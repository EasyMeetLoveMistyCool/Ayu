<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>阿遇♡阿凉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"HarmonyOS Sans","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#333;user-select:none}
#app{height:100%;position:relative;overflow:hidden}

:root{
--bg1:#ffe3ec;--bg2:#fff5f8;--bg3:#e8f4ff;
--glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.75);
--line:rgba(255,255,255,.85);
--me-bubble:rgba(255,182,203,.65);--other-bubble:rgba(255,255,255,.62);
--me-text:#7a3b4d;--other-text:#4a4a4a;
--accent:#ff4d6d;--accent-soft:#ff8fab;
--mask:25%;
}
body.theme-mint{--bg1:#d9f5ec;--bg2:#f0fbf7;--bg3:#e3f2ff;--me-bubble:rgba(150,225,200,.6);--me-text:#2f6b5a;--other-text:#3d5a52}
body.theme-cream{--bg1:#fff0d9;--bg2:#fffaf2;--bg3:#ffe9d6;--me-bubble:rgba(255,205,150,.6);--me-text:#7a5230;--other-text:#5a4a3a}
body.theme-blue{--bg1:#dcecff;--bg2:#f4f9ff;--bg3:#e6f0ff;--me-bubble:rgba(150,195,255,.6);--me-text:#2f4f7a;--other-text:#3a4a5a}
body.theme-purple{--bg1:#eadcff;--bg2:#f8f4ff;--bg3:#f0e6ff;--me-bubble:rgba(200,170,255,.6);--me-text:#5a3d7a;--other-text:#4a3d5a}
body.theme-dark{--bg1:#1e1e24;--bg2:#26262e;--bg3:#1a1a20;--glass:rgba(255,255,255,.08);--glass-strong:rgba(255,255,255,.12);--line:rgba(255,255,255,.12);--me-bubble:rgba(255,120,160,.35);--other-bubble:rgba(255,255,255,.08);--me-text:#ffd6e2;--other-text:#d8d8de;--accent:#ff6b8a;--accent-soft:#ff8fab;color:#d8d8de}

/* 高亮 */
.btn.on{background:var(--me-bubble);color:var(--me-text);border-color:var(--accent-soft)}
.switch.on{background:var(--accent-soft)}
.opt.sel{background:var(--me-bubble);color:var(--me-text);border-color:var(--accent-soft)}

/* 锁屏 */
#lockScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));background-size:cover;background-position:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);transition:opacity .45s,transform .45s;z-index:20}
#lockScreen::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,var(--mask));backdrop-filter:blur(2px);z-index:0;pointer-events:none}
body.theme-dark #lockScreen::before{background:rgba(0,0,0,var(--mask))}
#lockScreen.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.lock-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.site-name{font-size:26px;font-weight:600;letter-spacing:2px;color:#4a4a4a}
body.theme-dark .site-name{color:#f0f0f4}
.datetime{font-size:13px;color:#6b6b6b;letter-spacing:1px}
body.theme-dark .datetime{color:#a8a8b0}
.pair-wrap{display:flex;align-items:center;justify-content:center;gap:4px;margin:6px 0}
.pair-avatar{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.5);border:2px solid var(--line);object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.heart-line{width:40px;height:26px;overflow:visible;flex-shrink:0}
.heart-line path{stroke:var(--accent-soft);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:drawLine 2.4s ease-in-out infinite}
@keyframes drawLine{0%{stroke-dashoffset:60}40%{stroke-dashoffset:0}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
.heart-solid{font-size:20px;color:var(--accent);line-height:1;animation:heartBeat 2.2s ease-in-out infinite;display:inline-block}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.love-word{font-size:15px;color:#5a5a5a;letter-spacing:1px;text-align:center;max-width:80%;line-height:1.6;min-height:24px;transition:opacity .3s}
body.theme-dark .love-word{color:#b8b8c0}
.love-word.fade{opacity:0}
.enter-btn{margin-top:8px;padding:12px 38px;border:1px solid var(--line);border-radius:26px;background:var(--glass);backdrop-filter:blur(10px);color:#4a4a4a;font-size:16px;letter-spacing:2px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
body.theme-dark .enter-btn{color:#e8e8ee}
.enter-btn:active{transform:scale(.97)}

/* 密码层 */
#passLayer{position:absolute;inset:0;z-index:30;background:rgba(255,255,255,.35);backdrop-filter:blur(14px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
body.theme-dark #passLayer{background:rgba(0,0,0,.4)}
#passLayer.show{display:flex}
.dots{display:flex;gap:14px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-soft);background:transparent;transition:.15s}
.dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.08)}
#passInput{position:absolute;opacity:0;pointer-events:none}
.pass-tip{font-size:13px;color:#888;letter-spacing:1px}
.pass-tip.err{color:var(--accent);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 聊天页 */
#chatPage{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));background-size:cover;background-position:center}
#chatPage.show{display:flex}
#chatPage::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,var(--mask));pointer-events:none;z-index:0}
body.theme-dark #chatPage::before{background:rgba(0,0,0,var(--mask))}
.chat-inner{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}

/* 顶栏三排 */
.top-bar{display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 6px) 12px 8px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-shrink:0}
.top-row1{display:flex;align-items:center;justify-content:center;gap:4px}
.top-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.top-heart-line{width:40px;height:24px;overflow:visible;flex-shrink:0}
.top-heart-line path{stroke:var(--accent-soft);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:drawLine 2.4s ease-in-out infinite}
.top-heart-solid{font-size:18px;color:var(--accent);animation:heartBeat 2.2s ease-in-out infinite;line-height:1}
.top-row2{font-size:13px;color:var(--other-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.top-row3{font-size:12px;color:var(--accent);display:flex;align-items:center;gap:3px}

/* 消息区 */
.msg-list{flex:1;overflow-y:auto;padding:12px 10px 8px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:100%}
.msg-row.me{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
.msg-body{display:flex;flex-direction:column;gap:2px;max-width:72%}
.msg-row.me .msg-body{align-items:flex-end}
.msg-quote{font-size:11px;color:#888;padding:4px 8px;border-left:2px solid var(--accent-soft);background:rgba(255,255,255,.35);border-radius:6px;margin-bottom:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.theme-dark .msg-quote{background:rgba(255,255,255,.06);color:#aaa}
.msg-bubble{position:relative;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.5;word-break:break-word;background:var(--other-bubble);color:var(--other-text);border:1px solid var(--line);backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.msg-row.me .msg-bubble{background:var(--me-bubble);color:var(--me-text)}
.msg-meta{font-size:10px;color:#999;padding:0 4px;display:flex;gap:6px;align-items:center}
.msg-meta .read{color:var(--accent-soft)}

/* 正在输入：底部输入区上方 */
.typing-bar{padding:4px 14px 2px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.typing-text{font-size:12px;color:#888}
.typing-dots{display:flex;gap:3px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--accent-soft);animation:typing 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* 底部区 */
.bottom-bar{padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.input-box{flex:1;display:flex;align-items:flex-end;padding:8px 12px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(10px);min-height:40px}
.input-box textarea{flex:1;border:none;outline:none;background:transparent;font-size:15px;line-height:1.4;resize:none;max-height:100px;color:var(--other-text);font-family:inherit}
.input-box textarea::placeholder{color:#aaa}
body.theme-dark .input-box textarea{color:#e8e8ee}
.plus-btn,.send-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass-strong);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.plus-btn svg{width:22px;height:22px;stroke:var(--accent);stroke-width:2;fill:none;stroke-linecap:round}
.send-btn{display:none;background:var(--me-bubble)}
.send-btn svg{width:20px;height:20px;stroke:var(--me-text);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 弹出面板 */
.plus-panel{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--glass-strong);backdrop-filter:blur(20px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(100%);transition:transform .3s;max-height:70vh;overflow-y:auto}
.plus-panel.show{transform:translateY(0)}
.plus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0}
.plus-icon-box{width:44px;height:44px;border-radius:13px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.plus-icon-box svg{width:30px;height:30px;stroke:var(--accent);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.plus-item span{font-size:11px;color:var(--other-text)}
.panel-mask{position:absolute;inset:0;z-index:14;background:rgba(0,0,0,.15);display:none}
.panel-mask.show{display:block}
.card-panel{position:absolute;left:0;right:0;bottom:0;z-index:16;background:var(--glass-strong);backdrop-filter:blur(20px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(100%);transition:transform .3s;max-height:60vh;display:flex;flex-direction:column}
.card-panel.show{transform:translateY(0)}
.card-panel-title{font-size:14px;color:var(--other-text);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card-panel-title button{font-size:12px;color:var(--accent);background:none;border:none}
.card-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.card-item{padding:10px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px;color:var(--other-text);line-height:1.4}

/* 页面 */
.page{position:absolute;inset:0;z-index:25;background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));display:none;flex-direction:column}
.page.show{display:flex}
.page-header{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);gap:10px}
.page-header .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.page-header .back svg{width:22px;height:22px;stroke:var(--other-text);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.page-header h2{font-size:16px;color:var(--other-text);font-weight:500}
.page-body{flex:1;overflow-y:auto;padding:14px}
.setting-group{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.setting-group h3{font-size:13px;color:#888;margin-bottom:8px;font-weight:500}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--other-text)}
.setting-item:last-child{border-bottom:none}
.setting-item .val{font-size:12px;color:#aaa}
.switch{width:42px;height:24px;border-radius:12px;background:#ccc;position:relative;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:20px}
.btn{padding:9px 18px;border-radius:20px;border:1px solid var(--line);background:var(--glass-strong);color:var(--other-text);font-size:13px}
.btn.danger{color:#ff4d6d;border-color:rgba(255,77,109,.3)}
.card-input{width:100%;min-height:160px;border-radius:12px;border:1px solid var(--line);background:var(--glass);padding:12px;font-size:14px;line-height:1.6;resize:vertical;color:var(--other-text);font-family:inherit;outline:none}
.card-tip{font-size:12px;color:#aaa;margin:6px 0}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{position:relative}

/* 字卡管理：操作固定，下面面板 */
.card-ops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:sticky;top:0;z-index:5;background:var(--glass-strong);backdrop-filter:blur(12px);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.card-ops .btn{width:100%;padding:9px 4px;font-size:12px}
.card-panel-area{margin-top:4px}
.card-list-mgr{display:flex;flex-direction:column;gap:10px}
.mgr-card{padding:12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px;color:var(--other-text);line-height:1.4}
.sel-bar{position:sticky;top:56px;z-index:6;background:var(--glass-strong);backdrop-filter:blur(12px);padding:8px 0;margin-bottom:8px}
.card-empty{text-align:center;color:#aaa;font-size:13px;padding:30px 0}

/* 页面内弹窗 */
.modal-mask{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.3);display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.show{display:flex}
.modal{background:var(--glass-strong);backdrop-filter:blur(20px);border-radius:18px;border:1px solid var(--line);padding:18px;width:100%;max-width:320px}
.modal h3{font-size:15px;color:var(--other-text);margin-bottom:12px;font-weight:500}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal .row .btn{flex:1}

/* 悬浮球 */
.float-ball{position:absolute;right:14px;bottom:120px;z-index:40;border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;touch-action:none}
.float-ball.dragging{box-shadow:0 8px 24px rgba(0,0,0,.2)}
.float-panel{position:absolute;inset:0;z-index:50;background:rgba(255,255,255,.4);backdrop-filter:blur(18px);display:none;flex-direction:column}
body.theme-dark .float-panel{background:rgba(0,0,0,.5)}
.float-panel.show{display:flex}
.float-header{display:flex;align-items:center;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.float-header .close{width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.float-header .close svg{width:22px;height:22px;stroke:var(--other-text);stroke-width:2;fill:none;stroke-linecap:round}
.float-grid{flex:1;overflow-y:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 16px);display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px}
.float-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.float-icon-box{width:50px;height:50px;border-radius:15px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.float-icon-box svg{width:34px;height:34px;stroke:var(--accent);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.float-item span{font-size:12px;color:var(--other-text)}

/* 小世界 */
.world-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;padding:4px}
.world-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.world-icon-box{width:50px;height:50px;border-radius:15px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.world-icon-box svg{width:34px;height:34px;stroke:var(--accent);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.world-item span{font-size:12px;color:var(--other-text)}

/* 头像/背景 */
.avatar-cell{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.avatar-cell.sel-him{border-color:#9ecbff}
.avatar-cell.sel-me{border-color:#ffb6c8}
.pair-cell{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.pair-cell.sel{border-color:var(--accent);background:var(--me-bubble)}
.pair-cell img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.pair-cell .h{color:var(--accent)}
.bg-cell{width:60px;height:90px;border-radius:8px;object-fit:cover;border:2px solid var(--line)}
.bg-cell.sel{border-color:var(--accent)}

/* 悬浮球设置预览 */
.float-preview{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
</style>
</head>
<!-- 此处接第 2 段 -->
  <body>
<div id="app">

  <!-- 锁屏 -->
  <div id="lockScreen">
    <div class="lock-inner">
      <div class="site-name">阿遇♡阿凉</div>
      <div class="datetime" id="datetime">----年--月--日 星期- --:--:--</div>
      <div class="pair-wrap">
        <img class="pair-avatar" id="avatarHim" alt="">
        <svg class="heart-line" viewBox="0 0 40 26"><path d="M0 13 H10 L13 4 L16 22 L19 13 H22"/></svg>
        <span class="heart-solid">♡</span>
        <svg class="heart-line" viewBox="0 0 40 26"><path d="M18 13 H21 L24 4 L27 22 L30 13 H40"/></svg>
        <img class="pair-avatar" id="avatarMe" alt="">
      </div>
      <div class="love-word" id="loveWord">今天也想你了。</div>
      <button class="enter-btn" id="enterBtn">进入传讯</button>
    </div>
  </div>

  <!-- 密码层 -->
  <div id="passLayer">
    <div class="dots" id="dots"></div>
    <input id="passInput" type="text" inputmode="numeric" autocomplete="off">
    <div class="pass-tip" id="passTip">请输入暗号</div>
  </div>

  <!-- 聊天页 -->
  <div id="chatPage">
    <div class="chat-inner">
      <div class="top-bar">
        <div class="top-row1">
          <img class="top-avatar" id="topAvatarHim" alt="">
          <svg class="top-heart-line" viewBox="0 0 40 24"><path d="M0 12 H9 L12 4 L15 20 L18 12 H20"/></svg>
          <span class="top-heart-solid">♡</span>
          <svg class="top-heart-line" viewBox="0 0 40 24"><path d="M20 12 H22 L25 4 L28 20 L31 12 H40"/></svg>
          <img class="top-avatar" id="topAvatarMe" alt="">
        </div>
        <div class="top-row2" id="topCall">阿遇</div>
        <div class="top-row3">♡ <span id="loveValue">0</span></div>
      </div>

      <div class="msg-list" id="msgList"></div>

      <!-- 正在输入：输入区上方 -->
      <div class="typing-bar" id="typingBar" style="display:none">
        <span class="typing-text">祂正在输入中</span>
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>

      <div class="bottom-bar">
        <div class="input-box">
          <textarea id="msgInput" rows="1" placeholder="输入想对祂说的话…"></textarea>

    <script>
/* 阿遇♡阿凉 v1.0.0.2 */
const $ = id => document.getElementById(id);

const CONFIG = {
  passwords: ["所有的分别都是暂时的，我们一定会再次相会","用大把时间仿徨，用几个瞬间成长"],
  loveWords: ["今天也想你了。","你在，我就安心。","想和你一直这样聊下去。","你是我每天最期待的事。","有你在，日子都变软了。","想你，是今天的主旋律。","你一出现，我就笑了。","想牵你的手，走很久很久。","你是我藏起来的心动。","今天的心跳，有一半是你。","想和你把日子过成诗。","你是我所有温柔的归处。","只要是你，晚一点也没关系。","想陪你，从清晨到日暮。","你是我最想留住的幸运。","心里装着你，走到哪都不空。","想你的时候，风都是甜的。","你一来，我的世界就亮了。","想和你，慢慢来，一直走。","你是我最温柔的念想。","今天也想被你抱一下。","你是我平淡日子里的光。","想和你，把余生聊完。","你在的地方，就是我想去的地方。","想你，是我最安静的心事。","你是我所有心跳的理由。","想和你，把每天都过成纪念日。","你是我最舍不得的温柔。","今天也想你，明天也是。","有你在，就是最好的日子。"],
  cardsPerReply: { min:1, max:3 }
};

const STATE = {
  messages: [], cards: [], trash: [],
  settings: {
    theme:"", himName:"阿遇", meName:"阿凉",
    himAvatar:"", meAvatar:"", loveValue:0,
    replySpeed:{min:30,max:60}, stopDetect:{min:8,max:15},
    himCalls:[], meCalls:[], himCurrentCall:"", meCurrentCall:"",
    useCall:false, useCallRate:10,
    useQuote:false, useQuoteRate:10,
    collectHeart:false, collectHeartRate:10,
    activeMsg:false, activeMsgRate:10,
    activeAvatar:false, activeAvatarRate:10,
    activeBg:false, activeBgRate:10,
    activeCall:false, activeCallRate:10,
    maskOpacity:25, floatSize:52, floatImage:"",
    floatX:null, floatY:null, floatVisible:true,
    avatars:[], pairs:[], activePair:null,
    chatBgs:[], lockBgs:[], chatBg:"", lockBg:"",
    hearts:[], lockTrigger:"daily"
  }
};

const WEEK=["日","一","二","三","四","五","六"];
const pad=n=>n<10?"0"+n:""+n;
function updateDateTime(){
  const d=new Date();
  $("datetime").textContent=d.getFullYear()+"年"+pad(d.getMonth()+1)+"月"+pad(d.getDate())+"日 星期"+WEEK[d.getDay()]+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
}
setInterval(updateDateTime,1000); updateDateTime();

function randomLove(){ const a=CONFIG.loveWords; return a[Math.floor(Math.random()*a.length)]; }
(function(){ const el=$("loveWord"); el.classList.add("fade"); setTimeout(()=>{el.textContent=randomLove();el.classList.remove("fade");},200); })();

function defaultAvatar(color){
  return "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><circle cx="48" cy="48" r="48" fill="${color}"/><circle cx="48" cy="38" r="16" fill="#fff"/><path d="M16 84c4-18 18-26 32-26s28 8 32 26" fill="#fff"/></svg>`);
}
STATE.settings.himAvatar = defaultAvatar("#cfe3ff");
STATE.settings.meAvatar = defaultAvatar("#ffd6e2");

/* ---------- 页面内弹窗 ---------- */
function showModal(html){ $("modalBox").innerHTML=html; $("modalMask").classList.add("show"); }
function closeModal(){ $("modalMask").classList.remove("show"); }
$("modalMask").addEventListener("click",e=>{ if(e.target===$("modalMask")) closeModal(); });
function confirmModal(title,onOk,okText,delText,onDel){
  showModal(`<h3>${title}</h3><div class="row"><button class="btn" id="mCancel">取消</button>${onDel?`<button class="btn danger" id="mDel">${delText||"删除"}</button>`:""}${onOk?`<button class="btn on" id="mOk">${okText||"确定"}</button>`:""}</div>`);
  const c=$("mCancel"); if(c) c.onclick=closeModal;
  const o=$("mOk"); if(o) o.onclick=()=>{ closeModal(); onOk&&onOk(); };
  const d=$("mDel"); if(d) d.onclick=()=>{ closeModal(); onDel&&onDel(); };
}

/* ---------- 解锁 ---------- */
let passBuffer="";
const MAX_LEN=Math.max(...CONFIG.passwords.map(p=>p.length));
function openPass(){
  passBuffer=""; renderDots(); $("passLayer").classList.add("show");
  $("passTip").textContent="请输入暗号"; $("passTip").classList.remove("err");
  const inp=$("passInput"); inp.value=""; inp.focus();
}
function closePass(){ $("passLayer").classList.remove("show"); $("passInput").blur(); }
function renderDots(){
  const n=Math.max(passBuffer.length,1); const dots=$("dots"); dots.innerHTML="";
  for(let i=0;i<n;i++){ const d=document.createElement("div"); d.className="dot"+(i<passBuffer.length?" filled":""); dots.appendChild(d); }
}
function checkPass(){ if(CONFIG.passwords.includes(passBuffer)){ closePass(); enterChat(); return true; } return false; }
$("passInput").addEventListener("input",e=>{
  passBuffer=e.target.value.slice(0,MAX_LEN); e.target.value=passBuffer; renderDots();
  if(passBuffer.length>=MAX_LEN&&!checkPass()){
    $("passTip").textContent="暗号不对，再想想～"; $("passTip").classList.add("err");
    setTimeout(()=>{ passBuffer=""; e.target.value=""; renderDots(); $("passTip").textContent="请输入暗号"; $("passTip").classList.remove("err"); },800);
  }
});
$("passInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!checkPass()){ passBuffer=""; e.target.value=""; renderDots(); } });
$("enterBtn").addEventListener("click", openPass);

function enterChat(){
  $("lockScreen").classList.add("hide");
  setTimeout(()=>{
    $("lockScreen").style.display="none";
    $("chatPage").classList.add("show");
    if(STATE.settings.floatVisible) $("floatBall").style.display="flex";
    renderAll();
  },450);
}

/* ---------- 渲染 ---------- */
function renderAll(){ renderTop(); renderMessages(); renderCards(); applyMask(); }
function renderTop(){
  $("topAvatarHim").src=STATE.settings.himAvatar;
  $("topAvatarMe").src=STATE.settings.meAvatar;
  $("topCall").textContent=STATE.settings.himCurrentCall||STATE.settings.himCalls[0]||"阿遇";
  $("loveValue").textContent=STATE.settings.loveValue;
  $("avatarHim").src=STATE.settings.himAvatar;
  $("avatarMe").src=STATE.settings.meAvatar;
  if(STATE.settings.lockBg) $("lockScreen").style.backgroundImage="url("+STATE.settings.lockBg+")";
  if(STATE.settings.chatBg) $("chatPage").style.backgroundImage="url("+STATE.settings.chatBg+")";
}
function applyMask(){
  const m=(STATE.settings.maskOpacity||0)/100;
  document.documentElement.style.setProperty("--mask",m);
}
function fmtTime(ts){ const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function renderMessages(){
  const list=$("msgList"); list.innerHTML="";
  STATE.messages.forEach(m=>{
    const row=document.createElement("div"); row.className="msg-row "+(m.role==="me"?"me":"other");
    const avatar=document.createElement("img"); avatar.className="msg-avatar";
    avatar.src=m.role==="me"?STATE.settings.meAvatar:STATE.settings.himAvatar;
    const body=document.createElement("div"); body.className="msg-body";
    if(m.quote){ const q=document.createElement("div"); q.className="msg-quote"; q.textContent=m.quote; body.appendChild(q); }
    const bubble=document.createElement("div"); bubble.className="msg-bubble"; bubble.textContent=m.text; body.appendChild(bubble);
    const meta=document.createElement("div"); meta.className="msg-meta";
    const t=document.createElement("span"); t.textContent=fmtTime(m.ts); meta.appendChild(t);
    if(m.role==="me"&&m.read){ const r=document.createElement("span"); r.className="read"; r.textContent="已读"; meta.appendChild(r); }
    body.appendChild(meta); row.appendChild(avatar); row.appendChild(body);
    /* 长按引用/心动 */
    let pressTimer=null;
    const start=()=>{ pressTimer=setTimeout(()=>{ openMsgMenu(m); },500); };
    const end=()=>{ if(pressTimer) clearTimeout(pressTimer); };
    row.addEventListener("touchstart",start); row.addEventListener("touchend",end); row.addEventListener("touchmove",end);
    row.addEventListener("mousedown",start); row.addEventListener("mouseup",end); row.addEventListener("mouseleave",end);
    list.appendChild(row);
  });
  list.scrollTop=list.scrollHeight;
}
function openMsgMenu(m){
  showModal(`<h3>消息操作</h3><div class="row">
    <button class="btn" id="mQuote">引用</button>
    <button class="btn" id="mHeart">心动</button>
  </div><div class="row"><button class="btn" id="mCancel2">取消</button></div>`);
  $("mQuote").onclick=()=>{ closeModal(); input.value="「"+m.text+"」"; input.focus(); };
  $("mHeart").onclick=()=>{ closeModal(); STATE.settings.hearts.push({text:m.text,ts:Date.now()}); persist(); };
  $("mCancel2").onclick=closeModal;
}
function renderCards(){
  const list=$("cardList"); list.innerHTML="";
  if(!STATE.cards.length){ list.innerHTML='<div class="card-empty">还没有字卡，去添加一张吧～</div>'; return; }
  STATE.cards.forEach(c=>{
    const el=document.createElement("div"); el.className="card-item"; el.textContent=c.text;
    el.addEventListener("click",()=>{ input.value=c.text; input.dispatchEvent(new Event("input")); closeCardPanel(); });
    list.appendChild(el);
  });
}

/* ---------- 发送/回复 ---------- */
const input=$("msgInput"), plusBtn=$("plusBtn"), sendBtn=$("sendBtn");
input.addEventListener("input",()=>{
  input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,100)+"px";
  const has=input.value.trim().length>0;
  plusBtn.style.display=has?"none":"flex"; sendBtn.style.display=has?"flex":"none";
});
function sendMessage(){
  const text=input.value.trim(); if(!text) return;
  STATE.messages.push({id:Date.now()+"-me",role:"me",text,ts:Date.now(),read:false});
  input.value=""; input.style.height="auto"; plusBtn.style.display="flex"; sendBtn.style.display="none";
  renderMessages(); scheduleReply();
}
sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });

let replyTimer=null;
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function scheduleReply(){
  if(replyTimer) clearTimeout(replyTimer);
  const wait=rand(STATE.settings.stopDetect.min,STATE.settings.stopDetect.max)*1000;
  replyTimer=setTimeout(()=>{
    $("typingBar").style.display="flex";
    const speed=rand(STATE.settings.replySpeed.min,STATE.settings.replySpeed.max)*1000;
    setTimeout(()=>{ $("typingBar").style.display="none"; doReply(); }, speed);
  }, wait);
}
function doReply(){
  if(!STATE.cards.length){
    STATE.messages.push({id:Date.now()+"-o",role:"other",text:"（还没有字卡，去字卡里添加吧～）",ts:Date.now()});
    renderMessages(); return;
  }
  const n=rand(CONFIG.cardsPerReply.min,CONFIG.cardsPerReply.max);
  for(let i=0;i<n;i++){
    const c=STATE.cards[Math.floor(Math.random()*STATE.cards.length)];
    let text=c.text, quote="";
    if(STATE.settings.useCall&&Math.random()*100<STATE.settings.useCallRate&&STATE.settings.meCurrentCall){
      text=STATE.settings.meCurrentCall+"，"+text;
    }
    if(STATE.settings.useQuote&&Math.random()*100<STATE.settings.useQuoteRate){
      const today=STATE.messages.filter(m=>new Date(m.ts).toDateString()===new Date().toDateString());
      if(today.length) quote=today[Math.floor(Math.random()*today.length)].text;
    }
    STATE.messages.push({id:Date.now()+"-o"+i,role:"other",text,quote,ts:Date.now()+i});
    if(STATE.settings.collectHeart&&Math.random()*100<STATE.settings.collectHeartRate){
      STATE.settings.hearts.push({text:c.text,ts:Date.now()});
    }
  }
  STATE.messages.filter(m=>m.role==="me").forEach(m=>m.read=true);
  STATE.settings.loveValue+=1;
  renderMessages(); renderTop(); persist();
}

/* ---------- 字卡管理 ---------- */
const panelArea=$("cardPanelArea");
let currentOp="";
document.querySelectorAll(".card-ops .btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document.querySelectorAll(".card-ops .btn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    currentOp=b.dataset.op;
    renderCardOp(currentOp);
  });

function renderCardOp(op){
  panelArea.innerHTML="";
  if(op==="search"){
    panelArea.innerHTML='<div class="mgr-card"><input class="card-input" id="searchInput" placeholder="请输入搜索内容..." style="min-height:auto"></div><button class="btn" id="doSearch" style="margin-bottom:12px">搜索</button><div class="card-list-mgr" id="mgrList"></div>';
    $("doSearch").addEventListener("click",()=>{
      const kw=$("searchInput").value.trim();
      renderMgrList(STATE.cards.filter(c=>c.text.includes(kw)));
    });
    renderMgrList(STATE.cards);
  }
  if(op==="add"){
    panelArea.innerHTML='<div class="mgr-card"><textarea class="card-input" id="addInput" placeholder="祂会用这些字卡回复你哦"></textarea><div class="card-tip">一行一张字卡，可换行分隔</div></div><button class="btn" id="saveCards">保存字卡</button>';
    $("saveCards").addEventListener("click",()=>{
      const lines=$("addInput").value.split("\n").map(s=>s.trim()).filter(Boolean);
      lines.forEach(t=>STATE.cards.push({id:Date.now()+"-"+Math.random(),text:t}));
      persist(); renderMgrList(STATE.cards);
    });
  }
  if(op==="import"){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".txt,.json";
    inp.addEventListener("change",e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        let arr=[];
        if(f.name.endsWith(".json")){ try{ const j=JSON.parse(r.result); arr=Array.isArray(j)?j.map(x=>typeof x==="string"?x:x.text):[]; }catch(e){} }
        else { arr=r.result.split("\n").map(s=>s.trim()).filter(Boolean); }
        arr.forEach(t=>STATE.cards.push({id:Date.now()+"-"+Math.random(),text:t}));
        persist(); renderMgrList(STATE.cards);
      };
      r.readAsText(f,"utf-8");
    });
    inp.click();
  }
  if(op==="export"){
    showModal(`<h3>选择导出格式</h3><div class="row"><button class="btn" id="eTxt">TXT</button><button class="btn" id="eJson">JSON</button></div><div class="row"><button class="btn" id="eCancel">取消</button></div>`);
    $("eTxt").onclick=()=>{ closeModal(); download("字卡.txt",STATE.cards.map(c=>c.text).join("\n")); };
    $("eJson").onclick=()=>{ closeModal(); download("字卡.json",JSON.stringify(STATE.cards.map(c=>({text:c.text})),null,2)); };
    $("eCancel").onclick=closeModal;
    renderMgrList(STATE.cards);
  }
  if(op==="batch"){
    panelArea.innerHTML='<div class="sel-bar"><button class="btn danger" id="delSel">删除选中</button></div><div class="card-list-mgr" id="mgrList"></div>';
    renderMgrList(STATE.cards,true);
    $("delSel").addEventListener("click",()=>{
      const ids=[...panelArea.querySelectorAll("input:checked")].map(i=>i.dataset.id);
      const moved=STATE.cards.filter(c=>ids.includes(c.id));
      STATE.cards=STATE.cards.filter(c=>!ids.includes(c.id));
      STATE.trash.push(...moved); persist(); renderMgrList(STATE.cards,true);
    });
  }
  if(op==="dedup"){
    const seen={}; const dups=[];
    STATE.cards.forEach(c=>{ const k=c.text.trim(); if(seen[k]) dups.push(c); else seen[k]=true; });
    if(!dups.length){ panelArea.innerHTML='<div class="card-empty">没有重复字卡</div>'; return; }
    panelArea.innerHTML='<div class="sel-bar"><button class="btn" id="doDedup">全部去重</button></div><div class="card-list-mgr" id="mgrList"></div>';
    renderMgrList(dups);
    $("doDedup").addEventListener("click",()=>{
      const ids=dups.map(c=>c.id);
      STATE.cards=STATE.cards.filter(c=>!ids.includes(c.id));
      STATE.trash.push(...dups); persist(); renderMgrList(STATE.cards);
    });
  }
  if(op==="trash"){
    if(!STATE.trash.length){ panelArea.innerHTML='<div class="card-empty">回收站是空的</div>'; return; }
    const box=document.createElement("div"); box.className="card-list-mgr";
    STATE.trash.forEach(c=>{
      const el=document.createElement("div"); el.className="mgr-card";
      el.style.display="flex"; el.style.justifyContent="space-between"; el.style.alignItems="center";
      el.innerHTML='<span>'+c.text+'</span>';
      const ops=document.createElement("div"); ops.style.display="flex"; ops.style.gap="6px";
      const restore=document.createElement("button"); restore.className="btn"; restore.textContent="恢复";
      restore.addEventListener("click",()=>{ STATE.trash=STATE.trash.filter(x=>x.id!==c.id); STATE.cards.push(c); persist(); renderCardOp("trash"); });
      const del=document.createElement("button"); del.className="btn danger"; del.textContent="删除";
      del.addEventListener("click",()=>{ STATE.trash=STATE.trash.filter(x=>x.id!==c.id); persist(); renderCardOp("trash"); });
      ops.appendChild(restore); ops.appendChild(del); el.appendChild(ops); box.appendChild(el);
    });
    panelArea.appendChild(box);
  }
}
function renderMgrList(arr,selectable){
  const box=$("mgrList"); if(!box) return;
  box.innerHTML="";
  if(!arr.length){ box.innerHTML='<div class="card-empty">没有字卡</div>'; return; }
  arr.forEach(c=>{
    const el=document.createElement("div"); el.className="mgr-card";
    if(selectable){
      el.style.display="flex"; el.style.gap="8px"; el.style.alignItems="center";
      el.innerHTML='<input type="checkbox" data-id="'+c.id+'"><span>'+c.text+'</span>';
    } else {
      el.textContent=c.text;
      el.addEventListener("click",()=>{
        confirmModal("字卡操作",()=>{
          showModal(`<h3>编辑字卡</h3><textarea class="card-input" id="editCard" style="min-height:100px">${c.text}</textarea><div class="row"><button class="btn" id="ec">取消</button><button class="btn on" id="eo">保存</button></div>`);
          $("ec").onclick=closeModal;
          $("eo").onclick=()=>{ c.text=$("editCard").value.trim()||c.text; persist(); closeModal(); renderMgrList(STATE.cards); };
        },"编辑", "删除", ()=>{
          STATE.cards=STATE.cards.filter(x=>x.id!==c.id);
          STATE.trash.push(c); persist(); renderMgrList(STATE.cards);
        });
      });
    }
    box.appendChild(el);
  });
}

function download(name,content){
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

    });
    inp.click();
  });
  $("clearAll").addEventListener("click",()=>{
    confirmModal("确定清空所有数据？",()=>{ STATE.messages=[]; STATE.cards=[]; STATE.trash=[]; STATE.settings.hearts=[]; renderAll(); persist(); },"清空");
  });
}

/* ---------- 子页面 ---------- */
let callTarget="me";
function openSubPage(page,target){
  if(page==="speedPage"){
    $("speedTitle").textContent=target==="reply"?"祂回复速度":"停止检测时间";
    $("speedPage").dataset.target=target;
    const cur=target==="reply"?STATE.settings.replySpeed:STATE.settings.stopDetect;
    $("speedMin").value=cur.min; $("speedMax").value=cur.max; renderSpeedList(target);
  }
  if(page==="ratePage"){ $("ratePage").dataset.target=target; renderRateList(target); }
  if(page==="callPage"){
    $("callTitle").textContent=callTarget==="me"?"我的称呼管理":"祂的称呼管理";
    $("callInput").value=(callTarget==="me"?STATE.settings.meCalls:STATE.settings.himCalls).join("\n");
    renderCallList();

function renderAvatarPage(){
  $("himNameInput").value=STATE.settings.himName;
  $("meNameInput").value=STATE.settings.meName;
  $("himAvatarView").src=STATE.settings.himAvatar;
  $("meAvatarView").src=STATE.settings.meAvatar;
  $("himCallView").textContent=STATE.settings.himCurrentCall||"未设置";
  $("meCallView").textContent=STATE.settings.meCurrentCall||"未设置";
  const un=$("unpairedArea"); un.innerHTML="";
  STATE.settings.avatars.forEach(src=>{
    const img=document.createElement("img"); img.src=src; img.className="avatar-cell";
    img.addEventListener("click",()=>{
      const cur=img.dataset.side;
      if(cur){ img.dataset.side=""; img.classList.remove("sel-him","sel-me"); }
      else {
        const un2=$("unpairedArea");
        if(!un2.querySelector(".sel-him")){ img.dataset.side="him"; img.classList.add("sel-him"); }
        else if(!un2.querySelector(".sel-me")){ img.dataset.side="me"; img.classList.add("sel-me"); }
      }
      checkPair();
    });
    un.appendChild(img);
  });
  const pr=$("pairedArea"); pr.innerHTML="";
  STATE.settings.pairs.forEach((p,idx)=>{
    const wrap=document.createElement("div"); wrap.className="pair-cell"+(STATE.settings.activePair===idx?" sel":"");
    wrap.innerHTML='<img src="'+p.him+'"><span class="h">♡</span><img src="'+p.me+'">';
    wrap.addEventListener("click",()=>{
      showModal(`<h3>这一对</h3><div class="row"><button class="btn" id="pc">取消</button><button class="btn danger" id="pd">删除配对</button><button class="btn on" id="pu">用这一对</button></div>`);
      $("pc").onclick=closeModal;
      $("pu").onclick=()=>{ closeModal(); STATE.settings.himAvatar=p.him; STATE.settings.meAvatar=p.me; STATE.settings.activePair=idx; renderTop(); renderAvatarPage(); persist(); };
      $("pd").onclick=()=>{ closeModal(); STATE.settings.pairs.splice(idx,1); if(STATE.settings.activePair===idx) STATE.settings.activePair=null; persist(); renderAvatarPage(); };
    });
    pr.appendChild(wrap);
  });
}
function checkPair(){
  const un=$("unpairedArea");
  const him=un.querySelector(".sel-him"),me=un.querySelector(".sel-me");
  if(him&&me){
    const h=him.src,m=me.src;
    STATE.settings.pairs.push({him:h,me:m});
    STATE.settings.avatars=STATE.settings.avatars.filter(s=>s!==h&&s!==m);
    persist(); renderAvatarPage();
  }
}

function initFloatBall(){
  const ball=$("floatBall");
  ball.style.width=STATE.settings.floatSize+"px";
  ball.style.height=STATE.settings.floatSize+"px";
  if(STATE.settings.floatImage){
    ball.innerHTML='<img src="'+STATE.settings.floatImage+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
  } else {
    ball.innerHTML=svgIcon("heart");
    const svg=ball.querySelector("svg");
    svg.style.width="60%"; svg.style.height="60%"; svg.style.stroke="var(--accent)";
  }
  if(STATE.settings.floatX!==null){
    ball.style.left=STATE.settings.floatX+"px"; ball.style.top=STATE.settings.floatY+"px";

}
function toggleFloatBall(){
  STATE.settings.floatVisible=!STATE.settings.floatVisible;
  $("floatBall").style.display=STATE.settings.floatVisible?"flex":"none";
  persist();
}
(function dragFloat(){
  const ball=$("floatBall");
  let sx=0,sy=0,ox=0,oy=0,dragging=false,moved=false;
  function start(x,y){ const r=ball.getBoundingClientRect(); sx=x; sy=y; ox=r.left; oy=r.top; dragging=true; moved=false; }
  function move(x,y){
    if(!dragging) return;
    const dx=x-sx,dy=y-sy;
    if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true;
    let nx=ox+dx,ny=oy+dy;
    const maxX=window.innerWidth-ball.offsetWidth,maxY=window.innerHeight-ball.offsetHeight;
    nx=Math.max(0,Math.min(maxX,nx)); ny=Math.max(0,Math.min(maxY,ny));
    ball.style.left=nx+"px"; ball.style.top=ny+"px"; ball.style.right="auto"; ball.style.bottom="auto";
  }
  function end(){
    if(!dragging) return; dragging=false;
    if(moved){ const r=ball.getBoundingClientRect(); STATE.settings.floatX=r.left; STATE.settings.floatY=r.top; persist(); }
    else openFloat();
  }
  ball.addEventListener("touchstart",e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  ball.addEventListener("touchmove",e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
  ball.addEventListener("touchend",end);
  ball.addEventListener("mousedown",e=>start(e.clientX,e.clientY));
  document.addEventListener("mousemove",e=>move(e.clientX,e.clientY));
  document.addEventListener("mouseup",end);
})();
initFloatBall();

/* ---------- 存储 OPFS + Cache ---------- */
const STORE={
  async opfsRoot(){ if(!navigator.storage||!navigator.storage.getDirectory) return null; try{ return await navigator.storage.getDirectory(); }catch(e){ return null; } },
  async writeOPFS(name,data){ const root=await this.opfsRoot(); if(!root) return false; try{ const fh=await root.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(JSON.stringify(data)); await w.close(); return true; }catch(e){ return false; } },
  async readOPFS(name){ const root=await this.opfsRoot(); if(!root) return null; try{ const fh=await root.getFileHandle(name); const file=await fh.getFile(); return JSON.parse(await file.text()); }catch(e){ return null; } },
  async writeCache(name,data){ if(!window.caches) return false; try{ const c=await caches.open("ayu-data"); await c.put("/__data__/"+name,new Response(JSON.stringify(data))); return true; }catch(e){ return false; } },
  async readCache(name){ if(!window.caches) return null; try{ const c=await caches.open("ayu-data"); const res=await c.match("/__data__/"+name); if(!res) return null; return await res.json(); }catch(e){ return null; } },
  async save(name,data){ await this.writeOPFS(name,data); await this.writeCache(name,data); },
  async load(name){ let d=await this.readOPFS(name); if(d===null) d=await this.readCache(name); return d; }
};
async function persist(){ await STORE.save("state",{messages:STATE.messages,cards:STATE.cards,trash:STATE.trash,settings:STATE.settings}); }
async function restore(){
  const d=await STORE.load("state"); if(!d) return;
  if(d.messages) STATE.messages=d.messages;
  if(d.cards) STATE.cards=d.cards;
  if(d.trash) STATE.trash=d.trash;
  if(d.settings) Object.assign(STATE.settings,d.settings);
  if(STATE.settings.theme) document.body.classList.add(STATE.settings.theme);
  initFloatBall(); applyMask(); renderAll();
}
restore();
