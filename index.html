/* ===================================================================
   通用结构样式
   =================================================================== */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:8px 0 calc(6px + env(safe-area-inset-top));position:relative;z-index:5}
.avatar-wrap{display:flex;flex-direction:column;align-items:center}
.avatar-group{position:relative;width:72px;height:44px}
.av-her{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:10px;background:#fff;background-size:cover;background-position:center;box-shadow:1px 2px 5px rgba(0,0,0,.15)}
.av-me{position:absolute;left:44px;bottom:0;width:28px;height:28px;border-radius:7px;background:#fff;background-size:cover;background-position:center;box-shadow:1px 2px 4px rgba(0,0,0,.15)}
.names{display:flex;justify-content:space-between;width:72px;margin-top:5px;font-size:12px;min-height:14px}
.names span:first-child{text-align:left;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names span:last-child{text-align:right;max-width:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#stream{flex:1 1 auto;overflow-y:auto;padding:28px 16px 30px;position:relative;-webkit-overflow-scrolling:touch}
.note{position:relative;max-width:72%;padding:14px 16px;margin:22px 0;font-size:16px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.note.me{margin-left:auto;margin-right:8px}
.note.her{margin-right:auto;margin-left:8px}
.stamp{position:absolute;bottom:-12px;right:8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:2px}
.waiting{max-width:72%;margin:22px auto 22px 8px;padding:16px 14px;font-size:14px;text-align:center;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.sys{text-align:center;font-size:12.5px;margin:16px auto;padding:6px 12px;border-radius:4px;max-width:80%}

#composer{flex:0 0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom));position:relative}
.input-note{position:relative;padding:10px 56px 10px 12px}
#msgInput{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;resize:none;max-height:120px;line-height:1.4}
#sendStamp{position:absolute;right:8px;bottom:8px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:15px;font-weight:700}
#sendStamp:active{transform:scale(.92)}

#drawerMask{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#drawerMask.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:210px;box-shadow:4px 0 16px rgba(0,0,0,.2);transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:21;padding-top:calc(30px + env(safe-area-inset-top))}
#drawer.on{transform:translateX(0)}
.drawer-item{display:flex;align-items:center;gap:12px;padding:16px 20px;font-size:17px}
.drawer-item:active{opacity:.7}

.page{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;overflow:hidden}
.page.show{display:flex}
.page-head{flex:0 0 auto;height:52px;display:flex;align-items:center;padding:0 14px;padding-top:env(safe-area-inset-top)}
.page-head .back{font-size:22px;width:36px}
.page-head h2{flex:1;text-align:center;font-size:18px;font-weight:700;margin-right:36px}
.page-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}

.toolbar{display:flex;gap:6px;padding:10px 12px;align-items:center}
.tool{flex:1;min-width:40px;height:42px;display:flex;align-items:center;justify-content:center}
.tool:active{opacity:.6}
.tool.more{flex:0 0 44px}

.card-item{position:relative;padding:13px 40px 13px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.card-item.sel{outline:2px solid #c47a3a;background:#f7ecd0}
.card-item .chk{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:2px solid #c47a3a;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:14px;color:#c47a3a}
.card-item.selmode{padding-left:36px}
.card-item.selmode .chk{display:flex}
.empty-tip{text-align:center;font-size:14px;padding:40px 20px;line-height:1.8}

#multiBar{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;z-index:30}
#multiBar.on{display:flex}
.mbtn{flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:15px}
.mbtn:active{opacity:.7}
.mbtn.danger{color:#a5401a}

#selectAllRow{padding:8px 12px;font-size:14px;display:none;align-items:center;gap:8px}
#selectAllRow.on{display:flex}
#selectAllRow input{width:18px;height:18px}

#sheetMask{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#sheetMask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;border-radius:14px 14px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;z-index:41}
#sheet.on{transform:translateY(0)}
.sheet-item{padding:15px 20px;font-size:16px;text-align:center}
.sheet-item:active{opacity:.6}
.sheet-item.danger{color:#a5401a}
.sheet-cancel{margin-top:6px}

#addArea{flex:1;width:100%;padding:14px;font-family:inherit;font-size:16px;line-height:30px;outline:none;resize:none}
.save-btn{width:100%;margin-top:14px;height:48px;font-family:inherit;font-size:17px;font-weight:700}
.save-btn:active{opacity:.85}

.set-group{padding:14px;margin-bottom:14px}
.set-group h3{font-size:15px;margin-bottom:12px;font-weight:400;display:flex;align-items:center;gap:6px}

/* 人物块：大头像在左，右边名字/称呼，输入框撑满同高 */
.person-block{display:flex;align-items:flex-start;gap:14px}
.person-av{width:80px;height:80px;border-radius:12px;background:#fff;background-size:cover;background-position:center;flex:0 0 auto}
.person-fields{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.person-fields .field-row{display:flex;align-items:center;gap:8px}
.person-fields .field-row span{flex:0 0 auto;font-size:14px;width:auto}
.person-fields .field-row input{flex:1;min-width:0;height:36px;font-family:inherit;font-size:15px;padding:0 10px;outline:none;border-radius:5px}

.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:15.5px}
.set-row input[type=number]{width:64px;height:34px;text-align:center;font-family:inherit;font-size:15px;outline:none;border-radius:4px}
.style-opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.style-opt{flex:1;min-width:44%;height:56px;display:flex;align-items:center;justify-content:center;font-size:15px}
.style-opt.on{font-weight:700}
.btn-danger{width:100%;height:46px;font-family:inherit;font-size:16px;font-weight:700}
.btn-danger:active{opacity:.85}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(40,30,20,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
const FS = {
  dir:null,
  async init(){ try{ const root=await navigator.storage.getDirectory(); this.dir=await root.getDirectoryHandle('ayu_aliang',{create:true}); return true; }catch(e){ this.dir=null; return false; } },
  async read(name,def){ try{ if(this.dir){ const fh=await this.dir.getFileHandle(name); const f=await fh.getFile(); const t=await f.text(); return t?JSON.parse(t):def; } else{ const t=localStorage.getItem('ayu_'+name); return t?JSON.parse(t):def; } }catch(e){ return def; } },
  async write(name,obj){ const t=JSON.stringify(obj); try{ if(this.dir){ const fh=await this.dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(t); await w.close(); } else{ localStorage.setItem('ayu_'+name,t); } }catch(e){} }
};

let cards=[], messages=[];
let settings={
  dMin:30,dMax:60,gMin:5,gMax:8,style:'retro',
  avatarHer:null,avatarMe:null,
  nameHer:'',nameMe:'', callHer:'',callMe:''
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const saveCards=()=>FS.write('cards.json',{cards});
const saveMsgs =()=>FS.write('messages.json',{messages});
const saveSet  =()=>FS.write('settings.json',settings);
const $=s=>document.querySelector(s);
const stream=$('#stream'), drawer=$('#drawer'), mask=$('#drawerMask');

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2000); }

function applyProfile(){
  const h=settings.avatarHer, m=settings.avatarMe;
  $('#avHer').style.backgroundImage=h?`url(${h})`:'none';
  $('#avMe').style.backgroundImage =m?`url(${m})`:'none';
  $('#setAvHer').style.backgroundImage=h?`url(${h})`:'none';
  $('#setAvMe').style.backgroundImage =m?`url(${m})`:'none';
  $('#nameHer').textContent=settings.callHer||'';
  $('#nameMe').textContent =settings.callMe ||'';
  $('#setNameHer').value=settings.nameHer||'';
  $('#setNameMe').value =settings.nameMe ||'';
  $('#setCallHer').value=settings.callHer||'';
  $('#setCallMe').value =settings.callMe ||'';
}
function fmtTime(ts){ const d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function makeNote(m){
  const el=document.createElement('div');
  el.className='note '+(m.from==='me'?'me':'her');
  el.textContent=m.text;
  const st=document.createElement('div'); st.className='stamp'; st.textContent=fmtTime(m.time);
  el.appendChild(st); return el;
}
function renderMessages(){ stream.innerHTML=''; messages.forEach(m=>stream.appendChild(makeNote(m))); scrollBottom(); }
function scrollBottom(){ requestAnimationFrame(()=>stream.scrollTop=stream.scrollHeight); }
function appendMessage(m,save){ messages.push(m); if(save!==false) saveMsgs(); stream.appendChild(makeNote(m)); scrollBottom(); }
function showSystem(text){ const el=document.createElement('div'); el.className='sys'; el.dataset.sys='1'; el.textContent=text; stream.appendChild(el); scrollBottom(); }
function removeEmptyTip(){ stream.querySelectorAll('[data-sys="1"]').forEach(n=>n.remove()); }

let pendingReply=false;
function sendMessage(){
  const input=$('#msgInput'); const text=input.value.trim(); if(!text) return;
  appendMessage({id:uid(),from:'me',text,time:Date.now()});
  input.value=''; input.style.height='auto'; triggerReply();
}
function triggerReply(){
  const avail=cards.filter(c=>!c.locked); if(avail.length===0) return;
  if(pendingReply) return; pendingReply=true;
  const delay=rand(settings.dMin,settings.dMax)*1000;
  setTimeout(async ()=>{
    pendingReply=false;
    const n=randInt(1,3); const pool=cards.filter(c=>!c.locked);
    for(let i=0;i<n;i++){
      if(pool.length===0) break;
      const pick=pool[randInt(0,pool.length-1)];
      appendMessage({id:uid(),from:'her',text:pick.text,time:Date.now()});
      if(i<n-1) await new Promise(r=>setTimeout(r, rand(settings.gMin,settings.gMax)*1000));
    }
  }, delay);
}
$('#msgInput').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
$('#sendStamp').addEventListener('click',sendMessage);

function openDrawer(){ drawer.classList.add('on'); mask.classList.add('on'); }
function closeDrawer(){ drawer.classList.remove('on'); mask.classList.remove('on'); }
mask.addEventListener('click',closeDrawer);
let sx=0,sy=0,edge=false;
document.addEventListener('touchstart',e=>{ if(e.target.closest('textarea,input')){ edge=false; return; } const t=e.touches[0]; sx=t.clientX; sy=t.clientY; edge = !drawer.classList.contains('on'); },{passive:true});
document.addEventListener('touchmove',e=>{ if(!edge) return; const t=e.touches[0]; const dx=t.clientX-sx, dy=Math.abs(t.clientY-sy); if(dx>60 && dy<50){ openDrawer(); edge=false; } },{passive:true});
document.addEventListener('touchend',()=>{ edge=false; },{passive:true});
let cx=0;
document.addEventListener('touchstart',e=>{ if(drawer.classList.contains('on')) cx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchmove',e=>{ if(!drawer.classList.contains('on')) return; if(e.touches[0].clientX - cx < -60) closeDrawer(); },{passive:true});

function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); $('#'+id).classList.add('show'); document.body.classList.add('page-open'); }
function hidePages(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); document.body.classList.remove('page-open'); }
document.querySelectorAll('[data-go]').forEach(el=>{
  el.addEventListener('click',()=>{
    const go=el.dataset.go; closeDrawer();
    if(go==='pocket'){ lockedView=false; selMode=false; searchKw=''; renderPocket(); showPage('page-pocket'); }
    if(go==='settings'){ applyProfile(); renderSettings(); showPage('page-settings'); }
  });
});
document.querySelectorAll('[data-back]').forEach(el=>{
  el.addEventListener('click',()=>{
    if($('#page-add').classList.contains('show')){
      if($('#addArea').value.trim()){ if(!confirm('还没放进口袋，确定离开吗？')) return; $('#addArea').value=''; }
    }
    exitSelMode(); lockedView=false; searchKw='';
    hidePages();
  });
});

let selMode=false, selSet=new Set(), searchKw='', lockedView=false;
function currentList(){
  if(lockedView) return cards.filter(c=>c.locked);
  let arr=cards.filter(c=>!c.locked);
  if(searchKw) arr=arr.filter(c=>c.text.includes(searchKw));
  return arr;
}
function renderPocket(){
  $('#pocketTitle').textContent = lockedView?'锁起来的':'口袋';
  const list=$('#pocketList'); list.innerHTML='';
  const arr=currentList();
  if(arr.length===0){
    list.innerHTML='<div class="empty-tip">'+(lockedView?'还没有锁上的字卡':(searchKw?'没找到匹配的字卡':'口袋里还没有字卡<br>点 ➕ 给祂放几张吧'))+'</div>';
    updateMultiBar(); return;
  }
  arr.forEach(c=>{
    const el=document.createElement('div');
    el.className='card-item'+(selMode?' selmode':'')+(selSet.has(c.id)?' sel':'');
    el.textContent=c.text;
    const chk=document.createElement('div'); chk.className='chk'; chk.textContent=selSet.has(c.id)?'✓':''; el.appendChild(chk);
    el.addEventListener('click',()=>{
      if(selMode){ if(selSet.has(c.id)) selSet.delete(c.id); else selSet.add(c.id); renderPocket(); }
      else{ openSheet(c.id); }
    });
    list.appendChild(el);
  });
  updateMultiBar(); updateSelectAll();
}
function updateSelectAll(){
  const row=$('#selectAllRow');
  if(!selMode){ row.classList.remove('on'); return; }
  row.classList.add('on');
  const arr=currentList();
  $('#selectAllChk').checked = arr.length>0 && arr.every(c=>selSet.has(c.id));
}
$('#selectAllChk').addEventListener('change',e=>{
  const arr=currentList();
  if(e.target.checked) arr.forEach(c=>selSet.add(c.id)); else selSet.clear();
  renderPocket();
});
function updateMultiBar(){ $('#multiBar').classList.toggle('on', selMode); }
function exitSelMode(){ selMode=false; selSet.clear(); $('#selectAllRow').classList.remove('on'); $('#multiBar').classList.remove('on'); const del=$('#pocketTools .tool[data-t="del"]'); if(del) del.classList.remove('on'); }

$('#pocketTools').addEventListener('click',e=>{
  const t=e.target.closest('.tool'); if(!t) return;
  const act=t.dataset.t;
  if(act==='search'){ const kw=prompt('搜索字卡',searchKw); if(kw!==null){ searchKw=kw.trim(); lockedView=false; renderPocket(); } }
  else if(act==='add'){ $('#addArea').value=''; delete $('#addArea').dataset.editing; showPage('page-add'); }
  else if(act==='del'){ if(!selMode){ selMode=true; selSet.clear(); t.classList.add('on'); renderPocket(); } else{ exitSelMode(); renderPocket(); } }
  else if(act==='locked'){ lockedView=!lockedView; selMode=false; selSet.clear(); searchKw=''; renderPocket(); }
  else if(act==='more'){ openMoreSheet(); }
});

$('#mLock').addEventListener('click',()=>{
  if(selSet.size===0){ toast('还没选字卡'); return; }
  const n=selSet.size;
  cards.forEach(c=>{ if(selSet.has(c.id)) c.locked=true; });
  saveCards(); exitSelMode(); renderPocket(); removeEmptyTip(); toast('已锁上 '+n+' 张');
});
$('#mUnlock').addEventListener('click',()=>{
  if(selSet.size===0){ toast('还没选字卡'); return; }
  const n=selSet.size;
  cards.forEach(c=>{ if(selSet.has(c.id)) c.locked=false; });
  saveCards(); exitSelMode(); renderPocket(); toast('已解锁 '+n+' 张');
});
$('#mDel').addEventListener('click',()=>{
  if(selSet.size===0){ toast('还没选字卡'); return; }
  if(confirm('删除选中的 '+selSet.size+' 张字卡？')){ cards=cards.filter(c=>!selSet.has(c.id)); saveCards(); exitSelMode(); renderPocket(); toast('已删除'); }
});

let sheetCardId=null;
function openSheet(id){
  sheetCardId=id;
  const c=cards.find(x=>x.id===id); if(!c) return;
  document.querySelectorAll('#sheet .sheet-item').forEach(el=>{
    el.style.display = ['shEdit','shLock','shDel','shCancel'].includes(el.id) ? 'block' : 'none';
  });
  const li=$('#shLock');
  if(c.locked){ li.textContent='解锁'; li.dataset.act='unlock'; }
  else{ li.textContent='锁上'; li.dataset.act='lock'; }
  $('#sheetMask').classList.add('on'); $('#sheet').classList.add('on');
}
function openMoreSheet(){
  sheetCardId=null;
  document.querySelectorAll('#sheet .sheet-item').forEach(el=>{
    el.style.display = ['shDedup','shImport','shExport','shCancel'].includes(el.id) ? 'block' : 'none';
  });
  $('#sheetMask').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){ $('#sheetMask').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#sheetMask').addEventListener('click',closeSheet);
$('#shCancel').addEventListener('click',closeSheet);
$('#shEdit').addEventListener('click',()=>{ const id=sheetCardId; closeSheet(); if(id) editCard(id); });
$('#shLock').addEventListener('click',()=>{
  const c=cards.find(x=>x.id===sheetCardId); if(!c){ closeSheet(); return; }
  const act=$('#shLock').dataset.act;
  if(act==='lock'){ c.locked=true; toast('已锁上'); } else { c.locked=false; toast('已解锁'); }
  saveCards(); closeSheet(); renderPocket(); removeEmptyTip();
});
$('#shDel').addEventListener('click',()=>{
  if(!cards.find(x=>x.id===sheetCardId)){ closeSheet(); return; }
  if(confirm('删除这张字卡？')){ cards=cards.filter(x=>x.id!==sheetCardId); saveCards(); renderPocket(); toast('已删除'); }
  closeSheet();
});
$('#shDedup').addEventListener('click',()=>{ closeSheet(); dedup(); });
$('#shImport').addEventListener('click',()=>{ closeSheet(); $('#fileInput').click(); });
$('#shExport').addEventListener('click',()=>{ closeSheet(); exportCards(); });

function editCard(id){ const c=cards.find(x=>x.id===id); if(!c) return; $('#addArea').value=c.text; $('#addArea').dataset.editing=id; showPage('page-add'); }
function dedup(){
  const seen=new Set(); const kept=[];
  cards.forEach(c=>{ if(seen.has(c.text)) return; seen.add(c.text); kept.push(c); });
  const removed=cards.length-kept.length;
  if(removed===0){ toast('没有重复的字卡'); return; }
  if(confirm('发现 '+removed+' 张重复，保留最早的，删除其余？')){ cards=kept; saveCards(); renderPocket(); toast('已删除 '+removed+' 张重复字卡'); }
}
$('#fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text(); let incoming=[]; const name=f.name.toLowerCase();
  try{
    if(name.endsWith('.json')||text.trim().startsWith('{')){ const obj=JSON.parse(text); const arr=Array.isArray(obj)?obj:(obj.cards||[]); incoming=arr.map(x=>typeof x==='string'?x:(x.text||'')).filter(Boolean); }
    else{ incoming=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); }
  }catch(err){ toast('文件格式无法识别'); e.target.value=''; return; }
  const exist=new Set(cards.map(c=>c.text)); let added=0,skipped=0;
  incoming.forEach(txt=>{ if(exist.has(txt)){ skipped++; return; } cards.push({id:uid(),text:txt,locked:false}); exist.add(txt); added++; });
  if(added) await saveCards();
  renderPocket(); removeEmptyTip();
  toast('导入 '+added+' 张，跳过 '+skipped+' 张重复');
  e.target.value='';
});
async function exportCards(){
  const fmt=prompt('导出格式：输入 1 = JSON，2 = TXT','1'); if(fmt!=='1'&&fmt!=='2') return;
  const out=cards.filter(c=>!c.locked); let data,fname,type;
  if(fmt==='1'){ data=JSON.stringify({cards:out.map(c=>({text:c.text}))},null,2); fname='阿遇♡阿凉字卡.json'; type='application/json'; }
  else{ data=out.map(c=>c.text).join('\n'); fname='阿遇♡阿凉字卡.txt'; type='text/plain'; }
  const blob=new Blob([data],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('已导出 '+out.length+' 张字卡');
}
$('#saveCards').addEventListener('click',async ()=>{
  const area=$('#addArea'); const editingId=area.dataset.editing;
  const lines=area.value.split(/\r?\n/).map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim());
  if(lines.length===0){ toast('还没写呢'); return; }
  if(editingId){ const c=cards.find(x=>x.id===editingId); if(c){ c.text=area.value.trim(); await saveCards(); } delete area.dataset.editing; area.value=''; toast('已放进口袋'); }
  else{ for(const line of lines) cards.push({id:uid(),text:line,locked:false}); await saveCards(); area.value=''; toast('放进了 '+lines.length+' 张字卡'); }
  removeEmptyTip();
});

function renderSettings(){
  $('#dMin').value=settings.dMin; $('#dMax').value=settings.dMax;
  $('#gMin').value=settings.gMin; $('#gMax').value=settings.gMax;
  document.querySelectorAll('.style-opt').forEach(o=>o.classList.toggle('on',o.dataset.style===settings.style));
  applyProfile();
}
function bindNum(id,key){ $('#'+id).addEventListener('change',e=>{ let v=parseInt(e.target.value)||0; if(v<0) v=0; settings[key]=v; saveSet(); }); }
bindNum('dMin','dMin'); bindNum('dMax','dMax'); bindNum('gMin','gMin'); bindNum('gMax','gMax');
$('#setNameHer').addEventListener('input',e=>{settings.nameHer=e.target.value;saveSet();});
$('#setNameMe').addEventListener('input',e=>{settings.nameMe=e.target.value;saveSet();});
$('#setCallHer').addEventListener('input',e=>{settings.callHer=e.target.value;saveSet();applyProfile();});
$('#setCallMe').addEventListener('input',e=>{settings.callMe=e.target.value;saveSet();applyProfile();});
document.querySelectorAll('.style-opt').forEach(o=>{
  o.addEventListener('click',()=>{ settings.style=o.dataset.style; document.body.className=settings.style; saveSet(); renderSettings(); });
});
$('#clearMsgs').addEventListener('click',()=>{
  if(confirm('清空所有聊天记录？此操作不可恢复')){ messages=[]; saveMsgs(); renderMessages(); toast('已清空'); }
});
let avTarget=null;
const avFile=document.createElement('input'); avFile.type='file'; avFile.accept='image/*'; avFile.style.display='none'; document.body.appendChild(avFile);
$('#setAvHer').addEventListener('click',()=>{ avTarget='her'; avFile.click(); });
$('#setAvMe').addEventListener('click',()=>{ avTarget='me'; avFile.click(); });
avFile.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f||!avTarget) return;
  const r=new FileReader(); r.onload=()=>{ if(avTarget==='her') settings.avatarHer=r.result; else settings.avatarMe=r.result; saveSet(); applyProfile(); toast('已更换头像'); };
  r.readAsDataURL(f); e.target.value='';
});

async function boot(){
  await FS.init();
  const c=await FS.read('cards.json',{cards:[]});
  const m=await FS.read('messages.json',{messages:[]});
  const s=await FS.read('settings.json',null);
  cards=c.cards||[]; messages=m.messages||[];
  if(s) settings=Object.assign(settings,s);
  document.body.className=settings.style||'retro';
  applyProfile(); renderMessages();
  if(cards.length===0) showSystem('口袋里还没有字卡，去给祂放几张吧');
}
boot();
</script>
</body>
</html>
