<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>阿遇♥阿凉</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  color: var(--text);
  background: var(--bg-base);
  user-select: none;
  -webkit-user-select: none;
}

input, textarea {
  user-select: text;
  -webkit-user-select: text;
  font-family: inherit;
}

button {
  border: none;
  background: none;
  color: inherit;
  font-family: inherit;
  cursor: pointer;
}

ul, li { list-style: none; }

/* ================= 通用 ================= */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 6px 22px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#bg-layer {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2) 55%, var(--bg-grad-3));
  background-size: cover;
  background-position: center;
  transition: background-image .3s ease;
}

.page {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.page.active { display: flex; }

.scroll-y {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.scroll-y::-webkit-scrollbar { width: 0; height: 0; }
.scroll-y { scrollbar-width: none; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  color: var(--text);
  transition: transform .15s ease, background .2s ease;
}
.icon-btn:active { transform: scale(.9); background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; display: block; }

/* ================= 弹窗 ================= */
.modal-mask {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--mask);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 24px;
}
.modal-mask.active { display: flex; }

.modal {
  width: 100%;
  max-width: 340px;
  max-height: 78vh;
  border-radius: 22px;
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  animation: modal-in .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-title {
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  margin-bottom: 16px;
  color: var(--text);
}

.modal-body {
  flex: 1;
  overflow-y: auto;
  margin-bottom: 16px;
}
.modal-body::-webkit-scrollbar { width: 0; }

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.modal-btn {
  flex: 1;
  min-width: 96px;
  padding: 11px 16px;
  border-radius: 14px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--text);
  background: var(--accent);
  border: 1px solid var(--glass-border);
  transition: transform .12s ease;
}
.modal-btn:active { transform: scale(.96); }
.modal-btn.danger {
  color: #ffffff;
  background: var(--danger);
  border-color: rgba(217, 83, 106, 0.4);
}

.field {
  width: 100%;
  padding: 12px 14px;
  border-radius: 14px;
  font-size: 15px;
  color: var(--text);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  outline: none;
  resize: none;
}
.field::placeholder { color: var(--text-soft); }

.todo {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 120px;
  gap: 10px;
  color: var(--text-soft);
  font-size: 15px;
  letter-spacing: 1px;
}
.todo svg { width: 48px; height: 48px; opacity: .5; }

/* ================= 动画 ================= */
@keyframes heartbeat-line {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@keyframes heart-beat {
  0%, 100% { transform: scale(1); }
  12%      { transform: scale(1.15); }
  24%      { transform: scale(1); }
}
@keyframes dot-jump {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30%           { transform: translateY(-4px); opacity: 1; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@keyframes bubble-in {
  from { opacity: 0; transform: translateY(6px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes num-pop {
  0%   { transform: scale(1); opacity: 1; }
  50%  { transform: scale(1.25); opacity: .6; }
  100% { transform: scale(1); opacity: 1; }
}

/* ================= 锁屏 ================= */
.lock-wrap {
  position: relative;
  z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 40px 24px;
  text-align: center;
}

.lock-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text);
}

.lock-time {
  font-size: 14px;
  letter-spacing: 1px;
  color: var(--text-soft);
}

.lock-heart-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 4px 0;
}

.lock-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--glass-border);
  background: var(--glass-bg);
}

.heart-char {
  color: var(--heart-red);
  font-size: 22px;
  line-height: 1;
  display: inline-block;
}
.heart-char.beat {
  animation: heart-beat 1.6s ease-in-out infinite;
}
.lock-heart { font-size: 26px; }

.heartbeat-line {
  width: 54px;
  height: 20px;
  overflow: hidden;
  opacity: .85;
}
.heartbeat-line svg {
  width: 200%;
  height: 100%;
  display: block;
}
.heartbeat-line path {
  fill: none;
  stroke: var(--heart-red);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation: heartbeat-line 2.4s linear infinite;
}
.heartbeat-line.small { width: 40px; height: 16px; }

.lock-love {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
  max-width: 260px;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
}

.lock-enter {
  margin-top: 8px;
  padding: 12px 30px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--text);
  background: var(--accent);
  box-shadow: 0 6px 20px var(--accent-soft);
  transition: transform .15s ease;
}
.lock-enter:active { transform: scale(.94); }

.lock-pass {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  position: relative;
}
.lock-pass.active { display: flex; }

.lock-pass-dots {
  display: flex;
  gap: 8px;
  min-height: 14px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 260px;
}
.lock-pass-dots i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--text);
  display: block;
}

.lock-pass-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.01;
  color: transparent;
  background: transparent;
  border: none;
  outline: none;
  font-size: 16px;
  caret-color: transparent;
}

.lock-pass.shake { animation: shake .4s ease; }

/* ================= 聊天 ================= */
.chat-header {
  position: relative;
  z-index: 5;
  padding: 10px 14px 12px;
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.header-row-1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.header-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--glass-border);
  background: var(--glass-bg);
}

.header-heart { font-size: 20px; }

.header-row-2 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: .5px;
}

.header-row-3 {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--text-soft);
}
.love-heart {
  color: var(--heart-red);
  font-size: 13px;
  line-height: 1;
}
#hdr-love.pop { animation: num-pop .35s ease; }

.chat-body {
  flex: 1;
  padding: 14px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* 头像与气泡：气泡在上，头像在下，错开 */
.msg-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 100%;
}
.msg-row.me { justify-content: flex-end; }

.msg-col {
  display: flex;
  flex-direction: column;
  max-width: 70%;
}
.msg-row.me .msg-col { align-items: flex-end; }
.msg-row.other .msg-col { align-items: flex-start; }

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  color: var(--text);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow: 0 4px 14px var(--glass-shadow);
  animation: bubble-in .22s ease;
}
.msg-row.other .bubble {
  background: var(--bubble-other);
  border: 1px solid var(--glass-border);
}
.msg-row.me .bubble {
  background: var(--bubble-me);
  border: 1px solid var(--glass-border);
}

.bubble.media {
  padding: 4px;
  border-radius: 16px;
  overflow: hidden;
  line-height: 0;
}
.bubble.media img {
  width: 120px;
  height: auto;
  max-height: 160px;
  border-radius: 13px;
  object-fit: cover;
  display: block;
}

/* 头像：气泡在下，错开 30px */
.msg-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--glass-border);
  background: var(--glass-bg);
  flex-shrink: 0;
  margin-top: 30px;
}

.msg-meta {
  margin-top: 4px;
  font-size: 11px;
  color: var(--time-text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.read-flag { font-size: 11px; color: var(--heart-red); }

.chat-footer {
  position: relative;
  z-index: 5;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  border: none;
  background: transparent;
  flex-shrink: 0;
}

.typing-bar {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 2px 6px 8px;
  font-size: 12.5px;
  color: var(--text-soft);
}
.typing-bar.active { display: flex; }
.typing-bar .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;

const Store = {
  root: null,
  async init() {
    try { this.root = await navigator.storage.getDirectory(); }
    catch (e) { this.root = null; }
  },
  async _fh(name, create) {
    if (!this.root) return null;
    return await this.root.getFileHandle(name, { create });
  },
  async read(name) {
    try {
      if (this.root) {
        const fh = await this._fh(name, false);
        if (!fh) return null;
        const file = await fh.getFile();
        const txt = await file.text();
        return txt ? JSON.parse(txt) : null;
      }
      const raw = localStorage.getItem('ay_' + name);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  async write(name, data) {
    const txt = JSON.stringify(data);
    try {
      if (this.root) {
        const fh = await this._fh(name, true);
        const w = await fh.createWritable();
        await w.write(txt);
        await w.close();
        return;
      }
      localStorage.setItem('ay_' + name, txt);
    } catch (e) {
      try { localStorage.setItem('ay_' + name, txt); } catch (e2) {}
    }
  }
};

const CacheStore = {
  name: 'ay-media-v1',
  async put(key, blob) {
    try {
      const c = await caches.open(this.name);
      await c.put('/media/' + key, new Response(blob));
    } catch (e) {}
  },
  async get(key) {
    try {
      const c = await caches.open(this.name);
      const r = await c.match('/media/' + key);
      return r ? await r.blob() : null;
    } catch (e) { return null; }
  },
  async del(key) {
    try {
      const c = await caches.open(this.name);
      await c.delete('/media/' + key);
    } catch (e) {}
  }
};

const save = {

let pageStack = [];
function showPage(id, push = true) {
  const cur = $$('.page').find(p => p.classList.contains('active'));
  if (cur && push && cur.id !== id) pageStack.push(cur.id);
  $$('.page').forEach(p => p.classList.toggle('active', p.id === id));
  updateFloatBallVisible();
  applyBackgrounds();
}
function goBack() {
  const prev = pageStack.pop();
  const target = prev || 'page-chat';
  $$('.page').forEach(p => p.classList.toggle('active', p.id === target));
  updateFloatBallVisible();
  applyBackgrounds();
}

/* ---------- 弹窗 ---------- */
let modalStack = [];
function openModal({ title, bodyHTML, actions }) {
  modalStack.push({
    title: $('#modal-title').textContent,
    body: $('#modal-body').innerHTML,
    actions: $('#modal-actions').innerHTML
  });
  setModal({ title, bodyHTML, actions });
  $('#modal-mask').classList.add('active');
}
function setModal({ title, bodyHTML, actions }) {
  $('#modal-title').textContent = title || '';
  $('#modal-body').innerHTML = bodyHTML || '';
  const acts = $('#modal-actions');
  acts.innerHTML = '';
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.className = 'modal-btn' + (a.danger ? ' danger' : '');
    b.textContent = a.label;
    b.onclick = () => {
      if (a.onClick) a.onClick();
      if (a.keepOpen !== true) closeModal();
    };
    acts.appendChild(b);
  });
}
function closeModal() {
  modalStack = [];
  $('#modal-mask').classList.remove('active');
}
function modalBack() {
  if (modalStack.length) {
    const prev = modalStack.pop();
    $('#modal-title').textContent = prev.title;
    $('#modal-body').innerHTML = prev.body;
    $('#modal-actions').innerHTML = prev.actions;
  } else {
    closeModal();
  }
}

/* ---------- 选图片 ---------- */
function pickImage(cb, multiple = false) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  if (multiple) inp.multiple = true;
  inp.onchange = () => {
    [...inp.files].forEach(f => {
      const fr = new FileReader();
      fr.onload = () => cb(fr.result, f);
      fr.readAsDataURL(f);
    });
  };
  inp.click();
}

function bindLongPress(el, cb) {
  let timer = null;
  const start = () => { timer = setTimeout(() => { timer = null; cb(); }, 500); };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

/* ---------- 锁屏 ---------- */
function initLockPage() {
  function tick() {
    const d = new Date();
    const week = ['日','一','二','三','四','五','六'][d.getDay()];
    $('#lock-time').textContent =
      `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);

  $('#lock-love').textContent = LOVE_QUOTES[Math.floor(Math.random() * LOVE_QUOTES.length)];

  $('#btn-enter').onclick = () => {
    const mode = State.settings.lockMode;
    const today = new Date().toDateString();
    let needPass = false;
    if (mode === 'first') needPass = !State.settings.lockPassed;
    else if (mode === 'daily') needPass = State.settings.lastLockDay !== today;
    else if (mode === 'refresh') needPass = true;

    if (!needPass) { enterChat(); return; }

    $('#btn-enter').style.display = 'none';
    $('#lock-pass').classList.add('active');
    setTimeout(() => $('#lock-pass-input').focus(), 200);
  };

  const input = $('#lock-pass-input');
  const dots = $('#lock-pass-dots');

  function renderDots(n) {
    dots.innerHTML = '';
    for (let i = 0; i < n; i++) dots.appendChild(document.createElement('i'));
  }
  function passOK() {
    State.settings.lockPassed = true;
    State.settings.lastLockDay = new Date().toDateString();
    save.settings();
    input.blur(); input.value = ''; renderDots(0);
    $('#lock-pass').classList.remove('active');
    $('#btn-enter').style.display = '';
    enterChat();
  }
  function failPass() {
    input.value = ''; renderDots(0);
    const box = $('#lock-pass');
    box.classList.add('shake');
    setTimeout(() => box.classList.remove('shake'), 400);
  }
  function check(val) {
    if (LOCK_PASSWORDS.includes(val)) passOK();
    else failPass();
  }
  input.addEventListener('input', () => {
    const v = input.value;
    renderDots(v.length);
    if (LOCK_PASSWORDS.some(p => p === v)) { check(v); return; }
    if (!LOCK_PASSWORDS.some(p => p.startsWith(v)) && v.length > 0) failPass();
  });
  input.addEventListener('paste', () => {
    setTimeout(() => { const v = input.value; renderDots(v.length); check(v); }, 30);
  });
  renderDots(0);
}

function renderMessages() {
  const body = $('#chat-body');
  if (!body) return;
  body.innerHTML = '';
  State.messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (m.who === 'me' ? 'me' : 'other');

    const av = document.createElement('img');
    av.className = 'msg-avatar';
    av.src = m.who === 'me'
      ? (State.settings.avatars.me || defaultAvatar('pink'))
      : (State.settings.avatars.other || defaultAvatar('blue'));

    const col = document.createElement('div');
    col.className = 'msg-col';

    const b = document.createElement('div');
    b.className = 'bubble';
    if (m.type === 'img') {
      b.classList.add('media');
      const im = document.createElement('img');
      im.src = m.src;
      b.appendChild(im);
    } else {
      b.textContent = m.text;
    }

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = m.t;
    if (m.who === 'me' && m.read) {
      const r = document.createElement('span');
      r.className = 'read-flag';
      r.textContent = '已读';
      meta.appendChild(r);
    }

    col.appendChild(b);
    col.appendChild(meta);

    if (m.who === 'me') { row.appendChild(col); row.appendChild(av); }
    else { row.appendChild(av); row.appendChild(col); }

    body.appendChild(row);
  });

function scrollBottom() {
  const body = $('#chat-body');
  if (body) body.scrollTop = body.scrollHeight;
}
function updateLove() {
  const el = $('#hdr-love');
  if (el) el.textContent = State.love;
}

function triggerReply() {
  const lastMe = [...State.messages].reverse().find(m => m.who === 'me');
  if (lastMe) lastMe.read = true;
  save.messages();
  renderMessages();
  scrollBottom();

  const bar = $('#typing-bar');
  bar.classList.add('active');

  setTimeout(() => {
    bar.classList.remove('active');
    doReply();
  }, getReplyWait() * 1000);
}

function getReplyWait() {
  const s = State.settings;
  if (s.replySpeedMin != null && s.replySpeedMax != null) {
    return s.replySpeedMin + Math.random() * (s.replySpeedMax - s.replySpeedMin);
  }
  switch (s.replySpeed) {
    case 'fast':  return 15 + Math.random() * 15;
    case 'slow':  return 60 + Math.random() * 60;
    case 'long':  return 120 + Math.random() * 180;
    default:      return 30 + Math.random() * 30;
  }
}
function getMultiGap() {
  const s = State.settings;
  if (s.multiGapMin != null && s.multiGapMax != null) {
    return s.multiGapMin + Math.random() * (s.multiGapMax - s.multiGapMin);
  }
  switch (s.multiGap) {
    case 'fast':  return 1 + Math.random() * 2;
    case 'slow':  return 5 + Math.random() * 3;
    default:      return 3 + Math.random() * 2;
  }
}

function doReply() {
  if (State.cards.length === 0) {
    pushOther('没有字卡，祂只好安静地看着你。');
    return;
  }
  const n = 1 + Math.floor(Math.random() * 3);
  const picked = [];
  for (let i = 0; i < n; i++) {
    picked.push(State.cards[Math.floor(Math.random() * State.cards.length)].text);
  }
  let idx = 0;
  const sendNext = () => {
    if (idx >= picked.length) return;
    pushOther(picked[idx]);
    idx++;
    if (idx < picked.length) setTimeout(sendNext, getMultiGap() * 1000);
  };
  sendNext();
}

function pushOther(text) {
  State.messages.push({ id: uid(), who: 'other', type: 'text', text, t: nowHM() });
  save.messages();
  addLove(1);
  renderMessages();
  scrollBottom();
}

function initFloatBallDrag() {
  const ball = $('#float-ball');
  if (!ball) return;
  let startX = 0, startY = 0, startL = 0, startT = 0;
  let dragging = false, moved = false;

  function begin(x, y) {
    startX = x; startY = y;
    const r = ball.getBoundingClientRect();
    startL = r.left; startT = r.top;
    dragging = true; moved = false;
  }
  function move(x, y) {
    if (!dragging) return;
    const dx = x - startX, dy = y - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
    if (!moved) return;
    let nl = startL + dx, nt = startT + dy;
    nl = Math.max(0, Math.min(window.innerWidth - ball.offsetWidth, nl));
    nt = Math.max(0, Math.min(window.innerHeight - ball.offsetHeight, nt));
    ball.style.left = nl + 'px';
    ball.style.top = nt + 'px';
    ball.style.right = 'auto';
    ball.style.bottom = 'auto';
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    if (!moved) openBigMenu();
    else {
      State.settings.floatPos = { left: ball.style.left, top: ball.style.top };
      save.settings();
    }
  }
  ball.addEventListener('touchstart', e => { const t = e.touches[0]; begin(t.clientX, t.clientY); }, { passive: true });
  ball.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  ball.addEventListener('touchend', end);
  ball.addEventListener('mousedown', e => {
    begin(e.clientX, e.clientY);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = () => {
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
      end();
    };
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });
}

        markSeg(segSel, State.settings[segValKey]);
        return;
      }
      let mn = a == null ? lo : Math.max(lo, a);
      let mx = b == null ? hi : Math.min(hi, b);
      if (mn > mx) { const t = mn; mn = mx; mx = t; }
      State.settings[minKey] = mn; State.settings[maxKey] = mx;
      save.settings();
      minEl.value = mn; maxEl.value = mx;
    }
    $('#in-reply-min').onchange = () => readRange($('#in-reply-min'), $('#in-reply-max'), 5, 600, 'replySpeedMin', 'replySpeedMax', '#seg-reply', 'replySpeed');
    $('#in-reply-max').onchange = () => readRange($('#in-reply-min'), $('#in-reply-max'), 5, 600, 'replySpeedMin', 'replySpeedMax', '#seg-reply', 'replySpeed');

  });

/* ---------- 字卡管理 ---------- */
let cardSelectMode = false;
let cardSelected = new Set();
let searchKeyword = '';

function openCardManager() {
  cardSelectMode = false;
  cardSelected.clear();
  searchKeyword = '';
  showPage('page-sub');
  $('#sub-title').textContent = '字卡';
  const body = $('#sub-body');
  body.style.padding = '0';
  body.innerHTML = `
    <div class="card-toolbar" id="card-toolbar"></div>
    <div class="card-list" id="card-list"></div>
  `;
  renderCardToolbar();
  renderCardList();
}

function renderCardToolbar() {
  const bar = $('#card-toolbar');
  if (!bar) return;

  if (cardSelectMode) {
    bar.innerHTML = `
      <div class="toolbar-row">
        <button class="tool-btn" id="tb-all"><svg><use href="#i-select-all"/></svg>全选</button>
        <button class="tool-btn" id="tb-del"><svg><use href="#i-delete"/></svg>删除</button>
        <button class="tool-btn" id="tb-cancel"><svg><use href="#i-cancel"/></svg>取消</button>
      </div>
      <div class="empty-tip" style="padding:4px;font-size:12.5px;flex:none">已选 <b id="sel-count">${cardSelected.size}</b> 张</div>
    `;
    $('#tb-all').onclick = () => { getDisplayedCards().forEach(c => cardSelected.add(c.id)); renderCardList(); $('#sel-count').textContent = cardSelected.size; };
    $('#tb-del').onclick = () => {
      if (!cardSelected.size) return;
      moveCardsToTrash([...cardSelected]);
      cardSelected.clear(); renderCardList(); $('#sel-count').textContent = 0;
    };
    $('#tb-cancel').onclick = () => { cardSelectMode = false; cardSelected.clear(); renderCardToolbar(); renderCardList(); };
    return;
  }

  bar.innerHTML = `
    <div class="toolbar-row">
      <button class="tool-btn" id="tb-search"><svg><use href="#i-search"/></svg>搜索</button>
      <button class="tool-btn" id="tb-add"><svg><use href="#i-plus"/></svg>添加新字卡</button>
      <button class="tool-btn" id="tb-trash"><svg><use href="#i-trash"/></svg>回收站</button>
    </div>
    <div class="toolbar-row">
      <button class="tool-btn" id="tb-import"><svg><use href="#i-import"/></svg>文件导入</button>
      <button class="tool-btn" id="tb-export"><svg><use href="#i-export"/></svg>文件导出</button>
      <button class="tool-btn" id="tb-batch"><svg><use href="#i-batch-del"/></svg>批量删除</button>
      <button class="tool-btn" id="tb-dedup"><svg><use href="#i-dedup"/></svg>去重</button>
    </div>
  `;
  $('#tb-search').onclick = expandSearch;
  $('#tb-add').onclick = openAddCard;
  $('#tb-trash').onclick = openTrash;
  $('#tb-import').onclick = importCards;
  $('#tb-export').onclick = openExportDialog;
  $('#tb-batch').onclick = () => { cardSelectMode = true; cardSelected.clear(); renderCardToolbar(); renderCardList(); };
  $('#tb-dedup').onclick = doDedup;
}

function expandSearch() {
  const bar = $('#card-toolbar');
  bar.innerHTML = `
    <div class="toolbar-row">
      <div class="search-field">
        <input id="search-input" placeholder="请输入搜索内容...">
        <span class="clear-x" id="search-clear"><svg><use href="#i-close"/></svg></span>
      </div>
    </div>
  `;
  const inp = $('#search-input');
  inp.focus();
  inp.oninput = () => { searchKeyword = inp.value.trim(); renderCardList(); };
  $('#search-clear').onclick = () => { searchKeyword = ''; renderCardToolbar(); renderCardList(); };
}

function getDisplayedCards() {
  if (!searchKeyword) return State.cards;
  return State.cards.filter(c => c.text.includes(searchKeyword));
}

function renderCardList() {
  const list = $('#card-list');
  if (!list) return;
  const data = getDisplayedCards();
  if (!data.length) {
    list.innerHTML = `<div class="empty-tip">${State.cards.length === 0 ? '没有字卡，祂只好安静地看着你。' : '没有找到相关字卡。'}</div>`;
    return;
  }
  list.innerHTML = '';
  data.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card-item' + (cardSelected.has(c.id) ? ' selected' : '');
    el.innerHTML = `${cardSelectMode ? '<div class="card-check"></div>' : ''}<div class="card-text"></div>`;
    el.querySelector('.card-text').textContent = c.text;
    if (cardSelectMode) {
      el.onclick = () => {
        if (cardSelected.has(c.id)) cardSelected.delete(c.id);
        else cardSelected.add(c.id);
        el.classList.toggle('selected', cardSelected.has(c.id));
        const sc = $('#sel-count'); if (sc) sc.textContent = cardSelected.size;
      };
    } else {
      bindLongPress(el, () => openCardItemMenu(c));
    }
    list.appendChild(el);
  });
}

function openCardItemMenu(card) {
  openModal({
    title: '字卡', bodyHTML: '',
    actions: [
      { label: '编辑', onClick: () => editCardInline(card) },
      { label: '删除', danger: true, onClick: () => { moveCardsToTrash([card.id]); renderCardList(); } }
    ]
  });
}

function editCardInline(card) {
  const list = $('#card-list');
  const items = $$('.card-item', list);
  const idx = getDisplayedCards().findIndex(c => c.id === card.id);
  if (idx < 0) return;
  const el = items[idx]; if (!el) return;
  const textEl = el.querySelector('.card-text');
  textEl.innerHTML = '';
  const input = document.createElement('input');
  input.className = 'field';
  input.value = card.text;
  input.style.padding = '6px 10px';
  textEl.appendChild(input);
  input.focus();
  let done = false;
  const finish = saveIt => {
    if (done) return; done = true;
    if (saveIt && input.value.trim()) { card.text = input.value.trim(); save.cards(); }
    renderCardList();
  };
  input.onblur = () => finish(true);
  input.onkeydown = e => { if (e.key === 'Enter') finish(true); };
}

function moveCardsToTrash(ids) {
  const set = new Set(ids);
  const moving = State.cards.filter(c => set.has(c.id));
  State.cards = State.cards.filter(c => !set.has(c.id));
  moving.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
  save.cards(); save.trash();
}

function openAddCard() {
  openModal({
    title: '添加新字卡',
    bodyHTML: `<textarea class="field" id="add-card-input" rows="8" placeholder="祂会用这些字卡回复你哦"></textarea>
      <div style="font-size:12px;color:var(--text-soft);margin-top:8px;text-align:center">一行一张字卡，可换行分隔</div>`,
    actions: [{
      label: '保存字卡', onClick: () => {
        const lines = $('#add-card-input').value.split('\n').map(s => s.trim()).filter(Boolean);
        lines.forEach(text => State.cards.unshift({ id: uid(), text, t: Date.now() }));
        save.cards(); renderCardList();
      }
    }]
  });
}

function importCards() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.txt,.json,application/json,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text();
    let incoming = [];
    if (f.name.endsWith('.json')) {
      try {
        const data = JSON.parse(text);
        if (Array.isArray(data)) incoming = data.map(d => typeof d === 'string' ? d : (d.text || '')).filter(Boolean);
      } catch (e) { openModal({ title: '导入失败', bodyHTML: '文件格式不正确', actions: [] }); return; }
    } else {
      incoming = text.split('\n').map(s => s.trim()).filter(Boolean);
    }
    const existing = new Set(State.cards.map(c => c.text));
    const dups = [];
    incoming.forEach(t => {
      if (existing.has(t)) { dups.push(t); State.trash.push({ id: uid(), text: t, t: Date.now(), deletedAt: Date.now() }); }
      else { State.cards.unshift({ id: uid(), text: t, t: Date.now() }); existing.add(t); }
    });
    save.cards(); save.trash(); renderCardList();
    if (dups.length) {
      const html = `<div class="dup-list">` + dups.map(d => `<div class="dup-item">${escapeHTML(d)}</div>`).join('') + `</div>`;
      openModal({ title: '以下字卡重复，已移入回收站', bodyHTML: html, actions: [{ label: '去回收站', onClick: () => openTrash() }] });
    } else {
      openModal({ title: '导入完成', bodyHTML: '没有重复内容', actions: [] });
      setTimeout(closeModal, 5000);
    }
  };
  inp.click();
}

function openExportDialog() {
  openModal({
    title: '选择导出格式', bodyHTML: '',
    actions: [
      { label: 'TXT', onClick: () => exportCards('txt') },
      { label: 'JSON', onClick: () => exportCards('json') }
    ]
  });
}

function exportCards(fmt) {
  const data = State.cards.map(c => c.text);
  let content, mime, ext;
  if (fmt === 'json') { content = JSON.stringify(data, null, 2); mime = 'application/json'; ext = 'json'; }
  else { content = data.join('\n'); mime = 'text/plain'; ext = 'txt'; }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `字卡_${dateStamp()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function doDedup() {
  const map = new Map();
  State.cards.forEach(c => { if (!map.has(c.text)) map.set(c.text, []); map.get(c.text).push(c); });
  const groups = [...map.entries()].filter(([, arr]) => arr.length > 1);
  if (!groups.length) { openModal({ title: '去重', bodyHTML: '没有重复内容', actions: [] }); setTimeout(closeModal, 5000); return; }
  groups.forEach(([, arr]) => {
    arr.sort((a, b) => a.t - b.t);
    const rest = arr.slice(1);
    rest.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
    const set = new Set(rest.map(c => c.id));
    State.cards = State.cards.filter(c => !set.has(c.id));
  });
  save.cards(); save.trash();
  const html = `<div class="dup-list">` + groups.map(([text, arr]) =>
    `<div class="dup-item"><span>${escapeHTML(text)}</span><span class="dup-count" style="margin-left:auto">${arr.length}</span></div>`
  ).join('') + `</div>`;
  openModal({ title: '重复内容', bodyHTML: html, actions: [{ label: '去回收站', onClick: () => openTrash() }] });
}

/* ---------- 回收站 ---------- */
let trashSelectMode = false;
let trashSelected = new Set();

function openTrash() {
  trashSelectMode = false; trashSelected.clear();
  showPage('page-sub');
  $('#sub-title').textContent = '回收站';
  const body = $('#sub-body');
  body.style.padding = '0';
  body.innerHTML = `<div class="card-toolbar" id="trash-toolbar"></div><div class="card-list" id="trash-list"></div>`;
  renderTrashToolbar();
  renderTrashList();
}

function renderTrashToolbar() {
  const bar = $('#trash-toolbar');
  if (!bar) return;
  if (trashSelectMode) {
    bar.innerHTML = `
      <div class="toolbar-row">
        <button class="tool-btn" id="tr-all"><svg><use href="#i-select-all"/></svg>全选</button>
        <button class="tool-btn" id="tr-del"><svg><use href="#i-delete"/></svg>删除</button>
        <button class="tool-btn" id="tr-restore"><svg><use href="#i-restore"/></svg>恢复</button>
      </div>
    `;
    $('#tr-all').onclick = () => { State.trash.forEach(c => trashSelected.add(c.id)); renderTrashList(); };
    $('#tr-del').onclick = () => {
      if (!trashSelected.size) return;
      openModal({
        title: '永久删除？', bodyHTML: '此操作不可恢复。',
        actions: [
          { label: '取消', onClick: () => {} },
          { label: '永久删除', danger: true, onClick: () => {
            State.trash = State.trash.filter(c => !trashSelected.has(c.id));
            save.trash(); trashSelected.clear(); renderTrashList();
          }}
        ]
      });
    };
    $('#tr-restore').onclick = () => {
      const back = State.trash.filter(c => trashSelected.has(c.id));
      State.trash = State.trash.filter(c => !trashSelected.has(c.id));
      back.forEach(c => { delete c.deletedAt; State.cards.unshift(c); });
      save.trash(); save.cards(); trashSelected.clear(); renderTrashList();
    };
    return;
  }
  bar.innerHTML = `<div class="toolbar-row"><button class="tool-btn" id="tr-batch"><svg><use href="#i-batch-del"/></svg>批量</button></div>`;
  $('#tr-batch').onclick = () => { trashSelectMode = true; trashSelected.clear(); renderTrashToolbar(); renderTrashList(); };
}

function renderTrashList() {
  const list = $('#trash-list');
  if (!list) return;
  if (!State.trash.length) { list.innerHTML = `<div class="empty-tip">回收站是空的。</div>`; return; }
  list.innerHTML = '';
  State.trash.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card-item' + (trashSelected.has(c.id) ? ' selected' : '');
    el.innerHTML = `${trashSelectMode ? '<div class="card-check"></div>' : ''}<div class="card-text"></div>`;
    el.querySelector('.card-text').textContent = c.text;
    if (trashSelectMode) {
      el.onclick = () => {
        if (trashSelected.has(c.id)) trashSelected.delete(c.id);
        else trashSelected.add(c.id);
        el.classList.toggle('selected', trashSelected.has(c.id));
      };
    }
    list.appendChild(el);
  });
}

    };
    $('#edit-other-name').onclick = () => editField('otherName', '祂的名字', openAvatarManager);
    $('#edit-other-call').onclick = () => editField('otherCall', '祂的称呼', () => { applyAvatars(); openAvatarManager(); });
    $('#edit-my-name').onclick = () => editField('myName', '我的名字', openAvatarManager);
    $('#edit-my-call').onclick = () => editField('myCall', '我的称呼', openAvatarManager);
    $('#mgr-other-call').onclick = () => openCallManager('other');
    $('#mgr-my-call').onclick = () => openCallManager('me');
  });
}

function editField(key, placeholder, after) {
  openModal({
    title: placeholder,
    bodyHTML: `<input class="field" id="edit-field-input" value="${escapeHTML(State.settings[key] || '')}" placeholder="${placeholder}">`,
    actions: [{
      label: '保存', keepOpen: true, onClick: () => {
        State.settings[key] = $('#edit-field-input').value.trim();
        save.settings();
        applyAvatars();
        modalBack();
        if (after) after();
      }
    }]
  });
  setTimeout(() => $('#edit-field-input') && $('#edit-field-input').focus(), 100);
}

function renderAvatarArea() {
  const s = State.settings;
  const unpair = s.avatarPool.filter(a => !a.paired);
  const ug = $('#unpair-grid');
  if (ug) {
    ug.innerHTML = '';
    unpair.forEach(a => {
      const cell = document.createElement('div');
      cell.className = 'unpair-cell ' + (a.color || '');
      cell.innerHTML = `<img src="${a.src}">`;
      cell.onclick = () => {
        a.color = a.color === 'blue' ? '' : (a.color === 'pink' ? 'blue' : 'pink');
        save.settings(); renderAvatarArea(); tryAutoPair();
      };
      ug.appendChild(cell);
    });
  }
  const pg = $('#pair-grid');
  if (pg) {
    pg.innerHTML = '';
    s.avatarPairs.forEach((pair, i) => {
      const o = s.avatarPool.find(a => a.id === pair.other);
      const m = s.avatarPool.find(a => a.id === pair.me);
      const cell = document.createElement('div');
      cell.className = 'pair-cell';
      cell.innerHTML = `<div class="pair-imgs">
        <img class="blue" src="${o ? o.src : defaultAvatar('blue')}">
        <img class="pink" src="${m ? m.src : defaultAvatar('pink')}">
      </div>`;
      cell.onclick = () => {
        openModal({
          title: '这一对头像', bodyHTML: '',
          actions: [
            { label: '用这一对', onClick: () => usePair(i) },
            { label: '删除配对', danger: true, onClick: () => {
              const ids = [pair.other, pair.me];
              s.avatarPool = s.avatarPool.filter(a => !ids.includes(a.id));
              s.avatarPairs.splice(i, 1);
              save.settings(); renderAvatarArea();
            }}
          ]
        });
      };
      pg.appendChild(cell);
    });
  }
}

function tryAutoPair() {
  const s = State.settings;
  const blue = s.avatarPool.find(a => a.color === 'blue' && !a.paired);
  const pink = s.avatarPool.find(a => a.color === 'pink' && !a.paired);
  if (blue && pink) {
    blue.paired = true; pink.paired = true;
    s.avatarPairs.push({ other: blue.id, me: pink.id });
    save.settings(); renderAvatarArea(); tryAutoPair();
  }
}

function usePair(i) {
  const s = State.settings;
  const pair = s.avatarPairs[i];
  const o = s.avatarPool.find(a => a.id === pair.other);
  const m = s.avatarPool.find(a => a.id === pair.me);
  if (o) s.avatars.other = o.src;
  if (m) s.avatars.me = m.src;
  save.settings();
  applyAvatars();
  openModal({ title: '已应用', bodyHTML: '头像已更新。', actions: [] });
  setTimeout(closeModal, 1200);
}

function openCallManager(who) {
  const s = State.settings;
  const key = who === 'other' ? 'otherCalls' : 'myCalls';
  const curKey = who === 'other' ? 'otherCall' : 'myCall';
  const list = s[key];

  const html = list.length
    ? `<div class="dup-list">` + list.map((c, i) =>
        `<div class="dup-item" data-call="${i}"><span style="flex:1">${escapeHTML(c)}</span></div>`
      ).join('') + `</div>`
    : `<div class="empty-tip" style="padding:10px">还没有称呼</div>`;

  openModal({
    title: '称呼管理',
    bodyHTML: html,
    actions: [{ label: '添加称呼', onClick: () => { modalBack(); addCall(who); }, keepOpen: true }]
  });

  $$('#modal-body [data-call]').forEach(el => {
    const idx = +el.dataset.call;
    const txt = list[idx];
    el.onclick = () => {
      s[curKey] = txt;
      save.settings();
      applyAvatars();
      closeModal();
    };
    bindLongPress(el, () => {
      if (txt === s[curKey]) return; /* 当前使用中的不能删 */
      openModal({
        title: txt, bodyHTML: '',
        actions: [{ label: '删除称呼', danger: true, keepOpen: true, onClick: () => {
          s[key].splice(idx, 1);
          save.settings();
          closeModal();
          openCallManager(who);
        }}]
      });
    });
  });
}

function addCall(who) {
  const s = State.settings;
  const key = who === 'other' ? 'otherCalls' : 'myCalls';
  openModal({
    title: '添加称呼',
    bodyHTML: `<input class="field" id="new-call" placeholder="输入称呼...">`,
    actions: [{
      label: '保存称呼', keepOpen: true, onClick: () => {
        const v = $('#new-call').value.trim();
        if (v) { s[key].push(v); save.settings(); }
        closeModal();
        openCallManager(who);
      }
    }]
  });
  setTimeout(() => $('#new-call') && $('#new-call').focus(), 100);
}

/* ---------- 背景管理 ---------- */
let bgTab = 'chat';

function openBgManager() {
  const s = State.settings;
  openSub('背景', `
    <div class="bg-tabs">
      <div class="bg-tab ${bgTab==='chat'?'active':''}" id="tab-chat">聊天背景</div>
      <div class="bg-tab ${bgTab==='lock'?'active':''}" id="tab-lock">锁屏背景</div>
    </div>
    <div id="bg-content"></div>
  `, () => {
    renderBgTab();
    $('#tab-chat').onclick = () => { bgTab = 'chat'; openBgManager(); };
    $('#tab-lock').onclick = () => { bgTab = 'lock'; openBgManager(); };
  });
}

function renderBgTab() {
  const s = State.settings;
  const content = $('#bg-content');
  if (!content) return;
  if (bgTab === 'chat') {
    content.innerHTML = `
      <button class="upload-btn" id="up-chat-bg" style="margin:12px 0"><svg><use href="#i-plus"/></svg>上传聊天背景</button>
      <div class="bg-grid" id="chat-bg-grid"></div>
    `;
    $('#up-chat-bg').onclick = () => pickImage((dataUrl) => {
      s.chatBgPool.push(dataUrl); s.chatBg = dataUrl;
      save.settings(); applyBackgrounds(); renderBgTab();
    }, true);
    const grid = $('#chat-bg-grid');
    s.chatBgPool.forEach(src => {
      const cell = document.createElement('div');
      cell.className = 'bg-cell' + (s.chatBg === src ? ' active' : '');
      cell.innerHTML = `<img src="${src}">`;
      cell.onclick = () => { s.chatBg = src; save.settings(); applyBackgrounds(); renderBgTab(); };
      grid.appendChild(cell);
    });
  } else {
    content.innerHTML = `
      <button class="upload-btn" id="up-lock-bg" style="margin:12px 0"><svg><use href="#i-plus"/></svg>上传锁屏背景</button>
      <div class="bg-grid" id="lock-bg-grid"></div>
    `;
    $('#up-lock-bg').onclick = () => pickImage((dataUrl) => {
      s.lockBgPool.push(dataUrl); s.lockBg = dataUrl;
      save.settings(); renderBgTab();
    }, true);
    const grid = $('#lock-bg-grid');
    s.lockBgPool.forEach(src => {
      const cell = document.createElement('div');
      cell.className = 'bg-cell' + (s.lockBg === src ? ' active' : '');
      cell.innerHTML = `<img src="${src}">`;
      cell.onclick = () => { s.lockBg = src; save.settings(); renderBgTab(); };
      grid.appendChild(cell);
    });
  }
}

/* ---------- 启动 ---------- */
async function boot() {
  await Store.init();
  const st = await Store.read('settings.json');
  if (st) {
    Object.assign(State.settings, st);
    State.settings.avatars = Object.assign({ other: '', me: '' }, st.avatars || {});
    State.settings.otherCalls = st.otherCalls || [];
    State.settings.myCalls = st.myCalls || [];
    State.settings.avatarPool = st.avatarPool || [];
    State.settings.avatarPairs = st.avatarPairs || [];
    State.settings.chatBgPool = st.chatBgPool || [];
    State.settings.lockBgPool = st.lockBgPool || [];
  }
  const c = await Store.read('cards.json'); if (c) State.cards = c;
  const t = await Store.read('trash.json'); if (t) State.trash = t;
  const m = await Store.read('messages.json'); if (m) State.messages = m;
  const l = await Store.read('love.json'); if (l != null) State.love = l;

  applyTheme(State.settings.theme);
  applyFloatBall();
  applyBackgrounds();
  applyAvatars();

  initLockPage();
  initChatPage();
  initFloatBallDrag();

  $('#modal-mask').addEventListener('click', e => {
    if (e.target.id === 'modal-mask') closeModal();
  });
  $('#sub-back').onclick = () => goBack();
}

window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
