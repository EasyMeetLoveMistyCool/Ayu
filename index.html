/* ===== 通用结构 ===== */
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:8px 0 calc(6px + env(safe-area-inset-top));position:relative;z-index:5}
.avatar-wrap{display:flex;flex-direction:column;align-items:center}
.avatar-group{position:relative;width:72px;height:44px}
.av-her{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:10px;background:#fff;background-size:cover;background-position:center;box-shadow:1px 2px 5px rgba(0,0,0,.15)}
.av-me{position:absolute;left:44px;bottom:0;width:28px;height:28px;border-radius:7px;background:#fff;background-size:cover;background-position:center;box-shadow:1px 2px 4px rgba(0,0,0,.15)}
.names{display:flex;justify-content:space-between;width:72px;margin-top:5px;font-size:12px;min-height:14px}
.names span:first-child{text-align:left;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names span:last-child{text-align:right;max-width:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#stream{flex:1 1 auto;overflow-y:auto;padding:28px 16px 40px;position:relative;-webkit-overflow-scrolling:touch}
.msgnote{position:relative;max-width:72%;padding:14px 16px;margin:24px 0;font-size:16px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.msgnote.me{margin-left:auto;margin-right:20px}
.msgnote.her{margin-right:auto;margin-left:20px}
.msgnote .nav{position:absolute;width:26px;height:26px;border-radius:7px;background-color:#fff;background-size:cover;background-position:center}
.msgnote.me .nav{right:-13px;bottom:-13px}
.msgnote.her .nav{left:-13px;bottom:-13px}
.stamp{position:absolute;bottom:-14px;right:10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:2px;font-size:10px}
.msgnote.me .stamp{right:22px}
.waiting{max-width:72%;margin:24px auto 24px 20px;padding:16px 14px;font-size:14px;text-align:center;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.sys{text-align:center;font-size:12.5px;margin:16px auto;padding:6px 12px;border-radius:4px;max-width:80%}

#composer{flex:0 0 auto;position:relative;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.hold-bar{display:flex;align-items:center;justify-content:center;height:20px}
.hold-handle{width:44px;height:4px;border-radius:2px;opacity:.6}
.input-note{position:relative;padding:10px 56px 10px 12px}
#msgInput{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;resize:none;max-height:120px;line-height:1.4}
#sendStamp{position:absolute;right:8px;bottom:8px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:15px;font-weight:700}
#sendStamp:active{transform:scale(.92)}

#quickDrawer{position:fixed;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:15;padding:8px 10px calc(6px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
#quickDrawer.on{transform:translateY(0)}
.drawer-handle{width:44px;height:4px;border-radius:2px;margin:2px auto 10px;opacity:.6}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:10px;font-size:11px}
.qb .ico{width:22px;height:22px}
.qb:active{opacity:.7}

#drawerMask{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#drawerMask.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:220px;box-shadow:4px 0 16px rgba(0,0,0,.2);transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:21;padding-top:calc(16px + env(safe-area-inset-top));overflow-y:auto;-webkit-overflow-scrolling:touch}
#drawer.on{transform:translateX(0)}
.drawer-item{display:flex;align-items:center;gap:12px;padding:15px 20px;font-size:16px}
.drawer-item:active{opacity:.7}

.page{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;overflow:hidden}
.page.show{display:flex}
.page-head{flex:0 0 auto;height:52px;display:flex;align-items:center;padding:0 14px;padding-top:env(safe-area-inset-top)}
.page-head .back{font-size:22px;width:36px}
.page-head h2{flex:1;text-align:center;font-size:18px;font-weight:700;margin-right:36px}
.page-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
body.has-bg .page{background:transparent !important}

.box-wrap{padding:6px 4px}
.box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;border-radius:14px}
.drawer-cell{position:relative;padding:12px 4px;border-radius:10px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 4px rgba(0,0,0,.1);transition:transform .15s}
.drawer-cell:active{transform:translateY(2px)}
.drawer-cell .pull{width:24px;height:4px;border-radius:2px;background:currentColor;opacity:.35}
.drawer-cell .cnt{font-size:11px;opacity:.65}
.drawer-cell.on{outline:2px solid #c47a3a}
.panel{margin-top:14px}
.panel .toolbar{display:flex;gap:6px;padding:10px 0;align-items:center}
.panel .tool{flex:1;min-width:40px;height:42px;display:flex;align-items:center;justify-content:center}
.panel .tool:active{opacity:.6}
.panel .tool.more{flex:0 0 44px}
.card-item{position:relative;padding:13px 40px 13px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.card-item.sel{outline:2px solid #c47a3a}
.card-item .chk{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:2px solid #c47a3a;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:14px;color:#c47a3a}
.card-item.selmode{padding-left:36px}
.card-item.selmode .chk{display:flex}
.empty-tip{text-align:center;font-size:14px;padding:40px 20px;line-height:1.8}
.doing{text-align:center;font-size:15px;padding:60px 20px;opacity:.6;line-height:2}

#multiBar{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;z-index:30}
#multiBar.on{display:flex}
.mbtn{flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:15px}
.mbtn:active{opacity:.7}
.mbtn.danger{color:#a5401a}

#selectAllRow{padding:8px 2px;font-size:14px;display:none;align-items:center;gap:8px}
#selectAllRow.on{display:flex}
#selectAllRow input{width:18px;height:18px}

#sheetMask{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#sheetMask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;border-radius:14px 14px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;z-index:41}
#sheet.on{transform:translateY(0)}
.sheet-item{padding:15px 20px;font-size:16px;text-align:center}
.sheet-item:active{opacity:.6}
.sheet-item.danger{color:#a5401a}
.sheet-cancel{margin-top:6px}

#addArea{flex:1;width:100%;padding:14px;font-family:inherit;font-size:16px;line-height:30px;outline:none;resize:none}
.save-btn{width:100%;margin-top:14px;height:48px;font-family:inherit;font-size:17px;font-weight:700}
.save-btn:active{opacity:.85}

.set-group{padding:14px;margin-bottom:14px}
.set-group h3{font-size:15px;margin-bottom:12px;font-weight:400;display:flex;align-items:center;gap:6px}
.person-block{display:flex;align-items:flex-start;gap:14px}
.person-av{width:80px;height:80px;border-radius:12px;background:#fff;background-size:cover;background-position:center;flex:0 0 auto}
.person-fields{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.person-fields .field-row{display:flex;align-items:center;gap:8px}
.person-fields .field-row span{flex:0 0 auto;font-size:14px}
.person-fields .field-row input{flex:1;min-width:0;height:36px;font-family:inherit;font-size:15px;padding:0 10px;outline:none;border-radius:5px}

.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:15.5px}
.set-row input[type=number]{width:64px;height:34px;text-align:center;font-family:inherit;font-size:15px;outline:none;border-radius:4px}
.set-row input[type=range]{flex:1;margin-left:14px}
.bg-preview{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;border:1px solid #cbb98f;margin-right:12px}
.style-opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.style-opt{flex:1;min-width:44%;height:52px;display:flex;align-items:center;justify-content:center;font-size:14px}
.style-opt.on{font-weight:700}
.btn-danger{width:100%;height:46px;font-family:inherit;font-size:16px;font-weight:700}
.btn-danger:active{opacity:.85}
.mini-btn{font-family:inherit;font-size:13px;padding:6px 12px;border:1px solid #cbb98f;border-radius:5px;background:#fffaf0;color:#6b5334}
.mini-btn:active{opacity:.7}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(40,30,20,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  <div class="sheet-item" id="shExport">导出</div>
  <div class="sheet-item sheet-cancel" id="shCancel">取消</div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept=".json,.txt" style="display:none">

<script>
const FS = {
  dir:null,
  async init(){ try{ const root=await navigator.storage.getDirectory(); this.dir=await root.getDirectoryHandle('ayu_aliang',{create:true}); return true; }catch(e){ this.dir=null; return false; } },
  async read(name,def){ try{ if(this.dir){ const fh=await this.dir.getFileHandle(name); const f=await fh.getFile(); const t=await f.text(); return t?JSON.parse(t):def; } else{ const t=localStorage.getItem('ayu_'+name); return t?JSON.parse(t):def; } }catch(e){ return def; } },
  async write(name,obj){ const t=JSON.stringify(obj); try{ if(this.dir){ const fh=await this.dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(t); await w.close(); } else{ localStorage.setItem('ayu_'+name,t); } }catch(e){} }
};

let cards=[], messages=[];
let settings={ dMin:30,dMax:60,gMin:5,gMax:8,style:'retro',
  avatarHer:null,avatarMe:null,nameHer:'',nameMe:'',callHer:'',callMe:'',
  bg:null, bgMask:55 };

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const saveCards=()=>FS.write('cards.json',{cards});
const saveMsgs =()=>FS.write('messages.json',{messages});
const saveSet  =()=>FS.write('settings.json',settings);
const $=s=>document.querySelector(s);
const stream=$('#stream'), drawer=$('#drawer'), mask=$('#drawerMask');

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2000); }

function applyProfile(){
  const h=settings.avatarHer,m=settings.avatarMe;
  $('#avHer').style.backgroundImage=h?`url(${h})`:'none';
  $('#avMe').style.backgroundImage =m?`url(${m})`:'none';
  $('#setAvHer').style.backgroundImage=h?`url(${h})`:'none';
  $('#setAvMe').style.backgroundImage =m?`url(${m})`:'none';
  $('#nameHer').textContent=settings.callHer||'';
  $('#nameMe').textContent =settings.callMe ||'';
  $('#setNameHer').value=settings.nameHer||''; $('#setNameMe').value=settings.nameMe||'';
  $('#setCallHer').value=settings.callHer||''; $('#setCallMe').value=settings.callMe||'';
}
/* 背景 */
function applyBg(){
  const L=$('#bgLayer'), M=$('#bgMask');
  if(settings.bg){
    document.body.classList.add('has-bg');
    L.style.backgroundImage=`url(${settings.bg})`;
    const a=(settings.bgMask==null?55:settings.bgMask)/100;
    M.style.background=`rgba(255,255,255,${a})`;
    $('#bgPreview').style.backgroundImage=`url(${settings.bg})`;
  }else{
    document.body.classList.remove('has-bg');
    L.style.backgroundImage='none'; M.style.background='none';
    $('#bgPreview').style.backgroundImage='none';
  }
}
function fmtTime(ts){ const d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }

function makeNote(m, withAvatar){
  const el=document.createElement('div');
  el.className='msgnote '+(m.from==='me'?'me':'her');
  el.textContent=m.text;
  if(withAvatar){
    const av = m.from==='me'?settings.avatarMe:settings.avatarHer;
    if(av){ const nav=document.createElement('div'); nav.className='nav'; nav.style.backgroundImage=`url(${av})`; el.appendChild(nav); }
  }
  const st=document.createElement('div'); st.className='stamp'; st.textContent=fmtTime(m.time);
  el.appendChild(st); return el;
}
function firstOfGroup(idx){ if(idx===0) return true; return messages[idx-1].from !== messages[idx].from; }
function renderMessages(){ stream.innerHTML=''; messages.forEach((m,i)=>stream.appendChild(makeNote(m, firstOfGroup(i)))); scrollBottom(); }
function scrollBottom(){ requestAnimationFrame(()=>stream.scrollTop=stream.scrollHeight); }
function appendMessage(m){
  messages.push(m); saveMsgs();
  const withAvatar = messages.length===1 || messages[messages.length-2].from!==m.from;
  stream.appendChild(makeNote(m, withAvatar)); scrollBottom();
}
function showSystem(text){ const el=document.createElement('div'); el.className='sys'; el.dataset.sys='1'; el.textContent=text; stream.appendChild(el); scrollBottom(); }
function removeEmptyTip(){ stream.querySelectorAll('[data-sys="1"]').forEach(n=>n.remove()); }

let pendingReply=false;
function sendMessage(){
  const input=$('#msgInput'); const text=input.value.trim(); if(!text) return;
  appendMessage({id:uid(),from:'me',text,time:Date.now()});
  input.value=''; input.style.height='auto'; triggerReply();
}
function triggerReply(){
  const avail=cards.filter(c=>!c.locked); if(avail.length===0) return;
  if(pendingReply) return; pendingReply=true;
  const delay=rand(settings.dMin,settings.dMax)*1000;
  setTimeout(async ()=>{
    pendingReply=false;
    const n=randInt(1,3); const pool=cards.filter(c=>!c.locked);
    for(let i=0;i<n;i++){
      if(pool.length===0) break;
      const pick=pool[randInt(0,pool.length-1)];
      appendMessage({id:uid(),from:'her',text:pick.text,time:Date.now()});
      if(i<n-1) await new Promise(r=>setTimeout(r, rand(settings.gMin,settings.gMax)*1000));
    }
  }, delay);
}
$('#msgInput').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
$('#sendStamp').addEventListener('click',sendMessage);

/* 快捷抽屉 */
const quickItems=[
  {ic:'i-cam',n:'拍照'},{ic:'i-pic',n:'相册'},{ic:'i-vid',n:'视频'},
  {ic:'i-sticker',n:'贴纸'},{ic:'i-touch',n:'互动'},{ic:'i-music',n:'音乐'},
  {ic:'i-ask',n:'回应'},{ic:'i-together',n:'陪伴'},{ic:'i-archive',n:'归档'},
  {ic:'i-sync',n:'同频'}
];
(function buildQuick(){
  const g=$('#quickGrid');
  quickItems.forEach(q=>{
    const d=document.createElement('div'); d.className='qb';
    d.innerHTML=`<svg class="ico"><use href="#${q.ic}"/></svg><span>${q.n}</span>`;
    d.addEventListener('click',()=>toast('「'+q.n+'」还在做'));
    g.appendChild(d);
  });
})();
function openQuick(){ if(document.body.classList.contains('page-open')) return; $('#quickDrawer').classList.add('on'); }
function closeQuick(){ $('#quickDrawer').classList.remove('on'); }
/* 提手 + 底部拉手：点击开关 */
function toggleQuick(){ const d=$('#quickDrawer'); if(d.classList.contains('on')) closeQuick(); else openQuick(); }
$('#qHandle').addEventListener('click',toggleQuick);
$('#holdBar').addEventListener('click',toggleQuick);
/* 上滑开、下滑关（仅聊天页） */
let sY=0, tracking=false, mode=null;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('textarea,input')) return;
  if(document.body.classList.contains('page-open')){ tracking=false; return; }
  const t=e.touches[0]; sY=t.clientY;
  if($('#quickDrawer').classList.contains('on')){ mode='close'; }
  else if(t.clientY > window.innerHeight-120){ mode='open'; }
  else{ mode=null; }
  tracking=!!mode;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!tracking) return;
  const dy = sY - e.touches[0].clientY;
  if(mode==='open' && dy>50){ openQuick(); tracking=false; }
  if(mode==='close' && dy<-50){ closeQuick(); tracking=false; }
},{passive:true});
document.addEventListener('touchend',()=>{tracking=false;},{passive:true});

/* 侧栏 */
const sideItems=[
  {n:'口袋',ic:'i-box',go:'pocket'},{n:'信箱',ic:'i-mail',go:'doing'},
  {n:'恋人空间',ic:'i-space',go:'doing'},{n:'心动时刻',ic:'i-heart',go:'doing'},
  {n:'时光温存',ic:'i-clock',go:'doing'},{n:'旧梦温存',ic:'i-dream',go:'doing'},
  {n:'备忘录',ic:'i-note',go:'doing'},{n:'心愿单',ic:'i-wish',go:'doing'},
  {n:'重要日',ic:'i-day',go:'doing'},{n:'设置',ic:'i-set',go:'settings'}
];
(function buildDrawer(){
  sideItems.forEach(it=>{
    const d=document.createElement('div'); d.className='drawer-item';
    d.innerHTML=`<svg class="ico"><use href="#${it.ic}"/></svg>${it.n}`;
    d.addEventListener('click',()=>{ closeDrawer(); if(it.go==='pocket'){openPocket();} else if(it.go==='settings'){openSettings();} else {openDoing(it.n);} });
    drawer.appendChild(d);
  });
})();
function openDrawer(){ drawer.classList.add('on'); mask.classList.add('on'); }
function closeDrawer(){ drawer.classList.remove('on'); mask.classList.remove('on'); }
mask.addEventListener('click',closeDrawer);
let sx=0,sy=0,edge=false;
document.addEventListener('touchstart',e=>{ if(e.target.closest('textarea,input,#quickDrawer')){ edge=false; return; } const t=e.touches[0]; sx=t.clientX; sy=t.clientY; edge = !drawer.classList.contains('on'); },{passive:true});
document.addEventListener('touchmove',e=>{ if(!edge) return; const t=e.touches[0]; const dx=t.clientX-sx, dy=Math.abs(t.clientY-sy); if(dx>60 && dy<50){ openDrawer(); edge=false; } },{passive:true});
document.addEventListener('touchend',()=>{ edge=false; },{passive:true});
let cx=0;
document.addEventListener('touchstart',e=>{ if(drawer.classList.contains('on')) cx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchmove',e=>{ if(!drawer.classList.contains('on')) return; if(e.touches[0].clientX - cx < -60) closeDrawer(); },{passive:true});

function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); $('#'+id).classList.add('show'); document.body.classList.add('page-open'); closeQuick(); }
function hidePages(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); document.body.classList.remove('page-open'); }
function openDoing(name){ $('#doingTitle').textContent=name; showPage('page-doing'); }
function openSettings(){ applyProfile(); applyBg(); renderSettings(); showPage('page-settings'); }
document.querySelectorAll('[data-back]').forEach(el=>{
  el.addEventListener('click',()=>{
    if($('#page-add').classList.contains('show')){
      if($('#addArea').value.trim()){ if(!confirm('还没放进口袋，确定离开吗？')) return; $('#addArea').value=''; }
    }
    exitSelMode(); hidePages();
  });
});

/* 口袋：收纳盒 + 四抽屉 */
const pocketCats=[
  {key:'card', n:'字卡', ic:'i-note'},
  {key:'sticker', n:'贴纸', ic:'i-sticker'},
  {key:'interact', n:'互动', ic:'i-touch'},
  {key:'music', n:'音乐', ic:'i-music'}
];
let curCat=null;
function openPocket(){ curCat=null; renderPocketBox(); showPage('page-pocket'); }
function catCount(key){ if(key==='card') return cards.length; return 0; }
function renderPocketBox(){
  $('#pocketTitle').textContent='口袋';
  const box=$('#pocketBox'); box.innerHTML='';
  pocketCats.forEach(c=>{
    const d=document.createElement('div'); d.className='drawer-cell'+(curCat===c.key?' on':'');
    d.innerHTML=`<div class="pull"></div><svg class="ico" style="width:20px;height:20px"><use href="#${c.ic}"/></svg><span>${c.n}</span><span class="cnt">${catCount(c.key)}</span>`;
    d.addEventListener('click',()=>{ curCat=c.key; renderPocketBox(); });
    box.appendChild(d);
  });
  renderPanel();
}
function renderPanel(){
  const p=$('#pocketPanel');
  if(!curCat){ p.innerHTML=''; return; }
  if(curCat==='card'){ renderCardPanel(p); return; }
  p.innerHTML='<div class="doing">这一类还在做</div>';
}
let selMode=false, selSet=new Set(), searchKw='', lockedView=false;
function renderCardPanel(p){
  p.innerHTML=`
    <div class="toolbar" id="cardTools">
      <div class="tool" data-t="search"><svg class="ico"><use href="#i-search"/></svg></div>
      <div class="tool" data-t="add"><svg class="ico"><use href="#i-add"/></svg></div>
      <div class="tool" data-t="del"><svg class="ico"><use href="#i-del"/></svg></div>
      <div class="tool" data-t="locked"><svg class="ico"><use href="#i-lock"/></svg></div>
      <div class="tool more" data-t="more"><svg class="ico"><use href="#i-more"/></svg></div>
    </div>
    <div id="selectAllRow"><input type="checkbox" id="selectAllChk"><label for="selectAllChk">全选</label></div>
    <div id="cardList"></div>`;
  bindCardTools(); renderCardList();
}
function currentCards(){
  if(lockedView) return cards.filter(c=>c.locked);
  let arr=cards.filter(c=>!c.locked);
  if(searchKw) arr=arr.filter(c=>c.text.includes(searchKw));
  return arr;
}
function renderCardList(){
  const list=$('#cardList'); if(!list) return;
  list.innerHTML='';
  const arr=currentCards();
  // 只在搜索/锁列表时显示提示（口袋里数量抽屉上已有）
  let line='';
  if(lockedView) line='锁起来 '+arr.length+' 张';
  else if(searchKw) line='找到 '+arr.length+' 张';
  if(line){
    const l=document.createElement('div'); l.className='count-line'; l.textContent=line; list.appendChild(l);
  }
  if(arr.length===0){
    const e=document.createElement('div'); e.className='empty-tip';
    e.innerHTML = lockedView?'还没有锁上的字卡':(searchKw?'没找到':'口袋里还没有字卡<br>点 ➕ 给祂放几张吧');
    list.appendChild(e);
    updateMultiBar(); updateSelectAll(); return;
  }
  arr.forEach(c=>{
    const el=document.createElement('div');
    el.className='card-item'+(selMode?' selmode':'')+(selSet.has(c.id)?' sel':'');
    el.textContent=c.text;
    const chk=document.createElement('div'); chk.className='chk'; chk.textContent=selSet.has(c.id)?'✓':''; el.appendChild(chk);
    el.addEventListener('click',()=>{
      if(selMode){ if(selSet.has(c.id)) selSet.delete(c.id); else selSet.add(c.id); renderCardList(); }
      else openSheet(c.id);
    });
    list.appendChild(el);
  });
  updateMultiBar(); updateSelectAll();
}
function updateSelectAll(){ const row=$('#selectAllRow'); if(!row) return; if(!selMode){ row.classList.remove('on'); return; } row.classList.add('on'); const arr=currentCards(); $('#selectAllChk').checked = arr.length>0 && arr.every(c=>selSet.has(c.id)); }
function updateMultiBar(){ $('#multiBar').classList.toggle('on', selMode); }
function exitSelMode(){ selMode=false; selSet.clear(); const r=$('#selectAllRow'); if(r) r.classList.remove('on'); $('#multiBar').classList.remove('on'); const del=document.querySelector('#cardTools .tool[data-t="del"]'); if(del) del.classList.remove('on'); }
function bindCardTools(){
  const tools=$('#cardTools'); if(!tools) return;
  tools.addEventListener('click',e=>{
    const t=e.target.closest('.tool'); if(!t) return;
    const act=t.dataset.t;
    if(act==='search'){ const kw=prompt('搜索字卡',searchKw); if(kw!==null){ searchKw=kw.trim(); lockedView=false; renderCardList(); } }
    else if(act==='add'){ $('#addArea').value=''; delete $('#addArea').dataset.editing; showPage('page-add'); }
    else if(act==='del'){ if(!selMode){ selMode=true; selSet.clear(); t.classList.add('on'); renderCardList(); } else{ exitSelMode(); renderCardList(); } }
    else if(act==='locked'){ lockedView=!lockedView; selMode=false; selSet.clear(); searchKw=''; renderCardList(); }
    else if(act==='more'){ openMoreSheet(); }
  });
  const all=$('#selectAllChk'); if(all) all.addEventListener('change',e=>{ const arr=currentCards(); if(e.target.checked) arr.forEach(c=>selSet.add(c.id)); else selSet.clear(); renderCardList(); });
}
$('#mLock').addEventListener('click',()=>{ if(selSet.size===0){toast('还没选字卡');return;} const n=selSet.size; cards.forEach(c=>{ if(selSet.has(c.id)) c.locked=true; }); saveCards(); exitSelMode(); renderCardList(); removeEmptyTip(); toast('已锁上 '+n+' 张'); });
$('#mUnlock').addEventListener('click',()=>{ if(selSet.size===0){toast('还没选字卡');return;} const n=selSet.size; cards.forEach(c=>{ if(selSet.has(c.id)) c.locked=false; }); saveCards(); exitSelMode(); renderCardList(); toast('已解锁 '+n+' 张'); });
$('#mDel').addEventListener('click',()=>{ if(selSet.size===0){toast('还没选字卡');return;} if(confirm('删除选中的 '+selSet.size+' 张字卡？')){ cards=cards.filter(c=>!selSet.has(c.id)); saveCards(); exitSelMode(); renderCardList(); toast('已删除'); } });

let sheetCardId=null;
function openSheet(id){
  sheetCardId=id;
  const c=cards.find(x=>x.id===id); if(!c) return;
  document.querySelectorAll('#sheet .sheet-item').forEach(el=>{
    el.style.display = ['shEdit','shLock','shDel','shCancel'].includes(el.id) ? 'block' : 'none';
  });
  const li=$('#shLock');
  if(c.locked){ li.textContent='解锁'; li.dataset.act='unlock'; } else { li.textContent='锁上'; li.dataset.act='lock'; }
  $('#sheetMask').classList.add('on'); $('#sheet').classList.add('on');
}
function openMoreSheet(){
  document.querySelectorAll('#sheet .sheet-item').forEach(el=>{
    el.style.display = ['shDedup','shImport','shExport','shCancel'].includes(el.id) ? 'block' : 'none';
  });
  $('#sheetMask').classList.add('on'); $('#sheet').classList.add('on');
}
function closeSheet(){ $('#sheetMask').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#sheetMask').addEventListener('click',closeSheet);
$('#shCancel').addEventListener('click',closeSheet);
$('#shEdit').addEventListener('click',()=>{ const id=sheetCardId; closeSheet(); if(id) editCard(id); });
$('#shLock').addEventListener('click',()=>{ const c=cards.find(x=>x.id===sheetCardId); if(!c){closeSheet();return;} const act=$('#shLock').dataset.act; if(act==='lock'){c.locked=true;toast('已锁上');}else{c.locked=false;toast('已解锁');} saveCards(); closeSheet(); renderCardList(); removeEmptyTip(); });
$('#shDel').addEventListener('click',()=>{ if(!cards.find(x=>x.id===sheetCardId)){closeSheet();return;} if(confirm('删除这张字卡？')){ cards=cards.filter(x=>x.id!==sheetCardId); saveCards(); renderCardList(); toast('已删除'); } closeSheet(); });
$('#shDedup').addEventListener('click',()=>{ closeSheet(); dedup(); });
$('#shImport').addEventListener('click',()=>{ closeSheet(); $('#fileInput').click(); });
$('#shExport').addEventListener('click',()=>{ closeSheet(); exportCards(); });

function editCard(id){ const c=cards.find(x=>x.id===id); if(!c) return; $('#addArea').value=c.text; $('#addArea').dataset.editing=id; showPage('page-add'); }
function dedup(){
  const seen=new Set(); const kept=[];
  cards.forEach(c=>{ if(seen.has(c.text)) return; seen.add(c.text); kept.push(c); });
  const removed=cards.length-kept.length;
  if(removed===0){ toast('没有重复的字卡'); return; }
  if(confirm('发现 '+removed+' 张重复，保留最早的，删除其余？')){ cards=kept; saveCards(); renderCardList(); toast('已删除 '+removed+' 张重复字卡'); }
}
$('#fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text(); let incoming=[]; const name=f.name.toLowerCase();
  try{
    if(name.endsWith('.json')||text.trim().startsWith('{')){ const obj=JSON.parse(text); const arr=Array.isArray(obj)?obj:(obj.cards||[]); incoming=arr.map(x=>typeof x==='string'?x:(x.text||'')).filter(Boolean); }
    else{ incoming=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); }
  }catch(err){ toast('文件格式无法识别'); e.target.value=''; return; }
  const exist=new Set(cards.map(c=>c.text)); let added=0,skipped=0;
  incoming.forEach(txt=>{ if(exist.has(txt)){ skipped++; return; } cards.push({id:uid(),text:txt,locked:false}); exist.add(txt); added++; });
  if(added) await saveCards();
  if(curCat==='card'){ renderCardList(); removeEmptyTip(); }
  toast('导入 '+added+' 张，跳过 '+skipped+' 张重复');
  e.target.value='';
});
async function exportCards(){
  const fmt=prompt('导出格式：输入 1 = JSON，2 = TXT','1'); if(fmt!=='1'&&fmt!=='2') return;
  const out=cards.filter(c=>!c.locked); let data,fname,type;
  if(fmt==='1'){ data=JSON.stringify({cards:out.map(c=>({text:c.text}))},null,2); fname='阿遇♡阿凉字卡.json'; type='application/json'; }
  else{ data=out.map(c=>c.text).join('\n'); fname='阿遇♡阿凉字卡.txt'; type='text/plain'; }
  const blob=new Blob([data],{type}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('已导出 '+out.length+' 张字卡');
}
$('#saveCards').addEventListener('click',async ()=>{
  const area=$('#addArea'); const editingId=area.dataset.editing;
  const lines=area.value.split(/\r?\n/).map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim());
  if(lines.length===0){ toast('还没写呢'); return; }
  if(editingId){
    const c=cards.find(x=>x.id===editingId);
    if(c){ c.text=area.value.trim(); await saveCards(); }
    delete area.dataset.editing; area.value=''; toast('已放进口袋');
  }else{
    const exist=new Set(cards.map(c=>c.text)); let added=0,skipped=0;
    lines.forEach(line=>{ if(exist.has(line)){ skipped++; return; } cards.push({id:uid(),text:line,locked:false}); exist.add(line); added++; });
    await saveCards(); area.value='';
    toast(skipped? ('放进了 '+added+' 张，跳过 '+skipped+' 张重复') : ('放进了 '+added+' 张字卡'));
  }
  removeEmptyTip();
  document.body.classList.add('page-open'); $('#page-add').classList.add('show');
});

function renderSettings(){
  $('#dMin').value=settings.dMin; $('#dMax').value=settings.dMax;
  $('#gMin').value=settings.gMin; $('#gMax').value=settings.gMax;
  $('#bgMaskRange').value = settings.bgMask==null?55:settings.bgMask;
  document.querySelectorAll('.style-opt').forEach(o=>o.classList.toggle('on',o.dataset.style===settings.style));
  applyProfile(); applyBg();
}
function bindNum(id,key){ $('#'+id).addEventListener('change',e=>{ let v=parseInt(e.target.value)||0; if(v<0)v=0; settings[key]=v; saveSet(); }); }
bindNum('dMin','dMin'); bindNum('dMax','dMax'); bindNum('gMin','gMin'); bindNum('gMax','gMax');
$('#setNameHer').addEventListener('input',e=>{settings.nameHer=e.target.value;saveSet();});
$('#setNameMe').addEventListener('input',e=>{settings.nameMe=e.target.value;saveSet();});
$('#setCallHer').addEventListener('input',e=>{settings.callHer=e.target.value;saveSet();applyProfile();});
$('#setCallMe').addEventListener('input',e=>{settings.callMe=e.target.value;saveSet();applyProfile();});
document.querySelectorAll('.style-opt').forEach(o=>{ o.addEventListener('click',()=>{ settings.style=o.dataset.style; document.body.className=settings.style+(settings.bg?' has-bg':''); saveSet(); renderSettings(); }); });
$('#clearMsgs').addEventListener('click',()=>{ if(confirm('清空所有聊天记录？此操作不可恢复')){ messages=[]; saveMsgs(); renderMessages(); toast('已清空'); } });

/* 背景 */
const bgFile=document.createElement('input'); bgFile.type='file'; bgFile.accept='image/*'; bgFile.style.display='none'; document.body.appendChild(bgFile);
$('#bgUpload').addEventListener('click',()=>bgFile.click());
$('#bgClear').addEventListener('click',()=>{ settings.bg=null; saveSet(); applyBg(); toast('已清除背景'); });
bgFile.addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ settings.bg=r.result; saveSet(); applyBg(); toast('已更换背景'); }; r.readAsDataURL(f); e.target.value=''; });
$('#bgMaskRange').addEventListener('input',e=>{ settings.bgMask=parseInt(e.target.value)||0; saveSet(); applyBg(); });

/* 头像 */
let avTarget=null;
const avFile=document.createElement('input'); avFile.type='file'; avFile.accept='image/*'; avFile.style.display='none'; document.body.appendChild(avFile);
$('#setAvHer').addEventListener('click',()=>{ avTarget='her'; avFile.click(); });
$('#setAvMe').addEventListener('click',()=>{ avTarget='me'; avFile.click(); });
avFile.addEventListener('change',e=>{ const f=e.target.files[0]; if(!f||!avTarget) return; const r=new FileReader(); r.onload=()=>{ if(avTarget==='her') settings.avatarHer=r.result; else settings.avatarMe=r.result; saveSet(); applyProfile(); renderMessages(); toast('已更换头像'); }; r.readAsDataURL(f); e.target.value=''; });

async function boot(){
  await FS.init();
  const c=await FS.read('cards.json',{cards:[]});
  const m=await FS.read('messages.json',{messages:[]});
  const s=await FS.read('settings.json',null);
  cards=c.cards||[]; messages=m.messages||[];
  if(s) settings=Object.assign(settings,s);
  document.body.className=settings.style||'retro';
  applyProfile(); applyBg(); renderMessages();
  if(cards.length===0) showSystem('口袋里还没有字卡，去给祂放几张吧');
}
boot();
</script>
</body>
</html>
