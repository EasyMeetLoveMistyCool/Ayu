<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e8dcc0">
<title>阿遇♡阿凉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Kaiti SC","STKaiti","KaiTi","FangSong","STFangsong",serif;color:#4a3b2a;user-select:none;position:relative}
#bgLayer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none;display:none}
#bgMask{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
body.has-bg #bgLayer,body.has-bg #bgMask{display:block}
body.has-bg .topbar{background:transparent !important;border-bottom-color:transparent !important;box-shadow:none !important}
body.has-bg .page,body.has-bg .page-head,body.has-bg #composer{background:transparent !important}
body.has-bg .page-head{border-bottom-color:transparent !important}
body.has-bg .set-group{background:rgba(255,252,244,.92) !important;backdrop-filter:blur(6px)}
body.has-bg .box{background:rgba(255,252,244,.92) !important;backdrop-filter:blur(6px)}
body.has-bg .card-item{background:rgba(255,252,244,.95) !important}
body.has-bg .empty-tip,body.has-bg .doing{text-shadow:0 1px 3px rgba(255,255,255,.9)}
body.has-bg .page-head h2,body.has-bg .page-head .back{text-shadow:0 1px 4px rgba(255,255,255,.9)}
body.has-bg .field-row input,body.has-bg .set-row input{background:rgba(255,255,255,.9) !important}
body.has-bg .style-opt{background:rgba(255,255,255,.85) !important}
body.has-bg .drawer-cell{background:rgba(255,252,244,.92) !important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;z-index:1}
body.page-open #app{visibility:hidden}
body.page-open .topbar{visibility:hidden}
.ico{width:22px;height:22px;display:block;flex:0 0 auto}
.ico-inline{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:5px}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:8px 0 calc(6px + env(safe-area-inset-top));position:relative;z-index:5}
.avatar-wrap{display:flex;flex-direction:column;align-items:center}
.avatar-group{position:relative;width:72px;height:44px}
.av-her{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:10px;background:#fff;background-size:cover;background-position:center;box-shadow:1px 2px 5px rgba(0,0,0,.15)}
.av-me{position:absolute;left:44px;bottom:0;width:28px;height:28px;border-radius:7px;background:#fff;background-size:cover;background-position:center;box-shadow:1px 2px 4px rgba(0,0,0,.15)}
.names{display:flex;justify-content:space-between;width:72px;margin-top:5px;font-size:12px;min-height:14px}
.names span:first-child{text-align:left;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names span:last-child{text-align:right;max-width:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stream{flex:1 1 auto;overflow-y:auto;padding:28px 16px 40px;position:relative;-webkit-overflow-scrolling:touch}
.msgnote{position:relative;max-width:72%;padding:14px 16px;margin:24px 0;font-size:16px;line-height:1.6;word-break:break-word;white-space:pre-wrap;animation:noteIn .28s ease both}
@keyframes noteIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msgnote.me{margin-left:auto;margin-right:20px}
.msgnote.her{margin-right:auto;margin-left:20px}
.msgnote.sticker-note{background:transparent !important;border:none !important;padding:0 !important;box-shadow:none !important;background-image:none !important}
.msgnote.sticker-note::after,.msgnote.sticker-note::before{display:none !important}
.msgnote .nav{position:absolute;width:26px;height:26px;border-radius:7px;background-color:#fff;background-size:cover;background-position:center}
.msgnote.me .nav{right:-13px;bottom:-13px}
.msgnote.her .nav{left:-13px;bottom:-13px}
.msgnote .stkmsg{max-width:160px;max-height:160px;border-radius:8px;display:block}
.msgnote .imgmsg{max-width:200px;max-height:240px;border-radius:10px;display:block}
.stamp{position:absolute;bottom:-14px;right:10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;padding:2px;font-size:10px}
.msgnote.me .stamp{right:22px}
.waiting{max-width:72%;margin:24px auto 24px 20px;padding:16px 14px;font-size:14px;text-align:center;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.sys{text-align:center;font-size:12.5px;margin:16px auto;padding:6px 12px;border-radius:4px;max-width:80%}
#composer{flex:0 0 auto;position:relative;padding:0 12px calc(10px + env(safe-area-inset-bottom));z-index:16}
.hold-bar{display:flex;align-items:center;justify-content:center;height:20px}
.hold-handle{width:44px;height:4px;border-radius:2px;opacity:.6}
.input-note{position:relative;padding:10px 56px 10px 12px}
#msgInput{width:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;resize:none;max-height:120px;line-height:1.4}
#sendStamp{position:absolute;right:8px;bottom:8px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:15px;font-weight:700}
#sendStamp:active{transform:scale(.92)}
#quickDrawer{position:fixed;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:30;padding:8px 10px calc(6px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.15);max-height:70vh;display:flex;flex-direction:column}
#quickDrawer.on{transform:translateY(0)}
.drawer-handle{width:44px;height:4px;border-radius:2px;margin:2px auto 10px;opacity:.6;flex:0 0 auto}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:10px;font-size:11px}
.qb .ico{width:22px;height:22px}
.qb:active{opacity:.7}
#quickSticker{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
#quickSticker.on{display:flex}
#quickInteract{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
#quickInteract.on{display:flex}
#quickMusic{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
#quickMusic.on{display:flex}
.qs-head{text-align:center;font-size:14px;font-weight:700;padding:4px 0 10px;flex:0 0 auto}
.qs-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
#drawerMask{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#drawerMask.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:220px;box-shadow:4px 0 16px rgba(0,0,0,.2);transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);z-index:21;padding-top:calc(16px + env(safe-area-inset-top));overflow-y:auto;-webkit-overflow-scrolling:touch}
#drawer.on{transform:translateX(0)}
.drawer-item{display:flex;align-items:center;gap:12px;padding:15px 20px;font-size:16px}
.drawer-item:active{opacity:.7}
.page{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;overflow:hidden}
.page.show{display:flex}
.page-head{flex:0 0 auto;height:52px;display:flex;align-items:center;padding:0 14px;padding-top:env(safe-area-inset-top)}
.page-head .back{font-size:22px;width:36px}
.page-head h2{flex:1;text-align:center;font-size:18px;font-weight:700;margin-right:36px}
.page-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.box-wrap{padding:6px 4px}
.box{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;border-radius:14px}
.drawer-cell{position:relative;padding:12px 4px;border-radius:10px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 4px rgba(0,0,0,.1);transition:transform .15s}
.drawer-cell:active{transform:translateY(2px)}
.drawer-cell .pull{width:24px;height:4px;border-radius:2px;background:currentColor;opacity:.35}
.drawer-cell .cnt{font-size:11px;opacity:.65}
.drawer-cell.on{outline:2px solid #c47a3a}
.panel{margin-top:14px}
.panel .toolbar{display:flex;gap:6px;padding:10px 0;align-items:center}
.panel .tool{flex:1;min-width:40px;height:42px;display:flex;align-items:center;justify-content:center}
.panel .tool:active{opacity:.6}
.card-item{position:relative;padding:13px 40px 13px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.card-item.sel{outline:2px solid #c47a3a}
.card-item .chk{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:2px solid #c47a3a;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:14px;color:#c47a3a}
.card-item.selmode{padding-left:36px}
.card-item.selmode .chk{display:flex}
.empty-tip{text-align:center;font-size:14px;padding:40px 20px;line-height:1.8}
.doing{text-align:center;font-size:15px;padding:60px 20px;opacity:.6;line-height:2}
.stk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 0}
.stk-cell{position:relative;aspect-ratio:1/1}
.stk-cell .stk-thumb{width:100%;height:100%}
.stk-cell .chk{position:absolute;left:4px;top:4px;width:22px;height:22px;border:2px solid #c47a3a;border-radius:4px;background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;font-size:14px;color:#c47a3a}
.stk-cell.selmode .chk{display:flex}
.stk-cell.sel .stk-thumb{outline:3px solid #c47a3a;outline-offset:-2px;border-radius:8px}
.stk-thumb{background-color:transparent;border:none;background-size:contain;background-repeat:no-repeat;background-position:center;position:relative;overflow:hidden}
.stk-thumb img{width:100%;height:100%;object-fit:contain;display:block}
#multiBar{position:fixed;left:0;right:0;bottom:0;display:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;z-index:30}
#multiBar.on{display:flex}
.mbtn{flex:1;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-size:15px}
.mbtn:active{opacity:.7}
.mbtn.danger{color:#a5401a}
#selectAllRow{padding:8px 2px;font-size:14px;display:none;align-items:center;gap:8px}
#selectAllRow.on{display:flex}
#selectAllRow input{width:18px;height:18px}
#sheetMask{position:fixed;inset:0;background:rgba(40,30,20,.4);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#sheetMask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;border-radius:14px 14px 0 0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s;z-index:41}
#sheet.on{transform:translateY(0)}
.sheet-item{padding:15px 20px;font-size:16px;text-align:center}
.sheet-item:active{opacity:.6}
.sheet-item.danger{color:#a5401a}
.sheet-cancel{margin-top:6px}
#addArea{flex:1;width:100%;padding:14px;font-family:inherit;font-size:16px;line-height:30px;outline:none;resize:none}
.save-btn{width:100%;margin-top:14px;height:48px;font-family:inherit;font-size:17px;font-weight:700}
.save-btn:active{opacity:.85}
.set-group{padding:14px;margin-bottom:14px}
.set-group h3{font-size:15px;margin-bottom:12px;font-weight:400;display:flex;align-items:center;gap:6px}
.person-block{display:flex;align-items:flex-start;gap:14px}
.person-av{width:80px;height:80px;border-radius:12px;background:#fff;background-size:cover;background-position:center;flex:0 0 auto}
.person-fields{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.person-fields .field-row{display:flex;align-items:center;gap:8px}
.person-fields .field-row span{flex:0 0 auto;font-size:14px}
.person-fields .field-row input{flex:1;min-width:0;height:36px;font-family:inherit;font-size:15px;padding:0 10px;outline:none;border-radius:5px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:15.5px}
.set-row input[type=number]{width:64px;height:34px;text-align:center;font-family:inherit;font-size:15px;outline:none;border-radius:4px}
.set-row input[type=range]{flex:1;margin:0 10px}
.bg-list{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0}
.bg-thumb{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;position:relative}
.bg-thumb.sel{outline:3px solid #c47a3a;outline-offset:2px}
.bg-add{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.6}
.style-opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.style-opt{flex:1;min-width:44%;height:52px;display:flex;align-items:center;justify-content:center;font-size:14px}
.style-opt.on{font-weight:700}
.btn-danger{width:100%;height:46px;font-family:inherit;font-size:16px;font-weight:700}
.btn-danger:active{opacity:.85}
#previewMask{position:fixed;inset:0;background:rgba(20,15,10,.85);z-index:60;display:none;flex-direction:column;padding:20px}
#previewMask.on{display:flex}
.pv-title{color:#fff;text-align:center;font-size:16px;margin-bottom:14px}
.pv-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.pv-grid img{width:100%;aspect-ratio:1/1;object-fit:contain;background:transparent}
.pv-btns{display:flex;gap:10px;padding-top:14px}
.pv-btns button{flex:1;height:48px;border-radius:8px;border:none;font-family:inherit;font-size:16px;font-weight:700}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(40,30,20,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.msgnote.interact{border-style:dashed;padding:10px 14px;margin:18px 0;font-size:15px;max-width:66%}
.msgnote.interact .itag{display:inline-block;font-size:10px;opacity:.85;margin-right:6px;padding:1px 6px;border:1px solid currentColor;border-radius:6px;vertical-align:1px}
.msgnote.interact.touch{margin-left:auto;margin-right:20px;border-radius:20px;border-style:solid;border-width:1px}
.msgnote.interact.touch::before{content:"";position:absolute;left:-3px;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:2px;background:currentColor;opacity:.5}
.msgnote.interact.back{margin-right:auto;margin-left:20px;border-radius:4px;border-style:dashed;border-width:2px}
.msgnote.interact.back::before{content:"";position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:2px;background:currentColor;opacity:.5}
.msgnote.interact.pair{margin-left:auto;margin-right:auto;text-align:center;border-style:double;border-width:4px;border-radius:14px;padding:14px 20px}
.qi-tabs{display:flex;gap:8px;padding:4px 0 10px;flex:0 0 auto}
.qi-tab{flex:1;height:38px;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:8px;border:1px solid currentColor;opacity:.6}
.qi-tab.on{opacity:1;font-weight:700}
.qi-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:2px 0}
.qi-item{min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13.5px;border-radius:8px;padding:8px 6px;line-height:1.35}
.qi-item:active{opacity:.7}
.music-item{display:flex;align-items:center;gap:10px;padding:12px 12px;margin-bottom:10px;border-radius:10px;font-size:15px;border:1px solid currentColor}
.music-item .mi-info{flex:1;min-width:0}
.music-item .mi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music-item .mi-sub{font-size:12px;opacity:.6;margin-top:3px}
.music-item .mi-play{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.qi-invite{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto;border-radius:50%}
.invite-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:44px;font-family:inherit;font-size:15px;font-weight:700;margin:4px 0 10px;border-radius:12px}
.invite-btn:active{opacity:.8}
#musicExtra input{margin-top:8px;width:100%;height:44px;padding:0 12px;font-family:inherit;font-size:15px;outline:none;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit}
#musicExtra #mFileBtn{margin-top:8px;width:100%;height:44px;font-family:inherit;font-size:15px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit}
#musicExtra #mFileTip{font-size:12px;opacity:.6;margin-top:6px}
#listenBanner{display:none;text-align:center;font-size:12px;padding:4px 0;opacity:.85}
#listenBanner.on{display:block}
#miniPlayer{position:fixed;left:12px;width:calc(100vw - 24px);bottom:80px;z-index:45;border-radius:14px;padding:10px 12px;display:none;flex-direction:column;gap:6px;touch-action:none}
#miniPlayer.on{display:flex}
.mp-row1{display:flex;align-items:center;gap:8px;cursor:move}
.mp-title{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-artist{font-size:12px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-2px}
.mp-close{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;opacity:.7}
.mp-row2{display:flex;align-items:center;gap:8px;font-size:11px}
.mp-bar{flex:1;height:6px;border-radius:3px;position:relative;cursor:pointer}
.mp-fill{height:100%;width:0%;border-radius:3px}
.mp-knob{position:absolute;top:50%;left:0%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.mp-time{flex:0 0 auto;min-width:80px;text-align:right;opacity:.75}
.mp-row3{display:flex;align-items:center;justify-content:space-around;padding-top:2px}
.mp-btn{width:40px;height:34px;display:flex;align-items:center;justify-content:center;position:relative}
.mp-btn:active{opacity:.6}
.mp-mode-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;background:rgba(40,30,20,.85);color:#fff;padding:2px 8px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.mp-mode-label.on{opacity:1}
.msgmenu{position:fixed;z-index:80;min-width:120px;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.msgmenu.on{display:block}
.msgmenu .mi{padding:12px 18px;font-size:15px;text-align:center}
.msgmenu .mi:active{opacity:.6}
.quote-bar{display:none;margin:0 0 8px;padding:8px 12px;border-radius:8px;font-size:13px;position:relative;opacity:.9}
.quote-bar.on{display:block}
.quote-bar .q-x{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:16px;opacity:.6}
.msgnote .quote{display:block;font-size:12.5px;line-height:1.4;padding:6px 10px;margin-bottom:6px;border-radius:6px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collection-item{padding:13px 14px;margin-bottom:10px;font-size:15px;line-height:1.45;word-break:break-word;position:relative}
.collection-item .ci-time{font-size:11px;opacity:.55;margin-top:6px}
.collection-item img{max-width:100%;border-radius:8px;display:block;margin-top:6px}
#stkList{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

body.retro{background-color:#e8dcc0;background-image:radial-gradient(circle at 20% 30%, rgba(160,130,90,.08) 0 2px, transparent 3px),radial-gradient(circle at 70% 60%, rgba(160,130,90,.06) 0 2px, transparent 3px),linear-gradient(160deg,#efe4c8,#e3d5b4);background-size:60px 60px,80px 80px,100% 100%;color:#4a3b2a}
body.retro .topbar{background:linear-gradient(#f3ead2,#e9dcbc);border-bottom:1px solid #cbb98f}
body.retro .names span{color:#6b5334}
body.retro .page{background:linear-gradient(160deg,#efe4c8,#e3d5b4)}
body.retro .page-head{background:rgba(243,234,210,.95);border-bottom:1px solid #cbb98f}
body.retro .page-head h2,body.retro .page-head .back{color:#6b5334}
body.retro #drawer{background:linear-gradient(160deg,#f3ead2,#e6d9ba);border-right:1px solid #c9b98f}
body.retro .drawer-item{color:#5a4a2e}
body.retro .tool{color:#7a5f30;border:1px solid #cbb98f;background:linear-gradient(#fffaf0,#f3ead2);border-radius:6px}
body.retro .card-item{background:linear-gradient(#fbf7ec,#f6f0e0);border:1px solid #d8cba8;color:#4a3b2a;border-radius:3px}

<script>
const FS={
  dir:null,stickerDir:null,musicDir:null,
  async init(){try{const root=await navigator.storage.getDirectory();this.dir=await root.getDirectoryHandle('ayu_aliang',{create:true});this.stickerDir=await this.dir.getDirectoryHandle('stickers',{create:true});this.musicDir=await this.dir.getDirectoryHandle('music',{create:true});return true;}catch(e){this.dir=null;this.stickerDir=null;this.musicDir=null;return false;}},
  async read(name,def){try{if(this.dir){const fh=await this.dir.getFileHandle(name);const f=await fh.getFile();const t=await f.text();return t?JSON.parse(t):def;}else{const t=localStorage.getItem('ayu_'+name);return t?JSON.parse(t):def;}}catch(e){return def;}},
  async write(name,obj){const t=JSON.stringify(obj);try{if(this.dir){const fh=await this.dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(t);await w.close();}else{localStorage.setItem('ayu_'+name,t);}}catch(e){}},
  async saveSticker(id,dataUrl){try{const res=await fetch(dataUrl);const blob=await res.blob();if(this.stickerDir){const fh=await this.stickerDir.getFileHandle(id,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return true;}else{localStorage.setItem('ayustk_'+id,dataUrl);return true;}}catch(e){return false;}},
  async readSticker(id){try{if(this.stickerDir){const fh=await this.stickerDir.getFileHandle(id);const f=await fh.getFile();return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});}else{return localStorage.getItem('ayustk_'+id);}}catch(e){return null;}},
  async delSticker(id){try{if(this.stickerDir){await this.stickerDir.removeEntry(id);}else{localStorage.removeItem('ayustk_'+id);}}catch(e){}},
  async saveMusicFile(id,blob){try{if(this.musicDir){const fh=await this.musicDir.getFileHandle(id,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();return true;}return false;}catch(e){return false;}},
  async readMusicFile(id){try{if(this.musicDir){const fh=await this.musicDir.getFileHandle(id);const f=await fh.getFile();return URL.createObjectURL(f);}return null;}catch(e){return null;}},
  async delMusicFile(id){try{if(this.musicDir){await this.musicDir.removeEntry(id);}}catch(e){}}
};
let cards=[],messages=[],stickers=[],musicList=[],collection=[];
let interactions={touch:[],back:[],pair:[]};
let stickerCache={};
let settings={dMin:30,dMax:60,gMin:5,gMax:8,style:'retro',avatarHer:null,avatarMe:null,nameHer:'',nameMe:'',callHer:'',callMe:'',bgs:[],bgCur:null,bgMask:55,mpPos:null,listening:false};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const saveCards=()=>FS.write('cards.json',{cards});
const saveMsgs=()=>FS.write('messages.json',{messages});
const saveSet=()=>FS.write('settings.json',settings);
const saveStickers=()=>FS.write('stickers.json',{stickers});
const saveInteractions=()=>FS.write('interactions.json',interactions);
const saveMusic=()=>FS.write('music.json',{musicList});
const saveCollection=()=>FS.write('collection.json',{collection});
const $=s=>document.querySelector(s);
const stream=$('#stream'),drawer=$('#drawer'),mask=$('#drawerMask');
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2000);}
function callHerName(){return settings.callHer||'祂';}
const INTERACT_LABEL={touch:'触碰',back:'回握',pair:'缱绻'};
const INTERACT_PLACE={touch:'想对祂做的动作…',back:'想让他对你做的动作…',pair:'想一起做的动作…'};
function applyProfile(){
  const h=settings.avatarHer,m=settings.avatarMe;
  $('#avHer').style.backgroundImage=h?`url(${h})`:'none';
  $('#avMe').style.backgroundImage=m?`url(${m})`:'none';
  $('#setAvHer').style.backgroundImage=h?`url(${h})`:'none';
  $('#setAvMe').style.backgroundImage=m?`url(${m})`:'none';
  $('#nameHer').textContent=settings.callHer||'';
  $('#nameMe').textContent=settings.callMe||'';
  $('#setNameHer').value=settings.nameHer||'';$('#setNameMe').value=settings.nameMe||'';
  $('#setCallHer').value=settings.callHer||'';$('#setCallMe').value=settings.callMe||'';
  const qm=$('#qmCallHer');if(qm)qm.textContent=callHerName();
  const lb=$('#lbName');if(lb)lb.textContent=callHerName();
  renderInviteLabel();
}
function applyBg(){
  const L=$('#bgLayer'),M=$('#bgMask');
  const cur=settings.bgs.find(b=>b.id===settings.bgCur);
  if(cur){document.body.classList.add('has-bg');L.style.backgroundImage=`url(${cur.data})`;const a=(settings.bgMask==null?55:settings.bgMask)/100;M.style.background=`rgba(255,255,255,${a})`;}
  else{document.body.classList.remove('has-bg');L.style.backgroundImage='none';M.style.background='none';}
}
function renderBgList(){
  const box=$('#bgList');box.innerHTML='';
  settings.bgs.forEach(b=>{
    const d=document.createElement('div');d.className='bg-thumb'+(settings.bgCur===b.id?' sel':'');d.style.backgroundImage=`url(${b.data})`;
    d.addEventListener('click',()=>{settings.bgCur=(settings.bgCur===b.id)?null:b.id;saveSet();applyBg();renderBgList();});
    box.appendChild(d);
  });
  const add=document.createElement('div');add.className='bg-add';add.textContent='＋';add.addEventListener('click',()=>bgFile.click());box.appendChild(add);
}
function fmtTime(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
function makeNote(m,withAvatar,idx){
  const el=document.createElement('div');
  const isInteract=m.type==='interact';
  el.className='msgnote '+(m.from==='me'?'me':'her')+(m.type==='sticker'?' sticker-note':'')+(isInteract?' interact':'');
  if(isInteract)el.classList.add(m.dir||'touch');
  if(m.quote){const q=document.createElement('span');q.className='quote';q.textContent='❝ '+(m.quote.text||(m.quote.type==='photo'?'[图片]':''));el.appendChild(q);}
  if(m.type==='sticker'){const img=document.createElement('img');img.className='stkmsg';img.src=m.data;el.appendChild(img);}
  else if(m.type==='photo'){const img=document.createElement('img');img.className='imgmsg';img.src=m.data;el.appendChild(img);}
  else if(isInteract){const tag=document.createElement('span');tag.className='itag';tag.textContent=INTERACT_LABEL[m.dir]||'互动';el.appendChild(tag);el.appendChild(document.createTextNode(m.text));}
  else{el.textContent=m.text;}
  if(withAvatar){const av=m.from==='me'?settings.avatarMe:settings.avatarHer;if(av){const nav=document.createElement('div');nav.className='nav';nav.style.backgroundImage=`url(${av})`;el.appendChild(nav);}}
  const st=document.createElement('div');st.className='stamp';st.textContent=fmtTime(m.time);el.appendChild(st);
  el.addEventListener('click',(e)=>{if(e.target.closest('.nav'))return;openMsgMenu(idx,el);});
  return el;
}
function firstOfGroup(idx){if(idx===0)return true;return messages[idx-1].from!==messages[idx].from;}
function renderMessages(){stream.innerHTML='';messages.forEach((m,i)=>stream.appendChild(makeNote(m,firstOfGroup(i),i)));scrollBottom();}
function scrollBottom(){requestAnimationFrame(()=>stream.scrollTop=stream.scrollHeight);}
function appendMessage(m){messages.push(m);saveMsgs();const withAvatar=messages.length===1||messages[messages.length-2].from!==m.from;stream.appendChild(makeNote(m,withAvatar,messages.length-1));scrollBottom();}
function showSystem(text){const el=document.createElement('div');el.className='sys';el.dataset.sys='1';el.textContent=text;stream.appendChild(el);scrollBottom();}
function removeEmptyTip(){stream.querySelectorAll('[data-sys="1"]').forEach(n=>n.remove());}

let msgMenuIdx=-1,msgMenuEl=null;
function openMsgMenu(idx,el){
  msgMenuIdx=idx;msgMenuEl=el;
  const menu=$('#msgMenu');menu.classList.add('on');
  const r=el.getBoundingClientRect();
  menu.style.left=Math.max(8,Math.min(window.innerWidth-140,r.left))+'px';
  menu.style.top=Math.min(window.innerHeight-110,r.bottom+6)+'px';
}
function closeMsgMenu(){ $('#msgMenu').classList.remove('on'); msgMenuIdx=-1;msgMenuEl=null; }
document.addEventListener('click',e=>{ if(!e.target.closest('#msgMenu') && !e.target.closest('.msgnote')) closeMsgMenu(); });
$('#mmDel').addEventListener('click',()=>{
  if(msgMenuIdx<0){closeMsgMenu();return;}
  messages.splice(msgMenuIdx,1);saveMsgs();renderMessages();closeMsgMenu();toast('已删除');
});
$('#mmQuote').addEventListener('click',()=>{
  if(msgMenuIdx<0){closeMsgMenu();return;}
  const m=messages[msgMenuIdx];
  pendingQuote={text:m.text||(m.type==='photo'?'[图片]':(m.type==='sticker'?'[贴纸]':''))};
  $('#quoteText').textContent=pendingQuote.text;
  $('#quoteBar').classList.add('on');closeMsgMenu();
});
let pendingQuote=null;
$('#quoteClose').addEventListener('click',()=>{pendingQuote=null;$('#quoteBar').classList.remove('on');});

let pendingReply=false;
function sendMessage(){
  const input=$('#msgInput');const text=input.value.trim();if(!text)return;
  const m={id:uid(),from:'me',type:'text',text,time:Date.now()};
  if(pendingQuote){m.quote=pendingQuote;pendingQuote=null;$('#quoteBar').classList.remove('on');}
  appendMessage(m);
  input.value='';input.style.height='auto';triggerReply();
}
function saveToCollection(m){
  if(Math.random()>0.3)return;
  const item={id:uid(),type:m.type,text:m.text||'',data:m.data||'',time:Date.now()};
  collection.push(item);saveCollection();
}
async function triggerReply(){
  const pool=[];
  cards.filter(c=>!c.locked).forEach(c=>pool.push({kind:'card',text:c.text}));
  (interactions.back||[]).filter(x=>!x.locked).forEach(x=>pool.push({kind:'interact',dir:'back',text:x.text}));
  (interactions.pair||[]).filter(x=>!x.locked).forEach(x=>pool.push({kind:'interact',dir:'pair',text:x.text}));
  stickers.forEach(s=>pool.push({kind:'sticker',id:s.id}));
  if(pool.length===0)return;
  if(pendingReply)return;pendingReply=true;
  const delay=rand(settings.dMin,settings.dMax)*1000;
  setTimeout(async()=>{
    pendingReply=false;
    const n=randInt(1,3);const cur=pool.slice();
    let quote=null;
    if(collection.length>0 && Math.random()<0.35){
      const c=collection[randInt(0,collection.length-1)];
      quote={text:c.text||(c.type==='photo'?'[图片]':'')};
    }
    for(let i=0;i<n;i++){
      if(cur.length===0)break;
      const pick=cur.splice(randInt(0,cur.length-1),1)[0];
      const m={id:uid(),from:'her',time:Date.now()};
      if(i===0&&quote)m.quote=quote;
      if(pick.kind==='card'){m.type='text';m.text=pick.text;}
      else if(pick.kind==='interact'){m.type='interact';m.dir=pick.dir;m.text=pick.text;}

function cleanInteractDup(){
  const set=new Set();
  ['touch','back','pair'].forEach(k=>{(interactions[k]||[]).forEach(x=>set.add(x.text));});
  const removed=cards.filter(c=>set.has(c.text)).length;
  if(removed===0){toast('没有和互动重复的字卡');return;}
  if(!confirm('清掉 '+removed+' 条和互动重复的字卡？'))return;
  cards=cards.filter(c=>!set.has(c.text));
  saveCards();renderCardList();toast('清掉了 '+removed+' 条');
}

$('#fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;const text=await f.text();let incoming=[];const name=f.name.toLowerCase();
  try{if(name.endsWith('.json')||text.trim().startsWith('{')){const obj=JSON.parse(text);const arr=Array.isArray(obj)?obj:(obj.cards||[]);incoming=arr.map(x=>typeof x==='string'?x:(x.text||'')).filter(Boolean);}else{incoming=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);}}catch(err){toast('文件格式无法识别');e.target.value='';return;}
  const exist=new Set(cards.map(c=>c.text));let added=0,skipped=0;
  incoming.forEach(txt=>{if(exist.has(txt)){skipped++;return;}cards.push({id:uid(),text:txt,locked:false});exist.add(txt);added++;});
  if(added)await saveCards();if(curCat==='card'){renderCardList();removeEmptyTip();}toast('导入 '+added+' 张，跳过 '+skipped+' 张重复');e.target.value='';
});

function importMusic(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());const arr=Array.isArray(obj)?obj:(obj.musicList||[]);toast('歌单导入需带音频，暂仅支持导出');}catch(err){toast('文件格式无法识别');}});inp.click();}

$('#saveCards').addEventListener('click',async()=>{
  const area=$('#addArea');const editingId=area.dataset.editing;
  if(addCtx.mode==='music'){
    const name=$('#mName').value.trim();const artist=$('#mArtist').value.trim();const fileId=area.dataset.fileId||null;
    if(!name){toast('还没写歌名');return;}if(!fileId){toast('请选择音频文件');return;}
    if(editingId){const old=musicList.find(x=>x.id===editingId);if(old){if(old.fileId&&old.fileId!==fileId)await FS.delMusicFile(old.fileId);old.name=name;old.artist=artist;old.fileId=fileId;}}

    document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));$('#page-pocket').classList.add('show');document.body.classList.add('page-open');return;
  }
  const lines=area.value.split(/\r?\n/).map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim());

  if(addCtx.mode==='interact'){
    const dir=addCtx.dir;const arr=interactions[dir]||(interactions[dir]=[]);
    if(editingId){const it=arr.find(x=>x.id===editingId);if(it){it.text=area.value.trim();await saveInteractions();}toast('已保存');}
    else{const exist=new Set(arr.map(x=>x.text));let added=0,skipped=0;lines.forEach(line=>{if(exist.has(line)){skipped++;return;}arr.push({id:uid(),text:line,locked:false});exist.add(line);added++;});await saveInteractions();toast(skipped?('放进了 '+added+' 条，跳过 '+skipped+' 条重复'):('放进了 '+added+' 条互动'));}
    resetAddPage();document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));renderPocketBox();$('#page-pocket').classList.add('show');document.body.classList.add('page-open');return;
  }
  if(editingId){const c=cards.find(x=>x.id===editingId);if(c){c.text=area.value.trim();await saveCards();}toast('已保存');}
  else{const exist=new Set(cards.map(c=>c.text));let added=0,skipped=0;lines.forEach(line=>{if(exist.has(line)){skipped++;return;}cards.push({id:uid(),text:line,locked:false});exist.add(line);added++;});await saveCards();toast(skipped?('放进了 '+added+' 张，跳过 '+skipped+' 张重复'):('放进了 '+added+' 张字卡'));}
  removeEmptyTip();resetAddPage();document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));renderPocketBox();$('#page-pocket').classList.add('show');document.body.classList.add('page-open');
});

let itDir='touch',itSel=new Set(),itSelMode=false,itShown=50,itSearch='',itLockedView=false;
function renderInteractPanel(p){
  p.innerHTML=`<div class="toolbar" id="itTabs">
    <div class="tool it-tab on" data-dir="touch">触碰 (${(interactions.touch||[]).length})</div>
    <div class="tool it-tab" data-dir="back">回握 (${(interactions.back||[]).length})</div>
    <div class="tool it-tab" data-dir="pair">缱绻 (${(interactions.pair||[]).length})</div>
  </div>
  <div class="toolbar" id="itTools">
    <div class="tool" data-t="search"><svg class="ico"><use href="#i-search"/></svg></div>
    <div class="tool" data-t="add"><svg class="ico"><use href="#i-add"/></svg></div>
    <div class="tool" data-t="del"><svg class="ico"><use href="#i-del"/></svg></div>
    <div class="tool" data-t="locked"><svg class="ico"><use href="#i-lock"/></svg></div>
    <div class="tool" data-t="more"><svg class="ico"><use href="#i-more"/></svg></div>
  </div>
  <div id="selectAllRow"><input type="checkbox" id="itSelectAllChk"><label for="itSelectAllChk">全选</label></div>
  <div id="itList"></div>`;
  bindInteractTools();itShown=50;renderInteractList();
}
function bindInteractTools(){
  const tabs=$('#itTabs');
  tabs.addEventListener('click',e=>{const t=e.target.closest('.it-tab');if(!t)return;itDir=t.dataset.dir;itSel.clear();itSelMode=false;itShown=50;itSearch='';itLockedView=false;tabs.querySelectorAll('.it-tab').forEach(x=>x.classList.toggle('on',x===t));renderInteractList();});
  const tools=$('#itTools');
  tools.addEventListener('click',e=>{
    const t=e.target.closest('.tool');if(!t)return;const act=t.dataset.t;
    if(act==='search'){const kw=prompt('搜索动作',itSearch);if(kw!==null){itSearch=kw.trim();itLockedView=false;itShown=50;renderInteractList();}}
    else if(act==='add'){resetAddPage();addCtx={mode:'interact',dir:itDir};$('#addTitle').textContent='添加'+INTERACT_LABEL[itDir];$('#addArea').placeholder=INTERACT_PLACE[itDir];showPage('page-add');}
    else if(act==='del'){if(!itSelMode){itSelMode=true;itSel.clear();t.classList.add('on');renderInteractList();}else{exitInteractSel();renderInteractList();}}
    else if(act==='locked'){itLockedView=!itLockedView;itSelMode=false;itSel.clear();itSearch='';itShown=50;renderInteractList();}
    else if(act==='more')openMoreSheet('interact');
  });
  const all=$('#itSelectAllChk');if(all)all.addEventListener('change',e=>{const arr=currentInteracts();if(e.target.checked)arr.forEach(c=>itSel.add(c.id));else itSel.clear();renderInteractList();});
}
function currentInteracts(){let arr=(interactions[itDir]||[]);if(itLockedView)return arr.filter(x=>x.locked);arr=arr.filter(x=>!x.locked);if(itSearch)arr=arr.filter(x=>x.text.includes(itSearch));return arr;}
function renderInteractList(){
  const list=$('#itList');if(!list)return;list.innerHTML='';
  const arr=currentInteracts();
  if(arr.length===0){const e=document.createElement('div');e.className='empty-tip';e.innerHTML=itLockedView?'还没有锁上的动作':(itSearch?'没找到':'这个抽屉还没有动作<br>点 ➕ 添加');list.appendChild(e);updateInteractSelRow();return;}
  const slice=arr.slice(0,itShown);const frag=document.createDocumentFragment();
  slice.forEach(c=>{
    const el=document.createElement('div');el.className='card-item'+(itSelMode?' selmode':'')+(itSel.has(c.id)?' sel':'');el.textContent=c.text;
    const chk=document.createElement('div');chk.className='chk';chk.textContent=itSel.has(c.id)?'✓':'';el.appendChild(chk);
    el.addEventListener('click',()=>{if(itSelMode){if(itSel.has(c.id))itSel.delete(c.id);else itSel.add(c.id);renderInteractList();}else openInteractSheet(c.id);});
    frag.appendChild(el);
  });
  list.appendChild(frag);
  if(itShown<arr.length){const more=document.createElement('div');more.className='empty-tip';more.style.padding='16px';more.textContent='加载更多…';list.appendChild(more);const io=new IntersectionObserver(ents=>{if(ents[0].isIntersecting){itShown+=50;io.disconnect();renderInteractList();}});io.observe(more);}
  updateInteractSelRow();
}
function updateInteractSelRow(){const row=$('#selectAllRow');if(!row)return;if(!itSelMode){row.classList.remove('on');return;}row.classList.add('on');const arr=currentInteracts();$('#itSelectAllChk').checked=arr.length>0&&arr.every(c=>itSel.has(c.id));}
function exitInteractSel(){itSelMode=false;itSel.clear();const r=$('#selectAllRow');if(r)r.classList.remove('on');$('#multiBar').classList.remove('on');document.querySelectorAll('#itTools .tool[data-t="del"]').forEach(d=>d.classList.remove('on'));}
function editInteract(id){const c=(interactions[itDir]||[]).find(x=>x.id===id);if(!c)return;resetAddPage();addCtx={mode:'interact',dir:itDir};$('#addArea').value=c.text;$('#addArea').dataset.editing=id;$('#addTitle').textContent='编辑'+INTERACT_LABEL[itDir];$('#addArea').placeholder=INTERACT_PLACE[itDir];showPage('page-add');}

function renderSettings(){
  $('#dMin').value=settings.dMin;$('#dMax').value=settings.dMax;$('#gMin').value=settings.gMin;$('#gMax').value=settings.gMax;
  $('#bgMaskRange').value=settings.bgMask==null?55:settings.bgMask;$('#bgMaskVal').textContent=$('#bgMaskRange').value;
  document.querySelectorAll('.style-opt').forEach(o=>o.classList.toggle('on',o.dataset.style===settings.style));
}
function bindNum(id,key){$('#'+id).addEventListener('change',e=>{let v=parseInt(e.target.value)||0;if(v<0)v=0;settings[key]=v;saveSet();});}
bindNum('dMin','dMin');bindNum('dMax','dMax');bindNum('gMin','gMin');bindNum('gMax','gMax');
$('#setNameHer').addEventListener('input',e=>{settings.nameHer=e.target.value;saveSet();});
$('#setNameMe').addEventListener('input',e=>{settings.nameMe=e.target.value;saveSet();});
$('#setCallHer').addEventListener('input',e=>{settings.callHer=e.target.value;saveSet();applyProfile();});
$('#setCallMe').addEventListener('input',e=>{settings.callMe=e.target.value;saveSet();applyProfile();});
document.querySelectorAll('.style-opt').forEach(o=>{o.addEventListener('click',()=>{
  document.body.classList.remove('retro','comic','girl','news','sakura','glass','ticket','dream','cafe','starry','rain','washi','tape','mint');
  document.body.classList.add(o.dataset.style);settings.style=o.dataset.style;saveSet();
  document.querySelectorAll('.style-opt').forEach(x=>x.classList.toggle('on',x===o));
});});
$('#clearMsgs').addEventListener('click',()=>{if(confirm('清空所有聊天记录？此操作不可恢复')){messages=[];saveMsgs();renderMessages();toast('已清空');}});

const bgFile=document.createElement('input');bgFile.type='file';bgFile.accept='image/*';bgFile.multiple=true;bgFile.style.display='none';document.body.appendChild(bgFile);
bgFile.addEventListener('change',e=>{const files=[...e.target.files];if(!files.length)return;let done=0;files.forEach(f=>{const r=new FileReader();r.onload=()=>{settings.bgs.push({id:uid(),data:r.result});done++;if(done===files.length){saveSet();renderBgList();toast('已添加 '+files.length+' 张背景');}};r.readAsDataURL(f);});e.target.value='';});
$('#bgMaskRange').addEventListener('input',e=>{const v=parseInt(e.target.value)||0;settings.bgMask=v;saveSet();applyBg();$('#bgMaskVal').textContent=v;});

let avTarget=null;
const avFile=document.createElement('input');avFile.type='file';avFile.accept='image/*';avFile.style.display='none';document.body.appendChild(avFile);
$('#setAvHer').addEventListener('click',()=>{avTarget='her';avFile.click();});
$('#setAvMe').addEventListener('click',()=>{avTarget='me';avFile.click();});
avFile.addEventListener('change',e=>{const f=e.target.files[0];if(!f||!avTarget)return;const r=new FileReader();r.onload=()=>{if(avTarget==='her')settings.avatarHer=r.result;else settings.avatarMe=r.result;saveSet();applyProfile();renderMessages();toast('已更换头像');};r.readAsDataURL(f);e.target.value='';});

function openCollection(){
  renderCollection();showPage('page-collection');
}
function renderCollection(){
  const box=$('#colList');box.innerHTML='';
  if(collection.length===0){box.innerHTML='<div class="empty-tip">收藏匣还空着</div>';return;}
  const arr=collection.slice().sort((a,b)=>b.time-a.time);
  const frag=document.createDocumentFragment();
  arr.forEach(c=>{
    const el=document.createElement('div');el.className='collection-item';
    if(c.type==='photo'){el.innerHTML=`<img src="${c.data}">`;}
    else{el.textContent=c.text||'';}
    const t=document.createElement('div');t.className='ci-time';t.textContent=fmtTime(c.time);el.appendChild(t);
    frag.appendChild(el);
  });
  box.appendChild(frag);
}

async function boot(){
  await FS.init();
  const c=await FS.read('cards.json',{cards:[]});
  const m=await FS.read('messages.json',{messages:[]});
  const s=await FS.read('settings.json',null);
  const st=await FS.read('stickers.json',{stickers:[]});
  const it=await FS.read('interactions.json',null);
  const mu=await FS.read('music.json',{musicList:[]});
  const co=await FS.read('collection.json',{collection:[]});
  cards=c.cards||[];messages=m.messages||[];stickers=st.stickers||[];
  if(it&&typeof it==='object'){interactions=Object.assign({touch:[],back:[],pair:[]},it);}
  musicList=mu.musicList||[];collection=co.collection||[];
  if(s){settings=Object.assign(settings,s);if(!Array.isArray(settings.bgs))settings.bgs=[];}
  document.body.className=settings.style||'retro';
  applyProfile();applyBg();renderMessages();
  if(settings.listening)$('#listenBanner').classList.add('on');
  if(cards.length===0)showSystem('口袋里还没有字卡，去给祂放几张吧');
}
boot();
</script>
