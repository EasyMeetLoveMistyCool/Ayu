  closeModal();
  openModal({ title: '添加中', bodyHTML: `<div style="text-align:center"><div id="st-stage" style="margin-bottom:12px;font-size:13px;color:var(--text-soft)">准备中…</div><div style="height:6px;border-radius:3px;background:var(--glass-bg-strong);overflow:hidden"><div id="st-bar" style="height:100%;width:0;background:var(--accent-deep);transition:width .2s"></div></div><div id="st-pct" style="margin-top:8px;font-size:13px">0/${total}</div></div>`, actions: [] });

      save.stickers();
      $('#modal-mask').style.pointerEvents = '';
      closeModal();
      renderStickerList();
      toast('已添加 ' + total + ' 张');
      return;

    $('#st-bar').style.width = pct + '%';

    i++;
    setTimeout(step, 60);
  };
  setTimeout(step, 200);

function importStickers() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const txt = await f.text();
    let data;
    try { data = JSON.parse(txt); } catch(e) { openModal({ title:'失败', bodyHTML:'JSON 格式不正确', actions: [] }); return; }
    if (!Array.isArray(data)) { openModal({ title:'失败', bodyHTML:'格式不对', actions: [] }); return; }
    let n = 0;
    for (const item of data) {
      if (!item.data) continue;
      const id = uid();

      State.stickers.push({ id, src: item.data });
      n++;
    }
    await save.stickers(); renderStickerList();
    openModal({ title: '导入完成', bodyHTML: '已导入 ' + n + ' 张', actions: [] });
    setTimeout(closeModal, 2500);
  };
  inp.click();
}

let cardSelectMode = false, cardSelected = new Set(), searchKeyword = '';
let cardZone = 'normal';
function openCardManager() {
  cardSelectMode = false; cardSelected.clear(); searchKeyword = ''; cardZone = 'normal';
  openSub('字卡', `<div class="card-toolbar" id="card-toolbar"></div><div class="zone-tabs" id="card-zone-tabs"></div><div class="zone-body" id="card-zone-body"></div>`, () => {

    renderCardToolbar(); renderCardZoneTabs(); renderCardList();
  });
}
function renderCardZoneTabs() {
  const el = $('#card-zone-tabs'); if (!el) return;
  const lockedCount = State.cards.filter(c => c.locked).length;
  el.innerHTML = `
    <div class="zone-tab ${cardZone==='normal'?'active':''}" data-zone="normal">正常区</div>

function renderCardToolbar() {
  const bar = $('#card-toolbar'); if (!bar) return;
  if (cardSelectMode) {
    bar.innerHTML = `<div class="toolbar-row"><button class="tool-btn" id="tb-all"><svg><use href="#i-select-all"/></svg>全选</button><button class="tool-btn" id="tb-del"><svg><use href="#i-delete"/></svg>删除</button><button class="tool-btn" id="tb-cancel"><svg><use href="#i-cancel"/></svg>取消</button></div><div class="empty-tip" style="padding:4px;font-size:12.5px;flex:none">已选 <b id="sel-count">${cardSelected.size}</b> 张</div>`;

    $('#tb-cancel').onclick = () => { cardSelectMode = false; cardSelected.clear(); renderCardToolbar(); renderCardList(); };
    return;
  }
  bar.innerHTML = `<div class="toolbar-row"><button class="tool-btn" id="tb-search"><svg><use href="#i-search"/></svg>搜索</button><button class="tool-btn" id="tb-add"><svg><use href="#i-plus"/></svg>添加新字卡</button><button class="tool-btn" id="tb-trash"><svg><use href="#i-trash"/></svg>回收站</button></div><div class="toolbar-row"><button class="tool-btn" id="tb-import"><svg><use href="#i-import"/></svg>文件导入</button><button class="tool-btn" id="tb-export"><svg><use href="#i-export"/></svg>文件导出</button><button class="tool-btn" id="tb-batch"><svg><use href="#i-batch-del"/></svg>批量删除</button><button class="tool-btn" id="tb-dedup"><svg><use href="#i-dedup"/></svg>去重</button></div>`;
  $('#tb-search').onclick = expandSearch; $('#tb-add').onclick = openAddCard; $('#tb-trash').onclick = openTrash;
  $('#tb-import').onclick = importCards; $('#tb-export').onclick = openExportDialog;
  $('#tb-batch').onclick = () => { cardSelectMode = true; cardSelected.clear(); renderCardToolbar(); renderCardList(); };
  $('#tb-dedup').onclick = doDedup;
}
function expandSearch() {
  const bar = $('#card-toolbar');
  bar.innerHTML = `<div class="toolbar-row"><div class="search-field"><input id="search-input" placeholder="请输入搜索内容..."><span class="clear-x" id="search-clear"><svg><use href="#i-close"/></svg></span></div></div>`;
  const inp = $('#search-input'); inp.focus();
  inp.oninput = () => { searchKeyword = inp.value.trim(); renderCardList(); };
  $('#search-clear').onclick = () => { searchKeyword = ''; renderCardToolbar(); renderCardList(); };
}
function getDisplayedCards() {
  let pool;
  if (cardZone === 'normal') pool = State.cards.filter(c => !c.locked);
  else pool = State.cards.filter(c => c.locked);
  return searchKeyword ? pool.filter(c => c.text.includes(searchKeyword)) : pool;
}
function renderCardList() {
  const list = $('#card-zone-body'); if (!list) return;
  const data = getDisplayedCards();
  const total = cardZone === 'normal' ? State.cards.filter(c=>!c.locked).length : State.cards.filter(c=>c.locked).length;
  let head = '';
  if (cardZone === 'normal') {
    head = `<div class="list-count-bar">${searchKeyword ? `找到 ${data.length} 张` : `共 ${total} 张字卡`}</div>`;
  } else {
    const lockedCount = State.cards.filter(c=>c.locked).length;
    head = `<div class="zone-locked-head"><span>🔒 已上锁（${lockedCount}）</span><span class="zl-btns"><button class="zl-btn" id="card-unlock-all">一键解锁</button></span></div>`;
  }
  if (!data.length) {
    let emptyMsg;
    if (searchKeyword) emptyMsg = '没有找到相关字卡。';
    else if (cardZone === 'normal' && State.cards.length === 0) emptyMsg = '没有字卡，祂只好安静地看着你。';
    else if (cardZone === 'locked') emptyMsg = '上锁区是空的。';
    else emptyMsg = '没有字卡。';
    list.innerHTML = head + `<div class="zone-empty">${emptyMsg}</div>`;
    bindCardLockedHead();
    return;
  }
  list.innerHTML = head;
  const frag = document.createDocumentFragment();
  data.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card-item' + (cardSelected.has(c.id) ? ' selected' : '') + (c.locked ? ' locked' : '');
    el.innerHTML = `${cardSelectMode ? '<div class="card-check"></div>' : ''}<div class="card-text"></div>`;
    el.querySelector('.card-text').textContent = c.text;
    if (cardSelectMode) el.onclick = () => { if (cardSelected.has(c.id)) cardSelected.delete(c.id); else cardSelected.add(c.id); el.classList.toggle('selected', cardSelected.has(c.id)); const sc = $('#sel-count'); if (sc) sc.textContent = cardSelected.size; };
    else el.onclick = () => openCardItemMenu(c);
    frag.appendChild(el);
  });
  list.appendChild(frag);
  bindCardLockedHead();
}
function bindCardLockedHead() {
  const all = $('#card-unlock-all');
  if (all) all.onclick = () => {
    State.cards.forEach(c => { c.locked = false; });
    save.cards(); toast('已全部解锁'); renderCardZoneTabs(); renderCardList();
  };
}
function openCardItemMenu(card) {
  const locked = !!card.locked;
  openModal({ title: '字卡', bodyHTML: '', actions: [
    { label: '编辑', onClick: () => editCardInline(card) },
    { label: '删除', danger: true, onClick: () => { moveCardsToTrash([card.id]); renderCardZoneTabs(); renderCardList(); } },
    { label: locked ? '解锁' : '上锁', onClick: () => { card.locked = !card.locked; save.cards(); renderCardZoneTabs(); renderCardList(); toast(card.locked?'已上锁':'已解锁'); } }
  ]});
}
function editCardInline(card) {
  const list = $('#card-zone-body'); const items = $$('.card-item', list);
  const idx = getDisplayedCards().findIndex(c => c.id === card.id);
  if (idx < 0) return; const el = items[idx]; if (!el) return;
  const textEl = el.querySelector('.card-text'); textEl.innerHTML = '';
  const input = document.createElement('input'); input.className = 'field'; input.value = card.text; input.style.padding = '6px 10px';
  textEl.appendChild(input); input.focus();
  let done = false;
  const finish = saveIt => { if (done) return; done = true; if (saveIt && input.value.trim()) { card.text = input.value.trim(); save.cards(); } renderCardList(); };
  input.onblur = () => finish(true);
  input.onkeydown = e => { if (e.key === 'Enter') finish(true); };
}
function moveCardsToTrash(ids) {
  const set = new Set(ids);
  const moving = State.cards.filter(c => set.has(c.id));
  State.cards = State.cards.filter(c => !set.has(c.id));
  moving.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
  save.cards(); save.trash();
}
function openAddCard() {
  openModal({ title: '添加新字卡', bodyHTML: `<textarea class="field" id="add-card-input" rows="8" placeholder="祂会用这些字卡回复你哦"></textarea><div style="font-size:12px;color:var(--text-soft);margin-top:8px;text-align:center">一行一张字卡，可换行分隔</div>`,
    actions: [{ label: '保存字卡', onClick: () => {
      const lines = $('#add-card-input').value.split('\n').map(s => s.trim()).filter(Boolean);
      lines.forEach(text => State.cards.unshift({ id: uid(), text, t: Date.now(), locked: false }));
      save.cards(); renderCardZoneTabs(); renderCardList();
    }}]
  });
}
function importCards() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.json,application/json,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text(); let incoming = [];
    if (f.name.endsWith('.json')) {
      try { const data = JSON.parse(text); if (Array.isArray(data)) incoming = data.map(d => typeof d === 'string' ? d : (d.text || '')).filter(Boolean); }
      catch(e) { openModal({ title:'导入失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    } else incoming = text.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = new Set(State.cards.map(c => c.text));
    const dups = [];
    incoming.forEach(t => {
      if (existing.has(t)) { dups.push(t); State.trash.push({ id: uid(), text: t, t: Date.now(), deletedAt: Date.now() }); }
      else { State.cards.unshift({ id: uid(), text: t, t: Date.now(), locked: false }); existing.add(t); }
    });
    save.cards(); save.trash(); renderCardZoneTabs(); renderCardList();
    if (dups.length) {
      const html = `<div class="dup-list">` + dups.map(d => `<div class="dup-item">${escapeHTML(d)}</div>`).join('') + `</div>`;
      openModal({ title:'以下字卡重复，已移入回收站', bodyHTML: html, actions: [{ label:'去回收站', onClick: () => openTrash() }] });
    } else { openModal({ title:'导入完成', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 5000); }
  };
  inp.click();
}
function openExportDialog() {
  openModal({ title: '选择导出格式', bodyHTML: '', actions: [
    { label: 'TXT', onClick: () => exportCards('txt') },
    { label: 'JSON', onClick: () => exportCards('json') }
  ]});
}
function exportCards(fmt) {
  const data = State.cards.map(c => c.text);
  let content, mime, ext;
  if (fmt === 'json') { content = JSON.stringify(data, null, 2); mime = 'application/json'; ext = 'json'; }
  else { content = data.join('\n'); mime = 'text/plain'; ext = 'txt'; }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `字卡_${dateStamp()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doDedup() {
  const map = new Map();
  State.cards.forEach(c => { if (!map.has(c.text)) map.set(c.text, []); map.get(c.text).push(c); });
  const groups = [...map.entries()].filter(([, arr]) => arr.length > 1);
  if (!groups.length) { openModal({ title:'去重', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 5000); return; }
  groups.forEach(([, arr]) => {
    arr.sort((a, b) => a.t - b.t);
    const rest = arr.slice(1);
    rest.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
    const set = new Set(rest.map(c => c.id));
    State.cards = State.cards.filter(c => !set.has(c.id));
  });
  save.cards(); save.trash();
  const html = `<div class="dup-list">` + groups.map(([text, arr]) => `<div class="dup-item"><span>${escapeHTML(text)}</span><span class="dup-count" style="margin-left:auto">${arr.length}</span></div>`).join('') + `</div>`;
  openModal({ title:'重复内容', bodyHTML: html, actions: [{ label:'去回收站', onClick: () => openTrash() }] });
  renderCardZoneTabs(); renderCardList();
}

/* ==================== 回收站 ==================== */
let trashSelectMode = false, trashSelected = new Set();
function openTrash() {
  trashSelectMode = false; trashSelected.clear();
  openSub('回收站', `<div class="card-toolbar" id="trash-toolbar"></div><div class="zone-body" id="trash-list"></div>`, () => {
    $('#sub-body').classList.add('pad-off');
    setSubAction('');
    renderTrashToolbar(); renderTrashList();
  });
}
function renderTrashToolbar() {
  const bar = $('#trash-toolbar'); if (!bar) return;
  if (trashSelectMode) {
    bar.innerHTML = `<div class="toolbar-row"><button class="tool-btn" id="tr-all"><svg><use href="#i-select-all"/></svg>全选</button><button class="tool-btn" id="tr-del"><svg><use href="#i-delete"/></svg>删除</button><button class="tool-btn" id="tr-restore"><svg><use href="#i-restore"/></svg>恢复</button></div>`;
    $('#tr-all').onclick = () => { State.trash.forEach(c => trashSelected.add(c.id)); renderTrashList(); };
    $('#tr-del').onclick = () => {
      if (!trashSelected.size) return;
      openModal({ title:'永久删除？', bodyHTML:'此操作不可恢复。', actions: [
        { label:'取消', onClick: () => {} },
        { label:'永久删除', danger: true, onClick: () => { State.trash = State.trash.filter(c => !trashSelected.has(c.id)); save.trash(); trashSelected.clear(); renderTrashList(); } }
      ]});
    };
    $('#tr-restore').onclick = () => {
      const back = State.trash.filter(c => trashSelected.has(c.id));
      State.trash = State.trash.filter(c => !trashSelected.has(c.id));
      back.forEach(c => { delete c.deletedAt; State.cards.unshift(c); });
      save.trash(); save.cards(); trashSelected.clear(); renderTrashList();
    };

/* ==================== 播放页 ==================== */
let playState = { day: null, messages: [], idx: 0, timer: null, speed: 1, playing: true, baseDelay: 3000 };
function openPlayPage(day) {
  const entry = State.archive.find(a => a.day === day);
  if (!entry) return;
  playState.day = day; playState.messages = entry.messages.slice();
  playState.idx = 0; playState.speed = 1; playState.playing = true;
  $('#play-title').textContent = dayLabel(day);
  $('#play-body').innerHTML = '';
  $('#btn-speed').textContent = '1x';
  $$('.speed-opt').forEach(o => o.classList.toggle('active', o.dataset.speed === '1'));
  setPlayIcon(true); updateProgress();
  showPage('page-play'); showBars();
  setTimeout(() => playNext(), 400);
}
function setPlayIcon(playing) { $('#play-pause-icon use').setAttribute('href', playing ? '#i-pause' : '#i-play'); }
function playNext() {
  if (!playState.playing) return;
  if (playState.idx >= playState.messages.length) return;
  const m = playState.messages[playState.idx];
  const body = $('#play-body');
  body.appendChild(buildMsgRow(m));
  body.scrollTop = body.scrollHeight;
  playState.idx++; updateProgress();
  playState.timer = setTimeout(playNext, playState.baseDelay / playState.speed);
}
function updateProgress() {
  const total = playState.messages.length || 1;
  const pct = Math.min(100, playState.idx / total * 100);
  $('#progress-fill').style.width = pct + '%';
  $('#progress-knob').style.left = pct + '%';
}
let playHideTimer = null;
function showBars() {
  $('#play-header').classList.remove('hidden');
  $('#play-footer').classList.remove('hidden');
  clearTimeout(playHideTimer);
  playHideTimer = setTimeout(() => { $('#play-header').classList.add('hidden'); $('#play-footer').classList.add('hidden'); }, 3000);
}
function initPlayPage() {
  $('#play-close').onclick = () => { clearTimeout(playState.timer); playState.playing = false; goBack(); };
  $('#btn-play-pause').onclick = () => {
    playState.playing = !playState.playing; setPlayIcon(playState.playing);
    if (playState.playing) playNext(); else clearTimeout(playState.timer);
  };
  const bar = $('#progress-bar');
  function seek(clientX) {
    const rect = bar.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width; pct = Math.max(0, Math.min(1, pct));
    const target = Math.floor(pct * playState.messages.length);
    playState.idx = target;
    const body = $('#play-body'); body.innerHTML = '';
    for (let i = 0; i < target; i++) body.appendChild(buildMsgRow(playState.messages[i]));
    body.scrollTop = body.scrollHeight; updateProgress();
    clearTimeout(playState.timer);
    if (playState.playing) playNext();
  }
  bar.addEventListener('click', e => seek(e.clientX));
  let dragging = false;
  bar.addEventListener('touchstart', e => { dragging = true; seek(e.touches[0].clientX); }, { passive: true });
  bar.addEventListener('touchmove', e => { if (dragging) seek(e.touches[0].clientX); }, { passive: true });
  bar.addEventListener('touchend', () => dragging = false);
  $('#btn-speed').onclick = e => { e.stopPropagation(); $('#speed-pop').classList.toggle('active'); };
  $$('.speed-opt').forEach(opt => {
    opt.onclick = () => {
      playState.speed = +opt.dataset.speed;
      $('#btn-speed').textContent = opt.dataset.speed + 'x';
      $$('.speed-opt').forEach(o => o.classList.toggle('active', o === opt));
      $('#speed-pop').classList.remove('active');
    };
  });
  document.addEventListener('click', () => $('#speed-pop').classList.remove('active'));
  $('#page-play').addEventListener('click', e => {
    if (e.target.closest('.play-footer') || e.target.closest('.play-header')) return;
    showBars();
  });
}

    html += `</div>`;
    html += `<div class="stat-block"><div class="st-title">详细记录</div>`;
    const records = [...State.videoRecords].reverse();
    if (!records.length) html += `<div class="stat-empty">还没有通话记录</div>`;
    else {
      records.forEach(r => {
        const d = new Date(r.start || r.t);
        const dateStr = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

        } else if (r.type === 'missed') line2 = '未接来电';
        else if (r.type === 'rejected') line2 = '已拒绝';
        else if (r.type === 'interrupted') line2 = '通话中断' + (r.dur ? ' 通话时长 ' + callTime(r.dur) : '');

      });

    const hisCompTotal = hisComp.reduce((a, b) => a + (b.dur || 0), 0);
    const compRefused = State.messages.filter(m => m.type === 'companion' && m.who === 'me' && m.refused).length;

    html += `<div class="st-line"><span class="st-k">我发起</span><span class="st-v">${myComp.length} · ${hms(myCompTotal)}</span></div>`;
    html += `<div class="st-line"><span class="st-k">祂发起</span><span class="st-v">${hisComp.length} · ${hms(hisCompTotal)}</span></div>`;
    html += `<div class="st-line"><span class="st-k">祂拒绝陪伴</span><span class="st-v">${compRefused}</span></div>`;
    html += `</div>`;
    html += `<div class="stat-block"><div class="st-title">详细记录</div>`;

      <input class="field" id="in-mood-time" type="time" style="width:120px" value="${pad(s.moodHour??20)}:${pad(s.moodMinute??0)}"></div>
  `, () => {
    setSubAction('');
    markSeg('#seg-reply', s.replySpeedMin != null ? '' : s.replySpeed);
    markSeg('#seg-gap', s.multiGapMin != null ? '' : s.multiGap);
    markSeg('#seg-think', s.thinkTimeCustom != null ? '' : s.thinkTime);
    bindSeg('#seg-reply', v => { s.replySpeed = v; s.replySpeedMin = null; s.replySpeedMax = null; save.settings(); });
    bindSeg('#seg-gap', v => { s.multiGap = v; s.multiGapMin = null; s.multiGapMax = null; save.settings(); });
    bindSeg('#seg-think', v => { s.thinkTime = v; s.thinkTimeCustom = null; save.settings(); });
    function readRange(minEl, maxEl, lo, hi, minKey, maxKey, segSel, segValKey) {
      const a = minEl.value === '' ? null : +minEl.value;
      const b = maxEl.value === '' ? null : +maxEl.value;
      if (a == null && b == null) { State.settings[minKey] = null; State.settings[maxKey] = null; save.settings(); markSeg(segSel, State.settings[segValKey]); return; }
      let mn = a == null ? lo : Math.max(lo, a); let mx = b == null ? hi : Math.min(hi, b);
      if (mn > mx) { const t = mn; mn = mx; mx = t; }
      State.settings[minKey] = mn; State.settings[maxKey] = mx; save.settings();
      minEl.value = mn; maxEl.value = mx;
    }
    $('#in-reply-min').onchange = () => readRange($('#in-reply-min'), $('#in-reply-max'), 5, 600, 'replySpeedMin', 'replySpeedMax', '#seg-reply', 'replySpeed');
    $('#in-reply-max').onchange = () => readRange($('#in-reply-min'), $('#in-reply-max'), 5, 600, 'replySpeedMin', 'replySpeedMax', '#seg-reply', 'replySpeed');
    $('#in-gap-min').onchange = () => readRange($('#in-gap-min'), $('#in-gap-max'), 1, 30, 'multiGapMin', 'multiGapMax', '#seg-gap', 'multiGap');
    $('#in-gap-max').onchange = () => readRange($('#in-gap-min'), $('#in-gap-max'), 1, 30, 'multiGapMin', 'multiGapMax', '#seg-gap', 'multiGap');
    $('#in-think').onchange = e => {
      if (e.target.value === '') { s.thinkTimeCustom = null; save.settings(); markSeg('#seg-think', s.thinkTime); return; }
      const v = Math.max(1, Math.min(60, +e.target.value || 8));
      s.thinkTimeCustom = v; save.settings(); e.target.value = v; markSeg('#seg-think', '');
    };
    $('#in-mood-time').onchange = e => {
      const v = e.target.value || '20:00';
      const [hh, mm] = v.split(':').map(Number);
      s.moodHour = hh; s.moodMinute = mm; save.settings();
      runMoodHis();
    };
  });
}

async function doBackup() {
  toast('正在打包，请稍候…');
  const media = {};
  const keys = await CacheStore.keys();
  for (const k of keys) {
    const blob = await CacheStore.get(k);
    if (blob) media[k] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  }
  const data = {
    version: VERSION, exportedAt: Date.now(),
    settings: State.settings, cards: State.cards, trash: State.trash,
    messages: State.messages, archive: State.archive, quizzes: State.quizzes,
    quizResults: State.quizResults, memos: State.memos, wishes: State.wishes,
    days: State.days, hearts: State.hearts, moods: State.moods, songs: State.songs,
    companionStats: State.companionStats, interactions: State.interactions,
    itfStats: State.itfStats, stickers: State.stickers, gifts: State.gifts,
    giftRecords: State.giftRecords, boxRecords: State.boxRecords,
    videoRecords: State.videoRecords, love: State.love,
    notes: State.notes, noteQuota: State.noteQuota,
    spaces: State.spaces, spaceQuota: State.spaceQuota,
    mails: State.mails, mailQuota: State.mailQuota,
    media
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `阿遇♥阿凉_${dateStamp()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doRestore() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const txt = await f.text(); let data;
    try { data = JSON.parse(txt); } catch(e) { openModal({ title:'失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    openModal({ title: '覆盖中', bodyHTML: `<div style="text-align:center"><div id="restore-stage" style="margin-bottom:12px;font-size:13px;color:var(--text-soft)">准备中…</div><div style="height:6px;border-radius:3px;background:var(--glass-bg-strong);overflow:hidden"><div id="restore-bar" style="height:100%;width:0;background:var(--accent-deep);transition:width .2s"></div></div><div id="restore-pct" style="margin-top:8px;font-size:13px">0%</div></div>`, actions: [] });
    $('#modal-mask').style.pointerEvents = 'none';
    await new Promise(r => setTimeout(r, 200));
    const stages = [
      ['设置', () => { if (data.settings) State.settings = Object.assign(State.settings, data.settings); }],
      ['字卡', () => { State.cards = data.cards || []; }],
      ['回收站', () => { State.trash = data.trash || []; }],
      ['消息', () => { State.messages = data.messages || []; }],
      ['归档', () => { State.archive = data.archive || []; }],

      ['答卷', () => { State.quizResults = data.quizResults || []; }],

      ['心愿单', () => { State.wishes = data.wishes || []; }],
      ['重要日', () => { State.days = data.days || []; }],

      ['陪伴统计', () => { State.companionStats = data.companionStats || []; }],
      ['互动', () => { State.interactions = data.interactions || { me: [], other: [], together: [] }; }],
      ['互动统计', () => { State.itfStats = data.itfStats || {}; }],
      ['贴纸', () => { State.stickers = data.stickers || []; }],
      ['礼物', () => { State.gifts = data.gifts || []; }],
      ['礼物记录', () => { State.giftRecords = data.giftRecords || []; }],
      ['盲盒记录', () => { State.boxRecords = data.boxRecords || []; }],
      ['通话记录', () => { State.videoRecords = data.videoRecords || []; }],
      ['爱意值', () => { State.love = data.love || 0; }],
      ['留言笺', () => { State.notes = data.notes || []; State.noteQuota = data.noteQuota || null; }],
      ['恋人空间', () => { State.spaces = data.spaces || []; State.spaceQuota = data.spaceQuota || null; }],
      ['信箱', () => { State.mails = data.mails || []; State.mailQuota = data.mailQuota || null; }]
    ];
    for (let i = 0; i < stages.length; i++) {
      $('#restore-stage').textContent = '正在覆盖：' + stages[i][0] + '…';
      stages[i][1]();
      const pct = Math.round((i + 1) / stages.length * 100);
      $('#restore-bar').style.width = pct + '%'; $('#restore-pct').textContent = pct + '%';
      await new Promise(r => setTimeout(r, 120));
    }
    if (data.media && typeof data.media === 'object') {
      $('#restore-stage').textContent = '正在恢复媒体…';
      const keys = Object.keys(data.media);
      let i = 0;
      for (const k of keys) {
        try { const blob = await (await fetch(data.media[k])).blob(); await CacheStore.put(k, blob); } catch (e) {}
        i++;
        if (keys.length) { const pct = Math.round(i / keys.length * 100); $('#restore-bar').style.width = pct + '%'; $('#restore-pct').textContent = pct + '%'; }
      }
    }
    await save.settings(); await save.cards(); await save.trash(); await save.messages(); await save.archive();
    await save.quizzes(); await save.quizResults(); await save.memos(); await save.wishes(); await save.days(); await save.hearts(); await save.moods();
    await save.songs(); await save.companionStats(); await save.interactions(); await save.itfStats(); await save.stickers();
    await save.gifts(); await save.giftRecords(); await save.boxRecords(); await save.videoRecords(); await save.love();
    await save.notes(); await save.noteQuota(); await save.spaces(); await save.spaceQuota(); await save.mails(); await save.mailQuota();
    $('#restore-stage').textContent = '完成';

  };
  inp.click();
