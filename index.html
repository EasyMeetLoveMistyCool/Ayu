<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf2f5">
<title>阿遇♥阿凉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 15px; color: var(--text); background: var(--bg-base);
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; font-family: inherit; }
button { border: none; background: none; color: inherit; font-family: inherit; cursor: pointer; }
ul, li { list-style: none; }

/* ============ 主题 ============ */
:root, [data-theme="rose-glass"] {
  --bg-base: #fdf2f5; --bg-grad-1: #fef6f8; --bg-grad-2: #fdf2f5; --bg-grad-3: #fbeef2;
  --glass-bg: rgba(255,255,255,0.45); --glass-bg-strong: rgba(255,255,255,0.65);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(230,180,200,0.18);
  --bubble-me: #f5c8d5; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #f0b8c8; --accent-deep: #e8a0b5; --accent-soft: rgba(240,184,200,0.28);
  --heart-red: #e8536f; --check-green: #6fbf8f; --danger: #d9536a;
  --time-text: #a8a8a8; --mask: rgba(240,184,200,0.3);
  --progress: var(--accent-deep);
}
[data-theme="sakura-glass"] {
  --bg-base: #fef4f7; --bg-grad-1: #fff7fa; --bg-grad-2: #fef4f7; --bg-grad-3: #fceef4;
  --glass-bg: rgba(255,255,255,0.46); --glass-bg-strong: rgba(255,255,255,0.66);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(235,185,205,0.18);
  --bubble-me: #f7ccd8; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #f2bccc; --accent-deep: #eaa8bd; --accent-soft: rgba(242,188,204,0.28);
  --time-text: #a8a8a8; --mask: rgba(242,188,204,0.3); --progress: var(--accent-deep);
}
[data-theme="mint-ice"] {
  --bg-base: #effaf5; --bg-grad-1: #f4fcf8; --bg-grad-2: #effaf5; --bg-grad-3: #e8f7f0;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(160,215,190,0.18);
  --bubble-me: #c0e8d4; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #a8dcc4; --accent-deep: #92d0b4; --accent-soft: rgba(168,220,196,0.28);
  --time-text: #a8a8a8; --mask: rgba(168,220,196,0.3); --progress: var(--accent-deep);
}
[data-theme="cream-light"] {
  --bg-base: #fdf8ef; --bg-grad-1: #fffaf3; --bg-grad-2: #fdf8ef; --bg-grad-3: #faf2e4;
  --glass-bg: rgba(255,255,255,0.5); --glass-bg-strong: rgba(255,255,255,0.7);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(225,200,150,0.18);
  --bubble-me: #f2e0b8; --bubble-other: rgba(255,255,255,0.64);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #ecd2a0; --accent-deep: #e2c088; --accent-soft: rgba(236,210,160,0.3);
  --time-text: #a8a8a8; --mask: rgba(236,210,160,0.32); --progress: var(--accent-deep);
}
[data-theme="blue-crystal"] {
  --bg-base: #eff6ff; --bg-grad-1: #f5f9ff; --bg-grad-2: #eff6ff; --bg-grad-3: #e6f0fd;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(170,205,240,0.2);
  --bubble-me: #c8e0f5; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #b0d4f0; --accent-deep: #98c5ea; --accent-soft: rgba(176,212,240,0.28);
  --time-text: #a8a8a8; --mask: rgba(176,212,240,0.3); --progress: var(--accent-deep);
}
[data-theme="purple-mist"] {
  --bg-base: #f6f1fc; --bg-grad-1: #faf6fe; --bg-grad-2: #f6f1fc; --bg-grad-3: #f0e8f9;
  --glass-bg: rgba(255,255,255,0.46); --glass-bg-strong: rgba(255,255,255,0.66);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(200,175,230,0.2);
  --bubble-me: #d8c8ee; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #c8b0e4; --accent-deep: #b89cd8; --accent-soft: rgba(200,176,228,0.28);
  --time-text: #a8a8a8; --mask: rgba(200,176,228,0.3); --progress: var(--accent-deep);
}
[data-theme="cold-glass"] {
  --bg-base: #eff5f9; --bg-grad-1: #f5f9fc; --bg-grad-2: #eff5f9; --bg-grad-3: #e6eef4;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(175,205,225,0.2);
  --bubble-me: #c8dce8; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #b4cede; --accent-deep: #9cbcd0; --accent-soft: rgba(180,206,222,0.28);
  --time-text: #a8a8a8; --mask: rgba(180,206,222,0.3); --progress: var(--accent-deep);
}
[data-theme="warm-glass"] {
  --bg-base: #faf4ec; --bg-grad-1: #fdf8f2; --bg-grad-2: #faf4ec; --bg-grad-3: #f5ede1;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(220,195,165,0.18);
  --bubble-me: #ead8c0; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #e0c8a8; --accent-deep: #d4b890; --accent-soft: rgba(224,200,168,0.3);
  --time-text: #a8a8a8; --mask: rgba(224,200,168,0.32); --progress: var(--accent-deep);
}
[data-theme="night-glass"] {
  --bg-base: #1a1824; --bg-grad-1: #201d2c; --bg-grad-2: #1a1824; --bg-grad-3: #14121c;
  --glass-bg: rgba(255,255,255,0.08); --glass-bg-strong: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.18); --glass-highlight: rgba(255,255,255,0.28);
  --glass-shadow: rgba(0,0,0,0.4);
  --bubble-me: #4a3a48; --bubble-other: rgba(255,255,255,0.1);
  --text: #e8e8e8; --text-soft: #a8a8a8; --text-faint: #808080;
  --accent: #8a6a80; --accent-deep: #a07a94; --accent-soft: rgba(138,106,128,0.3);
  --heart-red: #ff5f7e; --time-text: #8a8a8a; --mask: rgba(0,0,0,0.5);
  --progress: #e893a8;
}
[data-theme="purple-glass"] {
  --bg-base: #f5effc; --bg-grad-1: #faf6fe; --bg-grad-2: #f5effc; --bg-grad-3: #efe6f9;
  --glass-bg: rgba(255,255,255,0.46); --glass-bg-strong: rgba(255,255,255,0.66);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(195,170,230,0.2);
  --bubble-me: #d4c0ea; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #c0a8e0; --accent-deep: #b094d6; --accent-soft: rgba(192,168,224,0.28);
  --time-text: #a8a8a8; --mask: rgba(192,168,224,0.3); --progress: var(--accent-deep);
}
[data-theme="cyan-glass"] {
  --bg-base: #eff8f6; --bg-grad-1: #f5fbf9; --bg-grad-2: #eff8f6; --bg-grad-3: #e6f3f0;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(165,215,205,0.2);
  --bubble-me: #c0e4dc; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #a8d8cc; --accent-deep: #90ccc0; --accent-soft: rgba(168,216,204,0.28);
  --time-text: #a8a8a8; --mask: rgba(168,216,204,0.3); --progress: var(--accent-deep);
}

/* ============ 通用 ============ */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 6px 22px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#bg-layer {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2) 55%, var(--bg-grad-3));
  background-size: cover; background-position: center;
  transition: background-image .35s ease;
}
.page { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }
.scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-y::-webkit-scrollbar { width: 0; height: 0; }
.scroll-y { scrollbar-width: none; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 50%; color: var(--text);
  transition: transform .15s ease, background .2s ease;
}
.icon-btn:active { transform: scale(.9); background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; display: block; }

/* ============ 弹窗 ============ */
.modal-mask {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: center; justify-content: center;
  background: var(--mask);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 24px;
}
.modal-mask.active { display: flex; }
.modal {
  width: 100%; max-width: 340px; max-height: 78vh;
  border-radius: 22px; padding: 22px 20px;
  display: flex; flex-direction: column;
  animation: modal-in .22s cubic-bezier(.2,.9,.3,1.2);
}
.modal.wide { max-width: 88vw; }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px; color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; margin-bottom: 16px; }
.modal-body::-webkit-scrollbar { width: 0; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal-btn {
  flex: 1; min-width: 96px; padding: 11px 16px; border-radius: 14px;
  font-size: 14.5px; font-weight: 500; color: var(--text);
  background: var(--accent); border: 1px solid var(--glass-border);
  transition: transform .12s ease;
}
.modal-btn:active { transform: scale(.96); }
.modal-btn.danger { color: #fff; background: var(--danger); border-color: rgba(217,83,106,0.4); }
.field {
  width: 100%; padding: 12px 14px; border-radius: 14px;
  font-size: 15px; color: var(--text);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  outline: none; resize: none;
}
.field::placeholder { color: var(--text-soft); }
.todo {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 120px; gap: 10px; color: var(--text-soft); font-size: 15px; letter-spacing: 1px;
}
.todo svg { width: 48px; height: 48px; opacity: .5; }

/* 抉择弹窗：2x2 按钮 */
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-btn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 18px 10px; border-radius: 16px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 14px; color: var(--text);
}
.choice-btn svg { width: 26px; height: 26px; color: var(--accent-deep); }
.choice-btn:active { transform: scale(.96); }

/* ============ 动画 ============ */
@keyframes heartbeat-line { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
@keyframes heart-beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.15); } 24% { transform: scale(1); } }
@keyframes dot-jump { 0%,60%,100% { transform: translateY(0); opacity:.5; } 30% { transform: translateY(-4px); opacity:1; } }
@keyframes shake {
  0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
}
@keyframes bubble-in { from { opacity:0; transform: translateY(6px) scale(.97); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes num-pop { 0% { transform: scale(1); opacity:1; } 50% { transform: scale(1.25); opacity:.6; } 100% { transform: scale(1); opacity:1; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes pop-up { from { opacity:0; transform: translateY(8px) scale(.95); } to { opacity:1; transform: translateY(0) scale(1); } }

/* ============ 锁屏 ============ */
.lock-wrap {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: calc(40px + env(safe-area-inset-top)) 24px 40px; text-align: center;
}
.lock-title { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--text); }
.lock-title .heart-char { color: var(--heart-red); }
.lock-time { font-size: 14px; letter-spacing: 1px; color: var(--text-soft); }
.lock-heart-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0; }
.lock-avatar {
  width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid var(--glass-border); background: var(--glass-bg);
}
.heart-char { color: var(--heart-red); font-size: 22px; line-height: 1; display: inline-block; }
.heart-char.beat { animation: heart-beat 1.6s ease-in-out infinite; }
.lock-heart { font-size: 26px; }
.heartbeat-line { width: 54px; height: 20px; overflow: hidden; opacity: .85; }
.heartbeat-line svg { width: 200%; height: 100%; display: block; }
.heartbeat-line path {
  fill: none; stroke: var(--heart-red); stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
  animation: heartbeat-line 2.4s linear infinite;
}
.heartbeat-line.small { width: 40px; height: 16px; }
.lock-love {
  font-size: 15px; line-height: 1.7; color: #8a8a8a;
  max-width: 260px; min-height: 48px;
  display: flex; align-items: center; justify-content: center; padding: 0 8px;
}
.lock-enter {
  margin-top: 8px; padding: 12px 30px; border-radius: 24px;
  font-size: 16px; font-weight: 600; letter-spacing: 1px;
  color: var(--text); background: var(--accent);
  transition: transform .15s ease;
}
.lock-enter:active { transform: scale(.94); }
.lock-enter .heart-char { font-size: 16px; }
.lock-pass { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px; position: relative; }
.lock-pass.active { display: flex; }
.lock-pass-dots {
  display: flex; gap: 8px; min-height: 14px; align-items: center;
  flex-wrap: wrap; justify-content: center; max-width: 260px;
}
.lock-pass-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--text); display: block; }
.lock-pass-input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0.01; color: transparent; background: transparent;
  border: none; outline: none; font-size: 16px; caret-color: transparent;
}
.lock-pass.shake { animation: shake .4s ease; }

/* ============ 聊天 ============ */
.chat-header {
  position: relative; z-index: 5;
  padding: calc(10px + env(safe-area-inset-top)) 14px 12px;
  border: none; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.header-row-1 { display: flex; align-items: center; justify-content: center; gap: 6px; }
.header-avatar {
  width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid var(--glass-border); background: var(--glass-bg);
}
.header-heart { font-size: 20px; }
.header-row-2 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: .5px; }
.header-row-3 { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-soft); }
.love-heart { color: var(--heart-red); font-size: 13px; line-height: 1; }
#hdr-love.pop { animation: num-pop .35s ease; }

.chat-body { flex: 1; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 14px; }
.msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 100%; }
.msg-row.me { justify-content: flex-end; }
.msg-col { display: flex; flex-direction: column; max-width: 78%; }
.msg-row.me .msg-col { align-items: flex-end; }
.msg-row.other .msg-col { align-items: flex-start; }
.bubble {
  padding: 10px 14px; border-radius: 18px;
  font-size: 15px; line-height: 1.5; word-break: break-word; color: var(--text);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow: 0 4px 14px var(--glass-shadow);
  animation: bubble-in .22s ease;
}
.msg-row.other .bubble { background: var(--bubble-other); border: 1px solid var(--glass-border); }
.msg-row.me .bubble { background: var(--bubble-me); border: 1px solid var(--glass-border); }
.bubble.media { padding: 4px; border-radius: 16px; overflow: hidden; line-height: 0; }
.bubble.media img { width: 120px; height: auto; max-height: 160px; border-radius: 13px; object-fit: cover; display: block; }
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid var(--glass-border); background: var(--glass-bg);
  flex-shrink: 0; margin-top: 30px;
}
.msg-meta { margin-top: 4px; font-size: 11px; color: var(--time-text); display: flex; align-items: center; gap: 6px; }
.read-flag { font-size: 11px; color: var(--heart-red); }

/* 卡片消息 */
.card-msg {
  border: 2px solid var(--accent-deep);
  border-radius: 18px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  padding: 14px;
  min-width: 220px;
  max-width: 100%;
}
.card-msg-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; text-align: center; }
.card-opt {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border-radius: 11px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 14px; color: var(--text);
  margin-bottom: 8px;
}
.card-opt:last-child { margin-bottom: 0; }
.card-opt .opt-label { flex: 1; }
.card-opt .opt-mark { font-size: 12px; margin-left: 8px; }
.card-opt.sel-me { background: var(--accent); border-color: var(--accent-deep); }
.card-opt.sel-other { background: var(--accent-soft); border-color: var(--accent-deep); }
.card-opt .opt-mark.mark-me { color: var(--accent-deep); font-weight: 600; }
.card-opt .opt-mark.mark-other { color: var(--accent); }
.card-msg-result { margin-top: 10px; text-align: center; font-size: 13px; color: var(--text-soft); }

/* 问卷卡片 */
.quiz-card {
  border: 2px solid var(--accent-deep);
  border-radius: 18px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(150%);

<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dateStamp() { const d = new Date(); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function dayKey(ts) { const d = new Date(ts); return '' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayLabel(key) { const [y, m, d] = key.split('-'); return `${y}年${Number(m)}月${Number(d)}日`; }
function todayKey() { return dayKey(Date.now()); }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const LOVE_QUOTES = [
  '今天也想你了。','你不在的时候，时间过得很慢。','我数着日子，等你。','想你的这件事，我一天都没落下。',
  '你在，我就安心。','梦里见你，醒来还想你。','我把今天的第一句想，留给你。','你是我藏起来的那点甜。',
  '世界很吵，你这里很静。','想和你一起，把日子过慢。','你一出现，我这一天就算没白过。','我很好，就是想你。',
  '你是我睁开眼就想见的人。','你是我所有温柔的来处。','想牵你的手，走一段没人的路。','我不急，我等你。',
  '有你在的地方，我都想去。','想你了，没别的事。','你笑一下，我记很久。','有你在，我就不怕天黑。',
  '你在的时候，连沉默都好。','想陪你，从今天到很久。','你是我一想起，就会软下来的名字。','我在这里，一直在这里。',
  '你是我睡前最后一个念头。','你今天，有没有想我一点。','我攒了好多话，想说给你听。','你是我平淡日子里，最亮的那一下。',
  '想靠着你，什么也不干。','阿遇和阿凉，要一直在一起。'
];

const LOCK_PASSWORDS = [
  '所有的分别都是暂时的，我们一定会再次相会',
  '用大把时间仿徨，用几个瞬间成长'
];

const DING_PRESETS = ['可以的','去吧','别去了','我支持你','跟着心走','再想想','等等看','随你'];
const ASK_PRESETS = ['是的','不是','应该是吧','我觉得是','我也在想','你说呢','让我想想','我也说不准','再说吧','看情况'];

const VERSION = '1.0.0.5';

const State = {
  settings: {
    theme: 'rose-glass',
    replySpeed: 'daily', replySpeedMin: null, replySpeedMax: null,
    multiGap: 'daily', multiGapMin: null, multiGapMax: null,
    thinkTime: 'normal', thinkTimeCustom: null,
    lockMode: 'first',
    floatSize: 52, floatImg: '', floatHidden: false, floatPos: null,
    avatars: { other: '', me: '' },
    otherName: '', otherCall: '', otherCalls: [],
    myName: '', myCall: '', myCalls: [],
    avatarPool: [], avatarPairs: [],
    chatBg: '', chatBgPool: [], lockBg: '', lockBgPool: [],
    lockPassed: false, lastLockDay: '', lastArchiveDay: '',
    notify: false, fullscreen: false
  },
  cards: [], trash: [], messages: [], archive: [],
  quizzes: [],   /* 问卷：[{id, title, questions:[{text, options:[]}], locked}] */
  love: 0
};

const Store = {
  root: null,
  async init() { try { this.root = await navigator.storage.getDirectory(); } catch (e) { this.root = null; } },
  async _fh(name, create) { if (!this.root) return null; return await this.root.getFileHandle(name, { create }); },
  async read(name) {
    try {
      if (this.root) {
        const fh = await this._fh(name, false); if (!fh) return null;
        const file = await fh.getFile(); const txt = await file.text();
        return txt ? JSON.parse(txt) : null;
      }
      const raw = localStorage.getItem('ay_' + name);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  async write(name, data) {
    const txt = JSON.stringify(data);
    try {
      if (this.root) {
        const fh = await this._fh(name, true);
        const w = await fh.createWritable(); await w.write(txt); await w.close(); return;
      }
      localStorage.setItem('ay_' + name, txt);
    } catch (e) { try { localStorage.setItem('ay_' + name, txt); } catch (e2) {} }
  }
};

const CacheStore = {
  name: 'ay-media-v1',
  async put(key, blob) { try { const c = await caches.open(this.name); await c.put('/media/' + key, new Response(blob)); } catch (e) {} }
};

const save = {
  settings: () => Store.write('settings.json', State.settings),
  cards:    () => Store.write('cards.json', State.cards),
  trash:    () => Store.write('trash.json', State.trash),
  messages: () => Store.write('messages.json', State.messages),
  archive:  () => Store.write('archive.json', State.archive),
  quizzes:  () => Store.write('quizzes.json', State.quizzes),
  love:     () => Store.write('love.json', State.love)
};

function defaultAvatar(color) {
  const c = color === 'pink' ? '#f0a8c0' : '#9cc4e8';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="${c}"/><circle cx="40" cy="32" r="14" fill="#fff" opacity=".85"/><ellipse cx="40" cy="66" rx="24" ry="16" fill="#fff" opacity=".85"/></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function applyTheme(name) { document.body.dataset.theme = name; State.settings.theme = name; save.settings(); }

/* ---------- 页面栈 ---------- */
let pageStack = [];
function showPage(id, push = true) {
  const cur = $$('.page').find(p => p.classList.contains('active'));
  if (cur && push && cur.id !== id) pageStack.push(cur.id);
  $$('.page').forEach(p => p.classList.toggle('active', p.id === id));
  updateFloatBallVisible(); applyBackgrounds();
}
function goBack() {
  const prev = pageStack.pop() || 'page-chat';
  $$('.page').forEach(p => p.classList.toggle('active', p.id === prev));
  updateFloatBallVisible(); applyBackgrounds();
}
function updateFloatBallVisible() {
  const lockActive = $('#page-lock') && $('#page-lock').classList.contains('active');
  const ball = $('#float-ball'); if (!ball) return;
  if (lockActive || State.settings.floatHidden) ball.classList.add('hidden');
  else ball.classList.remove('hidden');
}

/* ---------- 弹窗 ---------- */
let modalStack = [];
function openModal({ title, bodyHTML, actions, wide }) {
  modalStack.push({ title: $('#modal-title').textContent, body: $('#modal-body').innerHTML, actions: $('#modal-actions').innerHTML, wide: $('#modal').classList.contains('wide') });
  setModal({ title, bodyHTML, actions, wide });
  $('#modal-mask').classList.add('active');
}
function setModal({ title, bodyHTML, actions, wide }) {
  $('#modal-title').textContent = title || '';
  $('#modal-body').innerHTML = bodyHTML || '';
  $('#modal').classList.toggle('wide', !!wide);
  const acts = $('#modal-actions'); acts.innerHTML = '';
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.className = 'modal-btn' + (a.danger ? ' danger' : '');
    b.textContent = a.label;
    b.onclick = () => { if (a.onClick) a.onClick(); if (a.keepOpen !== true) closeModal(); };
    acts.appendChild(b);
  });
}
function closeModal() { modalStack = []; $('#modal-mask').classList.remove('active'); $('#modal').classList.remove('wide'); }
function modalBack() {
  if (modalStack.length) {
    const p = modalStack.pop();
    $('#modal-title').textContent = p.title;
    $('#modal-body').innerHTML = p.body;
    $('#modal-actions').innerHTML = p.actions;
    $('#modal').classList.toggle('wide', p.wide);
  } else closeModal();
}

/* ---------- 底部升起 ---------- */
function openSheet(items, onPick) {
  const grid = $('#sheet-grid'); grid.innerHTML = '';
  items.forEach(it => {
    const cell = document.createElement('div');
    cell.className = 'unpair-cell';
    cell.style.flexDirection = 'column'; cell.style.gap = '4px';
    cell.innerHTML = `<svg style="width:22px;height:22px;color:var(--accent-deep)"><use href="#${it[1]}"/></svg><span class="sheet-item-name">${it[0]}</span>`;
    cell.onclick = () => { closeSheet(); onPick(it[0]); };
    grid.appendChild(cell);
  });
  $('#sheet-mask').classList.add('active');
}
function closeSheet() { $('#sheet-mask').classList.remove('active'); }

function pickImage(cb, multiple = false) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  if (multiple) inp.multiple = true;
  inp.onchange = () => { [...inp.files].forEach(f => { const fr = new FileReader(); fr.onload = () => cb(fr.result, f); fr.readAsDataURL(f); }); };
  inp.click();
}
function bindLongPress(el, cb) {
  let timer = null;
  const start = () => { timer = setTimeout(() => { timer = null; cb(); }, 500); };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

/* ---------- 锁屏 ---------- */
function initLockPage() {
  function tick() {
    const d = new Date();
    const week = ['日','一','二','三','四','五','六'][d.getDay()];
    $('#lock-time').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
  $('#lock-love').textContent = LOVE_QUOTES[Math.floor(Math.random() * LOVE_QUOTES.length)];
  $('#btn-enter').onclick = () => {
    const mode = State.settings.lockMode;
    const today = new Date().toDateString();
    let needPass = false;
    if (mode === 'first') needPass = !State.settings.lockPassed;
    else if (mode === 'daily') needPass = State.settings.lastLockDay !== today;
    else if (mode === 'refresh') needPass = true;
    if (!needPass) { enterChat(); return; }
    $('#btn-enter').style.display = 'none';
    $('#lock-pass').classList.add('active');
    setTimeout(() => $('#lock-pass-input').focus(), 200);
  };
  const input = $('#lock-pass-input'); const dots = $('#lock-pass-dots');
  function renderDots(n) { dots.innerHTML = ''; for (let i = 0; i < n; i++) dots.appendChild(document.createElement('i')); }
  function passOK() {
    State.settings.lockPassed = true; State.settings.lastLockDay = new Date().toDateString();
    save.settings(); input.blur(); input.value = ''; renderDots(0);
    $('#lock-pass').classList.remove('active'); $('#btn-enter').style.display = '';
    enterChat();
  }
  function failPass() { input.value = ''; renderDots(0); const box = $('#lock-pass'); box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 400); }
  input.addEventListener('input', () => {
    const v = input.value; renderDots(v.length);
    if (LOCK_PASSWORDS.includes(v)) { passOK(); return; }
    if (!LOCK_PASSWORDS.some(p => p.startsWith(v)) && v.length > 0) failPass();
  });
  input.addEventListener('paste', () => { setTimeout(() => { const v = input.value; renderDots(v.length); if (LOCK_PASSWORDS.includes(v)) passOK(); else if (v) failPass(); }, 30); });
  renderDots(0);
}

function enterChat() {
  pageStack = [];
  runArchive();
  showPage('page-chat', false);
  renderedCount = MSG_PAGE;
  renderMessages();
  setTimeout(scrollBottom, 50);
}

/* ---------- 归档 ---------- */
function runArchive() {
  const today = todayKey();
  const last = State.settings.lastArchiveDay || '';
  if (!last) { State.settings.lastArchiveDay = today; save.settings(); return; }
  const byDay = {}; const remain = [];
  State.messages.forEach(m => {
    const k = dayKey(m.ts || Date.now());
    if (k === today) remain.push(m); else (byDay[k] = byDay[k] || []).push(m);
  });
  Object.keys(byDay).forEach(k => {
    let entry = State.archive.find(a => a.day === k);
    if (!entry) { entry = { day: k, messages: [] }; State.archive.push(entry); }
    entry.messages = entry.messages.concat(byDay[k]);
  });
  State.archive.sort((a, b) => b.day.localeCompare(a.day));
  if (Object.keys(byDay).length) { State.messages = remain; save.messages(); save.archive(); }
  State.settings.lastArchiveDay = today; save.settings();
  renderMessages();          /* ← 关键：归档后清空聊天页 */
  setTimeout(scrollBottom, 30);
}

/* ---------- 聊天 ---------- */
let multiSendMode = false;
const MSG_PAGE = 20;
let renderedCount = MSG_PAGE;

function initChatPage() {
  const input = $('#chat-input'); const btn = $('#btn-plus-send'); const icon = $('#plus-send-icon use');
  input.addEventListener('input', () => { icon.setAttribute('href', input.value.trim() ? '#i-send' : '#i-plus-circle'); });
  btn.onclick = () => {
    if (input.value.trim()) { sendMyText(input.value.trim()); input.value = ''; icon.setAttribute('href', '#i-plus-circle'); }
    else openPlusMenu();
  };
  $('#btn-stack').onclick = () => { triggerReply(); };
  $('#btn-lightning').onclick = () => {
    multiSendMode = !multiSendMode;
    $('#btn-lightning').classList.toggle('on', multiSendMode);
    if (!multiSendMode) triggerReply();
  };
  const body = $('#chat-body');
  body.addEventListener('scroll', () => {
    if (body.scrollTop < 30 && renderedCount < State.messages.length) {
      const prevH = body.scrollHeight;
      renderedCount += MSG_PAGE;
      renderMessages();
      body.scrollTop = body.scrollHeight - prevH + body.scrollTop;
    }
  });
  renderMessages(); updateLove();
}

function addLove(n) {
  State.love = Math.max(0, State.love + n);
  save.love();
  const el = $('#hdr-love');
  if (el) { el.textContent = State.love; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}
function sendMyText(text, noReply) {
  State.messages.push({ id: uid(), who: 'me', type: 'text', text, t: nowHM(), ts: Date.now(), read: false });
  save.messages(); addLove(1); renderMessages(); scrollBottom();
  if (!multiSendMode && !noReply) triggerReply();
}
function sendMyImage(dataUrl, noReply) {
  State.messages.push({ id: uid(), who: 'me', type: 'img', src: dataUrl, t: nowHM(), ts: Date.now(), read: false });
  save.messages(); addLove(1); renderMessages(); scrollBottom();
  if (!multiSendMode && !noReply) triggerReply();
}

function renderMessages() {
  const body = $('#chat-body'); if (!body) return;
  body.innerHTML = '';
  const total = State.messages.length;
  const start = Math.max(0, total - renderedCount);
  State.messages.slice(start).forEach(m => body.appendChild(buildMsgRow(m)));
}
function buildMsgRow(m) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (m.who === 'me' ? 'me' : 'other');
  const av = document.createElement('img');
  av.className = 'msg-avatar';
  av.src = m.who === 'me' ? (State.settings.avatars.me || defaultAvatar('pink')) : (State.settings.avatars.other || defaultAvatar('blue'));
  const col = document.createElement('div'); col.className = 'msg-col';
  if (m.type === 'card') {
    col.appendChild(buildCard(m));
  } else if (m.type === 'quiz') {
    col.appendChild(buildQuizCard(m));
  } else {
    const b = document.createElement('div'); b.className = 'bubble';
    if (m.type === 'img') { b.classList.add('media'); const im = document.createElement('img'); im.src = m.src; b.appendChild(im); }
    else b.textContent = m.text;
    col.appendChild(b);
  }
  const meta = document.createElement('div'); meta.className = 'msg-meta'; meta.textContent = m.t;
  if (m.who === 'me' && m.read) { const r = document.createElement('span'); r.className = 'read-flag'; r.textContent = '已读'; meta.appendChild(r); }
  col.appendChild(meta);
  if (m.who === 'me') { row.appendChild(col); row.appendChild(av); }
  else { row.appendChild(av); row.appendChild(col); }
  return row;
}

/* 卡片（抉择/问答） */
function buildCard(m) {
  const card = document.createElement('div');
  card.className = 'card-msg';
  const title = document.createElement('div'); title.className = 'card-msg-title'; title.textContent = m.title;
  card.appendChild(title);
  m.options.forEach((opt, i) => {
    const o = document.createElement('div'); o.className = 'card-opt';
    const lbl = document.createElement('span'); lbl.className = 'opt-label';
    lbl.textContent = String.fromCharCode(65 + i) + '. ' + opt;
    o.appendChild(lbl);
    const marks = [];
    if (m.myPick === i) marks.push('我');
    if (m.otherPick === i) marks.push('祂');
    marks.forEach(mk => { const s = document.createElement('span'); s.className = 'opt-mark ' + (mk === '我' ? 'mark-me' : 'mark-other'); s.textContent = mk; o.appendChild(s); });
    if (m.myPick === i) o.classList.add('sel-me');
    if (m.otherPick === i) o.classList.add('sel-other');
    card.appendChild(o);
  });
  if (m.result) { const r = document.createElement('div'); r.className = 'card-msg-result'; r.textContent = m.result; card.appendChild(r); }
  return card;
}

/* 问卷卡片 */
function buildQuizCard(m) {
  const card = document.createElement('div');
  card.className = 'quiz-card';
  if (m.done) card.classList.add('locked');
  const title = document.createElement('div'); title.className = 'quiz-card-title'; title.textContent = m.title;
  card.appendChild(title);
  const body = document.createElement('div'); body.className = 'quiz-card-body';
  m.questions.forEach((q, qi) => {
    const qEl = document.createElement('div'); qEl.className = 'quiz-q';
    const qt = document.createElement('div'); qt.className = 'quiz-q-text'; qt.textContent = (qi+1) + '. ' + q.text;
    qEl.appendChild(qt);
    q.options.forEach((opt, oi) => {
      const o = document.createElement('div'); o.className = 'card-opt';
      const lbl = document.createElement('span'); lbl.className = 'opt-label'; lbl.textContent = String.fromCharCode(65 + oi) + '. ' + opt;
      o.appendChild(lbl);
      const myPick = m.myPicks && m.myPicks[qi];
      const otherPick = m.otherPicks && m.otherPicks[qi];
      if (myPick === oi) { o.classList.add('sel-me'); const s = document.createElement('span'); s.className = 'opt-mark mark-me'; s.textContent = '我'; o.appendChild(s); }
      if (otherPick === oi) { o.classList.add('sel-other'); const s = document.createElement('span'); s.className = 'opt-mark mark-other'; s.textContent = '祂'; o.appendChild(s); }
      o.onclick = () => {
        if (m.done || m.myPicks) return;
        m.tmpPick = m.tmpPick || {};
        m.tmpPick[qi] = oi;
        $$('.card-opt', qEl).forEach((x, xi) => {
          x.classList.toggle('sel-me', xi === oi);
          let mk = x.querySelector('.mark-me');
          if (xi === oi) { if (!mk) { mk = document.createElement('span'); mk.className = 'opt-mark mark-me'; mk.textContent = '我'; x.appendChild(mk); } }
          else if (mk) mk.remove();
        });
      };
      qEl.appendChild(o);
    });
    body.appendChild(qEl);
  });
  card.appendChild(body);
  const footer = document.createElement('div'); footer.className = 'quiz-card-footer';
  const sub = document.createElement('button'); sub.className = 'quiz-submit'; sub.textContent = '提交问卷';
  if (m.submitted && !m.done) { sub.textContent = '已提交问卷'; sub.classList.add('done'); }
  if (m.done) sub.classList.add('hidden');
  sub.onclick = () => {
    if (m.submitted || m.done) return;
    if (!m.tmpPick || Object.keys(m.tmpPick).length < m.questions.length) { openModal({ title:'', bodyHTML:'每道题都选一个吧', actions: [] }); setTimeout(closeModal, 1500); return; }
    m.myPicks = { ...m.tmpPick };
    m.submitted = true;
    sub.textContent = '已提交问卷'; sub.classList.add('done');
    save.messages(); renderMessages(); scrollBottom();
    waitThink(() => {
      const otherPicks = {};
      m.questions.forEach((q, qi) => { otherPicks[qi] = Math.floor(Math.random() * q.options.length); });
      m.otherPicks = otherPicks;
      m.done = true;
      addLove(m.questions.length);
      save.messages(); renderMessages(); scrollBottom();
    });
  };
  footer.appendChild(sub);
  card.appendChild(footer);
  return card;
}

function scrollBottom() { const body = $('#chat-body'); if (body) body.scrollTop = body.scrollHeight; }

function triggerReply() {
  const lastMe = [...State.messages].reverse().find(m => m.who === 'me');
  if (lastMe) lastMe.read = true;
  save.messages(); renderMessages(); scrollBottom();
  const bar = $('#typing-bar'); bar.classList.add('active');
  setTimeout(() => { bar.classList.remove('active'); doReply(); }, getReplyWait() * 1000);
}
function getReplyWait() {
  const s = State.settings;
  if (s.replySpeedMin != null && s.replySpeedMax != null) return s.replySpeedMin + Math.random() * (s.replySpeedMax - s.replySpeedMin);
  switch (s.replySpeed) {
    case 'fast': return 15 + Math.random() * 15;
    case 'slow': return 60 + Math.random() * 60;
    case 'long': return 120 + Math.random() * 180;
    default: return 30 + Math.random() * 30;
  }
}
function getMultiGap() {
  const s = State.settings;
  if (s.multiGapMin != null && s.multiGapMax != null) return s.multiGapMin + Math.random() * (s.multiGapMax - s.multiGapMin);
  switch (s.multiGap) {
    case 'fast': return 1 + Math.random() * 2;
    case 'slow': return 5 + Math.random() * 3;
    default: return 3 + Math.random() * 2;
  }
}
function getThinkTime() {
  const s = State.settings;
  if (s.thinkTimeCustom != null) return s.thinkTimeCustom;
  switch (s.thinkTime) { case 'fast': return 5; case 'slow': return 15; default: return 8; }
}
function doReply() {
  if (State.cards.length === 0) { pushOther('没有字卡，祂只好安静地看着你。'); return; }
  const n = 1 + Math.floor(Math.random() * 3);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(State.cards[Math.floor(Math.random() * State.cards.length)].text);
  let idx = 0;
  const sendNext = () => { if (idx >= picked.length) return; pushOther(picked[idx]); idx++; if (idx < picked.length) setTimeout(sendNext, getMultiGap() * 1000); };
  sendNext();
}
function pushOther(text) {
  State.messages.push({ id: uid(), who: 'other', type: 'text', text, t: nowHM(), ts: Date.now() });
  save.messages(); addLove(1); renderMessages(); scrollBottom();
  maybeNotify(text);
}
function maybeNotify(text) {
  if (!State.settings.notify) return;
  if (document.visibilityState === 'visible') return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try { new Notification('阿遇♥阿凉', { body: text }); } catch (e) {}
}

function initFloatBallDrag() {
  const ball = $('#float-ball'); if (!ball) return;
  let startX = 0, startY = 0, startL = 0, startT = 0, dragging = false, moved = false, menuOpened = false;
  function begin(x, y) {
    startX = x; startY = y; const r = ball.getBoundingClientRect();
    startL = r.left; startT = r.top; dragging = true; moved = false; menuOpened = false;
    openBigMenu(); menuOpened = true;
  }
  function move(x, y) {
    if (!dragging) return;
    const dx = x - startX, dy = y - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { if (!moved && menuOpened) { closeModal(); menuOpened = false; } moved = true; }
    if (!moved) return;
    let nl = startL + dx, nt = startT + dy;
    nl = Math.max(0, Math.min(window.innerWidth - ball.offsetWidth, nl));
    nt = Math.max(0, Math.min(window.innerHeight - ball.offsetHeight, nt));
    ball.style.left = nl + 'px'; ball.style.top = nt + 'px'; ball.style.right = 'auto'; ball.style.bottom = 'auto';
  }
  function end() { if (!dragging) return; dragging = false; if (moved) { State.settings.floatPos = { left: ball.style.left, top: ball.style.top }; save.settings(); } }
  ball.addEventListener('touchstart', e => { const t = e.touches[0]; begin(t.clientX, t.clientY); }, { passive: true });
  ball.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  ball.addEventListener('touchend', end);
  ball.addEventListener('mousedown', e => {
    begin(e.clientX, e.clientY);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); end(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}

let quizEditing = null;
function openQuizCreate(q, readonly) {
  quizEditing = q ? { ...q, questions: q.questions.map(x => ({ ...x, options: [...x.options] })) } : { id: uid(), title: '', questions: [{ text: '', options: ['','','',''] }], locked: false };

    <div class="quiz-create-head"><input class="field" id="quiz-title" placeholder="问卷标题" value="${escapeHTML(quizEditing.title)}" ${readonly?'disabled':''}></div>
    <div class="quiz-create-body" id="quiz-questions"></div>
    ${readonly ? '' : `<div class="quiz-create-foot"><button class="upload-btn" id="btn-add-q" style="border-style:solid;flex:1"><svg><use href="#i-plus"/></svg>继续添加</button><button class="upload-btn" id="btn-save-quiz" style="border-style:solid;flex:1"><svg><use href="#i-card"/></svg>保存问卷</button></div>`}
  `;
  renderQuizQuestions(readonly);
  if (readonly) return;
  $('#btn-add-q').onclick = () => { quizEditing.title = $('#quiz-title').value; quizEditing.questions.push({ text: '', options: ['','','',''] }); renderQuizQuestions(false); };
  $('#btn-save-quiz').onclick = () => {
    quizEditing.title = $('#quiz-title').value.trim() || '未命名问卷';
    quizEditing.questions = quizEditing.questions.filter(q => q.text.trim() || q.options.some(o => o.trim()));
    quizEditing.questions.forEach(q => { q.options = q.options.filter(o => o.trim()); });
    if (!quizEditing.questions.length) { openModal({ title:'', bodyHTML:'至少加一道题', actions: [] }); setTimeout(closeModal, 1500); return; }
    const exist = State.quizzes.findIndex(x => x.id === quizEditing.id);
    if (exist >= 0) State.quizzes[exist] = quizEditing;
    else State.quizzes.unshift(quizEditing);
    save.quizzes();
    openQuizManager();
  };
}
function renderQuizQuestions(readonly) {
  const wrap = $('#quiz-questions'); if (!wrap) return;
  wrap.innerHTML = '';
  quizEditing.questions.forEach((q, qi) => {
    const el = document.createElement('div'); el.className = 'q-edit';
    el.innerHTML = `
      ${readonly ? '' : `<div class="q-edit-remove" data-rmq="${qi}">×</div>`}
      <input class="field" placeholder="问题" value="${escapeHTML(q.text)}" data-qt="${qi}" ${readonly?'disabled':''} style="margin-bottom:8px">
    `;
    q.options.forEach((opt, oi) => {
      const row = document.createElement('div'); row.className = 'q-opt-row';
      row.innerHTML = `
        <input class="field" placeholder="${String.fromCharCode(65+oi)}" value="${escapeHTML(opt)}" data-qo="${qi}-${oi}" ${readonly?'disabled':''}>
        ${readonly ? '' : `<div class="q-opt-del" data-rmo="${qi}-${oi}">×</div>`}
      `;
      el.appendChild(row);
    });
    if (!readonly) {
      const addOpt = document.createElement('button'); addOpt.className = 'q-add-opt'; addOpt.textContent = '+ 添加选项';
      addOpt.onclick = () => { syncQuizInputs(); q.options.push(''); renderQuizQuestions(false); };
      el.appendChild(addOpt);
    }
    wrap.appendChild(el);
  });
  if (readonly) return;
  $$('[data-qt]').forEach(inp => inp.oninput = () => { quizEditing.title = $('#quiz-title').value; });
  $$('[data-rmq]').forEach(el => el.onclick = () => { syncQuizInputs(); quizEditing.questions.splice(+el.dataset.rmq, 1); if (!quizEditing.questions.length) quizEditing.questions.push({ text:'', options:['','','',''] }); renderQuizQuestions(false); });
  $$('[data-rmo]').forEach(el => el.onclick = () => {
    syncQuizInputs();
    const [qi, oi] = el.dataset.rmo.split('-').map(Number);
    quizEditing.questions[qi].options.splice(oi, 1);
    if (!quizEditing.questions[qi].options.length) quizEditing.questions[qi].options.push('');
    renderQuizQuestions(false);
  });
  /* 输入同步 */
  $$('[data-qt]').forEach(inp => inp.oninput = () => { quizEditing.questions[+inp.dataset.qt].text = inp.value; });
  $$('[data-qo]').forEach(inp => inp.oninput = () => { const [qi, oi] = inp.dataset.qo.split('-').map(Number); quizEditing.questions[qi].options[oi] = inp.value; });
}
function syncQuizInputs() {

function doRestore() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const txt = await f.text(); let data;
    try { data = JSON.parse(txt); } catch(e) { openModal({ title:'失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    openModal({ title: '覆盖中', bodyHTML: `<div style="text-align:center"><div id="restore-stage" style="margin-bottom:12px;font-size:13px;color:var(--text-soft)">准备中…</div><div style="height:6px;border-radius:3px;background:var(--glass-bg-strong);overflow:hidden"><div id="restore-bar" style="height:100%;width:0;background:var(--accent-deep);transition:width .2s"></div></div><div id="restore-pct" style="margin-top:8px;font-size:13px">0%</div></div>`, actions: [] });
    $('#modal-mask').style.pointerEvents = 'none';
    await new Promise(r => setTimeout(r, 200));
    const stages = [
      ['设置', () => { if (data.settings) State.settings = Object.assign(State.settings, data.settings); }],
      ['字卡', () => { State.cards = data.cards || []; }],
      ['回收站', () => { State.trash = data.trash || []; }],
      ['消息', () => { State.messages = data.messages || []; }],
      ['归档', () => { State.archive = data.archive || []; }],
      ['问卷', () => { State.quizzes = data.quizzes || []; }],
      ['爱意值', () => { State.love = data.love || 0; }]
    ];
    for (let i = 0; i < stages.length; i++) {
      $('#restore-stage').textContent = '正在覆盖：' + stages[i][0] + '…';
      stages[i][1]();
      const pct = Math.round((i + 1) / stages.length * 100);
      $('#restore-bar').style.width = pct + '%'; $('#restore-pct').textContent = pct + '%';
      await new Promise(r => setTimeout(r, 250));
    }
    await save.settings(); await save.cards(); await save.trash(); await save.messages(); await save.archive(); await save.quizzes(); await save.love();
    $('#restore-stage').textContent = '完成';
    setTimeout(() => { $('#modal-mask').style.pointerEvents = ''; closeModal(); openModal({ title:'已覆盖', bodyHTML:'备份已覆盖，正在刷新…', actions: [] }); setTimeout(() => location.reload(), 1200); }, 600);
  };
  inp.click();
}

function openCardItemMenu(card) {

    { label: '删除', danger: true, onClick: () => { moveCardsToTrash([card.id]); renderCardList(); } }
  ]});

function editCardInline(card) {
  const list = $('#card-list'); const items = $$('.card-item', list);
  const idx = getDisplayedCards().findIndex(c => c.id === card.id);
  if (idx < 0) return; const el = items[idx]; if (!el) return;
  const textEl = el.querySelector('.card-text'); textEl.innerHTML = '';
  const input = document.createElement('input'); input.className = 'field'; input.value = card.text; input.style.padding = '6px 10px';
  textEl.appendChild(input); input.focus();
  let done = false;
  const finish = saveIt => { if (done) return; done = true; if (saveIt && input.value.trim()) { card.text = input.value.trim(); save.cards(); } renderCardList(); };
  input.onblur = () => finish(true);
  input.onkeydown = e => { if (e.key === 'Enter') finish(true); };
}
function moveCardsToTrash(ids) {
  const set = new Set(ids);
  const moving = State.cards.filter(c => set.has(c.id));
  State.cards = State.cards.filter(c => !set.has(c.id));
  moving.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
  save.cards(); save.trash();
}
function openAddCard() {
  openModal({ title: '添加新字卡', bodyHTML: `<textarea class="field" id="add-card-input" rows="8" placeholder="祂会用这些字卡回复你哦"></textarea><div style="font-size:12px;color:var(--text-soft);margin-top:8px;text-align:center">一行一张字卡，可换行分隔</div>`,
    actions: [{ label: '保存字卡', onClick: () => {
      const lines = $('#add-card-input').value.split('\n').map(s => s.trim()).filter(Boolean);
      lines.forEach(text => State.cards.unshift({ id: uid(), text, t: Date.now() }));
      save.cards(); renderCardList();
    }}]
  });
}
function importCards() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.json,application/json,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text(); let incoming = [];
    if (f.name.endsWith('.json')) {
      try { const data = JSON.parse(text); if (Array.isArray(data)) incoming = data.map(d => typeof d === 'string' ? d : (d.text || '')).filter(Boolean); }
      catch(e) { openModal({ title:'导入失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    } else incoming = text.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = new Set(State.cards.map(c => c.text));
    const dups = [];
    incoming.forEach(t => {
      if (existing.has(t)) { dups.push(t); State.trash.push({ id: uid(), text: t, t: Date.now(), deletedAt: Date.now() }); }
      else { State.cards.unshift({ id: uid(), text: t, t: Date.now() }); existing.add(t); }
    });
    save.cards(); save.trash(); renderCardList();
    if (dups.length) {
      const html = `<div class="dup-list">` + dups.map(d => `<div class="dup-item">${escapeHTML(d)}</div>`).join('') + `</div>`;
      openModal({ title:'以下字卡重复，已移入回收站', bodyHTML: html, actions: [{ label:'去回收站', onClick: () => openTrash() }] });
    } else { openModal({ title:'导入完成', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 5000); }
  };
  inp.click();
}
function openExportDialog() {
  openModal({ title: '选择导出格式', bodyHTML: '', actions: [
    { label: 'TXT', onClick: () => exportCards('txt') },
    { label: 'JSON', onClick: () => exportCards('json') }
  ]});
}
function exportCards(fmt) {
  const data = State.cards.map(c => c.text);
  let content, mime, ext;
  if (fmt === 'json') { content = JSON.stringify(data, null, 2); mime = 'application/json'; ext = 'json'; }
  else { content = data.join('\n'); mime = 'text/plain'; ext = 'txt'; }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `字卡_${dateStamp()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doDedup() {
  const map = new Map();
  State.cards.forEach(c => { if (!map.has(c.text)) map.set(c.text, []); map.get(c.text).push(c); });
  const groups = [...map.entries()].filter(([, arr]) => arr.length > 1);
  if (!groups.length) { openModal({ title:'去重', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 5000); return; }
  groups.forEach(([, arr]) => {
    arr.sort((a, b) => a.t - b.t);
    const rest = arr.slice(1);
    rest.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
    const set = new Set(rest.map(c => c.id));
    State.cards = State.cards.filter(c => !set.has(c.id));
  });
  save.cards(); save.trash();
  const html = `<div class="dup-list">` + groups.map(([text, arr]) => `<div class="dup-item"><span>${escapeHTML(text)}</span><span class="dup-count" style="margin-left:auto">${arr.length}</span></div>`).join('') + `</div>`;
  openModal({ title:'重复内容', bodyHTML: html, actions: [{ label:'去回收站', onClick: () => openTrash() }] });
}

let trashSelectMode = false, trashSelected = new Set();
function openTrash() {

function renderTrashToolbar() {
  const bar = $('#trash-toolbar'); if (!bar) return;
  if (trashSelectMode) {
    bar.innerHTML = `<div class="toolbar-row"><button class="tool-btn" id="tr-all"><svg><use href="#i-select-all"/></svg>全选</button><button class="tool-btn" id="tr-del"><svg><use href="#i-delete"/></svg>删除</button><button class="tool-btn" id="tr-restore"><svg><use href="#i-restore"/></svg>恢复</button></div>`;
    $('#tr-all').onclick = () => { State.trash.forEach(c => trashSelected.add(c.id)); renderTrashList(); };
    $('#tr-del').onclick = () => {
      if (!trashSelected.size) return;
      openModal({ title:'永久删除？', bodyHTML:'此操作不可恢复。', actions: [
        { label:'取消', onClick: () => {} },
        { label:'永久删除', danger: true, onClick: () => { State.trash = State.trash.filter(c => !trashSelected.has(c.id)); save.trash(); trashSelected.clear(); renderTrashList(); } }
      ]});
    };
    $('#tr-restore').onclick = () => {
      const back = State.trash.filter(c => trashSelected.has(c.id));
      State.trash = State.trash.filter(c => !trashSelected.has(c.id));
      back.forEach(c => { delete c.deletedAt; State.cards.unshift(c); });
      save.trash(); save.cards(); trashSelected.clear(); renderTrashList();
    };
    return;
  }
  bar.innerHTML = `<div class="toolbar-row"><button class="tool-btn" id="tr-batch"><svg><use href="#i-batch-del"/></svg>批量</button></div>`;

  });
}

let playState = { day: null, messages: [], idx: 0, timer: null, speed: 1, playing: true, baseDelay: 3000 };
function openPlayPage(day) {
  const entry = State.archive.find(a => a.day === day);
  if (!entry) return;
  playState.day = day; playState.messages = entry.messages.slice();
  playState.idx = 0; playState.speed = 1; playState.playing = true;
  $('#play-title').textContent = dayLabel(day);
  $('#play-body').innerHTML = '';
  $('#btn-speed').textContent = '1x';
  $$('.speed-opt').forEach(o => o.classList.toggle('active', o.dataset.speed === '1'));
  setPlayIcon(true); updateProgress();
  showPage('page-play'); showBars();
  setTimeout(() => playNext(), 400);
}
function setPlayIcon(playing) { $('#play-pause-icon use').setAttribute('href', playing ? '#i-pause' : '#i-play'); }
function playNext() {
  if (!playState.playing) return;
  if (playState.idx >= playState.messages.length) return;
  const m = playState.messages[playState.idx];
  const body = $('#play-body');
  body.appendChild(buildMsgRow(m));
  body.scrollTop = body.scrollHeight;
  playState.idx++; updateProgress();
  playState.timer = setTimeout(playNext, playState.baseDelay / playState.speed);
}
function updateProgress() {
  const total = playState.messages.length || 1;
  const pct = Math.min(100, playState.idx / total * 100);
  $('#progress-fill').style.width = pct + '%';
  $('#progress-knob').style.left = pct + '%';
}
let playHideTimer = null;
function showBars() {
  $('#play-header').classList.remove('hidden');
  $('#play-footer').classList.remove('hidden');
  clearTimeout(playHideTimer);
  playHideTimer = setTimeout(() => { $('#play-header').classList.add('hidden'); $('#play-footer').classList.add('hidden'); }, 3000);
}
function initPlayPage() {
  $('#play-close').onclick = () => { clearTimeout(playState.timer); playState.playing = false; goBack(); };
  $('#btn-play-pause').onclick = () => {
    playState.playing = !playState.playing; setPlayIcon(playState.playing);
    if (playState.playing) playNext(); else clearTimeout(playState.timer);
  };
  const bar = $('#progress-bar');
  function seek(clientX) {
    const rect = bar.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width; pct = Math.max(0, Math.min(1, pct));
    const target = Math.floor(pct * playState.messages.length);
    playState.idx = target;
    const body = $('#play-body'); body.innerHTML = '';
    for (let i = 0; i < target; i++) body.appendChild(buildMsgRow(playState.messages[i]));
    body.scrollTop = body.scrollHeight; updateProgress();
    clearTimeout(playState.timer);
    if (playState.playing) playNext();
  }
  bar.addEventListener('click', e => seek(e.clientX));
  let dragging = false;
  bar.addEventListener('touchstart', e => { dragging = true; seek(e.touches[0].clientX); }, { passive: true });
  bar.addEventListener('touchmove', e => { if (dragging) seek(e.touches[0].clientX); }, { passive: true });
  bar.addEventListener('touchend', () => dragging = false);
  $('#btn-speed').onclick = e => { e.stopPropagation(); $('#speed-pop').classList.toggle('active'); };
  $$('.speed-opt').forEach(opt => {
    opt.onclick = () => {
      playState.speed = +opt.dataset.speed;
      $('#btn-speed').textContent = opt.dataset.speed + 'x';
      $$('.speed-opt').forEach(o => o.classList.toggle('active', o === opt));
      $('#speed-pop').classList.remove('active');
    };
  });
  document.addEventListener('click', () => $('#speed-pop').classList.remove('active'));
  $('#page-play').addEventListener('click', e => {
    if (e.target.closest('.play-footer') || e.target.closest('.play-header')) return;
    showBars();
  });
}

  await Store.init();
  const st = await Store.read('settings.json');
  if (st) {
    Object.assign(State.settings, st);

    State.settings.otherCalls = st.otherCalls || [];
    State.settings.myCalls = st.myCalls || [];
    State.settings.avatarPool = st.avatarPool || [];
    State.settings.avatarPairs = st.avatarPairs || [];
    State.settings.chatBgPool = st.chatBgPool || [];
    State.settings.lockBgPool = st.lockBgPool || [];
  }
  const c = await Store.read('cards.json'); if (c) State.cards = c;
  const t = await Store.read('trash.json'); if (t) State.trash = t;
  const m = await Store.read('messages.json'); if (m) State.messages = m;
  const a = await Store.read('archive.json'); if (a) State.archive = a;
  const q = await Store.read('quizzes.json'); if (q) State.quizzes = q;
  const l = await Store.read('love.json'); if (l != null) State.love = l;

  applyTheme(State.settings.theme);
  applyFloatBall(); applyBackgrounds(); applyAvatars();

  initLockPage(); initChatPage(); initFloatBallDrag(); initPlayPage();

  $('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
  $('#sheet-mask').addEventListener('click', e => { if (e.target.id === 'sheet-mask') closeSheet(); });
  $('#sub-back').onclick = () => goBack();
}
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
