<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e8dcc0">
<title>阿遇♡阿凉</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Kaiti SC","STKaiti","KaiTi","FangSong","STFangsong",serif;
  color:#4a3b2a;user-select:none;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ========== 复古手帐信 ========== */
body.retro{
  background-color:#e8dcc0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(160,130,90,.08) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(160,130,90,.06) 0 2px, transparent 3px),
    linear-gradient(160deg,#efe4c8,#e3d5b4);
  background-size:60px 60px,80px 80px,100% 100%;
}
body.retro .topbar{background:linear-gradient(#f3ead2,#e9dcbc);border-bottom:1px solid #cbb98f;box-shadow:0 2px 6px rgba(120,95,60,.15)}
body.retro .names span{color:#6b5334}

/* ========== 漫画风 ========== */
body.comic{
  background-color:#fff;
  background-image:radial-gradient(rgba(0,0,0,.13) 1px, transparent 1.4px);
  background-size:12px 12px;
  color:#111;
}
body.comic .topbar{background:#fff;border-bottom:3px solid #111;box-shadow:0 3px 0 #111}
body.comic .names span{color:#111;font-weight:900}

/* ========== 少女手帐 ========== */
body.girl{
  background-color:#fdf2f6;
  background-image:radial-gradient(rgba(240,160,190,.35) 1.5px, transparent 2px);
  background-size:18px 18px;
  color:#7a4a5c;
}
body.girl .topbar{background:linear-gradient(#ffe9f1,#ffd6e6);border-bottom:1px solid #f3b8ce;box-shadow:0 2px 6px rgba(220,140,170,.25)}
body.girl .names span{color:#c05a80}
body.girl .page{background:#fdf2f6}
body.girl .page-head{background:rgba(255,233,241,.95);border-bottom:1px solid #f3b8ce}
body.girl .page-head h2,body.girl .page-head .back{color:#c05a80}
body.girl .drawer-item{color:#7a4a5c}
body.girl .set-group,body.girl .card-item{background:#fff;border-color:#f3c8d8}
body.girl .tool{border-color:#f3b8ce;background:#fff5f8}
body.girl .mini-btn{border-color:#f3b8ce;background:#fff5f8;color:#c05a80}
body.girl .save-btn{border-color:#f3b8ce;background:linear-gradient(#ffe9f1,#ffd6e6);color:#c05a80}
body.girl .empty-tip{color:#c08aa0}
body.girl #composer{background:linear-gradient(transparent,rgba(253,242,246,.95))}
body.girl .input-note{background:#fff;border:2px solid #ffd6e6;border-radius:14px;box-shadow:0 2px 8px rgba(220,140,170,.25)}
body.girl #sendStamp{border:2px solid #f3a8c2;background:radial-gradient(circle at 35% 30%,#fff0f5,#ffd6e6);color:#d86a92;border-radius:50%}
body.girl #drawer{background:linear-gradient(160deg,#ffe9f1,#ffd6e6);border-right:1px solid #f3b8ce}

/* ========== 报纸 ========== */
body.news{
  background-color:#e8e2d0;
  background-image:
    linear-gradient(rgba(120,110,80,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,110,80,.04) 1px, transparent 1px);
  background-size:100% 26px, 26px 100%;
  color:#2a2a26;
}
body.news .topbar{background:#ece6d4;border-bottom:3px double #2a2a26;box-shadow:none}
body.news .names span{color:#2a2a26;font-weight:700;letter-spacing:1px}
body.news .page{background:#e8e2d0}
body.news .page-head{background:#ece6d4;border-bottom:3px double #2a2a26}
body.news .page-head h2,body.news .page-head .back{color:#2a2a26;font-family:"FangSong",serif;letter-spacing:2px}
body.news .drawer-item{color:#2a2a26;font-family:"FangSong",serif}
body.news #drawer{background:#ece6d4;border-right:3px double #2a2a26}
body.news .set-group,body.news .card-item{background:#f2ecda;border:1px solid #6a6350}
body.news .tool{border:1px solid #6a6350;background:#f2ecda}
body.news .mini-btn{border:1px solid #6a6350;background:#f2ecda;color:#2a2a26}
body.news .save-btn{border:1px solid #6a6350;background:#f2ecda;color:#2a2a26;font-family:"FangSong",serif}
body.news .empty-tip{color:#6a6350}
body.news #composer{background:#e8e2d0;border-top:3px double #2a2a26}
body.news .input-note{background:#f2ecda;border:1px solid #6a6350;border-radius:0;box-shadow:none}
body.news #msgInput{color:#2a2a26}
body.news #sendStamp{border:2px solid #2a2a26;background:#f2ecda;color:#2a2a26;border-radius:0;font-family:"FangSong",serif;transform:none}

/* ========== 顶栏 ========== */
.topbar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  padding:8px 0 calc(6px + env(safe-area-inset-top));
  position:relative;z-index:5;
}
.avatar-wrap{display:flex;flex-direction:column;align-items:center}
.avatar-group{position:relative;width:72px;height:44px}
.av-her{
  position:absolute;left:0;top:0;
  width:44px;height:44px;border-radius:10px;
  background:#fff;border:1px solid #cbb98f;
  background-size:cover;background-position:center;
  box-shadow:1px 2px 5px rgba(120,95,50,.2);
}
.av-me{
  position:absolute;left:44px;bottom:0;
  width:28px;height:28px;border-radius:7px;
  background:#fff;border:1px solid #cbb98f;
  background-size:cover;background-position:center;
  box-shadow:1px 2px 4px rgba(120,95,50,.2);
}
.names{
  display:flex;justify-content:space-between;
  width:72px;margin-top:5px;font-size:12px;
}
.names span:first-child{text-align:left;max-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names span:last-child{text-align:right;max-width:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.comic .av-her,body.comic .av-me{border:2px solid #111;border-radius:4px}
body.girl .av-her,body.girl .av-me{border:2px solid #f3b8ce;border-radius:12px}
body.news .av-her,body.news .av-me{border:2px solid #2a2a26;border-radius:0}

/* ========== 消息区 ========== */
#stream{flex:1 1 auto;overflow-y:auto;padding:28px 16px 30px;position:relative;-webkit-overflow-scrolling:touch}
.note{
  position:relative;max-width:72%;padding:14px 16px;margin:22px 0;
  font-size:16px;line-height:1.6;word-break:break-word;white-space:pre-wrap;
}
/* 你的：右对齐 */
.note.me{
  background:#fdf3c8;border:1px solid #e2cf8a;border-radius:3px;
  box-shadow:2px 3px 8px rgba(120,95,50,.18);
  margin-left:auto;margin-right:8px;color:#5a4a2e;
}
body.retro .note.me::after{
  content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:46px;height:14px;background:rgba(200,180,130,.55);
  border-left:1px dashed rgba(255,255,255,.6);border-right:1px dashed rgba(255,255,255,.6);
}
/* 祂的：左对齐 */
.note.her{
  background:#fbf7ec;border:1px solid #d8cba8;border-radius:2px;
  box-shadow:2px 3px 8px rgba(120,95,50,.15);
  margin-right:auto;margin-left:8px;color:#4a3b2a;
  background-image:repeating-linear-gradient(transparent 0 27px, rgba(150,130,95,.25) 27px 28px);
  background-position:0 10px;
}
/* 漫画 */
body.comic .note.me,body.comic .note.her{background-image:none;border:3px solid #111;border-radius:4px;box-shadow:none}
/* 少女 */
body.girl .note.me{
  background:#fff;border:2px solid #ffd6e6;border-radius:16px;
  box-shadow:0 3px 10px rgba(220,140,170,.28);color:#a04a6a;
}
body.girl .note.me::after{
  content:"♥";position:absolute;top:-10px;left:-6px;
  color:#f38bb0;font-size:16px;
}
body.girl .note.her{
  background:#f6f0ff;border:2px solid #ddd0f5;border-radius:16px;
  box-shadow:0 3px 10px rgba(180,150,220,.25);color:#6a5a8a;background-image:none;
}
body.girl .note.her::after{
  content:"♥";position:absolute;top:-10px;right:-6px;
  color:#c0a8e8;font-size:16px;
}
/* 报纸 */
body.news .note.me{
  background:#f2ecda;border:1px solid #6a6350;border-radius:0;
  box-shadow:none;color:#2a2a26;font-family:"FangSong","STFangsong",serif;
  border-left:4px solid #2a2a26;
}
body.news .note.her{
  background:#f2ecda;border:1px solid #6a6350;border-radius:0;
  box-shadow:none;color:#2a2a26;font-family:"FangSong","STFangsong",serif;
  background-image:none;border-right:4px solid #2a2a26;
}

/* 时间戳 */
.stamp{
  position:absolute;bottom:-12px;right:8px;font-size:10px;color:#a08a5f;
  border:1px solid #c8b68a;border-radius:50%;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);
  opacity:.7;background:rgba(255,255,255,.35);padding:2px;text-align:center;line-height:1.1;
}
body.comic .stamp{border:2px solid #111;border-radius:3px;width:auto;height:auto;padding:1px 4px;transform:none;font-size:9px;color:#111;background:#fff}
body.girl .stamp{border:1px solid #f3b8ce;border-radius:10px;width:auto;height:auto;padding:1px 5px;transform:none;font-size:9px;color:#c05a80;background:#fff}
body.news .stamp{border:none;border-top:1px solid #6a6350;border-bottom:1px solid #6a6350;border-radius:0;width:auto;height:auto;padding:1px 4px;transform:none;font-size:9px;color:#2a2a26;background:transparent;font-family:"FangSong",serif}

/* 等待 */
.waiting{
  max-width:72%;margin:22px auto 22px 8px;padding:16px 14px;
  background:repeating-linear-gradient(45deg,#f4ecd6 0 8px,#efe6cc 8px 16px);
  border:1px dashed #c9b98f;border-radius:3px;color:#a08a5f;font-size:14px;text-align:center;
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
body.girl .waiting{background:#fff0f5;border:2px dashed #f3b8ce;color:#c05a80;border-radius:14px}
body.news .waiting{background:#f2ecda;border:1px dashed #6a6350;color:#6a6350;border-radius:0}

/* 系统提示 */
.sys{
  text-align:center;font-size:12.5px;color:#9a865e;margin:16px auto;padding:6px 12px;
  background:rgba(255,250,235,.6);border:1px dashed #c9b98f;border-radius:4px;max-width:80%;
}
body.comic .sys{background:#fff;border:2px dashed #111;color:#111}
body.girl .sys{background:#fff;border:2px dashed #f3b8ce;color:#c05a80}
body.news .sys{background:#f2ecda;border:1px dashed #6a6350;color:#2a2a26}

/* ========== 底部输入 ========== */
#composer{flex:0 0 auto;padding:8px 12px calc(10px + env(safe-area-inset-bottom));position:relative}
body.retro #composer{background:linear-gradient(transparent,rgba(232,220,192,.9))}
body.comic #composer{background:#fff;border-top:3px solid #111}
.input-note{
  position:relative;background:#fdf3c8;border:1px solid #e2cf8a;border-radius:3px;
  box-shadow:2px 3px 10px rgba(120,95,50,.2);padding:10px 56px 10px 12px;
}
body.comic .input-note{background:#fff;border:3px solid #111;border-radius:4px}
#msgInput{
  width:100%;border:none;outline:none;background:transparent;font-family:inherit;
  font-size:16px;color:#5a4a2e;resize:none;max-height:120px;line-height:1.4;
}
body.comic #msgInput{color:#111}
#msgInput::placeholder{color:#bca878}
#sendStamp{
  position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;
  border:2px solid #b89b5e;background:radial-gradient(circle at 35% 30%,#f7ecd0,#e6d3a4);
  color:#8a6f3c;font-family:inherit;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(120,95,50,.3);transform:rotate(-8deg);
}
#sendStamp:active{transform:rotate(-8deg) scale(.92)}
body.comic #sendStamp{border:3px solid #111;background:#fff;color:#111;border-radius:4px}

/* ========== 侧栏 ========== */
#drawerMask{position:fixed;inset:0;background:rgba(60,45,25,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#drawerMask.on{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;left:0;bottom:0;width:210px;
  background:linear-gradient(160deg,#f3ead2,#e6d9ba);
  border-right:1px solid #c9b98f;box-shadow:4px 0 16px rgba(90,70,40,.25);
  transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  z-index:21;padding-top:calc(30px + env(safe-area-inset-top));
}
#drawer.on{transform:translateX(0)}
body.comic #drawer{background:#fff;border-right:3px solid #111}
.drawer-item{display:flex;align-items:center;gap:12px;padding:16px 20px;font-size:17px;color:#5a4a2e}
.drawer-item:active{background:rgba(180,155,110,.2)}
.drawer-item .ico{font-size:20px}

/* ========== 页面 ========== */
.page{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;overflow:hidden}
body.retro .page{background:linear-gradient(160deg,#efe4c8,#e3d5b4)}
body.comic .page{background:#fff;background-image:radial-gradient(rgba(0,0,0,.13) 1px, transparent 1.4px);background-size:12px 12px}
.page.show{display:flex}
.page-head{
  flex:0 0 auto;height:52px;display:flex;align-items:center;padding:0 14px;
  padding-top:env(safe-area-inset-top);border-bottom:1px solid #cbb98f;background:rgba(243,234,210,.95);
}
body.comic .page-head{border-bottom:3px solid #111;background:#fff}
.page-head .back{font-size:22px;width:36px;color:#6b5334}
body.comic .page-head .back{color:#111}
.page-head h2{flex:1;text-align:center;font-size:18px;color:#6b5334;font-weight:700;margin-right:36px}
body.comic .page-head h2{color:#111}
.page-body{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}

/* ========== 口袋 ========== */
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px dashed #c9b98f;background:rgba(243,234,210,.7)}
body.comic .toolbar{background:#fff;border-bottom:2px dashed #111}
.tool{
  flex:1;min-width:38px;height:40px;border-radius:6px;border:1px solid #cbb98f;
  background:rgba(255,250,235,.8);font-size:17px;
  display:flex;align-items:center;justify-content:center;
}
body.comic .tool{border:2px solid #111;background:#fff}
.tool:active{background:#e6d9ba}
.tool.on{background:#d9c48f;border-color:#a88b4e}

.card-item{
  position:relative;background:#fbf7ec;border:1px solid #d8cba8;border-radius:3px;
  padding:13px 44px 13px 14px;margin-bottom:10px;font-size:15.5px;line-height:1.45;color:#4a3b2a;
  box-shadow:1px 2px 5px rgba(120,95,50,.12);word-break:break-word;white-space:pre-wrap;
}
body.comic .card-item{border:3px solid #111;border-radius:4px;background:#fff;color:#111}
body.girl .card-item{border:2px solid #f3c8d8;border-radius:12px;background:#fff;color:#7a4a5c}
body.news .card-item{border:1px solid #6a6350;border-radius:0;background:#f2ecda;color:#2a2a26}
.card-item.locked{opacity:.42;filter:grayscale(1)}
.card-item .lockbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;border-radius:50%}
.card-item .lockbtn:active{background:rgba(180,155,110,.25)}
.card-item.sel{outline:2px solid #c47a3a;background:#f7ecd0}
.card-item .chk{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:2px solid #c47a3a;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:14px;color:#c47a3a}
.card-item.selmode{padding-left:36px}
.card-item.selmode .chk{display:flex}
.empty-tip{text-align:center;color:#a08a5f;font-size:14px;padding:40px 20px;line-height:1.8}
body.comic .empty-tip{color:#111}

/* ========== 添加页 ========== */
#addArea{
  flex:1;width:100%;border:1px solid #d8cba8;border-radius:3px;background:#fbf7ec;
  background-image:repeating-linear-gradient(transparent 0 29px,rgba(150,130,95,.2) 29px 30px);
  background-position:0 12px;padding:14px;font-family:inherit;font-size:16px;line-height:30px;color:#4a3b2a;
  outline:none;resize:none;
}
body.comic #addArea{border:3px solid #111;border-radius:4px;background:#fff;background-image:none;color:#111}
body.girl #addArea{border:2px solid #ffd6e6;border-radius:14px;background:#fff;background-image:none;color:#7a4a5c}
body.news #addArea{border:1px solid #6a6350;border-radius:0;background:#f2ecda;background-image:none;color:#2a2a26;font-family:"FangSong",serif}
#addArea::placeholder{color:#bca878}
.save-btn{width:100%;margin-top:14px;height:48px;border-radius:6px;border:1px solid #b89b5e;background:linear-gradient(#f7ecd0,#e6d3a4);font-family:inherit;font-size:17px;font-weight:700;color:#7a5f30}
body.comic .save-btn{border:3px solid #111;background:#fff;color:#111;border-radius:4px}
.save-btn:active{filter:brightness(.95)}

/* ========== 设置 ========== */
.set-group{background:#fbf7ec;border:1px solid #d8cba8;border-radius:3px;padding:14px;margin-bottom:14px}
body.comic .set-group{border:3px solid #111;border-radius:4px;background:#fff}
body.girl .set-group{border:2px solid #f3c8d8;border-radius:12px;background:#fff}
body.news .set-group{border:1px solid #6a6350;border-radius:0;background:#f2ecda}
.set-group h3{font-size:14px;color:#a08a5f;margin-bottom:10px;font-weight:400}
body.comic .set-group h3{color:#111;font-weight:700}
body.girl .set-group h3{color:#c05a80}
body.news .set-group h3{color:#2a2a26}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:15.5px}
.set-row input[type=number]{width:64px;height:34px;text-align:center;font-family:inherit;font-size:15px;border:1px solid #cbb98f;border-radius:4px;background:#fffaf0;color:#5a4a2e;outline:none}
.set-row input[type=text]{width:110px;height:34px;text-align:center;font-family:inherit;font-size:15px;border:1px solid #cbb98f;border-radius:4px;background:#fffaf0;color:#5a4a2e;outline:none}
body.comic .set-row input{border:2px solid #111;background:#fff;color:#111}
body.girl .set-row input{border:2px solid #ffd6e6;background:#fff;color:#7a4a5c}
body.news .set-row input{border:1px solid #6a6350;background:#f2ecda;color:#2a2a26}
.style-opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.style-opt{flex:1;min-width:44%;height:56px;border:1px solid #cbb98f;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px}
body.comic .style-opt{border:2px solid #111;background:#fff}
body.girl .style-opt{border:2px solid #f3c8d8;background:#fff;color:#7a4a5c;border-radius:12px}
body.news .style-opt{border:1px solid #6a6350;background:#f2ecda;color:#2a2a26;border-radius:0}
.style-opt.on{border:2px solid #c47a3a;background:#f7ecd0;font-weight:700}
body.comic .style-opt.on{border:3px solid #111;background:#eee}
body.girl .style-opt.on{border:2px solid #f38bb0;background:#ffe9f1}
body.news .style-opt.on{border:2px solid #2a2a26;background:#ddd6c0}
.mini-btn{font-family:inherit;font-size:14px;padding:5px 10px;margin-left:6px;border:1px solid #cbb98f;border-radius:5px;background:#fffaf0;color:#6b5334}
.mini-btn:active{background:#e6d9ba}
body.comic .mini-btn{border:2px solid #111;background:#fff;color:#111}
.btn-danger{width:100%;height:46px;border-radius:6px;border:1px solid #c47a3a;background:#f7e0d0;color:#a5401a;font-family:inherit;font-size:16px;font-weight:700}
body.comic .btn-danger{border:3px solid #111;background:#fff;color:#111;border-radius:4px}
body.girl .btn-danger{border:2px solid #f38bb0;background:#ffe9f1;color:#c05a80;border-radius:12px}
body.news .btn-danger{border:1px solid #6a6350;background:#f2ecda;color:#2a2a26;border-radius:0}
.btn-danger:active{filter:brightness(.95)}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(90,70,40,.92);color:#fdf3c8;font-size:14px;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="retro">
<div id="app">
  <div class="topbar">
    <div class="avatar-wrap">
      <div class="avatar-group">
        <div class="av-her" id="avHer"></div>
        <div class="av-me" id="avMe"></div>
      </div>
      <div class="names"><span id="nameHer">祂</span><span id="nameMe">我</span></div>
    </div>
  </div>
  <div id="stream"></div>
  <div id="composer">
    <div class="input-note">
      <textarea id="msgInput" rows="1" placeholder="想对祂说的话…"></textarea>
      <button id="sendStamp">贴</button>
    </div>
  </div>
</div>

<div id="drawerMask"></div>
<div id="drawer">
  <div class="drawer-item" data-go="pocket"><span class="ico">🗄️</span>口袋</div>
  <div class="drawer-item" data-go="settings"><span class="ico">⚙️</span>设置</div>
</div>

<div class="page" id="page-pocket">
  <div class="page-head"><div class="back" data-back>←</div><h2>口袋</h2></div>
  <div class="toolbar" id="pocketTools">
    <div class="tool" data-t="search">🔍</div>
    <div class="tool" data-t="add">➕</div>
    <div class="tool" data-t="dedup">⧉</div>
    <div class="tool" data-t="import">⬇</div>
    <div class="tool" data-t="export">⬆</div>
    <div class="tool" data-t="del">🗑</div>
    <div class="tool" data-t="lockall">🔒</div>
  </div>
  <div class="page-body" id="pocketList"></div>
</div>

<div class="page" id="page-add">
  <div class="page-head"><div class="back" data-back>←</div><h2>添加字卡</h2></div>
  <div class="page-body" style="display:flex;flex-direction:column">
    <textarea id="addArea" placeholder="祂会用这些字卡回复你哦…"></textarea>
    <button class="save-btn" id="saveCards">放进口袋</button>
  </div>
</div>

<div class="page" id="page-settings">
  <div class="page-head"><div class="back" data-back>←</div><h2>设置</h2></div>
  <div class="page-body">
    <div class="set-group">
      <h3>头像</h3>
      <div class="set-row"><span>祂的头像</span>
        <span><button class="mini-btn" data-av="her">上传</button>
        <button class="mini-btn" data-avclear="her">清除</button></span></div>
      <div class="set-row"><span>我的头像</span>
        <span><button class="mini-btn" data-av="me">上传</button>
        <button class="mini-btn" data-avclear="me">清除</button></span></div>
    </div>
    <div class="set-group">
      <h3>称呼</h3>
      <div class="set-row"><span>祂的称呼</span><input type="text" id="nameHerIn" value="祂"></div>
      <div class="set-row"><span>我的称呼</span><input type="text" id="nameMeIn" value="我"></div>
    </div>
    <div class="set-group">
      <h3>祂回复</h3>
      <div class="set-row"><span>延迟（秒）</span>
        <span><input type="number" id="dMin" min="0"> ～ <input type="number" id="dMax" min="0"></span></div>
      <div class="set-row"><span>字卡间隔（秒）</span>
        <span><input type="number" id="gMin" min="0"> ～ <input type="number" id="gMax" min="0"></span></div>
    </div>
    <div class="set-group">
      <h3>风格</h3>
      <div class="style-opts">
        <div class="style-opt" data-style="retro">复古手帐信</div>
        <div class="style-opt" data-style="comic">漫画风</div>
        <div class="style-opt" data-style="girl">少女手帐</div>
        <div class="style-opt" data-style="news">报纸</div>
      </div>
    </div>
    <div class="set-group">
      <h3>数据</h3>
      <button class="btn-danger" id="clearMsgs">清空聊天记录</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept=".json,.txt" style="display:none">

<script>
/* ===== OPFS ===== */
const FS = {
  dir:null,
  async init(){
    try{
      const root = await navigator.storage.getDirectory();
      this.dir = await root.getDirectoryHandle('ayu_aliang',{create:true});
      return true;
    }catch(e){ this.dir=null; return false; }
  },
  async read(name,def){
    try{
      if(this.dir){
        const fh=await this.dir.getFileHandle(name);
        const f=await fh.getFile();
        const t=await f.text();
        return t?JSON.parse(t):def;
      }else{
        const t=localStorage.getItem('ayu_'+name);
        return t?JSON.parse(t):def;
      }
    }catch(e){ return def; }
  },
  async write(name,obj){
    const t=JSON.stringify(obj);
    try{
      if(this.dir){
        const fh=await this.dir.getFileHandle(name,{create:true});
        const w=await fh.createWritable();
        await w.write(t); await w.close();
      }else{
        localStorage.setItem('ayu_'+name,t);
      }
    }catch(e){}
  }
};

let cards=[], messages=[];
let settings={ dMin:30,dMax:60,gMin:5,gMax:8,style:'retro',
               avatarHer:null,avatarMe:null,nameHer:'祂',nameMe:'我' };

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const saveCards=()=>FS.write('cards.json',{cards});
const saveMsgs =()=>FS.write('messages.json',{messages});
const saveSet  =()=>FS.write('settings.json',settings);

const $=s=>document.querySelector(s);
const stream=$('#stream'), drawer=$('#drawer'), mask=$('#drawerMask');

let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'),2000);
}

function applyProfile(){
  $('#avHer').style.backgroundImage=settings.avatarHer?`url(${settings.avatarHer})`:'none';
  $('#avMe').style.backgroundImage =settings.avatarMe ?`url(${settings.avatarMe})` :'none';
  $('#nameHer').textContent=settings.nameHer||'祂';
  $('#nameMe').textContent =settings.nameMe ||'我';
}

function fmtTime(ts){
  const d=new Date(ts);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
}
function makeNote(m){
  const el=document.createElement('div');
  el.className='note '+(m.from==='me'?'me':'her');
  el.textContent=m.text;
  const st=document.createElement('div');
  st.className='stamp'; st.textContent=fmtTime(m.time);
  el.appendChild(st);
  return el;
}
function renderMessages(){
  stream.innerHTML='';
  messages.forEach(m=>stream.appendChild(makeNote(m)));
  scrollBottom();
}
function scrollBottom(){ requestAnimationFrame(()=>stream.scrollTop=stream.scrollHeight); }
function appendMessage(m,save){
  messages.push(m);
  if(save!==false) saveMsgs();
  stream.appendChild(makeNote(m));
  scrollBottom();
}
function showWaiting(){
  const el=document.createElement('div');
  el.className='waiting'; el.id='waitingNote'; el.textContent='祂正在写…';
  stream.appendChild(el); scrollBottom();
}
function hideWaiting(){ const w=document.getElementById('waitingNote'); if(w) w.remove(); }
function showSystem(text){
  const el=document.createElement('div');
  el.className='sys'; el.dataset.sys='1'; el.textContent=text;
  stream.appendChild(el); scrollBottom();
}
function removeEmptyTip(){ stream.querySelectorAll('[data-sys="1"]').forEach(n=>n.remove()); }

let pendingReply=false;
function sendMessage(){
  const input=$('#msgInput');
  const text=input.value.trim();
  if(!text) return;
  appendMessage({id:uid(),from:'me',text,time:Date.now()});
  input.value=''; input.style.height='auto';
  triggerReply();
}
function triggerReply(){
  const avail=cards.filter(c=>!c.locked);
  if(avail.length===0) return;
  if(pendingReply) return;
  pendingReply=true;
  const delay=rand(settings.dMin,settings.dMax)*1000;
  setTimeout(async ()=>{
    pendingReply=false;
    const n=randInt(1,3);
    const pool=cards.filter(c=>!c.locked);
    for(let i=0;i<n;i++){
      if(pool.length===0) break;
      const pick=pool[randInt(0,pool.length-1)];
      appendMessage({id:uid(),from:'her',text:pick.text,time:Date.now()});
      if(i<n-1) await new Promise(r=>setTimeout(r, rand(settings.gMin,settings.gMax)*1000));
    }
  }, delay);
}

$('#msgInput').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
});
$('#sendStamp').addEventListener('click',sendMessage);

function openDrawer(){ drawer.classList.add('on'); mask.classList.add('on'); }
function closeDrawer(){ drawer.classList.remove('on'); mask.classList.remove('on'); }
mask.addEventListener('click',closeDrawer);
let sx=0,sy=0,edge=false;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('textarea,input')){edge=false;return;}
  const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
  edge=sx<28 && !drawer.classList.contains('on');
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!edge) return;
  const t=e.touches[0];
  const dx=t.clientX-sx, dy=Math.abs(t.clientY-sy);
  if(dx>40 && dy<40){ openDrawer(); edge=false; }
},{passive:true});
drawer.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
drawer.addEventListener('touchmove',e=>{
  if(e.touches[0].clientX-sx<-40) closeDrawer();
},{passive:true});

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  $('#'+id).classList.add('show');
}
function hidePages(){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('show')); }
document.querySelectorAll('[data-go]').forEach(el=>{
  el.addEventListener('click',()=>{
    const go=el.dataset.go; closeDrawer();
    if(go==='pocket'){ renderPocket(); showPage('page-pocket'); }
    if(go==='settings'){ renderSettings(); showPage('page-settings'); }
  });
});
document.querySelectorAll('[data-back]').forEach(el=>{
  el.addEventListener('click',()=>{
    if($('#page-add').classList.contains('show')){
      if($('#addArea').value.trim()){
        if(!confirm('还没放进口袋，确定离开吗？')) return;
        $('#addArea').value='';
      }
    }
    hidePages();
  });
});

let selMode=false, selSet=new Set(), searchKw='';
function renderPocket(){
  const list=$('#pocketList');
  list.innerHTML='';
  let arr=cards.slice();
  if(searchKw) arr=arr.filter(c=>c.text.includes(searchKw));
  if(arr.length===0){
    list.innerHTML='<div class="empty-tip">'+(searchKw?'没找到匹配的字卡':'口袋里还没有字卡<br>点 ➕ 给祂放几张吧')+'</div>';
    return;
  }
  arr.forEach(c=>{
    const el=document.createElement('div');
    el.className='card-item'+(c.locked?' locked':'')+(selMode?' selmode':'')+(selSet.has(c.id)?' sel':'');
    el.textContent=c.text;
    const chk=document.createElement('div');
    chk.className='chk'; chk.textContent=selSet.has(c.id)?'✓':'';
    el.appendChild(chk);
    const lb=document.createElement('div');
    lb.className='lockbtn'; lb.textContent=c.locked?'🔒':'🔓';
    lb.addEventListener('click',ev=>{ev.stopPropagation();toggleLock(c.id);});
    el.appendChild(lb);
    el.addEventListener('click',()=>{
      if(selMode){
        if(selSet.has(c.id)) selSet.delete(c.id); else selSet.add(c.id);
        renderPocket();
      }else{ editCard(c.id); }
    });
    list.appendChild(el);
  });
}
function toggleLock(id){
  const c=cards.find(x=>x.id===id); if(!c) return;
  c.locked=!c.locked; saveCards(); renderPocket();
}
function editCard(id){
  const c=cards.find(x=>x.id===id); if(!c) return;
  $('#addArea').value=c.text;
  $('#addArea').dataset.editing=id;
  showPage('page-add');
}
function dedup(){
  const seen=new Set(); const kept=[];
  cards.forEach(c=>{ if(seen.has(c.text)) return; seen.add(c.text); kept.push(c); });
  const removed=cards.length-kept.length;
  if(removed===0){ toast('没有重复的字卡'); return; }
  if(confirm('发现 '+removed+' 张重复，保留最早的，删除其余？')){
    cards=kept; saveCards(); renderPocket(); toast('已删除 '+removed+' 张重复字卡');
  }
}
$('#pocketTools').addEventListener('click',e=>{
  const t=e.target.closest('.tool'); if(!t) return;
  const act=t.dataset.t;
  if(act==='search'){
    const kw=prompt('搜索字卡',searchKw);
    if(kw!==null){ searchKw=kw.trim(); renderPocket(); }
  }
  else if(act==='add'){
    $('#addArea').value=''; delete $('#addArea').dataset.editing;
    showPage('page-add');
  }
  else if(act==='dedup'){ dedup(); }
  else if(act==='import'){ $('#fileInput').click(); }
  else if(act==='export'){ exportCards(); }
  else if(act==='del'){
    if(!selMode){
      selMode=true; selSet.clear(); t.classList.add('on'); t.textContent='✓';
      renderPocket(); toast('选择要删除的字卡，再点 ✓');
    }else{
      if(selSet.size===0){ toast('还没选字卡'); return; }
      if(confirm('删除选中的 '+selSet.size+' 张字卡？')){
        cards=cards.filter(c=>!selSet.has(c.id));
        saveCards(); selMode=false; selSet.clear();
        t.classList.remove('on'); t.textContent='🗑';
        renderPocket(); toast('已删除');
      }
    }
  }
  else if(act==='lockall'){ toast('点每张字卡右侧的锁，可单独上锁'); }
});

$('#fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text();
  let incoming=[];
  const name=f.name.toLowerCase();
  try{
    if(name.endsWith('.json')||text.trim().startsWith('{')){
      const obj=JSON.parse(text);
      const arr=Array.isArray(obj)?obj:(obj.cards||[]);
      incoming=arr.map(x=>typeof x==='string'?x:(x.text||'')).filter(Boolean);
    }else{
      incoming=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    }
  }catch(err){ toast('文件格式无法识别'); e.target.value=''; return; }
  const exist=new Set(cards.map(c=>c.text));
  let added=0,skipped=0;
  incoming.forEach(txt=>{
    if(exist.has(txt)){ skipped++; return; }
    cards.push({id:uid(),text:txt,locked:false}); exist.add(txt); added++;
  });
  if(added) await saveCards();
  renderPocket();
  removeEmptyTip();
  toast('导入 '+added+' 张，跳过 '+skipped+' 张重复');
  e.target.value='';
});

async function exportCards(){
  const fmt=prompt('导出格式：输入 1 = JSON，2 = TXT','1');
  if(fmt!=='1'&&fmt!=='2') return;
  const out=cards.filter(c=>!c.locked);
  let data,fname,type;
  if(fmt==='1'){
    data=JSON.stringify({cards:out.map(c=>({text:c.text}))},null,2);
    fname='阿遇♡阿凉字卡.json'; type='application/json';
  }else{
    data=out.map(c=>c.text).join('\n');
    fname='阿遇♡阿凉字卡.txt'; type='text/plain';
  }
  const blob=new Blob([data],{type});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('已导出 '+out.length+' 张字卡');
}

$('#saveCards').addEventListener('click',async ()=>{
  const area=$('#addArea');
  const editingId=area.dataset.editing;
  const lines=area.value.split(/\r?\n/).map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim());
  if(lines.length===0){ toast('还没写呢'); return; }
  if(editingId){
    const c=cards.find(x=>x.id===editingId);
    if(c){ c.text=area.value.trim(); await saveCards(); }
    delete area.dataset.editing;
    area.value=''; toast('已放进口袋');
  }else{
    for(const line of lines) cards.push({id:uid(),text:line,locked:false});
    await saveCards();
    area.value=''; toast('放进了 '+lines.length+' 张字卡');
  }
  removeEmptyTip();
});

function renderSettings(){
  $('#dMin').value=settings.dMin; $('#dMax').value=settings.dMax;
  $('#gMin').value=settings.gMin; $('#gMax').value=settings.gMax;
  $('#nameHerIn').value=settings.nameHer||'祂';
  $('#nameMeIn').value=settings.nameMe||'我';
  document.querySelectorAll('.style-opt').forEach(o=>{
    o.classList.toggle('on',o.dataset.style===settings.style);
  });
}
function bindNum(id,key){
  $('#'+id).addEventListener('change',e=>{
    let v=parseInt(e.target.value)||0; if(v<0) v=0;
    settings[key]=v; saveSet();
  });
}
bindNum('dMin','dMin'); bindNum('dMax','dMax');
bindNum('gMin','gMin'); bindNum('gMax','gMax');
$('#nameHerIn').addEventListener('input',e=>{settings.nameHer=e.target.value||'祂';saveSet();applyProfile();});
$('#nameMeIn').addEventListener('input',e=>{settings.nameMe =e.target.value||'我';saveSet();applyProfile();});
document.querySelectorAll('.style-opt').forEach(o=>{
  o.addEventListener('click',()=>{
    settings.style=o.dataset.style;
    document.body.className=settings.style;
    saveSet(); renderSettings();
  });
});
$('#clearMsgs').addEventListener('click',()=>{
  if(confirm('清空所有聊天记录？此操作不可恢复')){
    messages=[]; saveMsgs(); renderMessages(); toast('已清空');
  }
});

let avTarget=null;
const avFile=document.createElement('input');
avFile.type='file'; avFile.accept='image/*'; avFile.style.display='none';
document.body.appendChild(avFile);
document.querySelectorAll('[data-av]').forEach(b=>{
  b.addEventListener('click',()=>{ avTarget=b.dataset.av; avFile.click(); });
});
document.querySelectorAll('[data-avclear]').forEach(b=>{
  b.addEventListener('click',()=>{
    const k=b.dataset.avclear;
    if(k==='her') settings.avatarHer=null; else settings.avatarMe=null;
    saveSet(); applyProfile();
  });
});
avFile.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f||!avTarget) return;
  const r=new FileReader();
  r.onload=()=>{
    if(avTarget==='her') settings.avatarHer=r.result;
    else settings.avatarMe=r.result;
    saveSet(); applyProfile(); toast('已更换头像');
  };
  r.readAsDataURL(f); e.target.value='';
});

async function boot(){
  await FS.init();
  const c=await FS.read('cards.json',{cards:[]});
  const m=await FS.read('messages.json',{messages:[]});
  const s=await FS.read('settings.json',null);
  cards=c.cards||[];
  messages=m.messages||[];
  if(s) settings=Object.assign(settings,s);
  document.body.className=settings.style||'retro';
  applyProfile();
  renderMessages();
  if(cards.length===0) showSystem('口袋里还没有字卡，去给祂放几张吧');
}
boot();
</script>
</body>
</html>
