<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf2f5">
<title>阿遇♥阿凉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 15px; color: var(--text); background: var(--bg-base);
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; font-family: inherit; }
button { border: none; background: none; color: inherit; font-family: inherit; cursor: pointer; }
ul, li { list-style: none; }

:root, [data-theme="rose-glass"] {
  --bg-base: #fdf2f5; --bg-grad-1: #fef6f8; --bg-grad-2: #fdf2f5; --bg-grad-3: #fbeef2;
  --glass-bg: rgba(255,255,255,0.45); --glass-bg-strong: rgba(255,255,255,0.65);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(230,180,200,0.18);
  --bubble-me: #f5c8d5; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #f0b8c8; --accent-deep: #e8a0b5; --accent-soft: rgba(240,184,200,0.28);
  --heart-red: #e8536f; --check-green: #6fbf8f; --danger: #d9536a;
  --time-text: #a8a8a8; --mask: rgba(240,184,200,0.3);
  --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}
[data-theme="sakura-glass"] {

}
[data-theme="mint-ice"] {

[data-theme="cream-light"] {

[data-theme="blue-crystal"] {

}
[data-theme="purple-mist"] {

  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #c8b0e4; --accent-deep: #b89cd8; --accent-soft: rgba(200,176,228,0.28);
  --time-text: #a8a8a8; --mask: rgba(200,176,228,0.3); --progress: var(--accent-deep);

[data-theme="cold-glass"] {
  --bg-base: #eff5f9; --bg-grad-1: #f5f9fc; --bg-grad-2: #eff5f9; --bg-grad-3: #e6eef4;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);

  --glass-shadow: rgba(175,205,225,0.2);
  --bubble-me: #c8dce8; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #b4cede; --accent-deep: #9cbcd0; --accent-soft: rgba(180,206,222,0.28);
  --time-text: #a8a8a8; --mask: rgba(180,206,222,0.3); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}
[data-theme="warm-glass"] {
  --bg-base: #faf4ec; --bg-grad-1: #fdf8f2; --bg-grad-2: #faf4ec; --bg-grad-3: #f5ede1;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(220,195,165,0.18);
  --bubble-me: #ead8c0; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #e0c8a8; --accent-deep: #d4b890; --accent-soft: rgba(224,200,168,0.3);
  --time-text: #a8a8a8; --mask: rgba(224,200,168,0.32); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}
[data-theme="night-glass"] {
  --bg-base: #1a1824; --bg-grad-1: #201d2c; --bg-grad-2: #1a1824; --bg-grad-3: #14121c;
  --glass-bg: rgba(255,255,255,0.08); --glass-bg-strong: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.18); --glass-highlight: rgba(255,255,255,0.28);
  --glass-shadow: rgba(0,0,0,0.4);
  --bubble-me: #4a3a48; --bubble-other: rgba(255,255,255,0.1);
  --text: #e8e8e8; --text-soft: #a8a8a8; --text-faint: #808080;
  --accent: #8a6a80; --accent-deep: #a07a94; --accent-soft: rgba(138,106,128,0.3);
  --heart-red: #ff5f7e; --time-text: #8a8a8a; --mask: rgba(0,0,0,0.5);
  --progress: #e893a8;
  --his-bg: rgba(120,170,220,0.35); --my-bg: rgba(220,130,170,0.35);
}
[data-theme="purple-glass"] {
  --bg-base: #f5effc; --bg-grad-1: #faf6fe; --bg-grad-2: #f5effc; --bg-grad-3: #efe6f9;
  --glass-bg: rgba(255,255,255,0.46); --glass-bg-strong: rgba(255,255,255,0.66);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(195,170,230,0.2);
  --bubble-me: #d4c0ea; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #c0a8e0; --accent-deep: #b094d6; --accent-soft: rgba(192,168,224,0.28);
  --time-text: #a8a8a8; --mask: rgba(192,168,224,0.3); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}
[data-theme="cyan-glass"] {
  --bg-base: #eff8f6; --bg-grad-1: #f5fbf9; --bg-grad-2: #eff8f6; --bg-grad-3: #e6f3f0;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(165,215,205,0.2);
  --bubble-me: #c0e4dc; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #a8d8cc; --accent-deep: #90ccc0; --accent-soft: rgba(168,216,204,0.28);
  --time-text: #a8a8a8; --mask: rgba(168,216,204,0.3); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 6px 22px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#bg-layer {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2) 55%, var(--bg-grad-3));
  background-size: cover; background-position: center;
  transition: background-image .35s ease;
}
.page { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }
.scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-y::-webkit-scrollbar { width: 0; height: 0; }
.scroll-y { scrollbar-width: none; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 50%; color: var(--text);
  transition: transform .15s ease, background .2s ease;
}
.icon-btn:active { transform: scale(.9); background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; display: block; }

.modal-mask {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: center; justify-content: center;
  background: var(--mask);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 24px;
}
.modal-mask.active { display: flex; }
.modal {
  width: 100%; max-width: 340px; max-height: 78vh;
  border-radius: 22px; padding: 22px 20px;
  display: flex; flex-direction: column;
  animation: modal-in .22s cubic-bezier(.2,.9,.3,1.2);
}
.modal.wide { max-width: 88vw; }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px; color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; margin-bottom: 16px; }
.modal-body::-webkit-scrollbar { width: 0; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal-btn {
  flex: 1; min-width: 96px; padding: 11px 16px; border-radius: 14px;
  font-size: 14.5px; font-weight: 500; color: var(--text);
  background: var(--accent); border: 1px solid var(--glass-border);
  transition: transform .12s ease;
}
.modal-btn:active { transform: scale(.96); }
.modal-btn.danger { color: #fff; background: var(--danger); border-color: rgba(217,83,106,0.4); }
.modal-btn.green { color: #fff; background: var(--check-green); border-color: rgba(111,191,143,0.4); }
.field {
  width: 100%; padding: 12px 14px; border-radius: 14px;
  font-size: 15px; color: var(--text);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  outline: none; resize: none;
}
.field::placeholder { color: var(--text-soft); }
.todo {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 120px; gap: 10px; color: var(--text-soft); font-size: 15px; letter-spacing: 1px;
}
.todo svg { width: 48px; height: 48px; opacity: .5; }
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-btn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 18px 10px; border-radius: 16px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 14px; color: var(--text);
}
.choice-btn svg { width: 26px; height: 26px; color: var(--accent-deep); }
.choice-btn:active { transform: scale(.96); }

.companion-cat {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 15px; color: var(--text);
  margin-bottom: 8px;
  transition: transform .12s ease;
}
.companion-cat:active { transform: scale(.97); }
.companion-cat svg { width: 20px; height: 20px; color: var(--accent-deep); }
.companion-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.companion-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 12px 4px; border-radius: 12px; text-align: center;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  font-size: 12px; color: var(--text); min-height: 54px;
}
.companion-item.active { background: var(--accent); border-color: var(--accent-deep); }

.companion-stat {
  padding: 10px 12px; border-radius: 12px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  font-size: 12.5px; color: var(--text-soft);
  margin-top: 6px;
}

.companion-float {
  position: fixed; z-index: 951;
  left: 50%; transform: translateX(-50%); bottom: 200px;
  width: 180px;
  border-radius: 16px; padding: 10px 12px;
  display: none; flex-direction: column; align-items: center; gap: 6px;
  touch-action: none;
  text-align: center;
}
.companion-float.active { display: flex; }
.companion-float .cf-avatars {
  display: flex; align-items: center; gap: 4px;
}
.companion-float .cf-avatars img {
  width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
  border: 1.2px solid var(--glass-border);
}
.companion-float .cf-heart { color: var(--heart-red); font-size: 14px; }
.companion-float .cf-text { font-size: 12px; color: var(--text); line-height: 1.4; }
.companion-float .cf-time { font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.companion-float .cf-end {
  width: 100%; padding: 7px; border-radius: 10px;
  font-size: 12px; color: var(--text); background: var(--accent);
  border: 1px solid var(--glass-border);
}

.invite-card {
  border: 2px solid var(--accent-deep);
  border-radius: 18px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  padding: 12px 14px;
  min-width: 200px; max-width: 100%;
}
.invite-card .ic-row { display: flex; align-items: center; gap: 10px; }
.invite-card .ic-icon { width: 26px; height: 26px; flex-shrink: 0; color: var(--accent-deep); }
.invite-card .ic-text { flex: 1; font-size: 14.5px; color: var(--text); }
.invite-card .ic-btn {
  display: block; width: 100%; margin-top: 10px;
  padding: 9px; border-radius: 12px;
  font-size: 13.5px; color: var(--text); background: var(--accent);
  border: 1px solid var(--glass-border); text-align: center;
}
.invite-card .ic-hint { margin-top: 8px; font-size: 12.5px; color: var(--text-soft); text-align: center; }

.msg-menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  font-size: 15px; color: var(--text);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  margin-bottom: 8px;
}
.msg-menu-item:last-child { margin-bottom: 0; }
.msg-menu-item.danger { color: var(--danger); }
.msg-menu-item svg { width: 20px; height: 20px; color: var(--accent-deep); }
.msg-menu-item.danger svg { color: var(--danger); }

.dropdown {
  position: absolute; z-index: 1100;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: 14px; padding: 6px;
  display: none; flex-direction: column; gap: 2px;
  box-shadow: 0 6px 22px var(--glass-shadow);
}
.dropdown.active { display: flex; }
.dropdown-item {
  padding: 10px 18px; border-radius: 9px;
  font-size: 14px; color: var(--text); white-space: nowrap;
}
.dropdown-item.active { background: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  color: var(--text); font-size: 13.5px;
  padding: 10px 20px; border-radius: 20px;
  box-shadow: 0 6px 22px var(--glass-shadow);
  z-index: 2000; opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.toast.active { opacity: 1; }

@keyframes heartbeat-line { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
@keyframes heart-beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.15); } 24% { transform: scale(1); } }
@keyframes dot-jump { 0%,60%,100% { transform: translateY(0); opacity:.5; } 30% { transform: translateY(-4px); opacity:1; } }
@keyframes shake {
  0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
}
@keyframes bubble-in { from { opacity:0; transform: translateY(6px) scale(.97); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes num-pop { 0% { transform: scale(1); opacity:1; } 50% { transform: scale(1.25); opacity:.6; } 100% { transform: scale(1); opacity:1; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes pop-up { from { opacity:0; transform: translateY(8px) scale(.95); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes highlight-flash {
  0%, 100% { box-shadow: 0 4px 14px var(--glass-shadow); }
  50% { box-shadow: 0 0 0 3px var(--accent-deep); }
}

.lock-wrap {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: calc(40px + env(safe-area-inset-top)) 24px 40px; text-align: center;
}
.lock-title { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--text); }
.lock-title .heart-char { color: var(--heart-red); }
.lock-time { font-size: 14px; letter-spacing: 1px; color: var(--text-soft); }
.lock-heart-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 0; }

.card-toolbar { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }

.card-list { flex: 1; padding: 4px 12px 20px; display: flex; flex-direction: column; gap: 8px; }

}

  transform: rotate(-45deg) translateY(-1px);
}
.card-text { flex: 1; font-size: 15px; line-height: 1.5; color: var(--text); word-break: break-word; }
.empty-tip {

}

.section-title { font-size: 13.5px; font-weight: 600; color: var(--text-soft); margin: 6px 4px 2px; letter-spacing: .5px; }
.avatar-block {

}

}

.pair-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.unpair-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

.bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

}

.bg-cell.active { border-color: var(--accent-deep); }
.bg-tabs { display: flex; gap: 8px; flex-shrink: 0; }
.bg-tab {

  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);

/* ==================== 互动气泡 ==================== */
.itf-bubble {
  position: relative;
  padding: 14px 18px 16px;
  border-radius: 16px;
  font-size: 15px; line-height: 1.5; word-break: break-word;
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow: 0 4px 14px var(--glass-shadow);
  animation: bubble-in .22s ease;
  margin-bottom: 14px;
  border: 2px solid transparent;
  background-clip: padding-box, border-box;
  background-origin: padding-box, border-box;
}
.itf-bubble .itf-content { font-size: 15.5px; font-weight: 600; line-height: 1.4; word-break: break-word; }
.itf-bubble .itf-tag {
  position: absolute; left: 50%; bottom: 0;
  transform: translate(-50%, 50%);
  padding: 2px 10px; border-radius: 999px;
  font-size: 11px; line-height: 1.5; color: #fff; white-space: nowrap;
  animation: itf-stamp .32s cubic-bezier(.2,.9,.3,1.4);
  box-shadow: 0 2px 6px var(--glass-shadow);
}
.itf-bubble .itf-c1, .itf-bubble .itf-c2, .itf-bubble .itf-c3, .itf-bubble .itf-c4 {
  position: absolute; font-size: 13px; line-height: 1; pointer-events: none;
}
.itf-bubble .itf-c1 { top: 4px; left: 6px; }
.itf-bubble .itf-c2 { top: 4px; right: 6px; }
.itf-bubble .itf-c3 { bottom: 4px; left: 6px; }
.itf-bubble .itf-c4 { bottom: 4px; right: 6px; }
.itf-bubble[data-board="me"] {
  background: linear-gradient(#fde8ef, #fde8ef) padding-box,
              linear-gradient(135deg, #fbc4d6, #f094b4) border-box;
}
.itf-bubble[data-board="me"] .itf-content { color: #c85a7e; }
.itf-bubble[data-board="me"] .itf-tag { background: #f0a8c0; }
.itf-bubble[data-board="other"] {
  background: linear-gradient(#fdeee0, #fdeee0) padding-box,
              linear-gradient(135deg, #fbdcb8, #f0b070) border-box;
}
.itf-bubble[data-board="other"] .itf-content { color: #c08040; }
.itf-bubble[data-board="other"] .itf-tag { background: #f0b888; }
.itf-bubble[data-board="together"] {
  background: linear-gradient(#f0e8fa, #f0e8fa) padding-box,
              linear-gradient(135deg, #dcc8f0, #b090d8) border-box;
}
.itf-bubble[data-board="together"] .itf-content { color: #8f70c0; }
.itf-bubble[data-board="together"] .itf-tag { background: #c0a0e0; }
@keyframes itf-stamp {
  0% { transform: translate(-50%, 50%) scale(.6); opacity: 0; }
  60% { transform: translate(-50%, 50%) scale(1.15); opacity: 1; }
  100% { transform: translate(-50%, 50%) scale(1); opacity: 1; }
}

/* ==================== 新增：贴纸网格 ==================== */
.sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sticker-cell {
  aspect-ratio: 1; border-radius: 12px; overflow: hidden;
  background: var(--glass-bg); border: 1.5px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.sticker-cell img { width: 100%; height: 100%; object-fit: cover; }

/* 贴纸大预览区（添加时） */
.sticker-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.sticker-preview-grid .sticker-cell { aspect-ratio: 1; }

/* ⊕贴纸弹窗：可滚动 */
.sticker-pick-scroll { max-height: 50vh; overflow-y: auto; }
.sticker-pick-scroll::-webkit-scrollbar { width: 0; }

/* 贴纸气泡里（跟图片一样的尺寸） */
.bubble.sticker { padding: 4px; border-radius: 16px; overflow: hidden; line-height: 0; }
.bubble.sticker img { width: 120px; height: auto; max-height: 160px; border-radius: 13px; object-fit: cover; display: block; }

<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dateStamp() { const d = new Date(); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function dayKey(ts) { const d = new Date(ts); return '' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayLabel(key) { const [y, m, d] = key.split('-'); return `${y}年${Number(m)}月${Number(d)}日`; }
function todayKey() { return dayKey(Date.now()); }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fullDate(d) { return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('active');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('active'), 1500);
}
function hms(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}

const Store = {
  root: null,
  async init() { try { this.root = await navigator.storage.getDirectory(); } catch (e) { this.root = null; } },
  async _fh(name, create) { if (!this.root) return null; return await this.root.getFileHandle(name, { create }); },
  async read(name) {
    try {
      if (this.root) {
        const fh = await this._fh(name, false); if (!fh) return null;
        const file = await fh.getFile(); const txt = await file.text();
        return txt ? JSON.parse(txt) : null;
      }
      const raw = localStorage.getItem('ay_' + name);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  async write(name, data) {
    const txt = JSON.stringify(data);
    try {
      if (this.root) {
        const fh = await this._fh(name, true);
        const w = await fh.createWritable(); await w.write(txt); await w.close(); return;
      }
      localStorage.setItem('ay_' + name, txt);
    } catch (e) { try { localStorage.setItem('ay_' + name, txt); } catch (e2) {} }
  }
};

const CacheStore = {
  name: 'ay-media-v1',
  async put(key, blob) { try { const c = await caches.open(this.name); await c.put('/media/' + key, new Response(blob)); } catch (e) {} },
  async get(key) { try { const c = await caches.open(this.name); const r = await c.match('/media/' + key); return r ? await r.blob() : null; } catch (e) { return null; } }
};

/* ==================== 音乐播放器 ==================== */
const Player = {
  audio: null, list: [], idx: 0, mode: 'order', url: null, curSongId: null,
  init() {
    if (this.audio) return;
    this.audio = new Audio();
    this.audio.addEventListener('ended', () => this.onEnded());
    this.audio.addEventListener('play', () => this.updateIcon());
    this.audio.addEventListener('pause', () => this.updateIcon());
  },
  async playSong(song, list) {
    this.init();
    this.list = (list && list.length) ? list : [song];
    this.idx = this.list.findIndex(s => s.id === song.id);
    if (this.idx < 0) this.idx = 0;
    this.curSongId = song.id;
    const blob = await CacheStore.get('song_' + song.id);
    if (!blob) { toast('音频找不到了'); return; }
    if (this.url) { URL.revokeObjectURL(this.url); this.url = null; }
    this.url = URL.createObjectURL(blob);
    this.audio.src = this.url;
    try { await this.audio.play(); } catch (e) {}
    this.showFloat(song);
  },
  onEnded() {
    if (this.mode === 'loop-one') { this.audio.play(); return; }
    if (!this.list.length) return;
    let next;
    if (this.mode === 'shuffle') {
      next = Math.floor(Math.random() * this.list.length);
    } else {
      next = this.idx + 1;
      if (next >= this.list.length) {
        if (this.mode === 'loop') next = 0;
        else { this.updateIcon(); return; }
      }
    }
    this.idx = next;
    this.playSong(this.list[next], this.list);
  },
  toggle() {
    if (!this.audio || !this.audio.src) return;
    if (this.audio.paused) this.audio.play(); else this.audio.pause();
    this.updateIcon();
  },
  prev() {
    if (!this.list.length) return;
    this.idx = (this.idx - 1 + this.list.length) % this.list.length;
    this.playSong(this.list[this.idx], this.list);
  },
  next() {
    if (!this.list.length) return;
    this.idx = (this.idx + 1) % this.list.length;
    this.playSong(this.list[this.idx], this.list);
  },
  showFloat(song) {
    $('#mf-name').textContent = song.name || '';
    $('#mf-artist').textContent = song.artist || '';
    $('#music-float').classList.add('active');
    $('#mf-mode-icon use').setAttribute('href', MODE_ICONS[this.mode]);
    this.updateIcon();
  },
  updateIcon() {
    if (!this.audio) return;
    const icon = $('#mf-pause-icon use');
    if (icon) icon.setAttribute('href', this.audio.paused ? '#i-play' : '#i-pause');
  }
};

const Companion = {
  active: false, type: '', startTime: 0, timer: null, lastLoveMin: 0,
  itfCount: 0, lastSeen: 0,
  start(type) {
    this.active = true;
    this.type = type;
    this.startTime = Date.now();
    this.lastLoveMin = 0;
    this.itfCount = 0;
    this.lastSeen = Date.now();
    State.companionActive = { id: uid(), type, start: this.startTime, lastSeen: this.lastSeen, itfCount: 0 };
    save.companionActive();
    this.showFloat();
    this.tick();
    save.settings();
  },
  tick() {
    if (!this.active) return;
    const now = Date.now();
    const sec = Math.floor((now - this.startTime) / 1000);
    $('#cf-time').textContent = hms(sec);
    const min = Math.floor(sec / 60);
    const should = Math.floor(min / 10);
    if (should > this.lastLoveMin) {
      addLove(should - this.lastLoveMin);
      this.lastLoveMin = should;
    }
    if (now - this.lastSeen >= 5000) {
      this.lastSeen = now;
      if (State.companionActive) {
        State.companionActive.lastSeen = now;
        State.companionActive.itfCount = this.itfCount;
        save.companionActive();
      }
    }
    this.timer = setTimeout(() => this.tick(), 1000);
  },
  showFloat() {
    $('#cf-avatar-other').src = State.settings.avatars.other || defaultAvatar('blue');
    $('#cf-avatar-me').src = State.settings.avatars.me || defaultAvatar('pink');
    $('#cf-text').textContent = '祂在陪你 ' + this.type;
    $('#cf-time').textContent = '00:00:00';
    $('#companion-float').classList.add('active');
  },
  end() {
    if (!this.active) return;
    const endTime = Date.now();
    const dur = Math.floor((endTime - this.startTime) / 1000);
    State.companionStats.push({ id: uid(), type: this.type, start: this.startTime, end: endTime, dur, itfCount: this.itfCount, interrupted: false });
    save.companionStats();
    State.companionActive = null;
    save.companionActive();
    this.active = false;
    this.type = '';
    clearTimeout(this.timer);
    $('#companion-float').classList.remove('active');
  }
};

function checkInterruptedCompanion() {

}

function renderMessages() {
  const body = $('#chat-body'); if (!body) return;
  body.innerHTML = '';
  const total = State.messages.length;
  const start = Math.max(0, total - renderedCount);
  const slice = State.messages.slice(start);
  slice.forEach((m, i) => {
    /* 判断"上一条是不是同一个人"（用于头像开关） */
    let prevSame = false;
    if (i > 0) prevSame = (slice[i - 1].who === m.who);
    else {
      const globalPrev = State.messages[start - 1];
      prevSame = globalPrev ? (globalPrev.who === m.who) : false;
    }
    const row = buildMsgRow(m, prevSame);
    if (archiveMode) {
      row.classList.add('archive-mode');
      if (archiveSelected.has(m.id)) row.classList.add('checked');
      const chk = document.createElement('div'); chk.className = 'msg-check';
      row.insertBefore(chk, row.firstChild);
      row.onclick = () => {
        if (archiveSelected.has(m.id)) archiveSelected.delete(m.id);
        else archiveSelected.add(m.id);
        row.classList.toggle('checked', archiveSelected.has(m.id));
      };
    } else {
      bindLongPress(row, () => openMsgMenu(m));
    }
    body.appendChild(row);
  });

/* ==================== 改动：头像开关 + 贴纸气泡 ==================== */
function buildMsgRow(m, prevSame) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (m.who === 'me' ? 'me' : 'other');
  if (m.id) row.dataset.mid = m.id;
  const av = document.createElement('img');
  av.className = 'msg-avatar';
  av.src = m.who === 'me' ? (State.settings.avatars.me || defaultAvatar('pink')) : (State.settings.avatars.other || defaultAvatar('blue'));
  /* 头像开关：关 → 连续同人只首条显示（其余留空） */
  if (!State.settings.showEveryAvatar && prevSame) av.classList.add('avatar-hidden');
  const col = document.createElement('div'); col.className = 'msg-col';

  if (m.quote) {
    const qb = document.createElement('div'); qb.className = 'quote-block';
    if (m.quote.thumb) qb.innerHTML = `<img class="quote-thumb" src="${m.quote.thumb}"><span class="quote-text">${escapeHTML(m.quote.text || '')}</span>`;
    else qb.innerHTML = `<span class="quote-text">${escapeHTML(m.quote.text || '')}</span>`;
    qb.onclick = () => jumpToMsg(m.quote.id);
    col.appendChild(qb);
  }

  if (m.type === 'card') col.appendChild(buildCard(m));
  else if (m.type === 'quiz') col.appendChild(buildQuizCard(m));
  else if (m.type === 'song') col.appendChild(buildSongCard(m));
  else if (m.type === 'companion') col.appendChild(buildCompanionCard(m));
  else if (m.type === 'itf') col.appendChild(buildItfBubble(m));
  else if (m.type === 'sticker') col.appendChild(buildStickerBubble(m));
  else {
    const b = document.createElement('div'); b.className = 'bubble';
    /* 纯文字气泡：加 message-sent / message-received（供气泡皮肤用） */
    if (m.type === 'img') { b.classList.add('media'); const im = document.createElement('img'); im.src = m.src; b.appendChild(im); }
    else {
      b.classList.add(m.who === 'me' ? 'message-sent' : 'message-received');
      b.textContent = m.text;
    }
    const hm = heartMarkOf(m.id);

/* ==================== doReply（表情 + 主动互动 + 贴纸 + 没字卡 toast） ==================== */
function doReply() {
  const usable = State.cards.filter(c => !c.locked);
  if (State.cards.length === 0) { toast('还没有字卡，祂暂时说不了话'); return; }
  if (usable.length === 0) { toast('字卡都被锁上了，祂说不了话'); return; }
  const quote = maybeOtherQuote();
  const heartMsg = maybeOtherHeart();
  const invite = maybeOtherInvite();
  const compInvite = maybeOtherCompanionInvite();
  const activeItf = maybeActiveInteraction();
  const stickerMsg = maybeOtherSticker();
  const n = 1 + Math.floor(Math.random() * 3);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(usable[Math.floor(Math.random() * usable.length)].text);
  let idx = 0;
  const sendNext = () => {
    if (idx >= picked.length) return;
    let txt = picked[idx];
    if (State.settings.emojiEnabled && Math.random() * 100 < (State.settings.emojiProb || 0)) {
      const e = randomEmoji();
      if (e) txt = (Math.random() < 0.5) ? (e + txt) : (txt + e);
    }
    pushOther(txt, idx === 0 ? quote : null);
    if (idx === 0 && heartMsg) doHeart(heartMsg, 'other');
    idx++;
    if (idx < picked.length) setTimeout(sendNext, getMultiGap() * 1000);
  };
  sendNext();
  if (invite) setTimeout(() => pushOtherSongInvite(invite), 1500);
  if (compInvite) setTimeout(() => pushOtherCompanionInvite(compInvite), 2500);
  if (activeItf) setTimeout(() => pushOtherInteraction(activeItf.content, activeItf.board), 2000);
  if (stickerMsg) setTimeout(() => pushOtherSticker(stickerMsg), 3000);
}
function hasAnyInteraction() {
  return (State.interactions.me.length + State.interactions.other.length + State.interactions.together.length) > 0;
}
function randomEmoji() {
  const all = [];
  for (const k in EMOJI_LIB) { EMOJI_LIB[k].forEach(e => all.push(e)); }
  if (!all.length) return '';
  return all[Math.floor(Math.random() * all.length)];
}
function maybeActiveInteraction() {
  const s = State.settings;
  if (Math.random() * 100 >= (s.itfActiveProb || 0)) return null;
  const boards = [];
  if ((State.interactions.other || []).filter(x => !x.locked).length) boards.push('other');
  if ((State.interactions.together || []).filter(x => !x.locked).length) boards.push('together');
  if (!boards.length) return null;
  const b = boards[Math.floor(Math.random() * boards.length)];
  const pool = State.interactions[b].filter(x => !x.locked);
  const item = pool[Math.floor(Math.random() * pool.length)];
  return { content: item.content, board: b };
}
/* ==================== 新增：祂发贴纸 ==================== */
function maybeOtherSticker() {
  const s = State.settings;
  if (!s.stickerEnabled) return null;
  if (Math.random() * 100 >= (s.stickerProb || 0)) return null;
  if (!State.stickers.length) return null;
  return State.stickers[Math.floor(Math.random() * State.stickers.length)];
}
function maybeOtherQuote() {
  const s = State.settings;
  if (!s.quoteEnabled) return null;
  if (Math.random() * 100 >= (s.quoteProb || 0)) return null;
  const recent = State.messages.slice(-10).filter(m => m.type !== 'card' && m.type !== 'quiz' && m.type !== 'song' && m.type !== 'companion');
  if (!recent.length) return null;
  const pick = recent[Math.floor(Math.random() * recent.length)];
  if (pick.type === 'img') return { id: pick.id, text: '[图片]', thumb: pick.src };
  if (pick.type === 'sticker') return { id: pick.id, text: '[贴纸]', thumb: pick.src };
  if (pick.type === 'itf') return { id: pick.id, text: pick.content || '' };
  return { id: pick.id, text: pick.text || '' };
}
function maybeOtherHeart() {
  const s = State.settings;
  if (!s.heartEnabled) return null;
  if (Math.random() * 100 >= (s.heartProb || 0)) return null;
  const pool = State.messages.filter(m => m.type !== 'card' && m.type !== 'quiz' && m.type !== 'song' && m.type !== 'companion');
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}
function maybeOtherInvite() {
  const s = State.settings;
  if (!s.inviteEnabled) return null;
  if (Math.random() * 100 >= (s.inviteProb || 0)) return null;
  if (!State.songs.length) return null;
  return State.songs[Math.floor(Math.random() * State.songs.length)];

function maybeOtherCompanionInvite() {
  const s = State.settings;
  if (!s.companionInviteEnabled) return null;
  if (Math.random() * 100 >= (s.companionInviteProb || 0)) return null;
  const all = [];
  COMPANION_CATS.forEach(c => c.items.forEach(it => all.push(it)));
  let pool = all;
  if (Companion.active) pool = all.filter(it => it !== Companion.type);
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];

/* ==================== 归档模式 ==================== */
function enterArchiveMode() {
  archiveMode = true; archiveSelected.clear();
  $('#chat-footer').style.display = 'none';

}
function exitArchiveMode() {
  archiveMode = false; archiveSelected.clear();

}
function doArchive() {
  if (!archiveSelected.size) { openModal({ title:'', bodyHTML:'先选几条吧', actions: [] }); setTimeout(closeModal, 1500); return; }
  const today = todayKey();
  openModal({
    title: '选择归档日期',
    bodyHTML: `<input class="field" id="arc-date" type="date" value="${today}">`,
    actions: [
      { label: '确认归档', keepOpen: true, onClick: () => {
        const d = $('#arc-date').value || today;
        closeModal();
        runArchive(d);
      }}
    ]
  });
  setTimeout(() => { const el = $('#arc-date'); if (el) el.focus(); }, 100);
}
function runArchive(dayStr) {
  const ids = [...archiveSelected];
  openModal({ title: '归档中', bodyHTML: `<div style="text-align:center"><div id="arc-stage" style="margin-bottom:12px;font-size:13px;color:var(--text-soft)">准备中…</div><div style="height:6px;border-radius:3px;background:var(--glass-bg-strong);overflow:hidden"><div id="arc-bar" style="height:100%;width:0;background:var(--accent-deep);transition:width .2s"></div></div><div id="arc-pct" style="margin-top:8px;font-size:13px">0%</div></div>`, actions: [] });
  $('#modal-mask').style.pointerEvents = 'none';
  let i = 0;
  const step = () => {
    if (i >= ids.length) {
      const moving = State.messages.filter(m => archiveSelected.has(m.id));
      let entry = State.archive.find(a => a.day === dayStr);
      if (!entry) { entry = { day: dayStr, messages: [] }; State.archive.push(entry); }
      moving.forEach(m => entry.messages.push(m));
      State.archive.sort((a, b) => b.day.localeCompare(a.day));
      State.messages = State.messages.filter(m => !archiveSelected.has(m.id));
      save.messages(); save.archive();
      archiveMode = false; archiveSelected.clear();
      $('#chat-footer').style.display = '';
      $('#archive-bar').style.display = 'none';

function initFloatBallDrag() {
  const ball = $('#float-ball'); if (!ball) return;
  let startX = 0, startY = 0, startL = 0, startT = 0, dragging = false, moved = false, menuOpened = false;
  function begin(x, y) {
    startX = x; startY = y; const r = ball.getBoundingClientRect();
    startL = r.left; startT = r.top; dragging = true; moved = false; menuOpened = false;
    openBigMenu(); menuOpened = true;
  }
  function move(x, y) {
    if (!dragging) return;
    const dx = x - startX, dy = y - startY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { if (!moved && menuOpened) { closeModal(); menuOpened = false; } moved = true; }
    if (!moved) return;
    let nl = startL + dx, nt = startT + dy;
    nl = Math.max(0, Math.min(window.innerWidth - ball.offsetWidth, nl));
    nt = Math.max(0, Math.min(window.innerHeight - ball.offsetHeight, nt));
    ball.style.left = nl + 'px'; ball.style.top = nt + 'px'; ball.style.right = 'auto'; ball.style.bottom = 'auto';
  }
  function end() { if (!dragging) return; dragging = false; if (moved) { State.settings.floatPos = { left: ball.style.left, top: ball.style.top }; save.settings(); } }
  ball.addEventListener('touchstart', e => { const t = e.touches[0]; begin(t.clientX, t.clientY); }, { passive: true });
  ball.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  ball.addEventListener('touchend', end);
  ball.addEventListener('mousedown', e => {
    begin(e.clientX, e.clientY);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); end(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}

/* ==================== sheet 下滑关闭（跟手） ==================== */
function initSheetDrag() {
  const sheet = $('#sheet'); const mask = $('#sheet-mask');
  if (!sheet || !mask) return;
  let startY = 0, curY = 0, dragging = false, moved = false;
  const onStart = (y) => { startY = y; curY = 0; dragging = true; moved = false; sheet.style.transition = 'none'; };
  const onMove = (y) => {
    if (!dragging) return;
    let dy = y - startY;
    if (dy < 0) dy = 0;
    curY = dy;
    if (dy > 4) moved = true;
    sheet.style.transform = `translateY(${dy}px)`;
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .26s cubic-bezier(.2,.9,.3,1.1)';
    const threshold = sheet.offsetHeight * 0.25;
    if (moved && curY > threshold) {
      sheet.style.transform = `translateY(${sheet.offsetHeight}px)`;
      setTimeout(() => { closeSheet(); sheet.style.transform = ''; sheet.style.transition = 'none'; }, 240);
    } else {
      sheet.style.transform = '';
    }
  };
  sheet.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientY); }, { passive: true });
  sheet.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientY); }, { passive: true });
  sheet.addEventListener('touchend', onEnd);
  sheet.addEventListener('mousedown', e => {
    onStart(e.clientY);
    const mm = ev => onMove(ev.clientY);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); onEnd(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}

}
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function nextDate(d) {
  const base = new Date(d.date + 'T00:00:00');
  const today = startOfDay(new Date());
  if (d.repeat === 'none') return base;
  let next = new Date(base);
  if (d.repeat === 'weekly') { while (next < today) next.setDate(next.getDate() + 7); }
  else if (d.repeat === 'monthly') { while (next < today) next.setMonth(next.getMonth() + 1); }
  else if (d.repeat === 'yearly') { while (next < today) next.setFullYear(next.getFullYear() + 1); }
  return next;
}
function openDayEditorMenu(d) {
  openModal({ title: escapeHTML(d.name), bodyHTML: '', actions: [

}

function runMoodHis() {
  const now = new Date();
  const s = State.settings;
  const targetH = s.moodHour ?? 20, targetM = s.moodMinute ?? 0;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const todayK = todayKey();
  const allKeys = Object.keys(State.moods);
  let startDate;
  if (allKeys.length) {
    const latest = allKeys.sort().pop();
    startDate = new Date(latest + 'T00:00:00');
    startDate.setDate(startDate.getDate() + 1);
  } else {
    startDate = new Date(now); startDate.setHours(0,0,0,0);
  }
  const today0 = new Date(now); today0.setHours(0,0,0,0);
  for (let d = new Date(startDate); d <= today0; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d.getTime());
    const isToday = k === todayK;
    if (isToday) {
      let rec = State.moods[k];
      if (!rec) { State.moods[k] = {}; rec = State.moods[k]; }
      if (rec._targetMin == null) {
        const base = targetH * 60 + targetM;
        const maxMin = Math.min(base + 180, 23 * 60 + 59);
        rec._targetMin = base + Math.floor(Math.random() * Math.max(1, maxMin - base));
      }
      if (nowMin < rec._targetMin) continue;
    }
    if (State.moods[k] && State.moods[k].his) continue;
    if (!State.moods[k]) State.moods[k] = {};
    const moodIdx = Math.floor(Math.random() * MOODS.length);
    const moodT = MOODS[moodIdx].t;
    let line;
    const itfStat = State.itfStats[k];
    if (itfStat && itfStat.total >= 5 && Math.random() < 0.6) {
      const positive = ['开心','想你','兴奋'];
      const pickT = positive[Math.floor(Math.random() * positive.length)];
      const lines = HIS_LINES[pickT];
      line = lines[Math.floor(Math.random() * lines.length)];
    } else {
      const lines = HIS_LINES[moodT];
      line = lines[Math.floor(Math.random() * lines.length)];
    }
    const weather = HIS_WEATHER[Math.floor(Math.random() * HIS_WEATHER.length)];
    State.moods[k].his = { mood: moodIdx, weather, line };
    if (!State.moods[k].his._recorded) {
      State.moods[k].his._recorded = true;
      addLove(3);
    }
  }
  save.moods();
}

function importSongs() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const txt = await f.text();
    let data;
    try { data = JSON.parse(txt); } catch(e) { openModal({ title:'失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    if (!Array.isArray(data)) { openModal({ title:'失败', bodyHTML:'格式不对', actions: [] }); return; }
    for (const item of data) {
      if (!item.name) continue;
      const id = uid();
      if (item.data) {
        try {
          const blob = await (await fetch(item.data)).blob();
          await CacheStore.put('song_' + id, blob);
        } catch (e) {}
      }
      State.songs.push({ id, name: item.name, artist: item.artist || '' });
    }
    await save.songs(); renderMusicList(); toast('已导入');
  };
  inp.click();
}
async function exportSongs() {
  const out = [];
  for (const s of State.songs) {
    const blob = await CacheStore.get('song_' + s.id);
    let data = '';
    if (blob) {
      data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    }
    out.push({ name: s.name, artist: s.artist || '', data });
  }
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `音乐_${dateStamp()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  });

  if (!groups.length) { openModal({ title:'去重', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 3000); return; }
  const dupIds = new Set();

  State.interactions[itfBoard] = list.filter(x => !dupIds.has(x.id));
  save.interactions();

function importInteractions() {
  const inp = document.createElement('input');

  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text();
    let incoming = [];
    if (f.name.toLowerCase().endsWith('.json')) {
      try {
        const data = JSON.parse(text);
        if (Array.isArray(data)) {
          incoming = data.map(d => {
            if (typeof d === 'string') return { content: d.trim() };
            return { content: (d.content || '').trim() };
          }).filter(x => x.content);
        }
      } catch(e) { openModal({ title:'导入失败', bodyHTML:'JSON 格式不正确', actions: [] }); return; }
    } else {
      incoming = text.split('\n').map(s => s.trim()).filter(Boolean).map(line => ({ content: line }));
    }
    if (!incoming.length) { openModal({ title:'导入失败', bodyHTML:'没有解析到内容', actions: [] }); return; }
    const list = State.interactions[itfBoard];
    const exist = new Set(list.map(x => (x.content||'').trim()));
    const dups = [];
    let added = 0;
    incoming.forEach(x => {
      if (exist.has(x.content)) { dups.push(x); }
      else { list.push({ id: uid(), content: x.content, locked: false, t: Date.now() }); exist.add(x.content); added++; }
    });
    save.interactions(); renderItfZoneTabs(); renderItfBody();
    if (dups.length) {
      const html = `<div class="dup-list">` + dups.map(d => `<div class="dup-item"><span style="flex:1">${escapeHTML(d.content)}</span></div>`).join('') + `</div><div style="font-size:12.5px;color:var(--text-soft);margin-top:8px;text-align:center">重复内容已忽略，不进回收站</div>`;

/* ==================== 互动回应 ==================== */
function doReplyInteraction() {
  const s = State.settings;
  const inComp = Companion.active;
  let pOther = s.itfProbOther, pTogether = s.itfProbTogether, pNormal = s.itfProbNormal;
  if (inComp) {
    const compWeight = (s.itfProbCompanion != null ? s.itfProbCompanion : 70) / 100;
    pOther = Math.round(pOther + (100 - pOther) * compWeight * 0.6);
    const rest = 100 - pOther;
    const otherRest = pTogether + pNormal || 1;
    pTogether = Math.round(rest * (pTogether / otherRest));
    pNormal = 100 - pOther - pTogether;
  }
  const r = Math.random() * 100;
  const hasOther = (State.interactions.other || []).filter(x => !x.locked).length > 0;
  const hasTogether = (State.interactions.together || []).filter(x => !x.locked).length > 0;
  let pickBoard = null;
  if (r < pOther && hasOther) pickBoard = 'other';
  else if (r < pOther + pTogether && hasTogether) pickBoard = 'together';
  else if (hasOther) pickBoard = 'other';
  else if (hasTogether) pickBoard = 'together';
  if (pickBoard) {
    const pool = State.interactions[pickBoard].filter(x => !x.locked);
    const item = pool[Math.floor(Math.random() * pool.length)];
    pushOtherInteraction(item.content, pickBoard);
    return;
  }
  const usable = State.cards.filter(c => !c.locked);
  if (usable.length) pushOther(usable[Math.floor(Math.random() * usable.length)].text);
  else pushOther('……');
}

function getDisplayedCards() {

  if (cardZone === 'normal') pool = State.cards.filter(c => !c.locked);

function renderCardList() {

function bindCardLockedHead() {

function openCardItemMenu(card) {

  openModal({ title: '字卡', bodyHTML: '', actions: [
    { label: '编辑', onClick: () => editCardInline(card) },
    { label: '删除', danger: true, onClick: () => { moveCardsToTrash([card.id]); renderCardZoneTabs(); renderCardList(); } },
    { label: locked ? '解锁' : '上锁', onClick: () => { card.locked = !card.locked; save.cards(); renderCardZoneTabs(); renderCardList(); toast(card.locked?'已上锁':'已解锁'); } }
  ]});

function editCardInline(card) {
  const list = $('#card-zone-body'); const items = $$('.card-item', list);
  const idx = getDisplayedCards().findIndex(c => c.id === card.id);
  if (idx < 0) return; const el = items[idx]; if (!el) return;
  const textEl = el.querySelector('.card-text'); textEl.innerHTML = '';
  const input = document.createElement('input'); input.className = 'field'; input.value = card.text; input.style.padding = '6px 10px';
  textEl.appendChild(input); input.focus();
  let done = false;
  const finish = saveIt => { if (done) return; done = true; if (saveIt && input.value.trim()) { card.text = input.value.trim(); save.cards(); } renderCardList(); };
  input.onblur = () => finish(true);
  input.onkeydown = e => { if (e.key === 'Enter') finish(true); };
}
function moveCardsToTrash(ids) {
  const set = new Set(ids);
  const moving = State.cards.filter(c => set.has(c.id));
  State.cards = State.cards.filter(c => !set.has(c.id));
  moving.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
  save.cards(); save.trash();
}
function openAddCard() {
  openModal({ title: '添加新字卡', bodyHTML: `<textarea class="field" id="add-card-input" rows="8" placeholder="祂会用这些字卡回复你哦"></textarea><div style="font-size:12px;color:var(--text-soft);margin-top:8px;text-align:center">一行一张字卡，可换行分隔</div>`,
    actions: [{ label: '保存字卡', onClick: () => {
      const lines = $('#add-card-input').value.split('\n').map(s => s.trim()).filter(Boolean);
      lines.forEach(text => State.cards.unshift({ id: uid(), text, t: Date.now(), locked: false }));
      save.cards(); renderCardZoneTabs(); renderCardList();
    }}]
  });
}
function importCards() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.json,application/json,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text(); let incoming = [];
    if (f.name.endsWith('.json')) {
      try { const data = JSON.parse(text); if (Array.isArray(data)) incoming = data.map(d => typeof d === 'string' ? d : (d.text || '')).filter(Boolean); }
      catch(e) { openModal({ title:'导入失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    } else incoming = text.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = new Set(State.cards.map(c => c.text));
    const dups = [];
    incoming.forEach(t => {
      if (existing.has(t)) { dups.push(t); State.trash.push({ id: uid(), text: t, t: Date.now(), deletedAt: Date.now() }); }
      else { State.cards.unshift({ id: uid(), text: t, t: Date.now(), locked: false }); existing.add(t); }
    });
    save.cards(); save.trash(); renderCardZoneTabs(); renderCardList();
    if (dups.length) {
      const html = `<div class="dup-list">` + dups.map(d => `<div class="dup-item">${escapeHTML(d)}</div>`).join('') + `</div>`;
      openModal({ title:'以下字卡重复，已移入回收站', bodyHTML: html, actions: [{ label:'去回收站', onClick: () => openTrash() }] });
    } else { openModal({ title:'导入完成', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 5000); }
  };
  inp.click();
}
function openExportDialog() {
  openModal({ title: '选择导出格式', bodyHTML: '', actions: [
    { label: 'TXT', onClick: () => exportCards('txt') },
    { label: 'JSON', onClick: () => exportCards('json') }
  ]});
}
function exportCards(fmt) {
  const data = State.cards.map(c => c.text);
  let content, mime, ext;
  if (fmt === 'json') { content = JSON.stringify(data, null, 2); mime = 'application/json'; ext = 'json'; }
  else { content = data.join('\n'); mime = 'text/plain'; ext = 'txt'; }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `字卡_${dateStamp()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doDedup() {
  const map = new Map();
  State.cards.forEach(c => { if (!map.has(c.text)) map.set(c.text, []); map.get(c.text).push(c); });
  const groups = [...map.entries()].filter(([, arr]) => arr.length > 1);
  if (!groups.length) { openModal({ title:'去重', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 5000); return; }
  groups.forEach(([, arr]) => {
    arr.sort((a, b) => a.t - b.t);
    const rest = arr.slice(1);
    rest.forEach(c => State.trash.push({ ...c, deletedAt: Date.now() }));
    const set = new Set(rest.map(c => c.id));
    State.cards = State.cards.filter(c => !set.has(c.id));
  });
  save.cards(); save.trash();
  const html = `<div class="dup-list">` + groups.map(([text, arr]) => `<div class="dup-item"><span>${escapeHTML(text)}</span><span class="dup-count" style="margin-left:auto">${arr.length}</span></div>`).join('') + `</div>`;
  openModal({ title:'重复内容', bodyHTML: html, actions: [{ label:'去回收站', onClick: () => openTrash() }] });
  renderCardZoneTabs(); renderCardList();
}

let playState = { day: null, messages: [], idx: 0, timer: null, speed: 1, playing: true, baseDelay: 3000 };
function openPlayPage(day) {
  const entry = State.archive.find(a => a.day === day);
  if (!entry) return;
  playState.day = day; playState.messages = entry.messages.slice();
  playState.idx = 0; playState.speed = 1; playState.playing = true;
  $('#play-title').textContent = dayLabel(day);
  $('#play-body').innerHTML = '';
  $('#btn-speed').textContent = '1x';
  $$('.speed-opt').forEach(o => o.classList.toggle('active', o.dataset.speed === '1'));
  setPlayIcon(true); updateProgress();
  showPage('page-play'); showBars();
  setTimeout(() => playNext(), 400);
}
function setPlayIcon(playing) { $('#play-pause-icon use').setAttribute('href', playing ? '#i-pause' : '#i-play'); }
function playNext() {
  if (!playState.playing) return;
  if (playState.idx >= playState.messages.length) return;
  const m = playState.messages[playState.idx];
  const body = $('#play-body');
  body.appendChild(buildMsgRow(m));
  body.scrollTop = body.scrollHeight;
  playState.idx++; updateProgress();
  playState.timer = setTimeout(playNext, playState.baseDelay / playState.speed);
}
function updateProgress() {
  const total = playState.messages.length || 1;
  const pct = Math.min(100, playState.idx / total * 100);
  $('#progress-fill').style.width = pct + '%';
  $('#progress-knob').style.left = pct + '%';
}
let playHideTimer = null;
function showBars() {
  $('#play-header').classList.remove('hidden');
  $('#play-footer').classList.remove('hidden');
  clearTimeout(playHideTimer);
  playHideTimer = setTimeout(() => { $('#play-header').classList.add('hidden'); $('#play-footer').classList.add('hidden'); }, 3000);
}
function initPlayPage() {
  $('#play-close').onclick = () => { clearTimeout(playState.timer); playState.playing = false; goBack(); };
  $('#btn-play-pause').onclick = () => {
    playState.playing = !playState.playing; setPlayIcon(playState.playing);
    if (playState.playing) playNext(); else clearTimeout(playState.timer);
  };
  const bar = $('#progress-bar');
  function seek(clientX) {
    const rect = bar.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width; pct = Math.max(0, Math.min(1, pct));
    const target = Math.floor(pct * playState.messages.length);
    playState.idx = target;
    const body = $('#play-body'); body.innerHTML = '';
    for (let i = 0; i < target; i++) body.appendChild(buildMsgRow(playState.messages[i]));
    body.scrollTop = body.scrollHeight; updateProgress();
    clearTimeout(playState.timer);
    if (playState.playing) playNext();
  }
  bar.addEventListener('click', e => seek(e.clientX));
  let dragging = false;
  bar.addEventListener('touchstart', e => { dragging = true; seek(e.touches[0].clientX); }, { passive: true });
  bar.addEventListener('touchmove', e => { if (dragging) seek(e.touches[0].clientX); }, { passive: true });
  bar.addEventListener('touchend', () => dragging = false);
  $('#btn-speed').onclick = e => { e.stopPropagation(); $('#speed-pop').classList.toggle('active'); };
  $$('.speed-opt').forEach(opt => {
    opt.onclick = () => {
      playState.speed = +opt.dataset.speed;
      $('#btn-speed').textContent = opt.dataset.speed + 'x';
      $$('.speed-opt').forEach(o => o.classList.toggle('active', o === opt));
      $('#speed-pop').classList.remove('active');
    };
  });
  document.addEventListener('click', () => $('#speed-pop').classList.remove('active'));
  $('#page-play').addEventListener('click', e => {
    if (e.target.closest('.play-footer') || e.target.closest('.play-header')) return;
    showBars();
  });
}

/* ==================== 改动：备份/恢复/清空（加 sticker、quizResults） ==================== */
function doBackup() {
  const data = { version: VERSION, exportedAt: Date.now(), settings: State.settings, cards: State.cards, trash: State.trash, messages: State.messages, archive: State.archive, quizzes: State.quizzes, quizResults: State.quizResults, memos: State.memos, wishes: State.wishes, days: State.days, hearts: State.hearts, moods: State.moods, companionStats: State.companionStats, interactions: State.interactions, itfStats: State.itfStats, stickers: State.stickers, love: State.love };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `阿遇♥阿凉_${dateStamp()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doRestore() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const txt = await f.text(); let data;
    try { data = JSON.parse(txt); } catch(e) { openModal({ title:'失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    openModal({ title: '覆盖中', bodyHTML: `<div style="text-align:center"><div id="restore-stage" style="margin-bottom:12px;font-size:13px;color:var(--text-soft)">准备中…</div><div style="height:6px;border-radius:3px;background:var(--glass-bg-strong);overflow:hidden"><div id="restore-bar" style="height:100%;width:0;background:var(--accent-deep);transition:width .2s"></div></div><div id="restore-pct" style="margin-top:8px;font-size:13px">0%</div></div>`, actions: [] });
    $('#modal-mask').style.pointerEvents = 'none';
    await new Promise(r => setTimeout(r, 200));
    const stages = [
      ['设置', () => { if (data.settings) State.settings = Object.assign(State.settings, data.settings); }],
      ['字卡', () => { State.cards = data.cards || []; }],
      ['回收站', () => { State.trash = data.trash || []; }],
      ['消息', () => { State.messages = data.messages || []; }],
      ['归档', () => { State.archive = data.archive || []; }],
      ['问卷', () => { State.quizzes = data.quizzes || []; }],
      ['答卷', () => { State.quizResults = data.quizResults || []; }],
      ['备忘录', () => { State.memos = data.memos || ''; }],
      ['心愿单', () => { State.wishes = data.wishes || []; }],
      ['重要日', () => { State.days = data.days || []; }],
      ['心动时刻', () => { State.hearts = data.hearts || []; }],
      ['心情手帐', () => { State.moods = data.moods || {}; }],
      ['陪伴统计', () => { State.companionStats = data.companionStats || []; }],
      ['互动', () => { State.interactions = data.interactions || { me: [], other: [], together: [] }; }],
      ['互动统计', () => { State.itfStats = data.itfStats || {}; }],
      ['贴纸', () => { State.stickers = data.stickers || []; }],
      ['爱意值', () => { State.love = data.love || 0; }]
    ];
    for (let i = 0; i < stages.length; i++) {
      $('#restore-stage').textContent = '正在覆盖：' + stages[i][0] + '…';
      stages[i][1]();
      const pct = Math.round((i + 1) / stages.length * 100);
      $('#restore-bar').style.width = pct + '%'; $('#restore-pct').textContent = pct + '%';
      await new Promise(r => setTimeout(r, 160));
    }
    await save.settings(); await save.cards(); await save.trash(); await save.messages(); await save.archive();
    await save.quizzes(); await save.quizResults(); await save.memos(); await save.wishes(); await save.days(); await save.hearts(); await save.moods();
    await save.companionStats(); await save.interactions(); await save.itfStats(); await save.stickers(); await save.love();
    $('#restore-stage').textContent = '完成';
    setTimeout(() => { $('#modal-mask').style.pointerEvents = ''; closeModal(); openModal({ title:'已覆盖', bodyHTML:'备份已覆盖，正在刷新…', actions: [] }); setTimeout(() => location.reload(), 1200); }, 600);
  };
  inp.click();
}
function doClear() {
  openModal({ title: '清空所有数据', bodyHTML: '确定清空全部数据吗？<br>清空后无法恢复，建议先备份。', actions: [
    { label: '确认清空', danger: true, keepOpen: true, onClick: async () => {
      State.cards = []; State.trash = []; State.messages = []; State.archive = []; State.quizzes = []; State.quizResults = [];
      State.memos = ''; State.wishes = []; State.days = []; State.hearts = []; State.moods = {}; State.songs = []; State.companionStats = [];

      State.stickers = [];
      State.love = 0;
      State.settings.lockPassed = false; State.settings.lastLockDay = '';
      await save.cards(); await save.trash(); await save.messages(); await save.archive(); await save.quizzes(); await save.quizResults();
      await save.memos(); await save.wishes(); await save.days(); await save.hearts(); await save.moods(); await save.songs(); await save.companionStats();
      await save.companionActive(); await save.interactions(); await save.itfStats(); await save.stickers(); await save.love(); await save.settings();
      location.reload();
    }}
  ]});
}

/* ==================== 启动 ==================== */
async function boot() {
  await Store.init();
  const st = await Store.read('settings.json');
  if (st) {
    Object.assign(State.settings, st);
    State.settings.avatars = Object.assign({ other: '', me: '' }, st.avatars || {});
    State.settings.otherCalls = st.otherCalls || [];
    State.settings.myCalls = st.myCalls || [];
    State.settings.avatarPool = st.avatarPool || [];
    State.settings.avatarPairs = st.avatarPairs || [];
    State.settings.chatBgPool = st.chatBgPool || [];
    State.settings.lockBgPool = st.lockBgPool || [];
    /* 旧数据补齐 */
    if (State.settings.quoteProb == null) State.settings.quoteProb = 7;
    if (State.settings.heartProb == null) State.settings.heartProb = 5;
    if (State.settings.inviteProb == null) State.settings.inviteProb = 6;
    if (State.settings.companionInviteProb == null) State.settings.companionInviteProb = 5;
    if (State.settings.itfProbOther == null) State.settings.itfProbOther = 50;
    if (State.settings.itfProbTogether == null) State.settings.itfProbTogether = 30;
    if (State.settings.itfProbNormal == null) State.settings.itfProbNormal = 20;
    if (State.settings.itfProbCompanion == null) State.settings.itfProbCompanion = 70;
    if (State.settings.itfActiveProb == null) State.settings.itfActiveProb = 3;
    if (State.settings.emojiEnabled == null) State.settings.emojiEnabled = false;
    if (State.settings.emojiProb == null) State.settings.emojiProb = 6;
    if (State.settings.companionAcceptProb == null) State.settings.companionAcceptProb = 80;
    if (State.settings.showEveryAvatar == null) State.settings.showEveryAvatar = false;
    if (State.settings.bubbleSkin == null) State.settings.bubbleSkin = 'default';
    if (State.settings.stickerEnabled == null) State.settings.stickerEnabled = false;
    if (State.settings.stickerProb == null) State.settings.stickerProb = 7;
  }
  const c = await Store.read('cards.json'); if (c) State.cards = c;
  const t = await Store.read('trash.json'); if (t) State.trash = t;
  const m = await Store.read('messages.json'); if (m) State.messages = m;
  const a = await Store.read('archive.json'); if (a) State.archive = a;
  const q = await Store.read('quizzes.json'); if (q) State.quizzes = q;
  const qr = await Store.read('quiz_results.json'); if (qr) State.quizResults = qr;
  const mm = await Store.read('memos.json'); if (mm != null) State.memos = mm;
  const w = await Store.read('wishes.json'); if (w) State.wishes = w;
  const d = await Store.read('days.json'); if (d) State.days = d;
  const h = await Store.read('hearts.json'); if (h) State.hearts = h;
  const mo = await Store.read('moods.json'); if (mo) State.moods = mo;
  const so = await Store.read('songs.json'); if (so) State.songs = so;
  const cs = await Store.read('companion_stats.json'); if (cs) State.companionStats = cs;
  const ca = await Store.read('companion_active.json'); if (ca) State.companionActive = ca;
  const itf = await Store.read('interactions.json'); if (itf) State.interactions = Object.assign({ me: [], other: [], together: [] }, itf);
  const is = await Store.read('itf_stats.json'); if (is) State.itfStats = is;
  const stk = await Store.read('stickers.json'); if (stk) State.stickers = stk;
  const l = await Store.read('love.json'); if (l != null) State.love = l;

  checkInterruptedCompanion();

  applyTheme(State.settings.theme);
  applyBubbleSkin(State.settings.bubbleSkin);
  applyFloatBall(); applyBackgrounds(); applyAvatars();

  initLockPage(); initChatPage(); initFloatBallDrag(); initPlayPage();
  initSheetDrag();

  $('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
  $('#sheet-mask').addEventListener('click', e => { if (e.target.id === 'sheet-mask') closeSheet(); });
  /* ==================== 改动：返回按钮（先退 subStack） ==================== */
  $('#sub-back').onclick = () => {
    if (subStack.length) {
      const prev = subStack.pop();
      $('#sub-title').textContent = prev.title;
      $('#sub-body').innerHTML = prev.html;
      const subPage = $('#page-sub');
      subPage._afterRender = prev.after;
      if (prev.after) prev.after();
    } else {
      goBack();
    }
  };
  document.addEventListener('click', e => { if (!e.target.closest('.dropdown') && !e.target.closest('#day-repeat-row')) closeDropdown(); });
}
window.addEventListener('DOMContentLoaded', boot);
</script>
