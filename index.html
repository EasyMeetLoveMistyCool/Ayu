<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf2f5">
<title>阿遇♥阿凉</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: -apple-system, "HarmonyOS Sans", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 15px; color: var(--text); background: var(--bg-base);
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; font-family: inherit; }
button { border: none; background: none; color: inherit; font-family: inherit; cursor: pointer; }
ul, li { list-style: none; }

:root, [data-theme="rose-glass"] {
  --bg-base: #fdf2f5; --bg-grad-1: #fef6f8; --bg-grad-2: #fdf2f5; --bg-grad-3: #fbeef2;
  --glass-bg: rgba(255,255,255,0.45); --glass-bg-strong: rgba(255,255,255,0.65);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(230,180,200,0.18);
  --bubble-me: #f5c8d5; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #f0b8c8; --accent-deep: #e8a0b5; --accent-soft: rgba(240,184,200,0.28);
  --heart-red: #e8536f; --check-green: #6fbf8f; --danger: #d9536a;
  --time-text: #a8a8a8; --mask: rgba(240,184,200,0.3);
  --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}

[data-theme="warm-glass"] {
  --bg-base: #faf4ec; --bg-grad-1: #fdf8f2; --bg-grad-2: #faf4ec; --bg-grad-3: #f5ede1;

  --accent: #e0c8a8; --accent-deep: #d4b890; --accent-soft: rgba(224,200,168,0.3);
  --time-text: #a8a8a8; --mask: rgba(224,200,168,0.32); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);
}
[data-theme="night-glass"] {
  --bg-base: #1a1824; --bg-grad-1: #201d2c; --bg-grad-2: #1a1824; --bg-grad-3: #14121c;

  --glass-border: rgba(255,255,255,0.18); --glass-highlight: rgba(255,255,255,0.28);

  --bubble-me: #4a3a48; --bubble-other: rgba(255,255,255,0.1);
  --text: #e8e8e8; --text-soft: #a8a8a8; --text-faint: #808080;
  --accent: #8a6a80; --accent-deep: #a07a94; --accent-soft: rgba(138,106,128,0.3);
  --heart-red: #ff5f7e; --time-text: #8a8a8a; --mask: rgba(0,0,0,0.5);
  --progress: #e893a8;
  --his-bg: rgba(120,170,220,0.35); --my-bg: rgba(220,130,170,0.35);
}
[data-theme="purple-glass"] {
  --bg-base: #f5effc; --bg-grad-1: #faf6fe; --bg-grad-2: #f5effc; --bg-grad-3: #efe6f9;
  --glass-bg: rgba(255,255,255,0.46); --glass-bg-strong: rgba(255,255,255,0.66);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(195,170,230,0.2);
  --bubble-me: #d4c0ea; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #c0a8e0; --accent-deep: #b094d6; --accent-soft: rgba(192,168,224,0.28);
  --time-text: #a8a8a8; --mask: rgba(192,168,224,0.3); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);

[data-theme="cyan-glass"] {
  --bg-base: #eff8f6; --bg-grad-1: #f5fbf9; --bg-grad-2: #eff8f6; --bg-grad-3: #e6f3f0;
  --glass-bg: rgba(255,255,255,0.48); --glass-bg-strong: rgba(255,255,255,0.68);
  --glass-border: rgba(255,255,255,0.7); --glass-highlight: rgba(255,255,255,0.9);
  --glass-shadow: rgba(165,215,205,0.2);
  --bubble-me: #c0e4dc; --bubble-other: rgba(255,255,255,0.62);
  --text: #4a4a4a; --text-soft: #888888; --text-faint: #bbbbbb;
  --accent: #a8d8cc; --accent-deep: #90ccc0; --accent-soft: rgba(168,216,204,0.28);
  --time-text: #a8a8a8; --mask: rgba(168,216,204,0.3); --progress: var(--accent-deep);
  --his-bg: rgba(150,200,240,0.35); --my-bg: rgba(240,170,195,0.35);

.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 6px 22px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#bg-layer {
  position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2) 55%, var(--bg-grad-3));
  background-size: cover; background-position: center;
  transition: background-image .35s ease;
}
.page { position: absolute; inset: 0; z-index: 1; display: none; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }
.scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.scroll-y::-webkit-scrollbar { width: 0; height: 0; }
.scroll-y { scrollbar-width: none; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 50%; color: var(--text);
  transition: transform .15s ease, background .2s ease;
}
.icon-btn:active { transform: scale(.9); background: var(--accent-soft); }
.icon-btn svg { width: 22px; height: 22px; display: block; }

.modal-mask {
  position: fixed; inset: 0; z-index: 1000;
  display: none; align-items: center; justify-content: center;
  background: var(--mask);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 24px;
}
.modal-mask.active { display: flex; }
.modal {
  width: 100%; max-width: 340px; max-height: 78vh;
  border-radius: 22px; padding: 22px 20px;
  display: flex; flex-direction: column;
  animation: modal-in .22s cubic-bezier(.2,.9,.3,1.2);
}
.modal.wide { max-width: 88vw; }
@keyframes modal-in {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.modal-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px; color: var(--text); }
.modal-body { flex: 1; overflow-y: auto; margin-bottom: 16px; }
.modal-body::-webkit-scrollbar { width: 0; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.modal-btn {
  flex: 1; min-width: 96px; padding: 11px 16px; border-radius: 14px;
  font-size: 14.5px; font-weight: 500; color: var(--text);
  background: var(--accent); border: 1px solid var(--glass-border);
  transition: transform .12s ease;
}
.modal-btn:active { transform: scale(.96); }
.modal-btn.danger { color: #fff; background: var(--danger); border-color: rgba(217,83,106,0.4); }
.modal-btn.green { color: #fff; background: var(--check-green); border-color: rgba(111,191,143,0.4); }
.field {
  width: 100%; padding: 12px 14px; border-radius: 14px;
  font-size: 15px; color: var(--text);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  outline: none; resize: none;
}
.field::placeholder { color: var(--text-soft); }
.todo {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 120px; gap: 10px; color: var(--text-soft); font-size: 15px; letter-spacing: 1px;
}
.todo svg { width: 48px; height: 48px; opacity: .5; }
.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-btn {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 18px 10px; border-radius: 16px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 14px; color: var(--text);
}
.choice-btn svg { width: 26px; height: 26px; color: var(--accent-deep); }
.choice-btn:active { transform: scale(.96); }

.companion-cat {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  font-size: 15px; color: var(--text);
  margin-bottom: 8px;
  transition: transform .12s ease;
}
.companion-cat:active { transform: scale(.97); }
.companion-cat svg { width: 20px; height: 20px; color: var(--accent-deep); }
.companion-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.companion-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 12px 4px; border-radius: 12px; text-align: center;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  font-size: 12px; color: var(--text); min-height: 54px;
}
.companion-item.active { background: var(--accent); border-color: var(--accent-deep); }

.companion-stat {
  padding: 10px 12px; border-radius: 12px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  font-size: 12.5px; color: var(--text-soft);
  margin-top: 6px;
}

.companion-float {
  position: fixed; z-index: 951;
  left: 50%; transform: translateX(-50%); bottom: 200px;
  width: 180px;
  border-radius: 16px; padding: 10px 12px;
  display: none; flex-direction: column; align-items: center; gap: 6px;
  touch-action: none;
  text-align: center;
}
.companion-float.active { display: flex; }
.companion-float .cf-avatars {
  display: flex; align-items: center; gap: 4px;
}
.companion-float .cf-avatars img {
  width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
  border: 1.2px solid var(--glass-border);
}
.companion-float .cf-heart { color: var(--heart-red); font-size: 14px; }
.companion-float .cf-text { font-size: 12px; color: var(--text); line-height: 1.4; }
.companion-float .cf-time { font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.companion-float .cf-end {
  width: 100%; padding: 7px; border-radius: 10px;
  font-size: 12px; color: var(--text); background: var(--accent);
  border: 1px solid var(--glass-border);
}

/* ==================== 触碰同频小窗 ==================== */
.touch-float {
  position: fixed; z-index: 1200;
  left: 50%; transform: translateX(-50%);
  top: 50%; margin-top: -180px;
  width: 300px; max-width: 88vw;
  border-radius: 20px;
  padding: 14px 14px 16px;
  display: none; flex-direction: column; align-items: center; gap: 12px;
  touch-action: none;
  animation: modal-in .22s cubic-bezier(.2,.9,.3,1.2);
}
.touch-float.active { display: flex; }
.touch-float .tf-head {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  position: relative; width: 100%;
}
.touch-float .tf-head img {
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid var(--glass-border); background: var(--glass-bg);
}
.touch-float .tf-head .heart-char { font-size: 18px; }
.touch-float .tf-close {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft); background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
}
.touch-float .tf-close svg { width: 14px; height: 14px; }
.touch-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  width: 100%;
}
.touch-btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 12px 6px; border-radius: 14px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  box-shadow: inset 0 1px 0 var(--glass-highlight);
  font-size: 13px; color: var(--text);
  transition: transform .12s ease;
}
.touch-btn:active { transform: scale(.94); }
.touch-btn svg { width: 26px; height: 26px; color: var(--accent-deep); }
.touch-msg {
  width: 100%; min-height: 44px;
  display: none; align-items: center; justify-content: center;
  text-align: center;
  padding: 10px 12px; border-radius: 12px;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  font-size: 13.5px; line-height: 1.6; color: var(--text);
  word-break: break-word;
  animation: bubble-in .22s ease;
}
.touch-msg.active { display: flex; }
.touch-msg .tm-temp { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.touch-msg .tm-temp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.touch-msg .tm-temp-k { color: var(--text-soft); font-size: 13px; }
.touch-msg .tm-temp-v { color: #f0a8c0; font-size: 15px; font-weight: 600; }

.invite-card {
  border: 2px solid var(--accent-deep);
  border-radius: 18px;
  background: var(--glass-bg);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  padding: 12px 14px;
  min-width: 200px; max-width: 100%;
}
.invite-card .ic-row { display: flex; align-items: center; gap: 10px; }
.invite-card .ic-icon { width: 26px; height: 26px; flex-shrink: 0; color: var(--accent-deep); }
.invite-card .ic-text { flex: 1; font-size: 14.5px; color: var(--text); }
.invite-card .ic-btn {
  display: block; width: 100%; margin-top: 10px;
  padding: 9px; border-radius: 12px;
  font-size: 13.5px; color: var(--text); background: var(--accent);
  border: 1px solid var(--glass-border); text-align: center;
}
.invite-card .ic-hint { margin-top: 8px; font-size: 12.5px; color: var(--text-soft); text-align: center; }

.msg-menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  font-size: 15px; color: var(--text);
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  margin-bottom: 8px;
}
.msg-menu-item:last-child { margin-bottom: 0; }
.msg-menu-item.danger { color: var(--danger); }
.msg-menu-item.green { color: #3d8f60; }
.msg-menu-item svg { width: 20px; height: 20px; color: var(--accent-deep); }
.msg-menu-item.danger svg { color: var(--danger); }
.msg-menu-item.green svg { color: #3d8f60; }

.dropdown {
  position: absolute; z-index: 1100;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(18px) saturate(160%);

.video-ripple.r2 { animation-delay: 0.8s; }
.video-ripple.r3 { animation-delay: 1.6s; }
.video-name { font-size: 18px; font-weight: 700; color: #4a4a4a; margin-top: 14px; }
.video-status { font-size: 13px; color: #7a7a7a; margin-top: 6px; }
.video-timer { font-size: 15px; color: #4a4a4a; margin-top: 6px; font-variant-numeric: tabular-nums; }
.video-wave { display: flex; align-items: center; gap: 3px; height: 24px; margin-top: 12px; }
.video-wave i { display: block; width: 3px; height: 100%; background: var(--accent-deep); border-radius: 2px; animation: wave-bar 1s ease-in-out infinite; }
.video-wave i:nth-child(1) { animation-delay: 0s; } .video-wave i:nth-child(2) { animation-delay: .12s; }
.video-wave i:nth-child(3) { animation-delay: .24s; } .video-wave i:nth-child(4) { animation-delay: .36s; }
.video-wave i:nth-child(5) { animation-delay: .48s; } .video-wave i:nth-child(6) { animation-delay: .6s; }
.video-wave i:nth-child(7) { animation-delay: .72s; }
.video-actions { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: auto; padding-top: 22px; }
.video-btn { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.2); transition: transform .12s ease; }
.video-btn:active { transform: scale(.92); }
.video-btn.accept { background: var(--check-green); }
.video-btn.reject { background: var(--danger); }
.video-btn.mini { background: var(--accent-deep); font-size: 22px; }
.video-float { position: fixed; z-index: 1450; left: 50%; transform: translateX(-50%); bottom: 180px; border-radius: 16px; padding: 10px 12px; display: none; flex-direction: column; align-items: center; gap: 6px; touch-action: none; text-align: center; border: 1px solid var(--glass-border); }
.video-float.active { display: flex; }
.video-float.mini-size { width: 120px; }
.video-float.small-size { width: 180px; }
.video-float .vf-avatars { display: flex; align-items: center; gap: 4px; }
.video-float .vf-avatars img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1.2px solid var(--glass-border); }
.video-float .cf-heart { color: var(--heart-red); font-size: 14px; }
.video-float .vf-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.video-float .vf-row { display: flex; align-items: center; gap: 4px; }
.video-float .vf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--check-green); animation: green-dot 1.4s ease-in-out infinite; }
.video-float .vf-time { font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }
.video-float .vf-expand { width: 100%; padding: 6px; border-radius: 9px; font-size: 11px; color: var(--text); background: var(--accent); border: 1px solid var(--glass-border); }
</style>

<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dateStamp() { const d = new Date(); return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function dayKey(ts) { const d = new Date(ts); return '' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayLabel(key) { const [y, m, d] = key.split('-'); return `${y}年${Number(m)}月${Number(d)}日`; }
function todayKey() { return dayKey(Date.now()); }
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fullDate(d) { return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function fullDateTime(ts) { const d = new Date(ts); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function relTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  return fullDateTime(ts);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('active');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('active'), 1500);
}
function hms(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return pad(h) + ':' + pad(m) + ':' + pad(s);
}
function callTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}

const Store = {
  root: null,
  async init() { try { this.root = await navigator.storage.getDirectory(); } catch (e) { this.root = null; } },
  async _fh(name, create) { if (!this.root) return null; return await this.root.getFileHandle(name, { create }); },
  async read(name) {
    try {
      if (this.root) {
        const fh = await this._fh(name, false); if (!fh) return null;
        const file = await fh.getFile(); const txt = await file.text();
        return txt ? JSON.parse(txt) : null;
      }
      const raw = localStorage.getItem('ay_' + name);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  async write(name, data) {
    const txt = JSON.stringify(data);
    try {
      if (this.root) {
        const tmpName = name + '.tmp';
        try {
          const fh = await this._fh(tmpName, true);
          const w = await fh.createWritable();
          await w.write(txt);
          await w.close();
        } catch (e) {
          try { localStorage.setItem('ay_' + name, txt); } catch (e2) {}
          return;
        }
        let tmpTxt = null;
        try {
          const tfh = await this._fh(tmpName, false);
          if (tfh) { const tf = await tfh.getFile(); tmpTxt = await tf.text(); }
        } catch (e) {}
        try {
          const fh2 = await this._fh(name, true);
          const w2 = await fh2.createWritable();
          await w2.write(tmpTxt != null ? tmpTxt : txt);
          await w2.close();
        } catch (e) {
          try { localStorage.setItem('ay_' + name, txt); } catch (e2) {}
        }
        try { await this.root.removeEntry(tmpName); } catch (e) {}
        return;
      }
      localStorage.setItem('ay_' + name, txt);
    } catch (e) { try { localStorage.setItem('ay_' + name, txt); } catch (e2) {} }
  }
};

const CacheStore = {
  name: 'ay-media-v1',
  async put(key, blob) { try { const c = await caches.open(this.name); await c.put('/media/' + key, new Response(blob)); } catch (e) {} },
  async get(key) { try { const c = await caches.open(this.name); const r = await c.match('/media/' + key); return r ? await r.blob() : null; } catch (e) { return null; } },
  async del(key) { try { const c = await caches.open(this.name); await c.delete('/media/' + key); } catch (e) {} },
  async keys() { try { const c = await caches.open(this.name); const ks = await c.keys(); return ks.map(k => k.url.split('/media/')[1]).filter(Boolean); } catch (e) { return []; } }
};

let pageStack = [];
function showPage(id, push = true) {
  const cur = $$('.page').find(p => p.classList.contains('active'));
  if (cur && push && cur.id !== id) pageStack.push(cur.id);
  $$('.page').forEach(p => p.classList.toggle('active', p.id === id));
  updateFloatBallVisible(); applyBackgrounds();
}
function goBack() {
  const prev = pageStack.pop() || 'page-chat';
  $$('.page').forEach(p => p.classList.toggle('active', p.id === prev));
  updateFloatBallVisible(); applyBackgrounds();
}
function updateFloatBallVisible() {
  const lockActive = $('#page-lock') && $('#page-lock').classList.contains('active');
  const ball = $('#float-ball'); if (!ball) return;
  if (lockActive || State.settings.floatHidden) ball.classList.add('hidden');
  else ball.classList.remove('hidden');
}

let modalStack = [];
function openModal({ title, bodyHTML, actions, wide }) {
  modalStack.push({ title: $('#modal-title').textContent, body: $('#modal-body').innerHTML, actions: $('#modal-actions').innerHTML, wide: $('#modal').classList.contains('wide') });
  setModal({ title, bodyHTML, actions, wide });
  $('#modal-mask').classList.add('active');
}
function setModal({ title, bodyHTML, actions, wide }) {
  const titleEl = $('#modal-title');
  titleEl.classList.remove('gift-pick-title', 'box-pick-title');
  titleEl.textContent = title || '';
  $('#modal-body').innerHTML = bodyHTML || '';
  $('#modal').classList.toggle('wide', !!wide);
  const acts = $('#modal-actions'); acts.innerHTML = '';
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.className = 'modal-btn' + (a.danger ? ' danger' : '') + (a.center ? ' center-btn' : '') + (a.green ? ' green' : '');
    b.textContent = a.label;
    b.onclick = () => { if (a.onClick) a.onClick(); if (a.keepOpen !== true) closeModal(); };
    acts.appendChild(b);
  });
}
function closeModal() { modalStack = []; $('#modal-mask').classList.remove('active'); $('#modal').classList.remove('wide'); }
function modalBack() {
  if (modalStack.length) {
    const p = modalStack.pop();
    $('#modal-title').textContent = p.title;
    $('#modal-body').innerHTML = p.body;
    $('#modal-actions').innerHTML = p.actions;
    $('#modal').classList.toggle('wide', p.wide);
  } else closeModal();
}

function openDropdown(anchorEl, items, onPick, current) {
  const dd = $('#dropdown'); dd.innerHTML = '';
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'dropdown-item' + (it.value === current ? ' active' : '');
    el.textContent = it.label;
    el.onclick = () => { closeDropdown(); onPick(it.value); };
    dd.appendChild(el);
  });
  const r = anchorEl.getBoundingClientRect();
  dd.style.left = Math.min(r.left, window.innerWidth - 140) + 'px';
  dd.style.top = (r.bottom + 6) + 'px';
  dd.classList.add('active');
}
function closeDropdown() { $('#dropdown').classList.remove('active'); }

function openSheet(items, onPick) {
  const grid = $('#sheet-grid'); grid.innerHTML = '';
  items.forEach(it => {
    const cell = document.createElement('div');
    cell.className = 'unpair-cell';
    cell.style.flexDirection = 'column'; cell.style.gap = '4px';
    cell.innerHTML = `<svg style="width:22px;height:22px;color:var(--accent-deep)"><use href="#${it[1]}"/></svg><span class="sheet-item-name">${it[0]}</span>`;
    cell.onclick = () => { closeSheet(); onPick(it[0]); };
    grid.appendChild(cell);
  });
  $('#sheet-mask').classList.add('active');
}
function closeSheet() { $('#sheet-mask').classList.remove('active'); }

function pickImage(cb, multiple = false) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  if (multiple) inp.multiple = true;
  inp.onchange = () => { [...inp.files].forEach(f => { const fr = new FileReader(); fr.onload = () => cb(fr.result, f); fr.readAsDataURL(f); }); };
  inp.click();
}
function pickAudio(cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'audio/*';
  inp.onchange = () => { const f = inp.files[0]; if (f) cb(f); };
  inp.click();
}
function bindLongPress(el, cb) {
  let timer = null;
  const start = () => { timer = setTimeout(() => { timer = null; cb(); }, 500); };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

/* ==================== 音乐播放器 ==================== */
const Player = {
  audio: null, list: [], idx: 0, mode: 'order', url: null, curSongId: null,
  init() {
    if (this.audio) return;
    this.audio = new Audio();
    this.audio.addEventListener('ended', () => this.onEnded());
    this.audio.addEventListener('play', () => this.updateIcon());
    this.audio.addEventListener('pause', () => this.updateIcon());
  },
  async playSong(song, list) {
    this.init();
    this.list = (list && list.length) ? list : [song];
    this.idx = this.list.findIndex(s => s.id === song.id);
    if (this.idx < 0) this.idx = 0;
    this.curSongId = song.id;
    const blob = await CacheStore.get('song_' + song.id);
    if (!blob) { toast('音频找不到了'); return; }
    if (this.url) { URL.revokeObjectURL(this.url); this.url = null; }
    this.url = URL.createObjectURL(blob);
    this.audio.src = this.url;
    try { await this.audio.play(); } catch (e) {}
    this.showFloat(song);
  },
  onEnded() {
    if (this.mode === 'loop-one') { this.audio.play(); return; }
    if (!this.list.length) return;
    let next;
    if (this.mode === 'shuffle') {
      next = Math.floor(Math.random() * this.list.length);
    } else {
      next = this.idx + 1;
      if (next >= this.list.length) {
        if (this.mode === 'loop') next = 0;
        else { this.updateIcon(); return; }
      }
    }
    this.idx = next;
    this.playSong(this.list[next], this.list);
  },
  toggle() {
    if (!this.audio || !this.audio.src) return;
    if (this.audio.paused) this.audio.play(); else this.audio.pause();
    this.updateIcon();
  },
  prev() {
    if (!this.list.length) return;
    this.idx = (this.idx - 1 + this.list.length) % this.list.length;
    this.playSong(this.list[this.idx], this.list);
  },
  next() {
    if (!this.list.length) return;
    this.idx = (this.idx + 1) % this.list.length;
    this.playSong(this.list[this.idx], this.list);
  },
  showFloat(song) {
    $('#mf-name').textContent = song.name || '';
    $('#mf-artist').textContent = song.artist || '';
    $('#music-float').classList.add('active');
    $('#mf-mode-icon use').setAttribute('href', MODE_ICONS[this.mode]);
    this.updateIcon();
  },
  updateIcon() {
    if (!this.audio) return;
    const icon = $('#mf-pause-icon use');
    if (icon) icon.setAttribute('href', this.audio.paused ? '#i-play' : '#i-pause');
  }
};

/* ==================== 陪伴 ==================== */
const Companion = {
  active: false, type: '', startTime: 0, timer: null, lastLoveMin: 0,
  itfCount: 0, lastSeen: 0, by: 'me', switches: [],
  start(type, by) {
    this.active = true;
    this.type = type;
    this.by = by || 'me';
    this.startTime = Date.now();
    this.lastLoveMin = 0;
    this.itfCount = 0;
    this.lastSeen = Date.now();
    this.switches = [];
    State.companionActive = { id: uid(), type, by: this.by, start: this.startTime, lastSeen: this.lastSeen, itfCount: 0, switches: [] };
    save.companionActive();
    this.showFloat();
    this.tick();
    save.settings();
  },
  switchTo(newType) {
    if (!this.active || this.type === newType) return;
    const t = Date.now();
    const from = this.type;
    this.type = newType;
    this.switches.push({ from, to: newType, t });
    if (State.companionActive) {
      State.companionActive.type = newType;
      State.companionActive.switches = this.switches.slice();
      save.companionActive();
    }
    $('#cf-text').textContent = '祂在陪你 ' + this.type;
  },
  tick() {
    if (!this.active) return;
    const now = Date.now();
    const sec = Math.floor((now - this.startTime) / 1000);
    $('#cf-time').textContent = hms(sec);
    const min = Math.floor(sec / 60);
    const should = Math.floor(min / 10);
    if (should > this.lastLoveMin) {
      addLove(should - this.lastLoveMin);
      this.lastLoveMin = should;
    }
    if (now - this.lastSeen >= 5000) {
      this.lastSeen = now;
      if (State.companionActive) {
        State.companionActive.lastSeen = now;
        State.companionActive.itfCount = this.itfCount;
        save.companionActive();
      }
    }
    this.timer = setTimeout(() => this.tick(), 1000);
  },
  showFloat() {
    $('#cf-avatar-other').src = State.settings.avatars.other || defaultAvatar('blue');
    $('#cf-avatar-me').src = State.settings.avatars.me || defaultAvatar('pink');
    $('#cf-text').textContent = '祂在陪你 ' + this.type;
    $('#cf-time').textContent = '00:00:00';
    $('#companion-float').classList.add('active');
  },
  end() {
    if (!this.active) return;
    const endTime = Date.now();
    const dur = Math.floor((endTime - this.startTime) / 1000);
    State.companionStats.push({ id: uid(), type: this.type, by: this.by || 'me', start: this.startTime, end: endTime, dur, itfCount: this.itfCount, switches: this.switches.slice(), interrupted: false });
    save.companionStats();
    State.companionActive = null;
    save.companionActive();
    this.active = false;
    this.type = '';
    this.switches = [];
    clearTimeout(this.timer);
    $('#companion-float').classList.remove('active');
  }
};

function checkInterruptedCompanion() {
  const ca = State.companionActive;
  if (!ca) return;
  const dur = Math.floor((ca.lastSeen - ca.start) / 1000);
  if (dur >= 10) {
    State.companionStats.push({ id: ca.id || uid(), type: ca.type, by: ca.by || 'me', start: ca.start, end: ca.lastSeen, dur, itfCount: ca.itfCount || 0, switches: ca.switches || [], interrupted: true });
    save.companionStats();
  }
  State.companionActive = null;
  save.companionActive();
}

/* ==================== 视频通话 ==================== */
const Video = {
  active: false, mode: '', status: '', startTime: 0, timer: null,
  lastLoveMin: 0, lastSeen: 0, ringTimeout: null, hangTimer: null,
  miniMode: '', recordId: null,

  callOut() {
    if (this.active) { toast('正在通话中'); return; }
    this.active = true;
    this.mode = 'outgoing';
    this.status = 'calling';
    this.lastSeen = Date.now();
    this.recordId = uid();
    State.videoActive = { id: this.recordId, mode: 'outgoing', start: Date.now(), lastSeen: Date.now(), status: 'calling' };
    save.videoActive();
    this.showLayer('正在呼叫祂...', false);
    const acceptProb = (State.settings.videoAcceptProb != null ? State.settings.videoAcceptProb : 80);
    const delay = 1 + Math.random() * 14;
    this.ringTimeout = setTimeout(() => {
      if (!this.active) return;
      if (Math.random() * 100 < acceptProb) {
        this.startTalking();
      } else {
        this.endCall('rejected');
        const line = VIDEO_REFUSE_LINES[Math.floor(Math.random() * VIDEO_REFUSE_LINES.length)];
        this.addRecord('rejected', 0);
        toast(line);
      }
    }, delay * 1000);
  },

  callIn() {
    if (this.active) return;
    this.active = true;
    this.mode = 'incoming';
    this.status = 'ringing';
    this.lastSeen = Date.now();
    this.recordId = uid();
    State.videoActive = { id: this.recordId, mode: 'incoming', start: Date.now(), lastSeen: Date.now(), status: 'ringing' };
    save.videoActive();
    this.showLayer('祂正在呼叫你...', true);
    this.ringTimeout = setTimeout(() => {
      if (!this.active || this.status !== 'ringing') return;
      this.addRecord('missed', 0);
      this.endCall('missed');
    }, 15000);
  },

  startTalking() {
    if (!this.active) return;
    clearTimeout(this.ringTimeout);
    this.status = 'talking';
    this.startTime = Date.now();
    this.lastLoveMin = 0;
    this.lastSeen = Date.now();
    this.addLoveOnce(5);
    State.videoActive = { id: this.recordId, mode: this.mode, start: this.startTime, lastSeen: this.lastSeen, status: 'talking' };
    save.videoActive();
    this.showLayer('祂正在与你通话中', false);
    this.tick();
    this.scheduleHang();
    toast('已接通');
  },

  tick() {
    if (!this.active || this.status !== 'talking') return;
    const now = Date.now();
    const sec = Math.floor((now - this.startTime) / 1000);
    $('#video-timer').textContent = callTime(sec);
    const should = Math.floor(sec / 300);
    if (should > this.lastLoveMin) {
      addLove(should - this.lastLoveMin);
      this.lastLoveMin = should;
    }
    if (now - this.lastSeen >= 5000) {
      this.lastSeen = now;
      if (State.videoActive) {
        State.videoActive.lastSeen = now;
        State.videoActive.status = 'talking';
        save.videoActive();
      }
    }
    this.timer = setTimeout(() => this.tick(), 1000);
  },

  scheduleHang() {
    const minH = State.settings.videoHangMin != null ? State.settings.videoHangMin : 5;
    const maxH = State.settings.videoHangMax != null ? State.settings.videoHangMax : 10;
    const hours = minH + Math.random() * (maxH - minH);
    this.hangTimer = setTimeout(() => {
      if (!this.active || this.status !== 'talking') return;
      this.endCall('hangup-other');
      const dur = Math.floor((Date.now() - this.startTime) / 1000);
      this.addRecord('normal', dur);
      toast('祂挂断了');
    }, hours * 3600 * 1000);
  },

  hangupMe() {
    if (!this.active) return;
    if (this.status === 'talking') {
      const dur = Math.floor((Date.now() - this.startTime) / 1000);
      this.addRecord('normal', dur);
    } else if (this.status === 'ringing') {
      this.addRecord('rejected', 0);
    }
    this.endCall('me');
  },

  endCall(reason) {
    clearTimeout(this.ringTimeout);
    clearTimeout(this.hangTimer);
    clearTimeout(this.timer);
    this.active = false;
    this.status = '';
    this.mode = '';
    this.miniMode = '';
    State.videoActive = null;
    save.videoActive();
    $('#video-layer').classList.remove('active');
    $('#video-float').classList.remove('active');
    const pop = $('#video-mini-pop');
    if (pop) pop.remove();
    this.renderActions();
  },

  showLayer(statusText, isIncoming) {
    const box = $('#video-box');
    if (box) { box.style.position = ''; box.style.left = ''; box.style.top = ''; box.style.margin = ''; box.style.transform = ''; box.style.width = ''; box.style.height = ''; box.style.maxWidth = ''; box.style.minHeight = ''; box.style.borderRadius = ''; }
    $('#video-avatar').src = State.settings.avatars.other || defaultAvatar('blue');
    $('#video-name').textContent = State.settings.otherCall || '祂';
    $('#video-status').textContent = statusText;
    $('#video-timer').style.display = (this.status === 'talking') ? '' : 'none';
    $('#video-layer').classList.add('active');
    this.renderActions(isIncoming);
  },

  renderActions(isIncoming) {
    const acts = $('#video-actions');
    if (!acts) return;
    acts.innerHTML = '';
    if (this.status === 'ringing') {
      const a = document.createElement('button');
      a.className = 'video-btn accept';
      a.innerHTML = '<svg style="width:28px;height:28px"><use href="#i-phone"/></svg>';
      a.onclick = () => { this.startTalking(); };
      const r = document.createElement('button');
      r.className = 'video-btn reject';
      r.innerHTML = '<svg style="width:28px;height:28px"><use href="#i-hangup"/></svg>';
      r.onclick = () => { this.addRecord('rejected', 0); this.endCall('me'); };
      acts.appendChild(a); acts.appendChild(r);
    } else if (this.status === 'calling') {
      const r = document.createElement('button');
      r.className = 'video-btn reject';
      r.innerHTML = '<svg style="width:28px;height:28px"><use href="#i-hangup"/></svg>';
      r.onclick = () => { this.endCall('me'); };
      acts.appendChild(r);
    } else if (this.status === 'talking') {
      const m = document.createElement('button');
      m.className = 'video-btn mini';
      m.innerHTML = '□';
      m.onclick = () => { this.pickMiniMode(); };
      const r = document.createElement('button');
      r.className = 'video-btn reject';
      r.innerHTML = '<svg style="width:28px;height:28px"><use href="#i-hangup"/></svg>';
      r.onclick = () => { this.hangupMe(); };
      acts.appendChild(m); acts.appendChild(r);
    }
  },

  pickMiniMode() {
    const old = $('#video-mini-pop');
    if (old) { old.remove(); return; }
    const box = $('#video-box');
    const br = box ? box.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2, width: 0, height: 0 };
    const popW = 150;
    let left = br.left + br.width / 2 - popW / 2;
    left = Math.max(8, Math.min(window.innerWidth - popW - 8, left));

    const pop = document.createElement('div');
    pop.id = 'video-mini-pop';
    pop.style.cssText = 'position:fixed;z-index:1600;width:' + popW + 'px;border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(255,255,255,0.5);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,0.6);box-shadow:0 6px 22px rgba(120,120,130,0.22)';
    pop.innerHTML = `
      <div class="vm-cell" data-vm="mini"><div class="vm-icon">▪</div><div class="vm-name">迷你</div></div>
      <div class="vm-cell" data-vm="small"><div class="vm-icon">▫</div><div class="vm-name">小</div></div>
      <div class="vm-cell" data-vm="standard"><div class="vm-icon">□</div><div class="vm-name">标准</div></div>
    `;
    document.body.appendChild(pop);

    const ph = pop.offsetHeight;
    let topFinal = br.top - ph - 12;
    if (topFinal < 8) topFinal = br.top + br.height + 12;
    pop.style.left = left + 'px';
    pop.style.top = topFinal + 'px';

    pop.querySelectorAll('[data-vm]').forEach(el => {
      el.onclick = () => { pop.remove(); this.toMini(el.dataset.vm); };
    });
    setTimeout(() => {
      const off = (ev) => {
        if (!pop.contains(ev.target) && !ev.target.closest('.video-btn')) { pop.remove(); document.removeEventListener('click', off); }
      };
      document.addEventListener('click', off);
    }, 50);
  },

  toMini(mode) {
    if (mode === 'standard') {
      const box = $('#video-box');
      if (box) { box.style.position = ''; box.style.left = ''; box.style.top = ''; box.style.margin = ''; box.style.transform = ''; box.style.width = ''; box.style.height = ''; box.style.maxWidth = ''; box.style.minHeight = ''; box.style.borderRadius = ''; }
      $('#video-layer').classList.add('active');
      $('#video-float').classList.remove('active');
      this.miniMode = '';
      this.renderActions();
      return;
    }
    this.miniMode = mode;
    $('#video-layer').classList.remove('active');
    const f = $('#video-float');
    f.classList.remove('active');
    $('#vf-avatar-other').src = State.settings.avatars.other || defaultAvatar('blue');
    $('#vf-avatar-me').src = State.settings.avatars.me || defaultAvatar('pink');
    $('#vf-name').textContent = State.settings.otherCall || '祂';
    f.classList.toggle('mini-size', mode === 'mini');
    f.classList.toggle('small-size', mode === 'small');
    f.classList.add('active');
    this.floatTick();
  },

  floatTick() {
    if (!this.active || this.status !== 'talking' || !this.miniMode) return;
    const sec = Math.floor((Date.now() - this.startTime) / 1000);
    $('#vf-time').textContent = callTime(sec);
    setTimeout(() => this.floatTick(), 1000);
  },

  addRecord(type, dur) {
    if (!this.recordId) this.recordId = uid();
    const mode = this.mode || 'outgoing';
    let startTs, endTs;
    if (type === 'normal' && this.startTime) {
      startTs = this.startTime; endTs = Date.now();
    } else if (type === 'missed' || type === 'rejected') {
      startTs = Date.now(); endTs = Date.now();
    } else {
      startTs = this.startTime || Date.now(); endTs = Date.now();
    }
    State.videoRecords.push({ id: this.recordId, type, mode, start: startTs, end: endTs, dur, t: Date.now() });
    save.videoRecords();
    const m = { id: uid(), who: 'sys', type: 'sys', text: '', t: nowHM(), ts: Date.now() };
    if (type === 'normal') {
      const s = new Date(startTs), e = new Date(endTs);
      m.text = '开始 ' + pad(s.getHours()) + ':' + pad(s.getMinutes()) + ' 结束 ' + pad(e.getHours()) + ':' + pad(e.getMinutes()) + ' 通话时长 ' + callTime(dur);
    } else if (type === 'missed') {
      m.text = nowHM() + ' 未接来电';
    } else if (type === 'rejected') {
      m.text = nowHM() + ' 已拒绝';
    } else {
      m.text = nowHM() + ' 通话中断';
    }
    State.messages.push(m);
    save.messages(); renderMessages(); scrollBottom();
  },

  addLoveOnce(n) { addLove(n); }
};

function checkInterruptedVideo() {
  const va = State.videoActive;
  if (!va) return;
  if (va.status === 'talking') {
    const dur = Math.floor((va.lastSeen - va.start) / 1000);
    if (dur >= 10) {
      State.videoRecords.push({ id: va.id || uid(), type: 'interrupted', mode: va.mode || '', start: va.start, end: va.lastSeen, dur, t: Date.now() });
      save.videoRecords();
      const m = { id: uid(), who: 'sys', type: 'sys', text: nowHM() + ' 通话中断', t: nowHM(), ts: Date.now() };
      State.messages.push(m);
      save.messages();
    }
  } else if (va.status === 'ringing') {
    State.videoRecords.push({ id: va.id || uid(), type: 'missed', mode: va.mode || '', start: va.start, end: va.lastSeen, dur: 0, t: Date.now() });
    save.videoRecords();
    const m = { id: uid(), who: 'sys', type: 'sys', text: nowHM() + ' 未接来电', t: nowHM(), ts: Date.now() };
    State.messages.push(m);
    save.messages();
  } else if (va.status === 'calling') {
    State.videoRecords.push({ id: va.id || uid(), type: 'interrupted', mode: va.mode || '', start: va.start, end: va.lastSeen, dur: 0, t: Date.now() });
    save.videoRecords();
  }
  State.videoActive = null;
  save.videoActive();
}

function initLockPage() {
  function tick() {
    const d = new Date();
    const week = ['日','一','二','三','四','五','六'][d.getDay()];
    $('#lock-time').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
  $('#lock-love').textContent = LOVE_QUOTES[Math.floor(Math.random() * LOVE_QUOTES.length)];
  $('#btn-enter').onclick = () => {
    const mode = State.settings.lockMode;
    const today = new Date().toDateString();
    let needPass = false;
    if (mode === 'first') needPass = !State.settings.lockPassed;
    else if (mode === 'daily') needPass = State.settings.lastLockDay !== today;
    else if (mode === 'refresh') needPass = true;
    if (!needPass) { enterChat(); return; }
    $('#btn-enter').style.display = 'none';
    $('#lock-pass').classList.add('active');
    setTimeout(() => $('#lock-pass-input').focus(), 200);
  };
  const input = $('#lock-pass-input'); const dots = $('#lock-pass-dots');
  function renderDots(n) { dots.innerHTML = ''; for (let i = 0; i < n; i++) dots.appendChild(document.createElement('i')); }
  function passOK() {
    State.settings.lockPassed = true; State.settings.lastLockDay = new Date().toDateString();
    save.settings(); input.blur(); input.value = ''; renderDots(0);
    $('#lock-pass').classList.remove('active'); $('#btn-enter').style.display = '';
    enterChat();
  }
  function failPass() { input.value = ''; renderDots(0); const box = $('#lock-pass'); box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 400); }
  input.addEventListener('input', () => {
    const v = input.value; renderDots(v.length);
    if (LOCK_PASSWORDS.includes(v)) { passOK(); return; }
    if (!LOCK_PASSWORDS.some(p => p.startsWith(v)) && v.length > 0) failPass();
  });
  input.addEventListener('paste', () => { setTimeout(() => { const v = input.value; renderDots(v.length); if (LOCK_PASSWORDS.includes(v)) passOK(); else if (v) failPass(); }, 30); });
  renderDots(0);
}

/* 祂主动发消息 */
function checkActiveMsg() {
  if (!State.settings.activeMsgEnabled) return;
  if (inDND()) return;
  if (Video.active) return;
  const chatActive = $('#page-chat') && $('#page-chat').classList.contains('active');
  const visible = document.visibilityState === 'visible';
  if (!chatActive || !visible) return;
  const now = Date.now();
  const level = State.settings.activeMsgLevel || 'daily';
  const cfg = {
    light: { prob: 0.5, gapMin: 60 },
    daily: { prob: 1, gapMin: 30 },
    sticky: { prob: 2, gapMin: 15 },
    vsticky: { prob: 3, gapMin: 10 }
  }[level] || { prob: 1, gapMin: 30 };
  if (now - activeMsgLastTime < cfg.gapMin * 60 * 1000) return;
  if (Math.random() * 100 >= cfg.prob) return;
  activeMsgLastTime = now;
  const usable = State.cards.filter(c => !c.locked);
  if (!usable.length) return;
  const n = 1 + Math.floor(Math.random() * 2);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(usable[Math.floor(Math.random() * usable.length)].text);
  let idx = 0;
  const sendNext = () => {
    if (idx >= picked.length) return;
    let txt = picked[idx];
    if (State.settings.emojiEnabled && Math.random() * 100 < (State.settings.emojiProb || 0)) {
      const e = randomEmoji();
      if (e) txt = (Math.random() < 0.5) ? (e + txt) : (txt + e);
    }
    pushOther(txt);
    idx++;
    if (idx < picked.length) setTimeout(sendNext, getMultiGap() * 1000);
  };
  sendNext();
}

let multiSendMode = false;
const MSG_PAGE = 20;
let renderedCount = MSG_PAGE;
let archiveMode = false;
let archiveSelected = new Set();
let quoteTarget = null;

function initChatPage() {
  const input = $('#chat-input'); const btn = $('#btn-plus-send'); const icon = $('#plus-send-icon use');
  input.addEventListener('input', () => { icon.setAttribute('href', input.value.trim() ? '#i-send' : '#i-plus-circle'); });
  btn.onclick = () => {
    if (input.value.trim()) { sendMyText(input.value.trim()); input.value = ''; icon.setAttribute('href', '#i-plus-circle'); }
    else openPlusMenu();
  };
  $('#btn-stack').onclick = () => { triggerReply(); };
  $('#btn-lightning').onclick = () => {
    multiSendMode = !multiSendMode;
    $('#btn-lightning').classList.toggle('on', multiSendMode);
    if (!multiSendMode) triggerReply();
  };
  $('#quote-bar-x').onclick = () => { quoteTarget = null; $('#quote-bar').classList.remove('active'); };
  const body = $('#chat-body');
  body.addEventListener('scroll', () => {
    if (body.scrollTop < 30 && renderedCount < State.messages.length && !archiveMode) {
      const prevH = body.scrollHeight;
      renderedCount += MSG_PAGE;
      renderMessages();
      body.scrollTop = body.scrollHeight - prevH + body.scrollTop;
    }
  });
  $('#arc-all').onclick = () => { State.messages.forEach(m => { if (m.type !== 'sys') archiveSelected.add(m.id); }); renderMessages(); };
  $('#arc-exit').onclick = () => exitArchiveMode();
  $('#arc-go').onclick = doArchive;
  $('#mf-close').onclick = () => { $('#music-float').classList.remove('active'); if (Player.audio) Player.audio.pause(); Player.updateIcon(); };
  $('#mf-pause').onclick = () => Player.toggle();
  $('#mf-prev').onclick = () => Player.prev();
  $('#mf-next').onclick = () => Player.next();
  $('#mf-mode').onclick = () => {
    const i = MODES.indexOf(Player.mode);
    Player.mode = MODES[(i + 1) % MODES.length];
    $('#mf-mode-icon use').setAttribute('href', MODE_ICONS[Player.mode]);
    toast(MODE_NAMES[Player.mode]);
  };
  initMusicFloatDrag();
  $('#cf-end').onclick = () => {
    Companion.end();
    toast('陪伴结束');
  };
  initCompanionFloatDrag();
  $('#vf-expand').onclick = () => { Video.pickMiniMode(); };
  initVideoFloatDrag();
  initTouchFloatDrag();
  $('#tf-close').onclick = () => closeTouchFloat();

function renderMessages() {
  const body = $('#chat-body'); if (!body) return;
  body.innerHTML = '';
  const total = State.messages.length;
  const start = Math.max(0, total - renderedCount);
  const slice = State.messages.slice(start);
  slice.forEach((m, i) => {
    if (m.type === 'sys') {
      const el = document.createElement('div');
      el.className = 'sys-msg';
      el.innerHTML = `<span>${escapeHTML(m.text || '')}</span>`;
      body.appendChild(el);
      return;
    }
    let prevSame = false;
    if (i > 0) prevSame = (slice[i - 1].who === m.who);
    else {
      const globalPrev = State.messages[start - 1];
      prevSame = globalPrev ? (globalPrev.who === m.who && globalPrev.type !== 'sys') : false;
    }
    const row = buildMsgRow(m, prevSame);
    if (archiveMode) {
      row.classList.add('archive-mode');
      if (archiveSelected.has(m.id)) row.classList.add('checked');
      const chk = document.createElement('div'); chk.className = 'msg-check';
      row.insertBefore(chk, row.firstChild);
      row.onclick = () => {
        if (archiveSelected.has(m.id)) archiveSelected.delete(m.id);
        else archiveSelected.add(m.id);
        row.classList.toggle('checked', archiveSelected.has(m.id));
      };
    } else {
      bindLongPress(row, () => openMsgMenu(m));
    }
    body.appendChild(row);
  });
}
function buildMsgRow(m, prevSame) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (m.who === 'me' ? 'me' : 'other');
  if (m.id) row.dataset.mid = m.id;
  const av = document.createElement('img');
  av.className = 'msg-avatar';
  av.src = m.who === 'me' ? (State.settings.avatars.me || defaultAvatar('pink')) : (State.settings.avatars.other || defaultAvatar('blue'));
  if (!State.settings.showEveryAvatar && prevSame) av.classList.add('avatar-hidden');
  const col = document.createElement('div'); col.className = 'msg-col';

  if (m.quote) {
    const qb = document.createElement('div'); qb.className = 'quote-block';
    if (m.quote.thumb) qb.innerHTML = `<img class="quote-thumb" src="${m.quote.thumb}"><span class="quote-text">${escapeHTML(m.quote.text || '')}</span>`;
    else qb.innerHTML = `<span class="quote-text">${escapeHTML(m.quote.text || '')}</span>`;
    qb.onclick = () => jumpToMsg(m.quote.id);
    col.appendChild(qb);
  }

  if (m.type === 'card') col.appendChild(buildCard(m));
  else if (m.type === 'quiz') col.appendChild(buildQuizCard(m));
  else if (m.type === 'song') col.appendChild(buildSongCard(m));
  else if (m.type === 'companion') col.appendChild(buildCompanionCard(m));
  else if (m.type === 'itf') col.appendChild(buildItfBubble(m));
  else if (m.type === 'sticker') col.appendChild(buildStickerBubble(m));
  else if (m.type === 'gift') col.appendChild(buildGiftCard(m));
  else if (m.type === 'box') col.appendChild(buildBoxCard(m));
  else {
    const b = document.createElement('div'); b.className = 'bubble';
    if (m.type === 'img') { b.classList.add('media'); const im = document.createElement('img'); im.src = m.src; b.appendChild(im); }
    else {
      b.classList.add(m.who === 'me' ? 'message-sent' : 'message-received');
      b.textContent = m.text;
    }
    const hm = heartMarkOf(m.id);
    if (hm) { const s = document.createElement('span'); s.className = 'heart-mark'; s.textContent = hm; b.appendChild(s); }
    col.appendChild(b);
  }
  const meta = document.createElement('div'); meta.className = 'msg-meta'; meta.textContent = m.t;
  if (m.who === 'me' && m.read) { const r = document.createElement('span'); r.className = 'read-flag'; r.textContent = '已读'; meta.appendChild(r); }
  col.appendChild(meta);

  return row;
}

function heartMarkOf(mid) {
  const hs = State.hearts.filter(h => h.mid === mid);
  if (!hs.length) return '';
  const byMe = hs.some(h => h.by === 'me');
  const other = hs.some(h => h.by === 'other');
  if (byMe && other) return '💕';
  if (byMe) return '🩷';
  return '🥰';

function openMsgMenu(m) {
  if (m.type === 'sys') return;
  const isGiftClosed = (m.type === 'gift' && !m.opened) || (m.type === 'box' && !m.opened);
  const isCard = (m.type === 'card' || m.type === 'quiz' || m.type === 'song' || m.type === 'companion' || isGiftClosed);
  let html = '';
  if (!isCard) {
    html += `<div class="msg-menu-item" id="mm-quote"><svg><use href="#i-quote"/></svg>引用</div>`;
    html += `<div class="msg-menu-item" id="mm-heart"><svg><use href="#i-heart-mark"/></svg>心动</div>`;
  }
  html += `<div class="msg-menu-item danger" id="mm-del"><svg><use href="#i-trash"/></svg>删除</div>`;
  openModal({ title: '', bodyHTML: html, actions: [] });
  if (!isCard) {
    $('#mm-quote').onclick = () => { closeModal(); doQuote(m); };
    $('#mm-heart').onclick = () => { closeModal(); doHeart(m, 'me'); };
  }
  $('#mm-del').onclick = () => {
    closeModal();
    State.messages = State.messages.filter(x => x.id !== m.id);
    save.messages(); renderMessages();
  };
}
function doQuote(m) {
  let text = '';
  if (m.type === 'itf') text = m.content || '';

  const usable = State.cards.filter(c => !c.locked);
  if (State.cards.length === 0) { toast('还没有字卡，祂暂时说不了话'); return; }
  if (usable.length === 0) { toast('字卡都被锁上了，祂说不了话'); return; }

  const heartMsg = maybeOtherHeart();
  const invite = maybeOtherInvite();

  const activeItf = maybeActiveInteraction();

  const giftMsg = maybeOtherGift();
  const boxMsg = maybeOtherBox();
  const videoCall = maybeOtherVideo();
  const noteReply = maybeNoteReply();
  const spacePost = maybeSpacePost();
  const n = 1 + Math.floor(Math.random() * 3);
  const picked = [];
  for (let i = 0; i < n; i++) picked.push(usable[Math.floor(Math.random() * usable.length)].text);
  let idx = 0;

    if (idx >= picked.length) return;

      const e = randomEmoji();

let touchFloatInited = false;
function initTouchFloatDrag() {
  const el = $('#touch-float'); if (!el || touchFloatInited) return;
  touchFloatInited = true;
  let startX = 0, startY = 0, startL = 0, startT = 0, dragging = false;
  function begin(x, y) {
    startX = x; startY = y; const r = el.getBoundingClientRect();
    startL = r.left; startT = r.top; dragging = true;
    el.style.left = startL + 'px'; el.style.top = startT + 'px';
    el.style.transform = 'none'; el.style.marginTop = '0'; el.style.bottom = 'auto';
  }
  function move(x, y) {
    if (!dragging) return;
    let nl = startL + (x - startX), nt = startT + (y - startY);
    nl = Math.max(0, Math.min(window.innerWidth - el.offsetWidth, nl));
    nt = Math.max(0, Math.min(window.innerHeight - el.offsetHeight, nt));
    el.style.left = nl + 'px'; el.style.top = nt + 'px';
  }
  function end() { dragging = false; }
  el.addEventListener('touchstart', e => {
    if (e.target.closest('.touch-btn') || e.target.closest('#tf-close')) return;
    const t = e.touches[0]; begin(t.clientX, t.clientY);
  }, { passive: true });
  el.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('mousedown', e => {
    if (e.target.closest('.touch-btn') || e.target.closest('#tf-close')) return;
    begin(e.clientX, e.clientY);
    const mm = ev => move(ev.clientX, ev.clientY);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); end(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}

function runArchive(dayStr) {
  const ids = [...archiveSelected];
  openModal({ title: '归档中', bodyHTML: `<div style="text-align:center"><div id="arc-stage" style="margin-bottom:12px;font-size:13px;color:var(--text-soft)">准备中…</div><div style="height:6px;border-radius:3px;background:var(--glass-bg-strong);overflow:hidden"><div id="arc-bar" style="height:100%;width:0;background:var(--accent-deep);transition:width .2s"></div></div><div id="arc-pct" style="margin-top:8px;font-size:13px">0%</div></div>`, actions: [] });
  $('#modal-mask').style.pointerEvents = 'none';
  let i = 0;
  const step = () => {
    if (i >= ids.length) {
      const moving = State.messages.filter(m => archiveSelected.has(m.id));
      let entry = State.archive.find(a => a.day === dayStr);
      if (!entry) { entry = { day: dayStr, messages: [] }; State.archive.push(entry); }
      moving.forEach(m => entry.messages.push(m));
      State.archive.sort((a, b) => b.day.localeCompare(a.day));
      State.messages = State.messages.filter(m => archiveSelected.has(m.id) ? false : (m.type === 'sys' ? false : true));
      save.messages(); save.archive();
      archiveMode = false; archiveSelected.clear();
      $('#chat-footer').style.display = '';
      $('#archive-bar').style.display = 'none';
      renderMessages();
      $('#modal-mask').style.pointerEvents = '';
      closeModal();
      return;
    }
    $('#arc-stage').textContent = '正在归档：第 ' + (i+1) + ' 条…';
    const pct = Math.round((i+1) / ids.length * 100);
    $('#arc-bar').style.width = pct + '%'; $('#arc-pct').textContent = pct + '%';
    i++;
    setTimeout(step, 80);
  };
  setTimeout(step, 200);
}

/* ==================== sheet 下滑关闭 ==================== */
function initSheetDrag() {
  const sheet = $('#sheet'); const mask = $('#sheet-mask');
  if (!sheet || !mask) return;
  let startY = 0, curY = 0, dragging = false, moved = false;
  const onStart = (y) => { startY = y; curY = 0; dragging = true; moved = false; sheet.style.transition = 'none'; };
  const onMove = (y) => {
    if (!dragging) return;
    let dy = y - startY;
    if (dy < 0) dy = 0;
    curY = dy;
    if (dy > 4) moved = true;
    sheet.style.transform = `translateY(${dy}px)`;
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .26s cubic-bezier(.2,.9,.3,1.1)';
    const threshold = sheet.offsetHeight * 0.25;
    if (moved && curY > threshold) {
      sheet.style.transform = `translateY(${sheet.offsetHeight}px)`;
      setTimeout(() => { closeSheet(); sheet.style.transform = ''; sheet.style.transition = 'none'; }, 240);
    } else {
      sheet.style.transform = '';
    }
  };
  sheet.addEventListener('touchstart', e => { const t = e.touches[0]; onStart(t.clientY); }, { passive: true });
  sheet.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientY); }, { passive: true });
  sheet.addEventListener('touchend', onEnd);
  sheet.addEventListener('mousedown', e => {
    onStart(e.clientY);
    const mm = ev => onMove(ev.clientY);
    const mu = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); onEnd(); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}

/* ==================== 标点拼接 ==================== */
function buildFromCards(minN, maxN) {
  const usable = State.cards.filter(c => !c.locked);
  if (usable.length < minN) return '';
  const count = minN + Math.floor(Math.random() * (maxN - minN + 1));
  const picked = [];
  for (let i = 0; i < count; i++) picked.push(usable[Math.floor(Math.random() * usable.length)].text);
  const parts = picked.map(t => String(t).trim()).filter(Boolean);
  if (!parts.length) return '';
  const sep = () => { const r = Math.random() * 100; if (r < 80) return '，'; if (r < 95) return '、'; return '；'; };
  const endPunct = /[。！？!?…~～，,、；;：:.]$/;
  let out = '';
  parts.forEach((p, i) => {
    if (i === 0) { out = p; return; }
    if (endPunct.test(out)) out += p;
    else out += sep() + p;
  });
  if (!/[。！？!?…~～]$/.test(out)) {
    const r = Math.random() * 100;
    out += r < 60 ? '。' : (r < 80 ? '～' : '…');
  }
  if (State.settings.emojiEnabled && Math.random() * 100 < (State.settings.emojiProb || 0)) {
    const e = randomEmoji();
    if (e) out = (Math.random() < 0.5) ? (e + out) : (out + e);
  }
  return out;
}
function buildMailBody() {
  const segCount = 1 + Math.floor(Math.random() * 3);
  const total = 15 + Math.floor(Math.random() * 16);
  let left = total;
  const perSeg = [];
  for (let i = 0; i < segCount; i++) {
    const remain = segCount - i;
    if (remain === 1) { perSeg.push(left); break; }
    const minEach = 5;
    const maxEach = left - (remain - 1) * minEach;
    const n = minEach + Math.floor(Math.random() * Math.max(1, maxEach - minEach + 1));
    perSeg.push(n);
    left -= n;
  }
  const segs = [];
  perSeg.forEach(n => { const t = buildFromCards(n, n); if (t) segs.push(t); });
  return segs.join('\n\n');
}

  const sorted = [...State.spaces].sort((a, b) => (b.ts || 0) - (a.ts || 0));
  sorted.forEach(s => {
    const card = document.createElement('div');
    card.className = 'space-card';
    card.setAttribute('data-who', s.who);
    const av = s.who === 'me' ? (State.settings.avatars.me || defaultAvatar('pink')) : (State.settings.avatars.other || defaultAvatar('blue'));
    const call = s.who === 'me' ? (State.settings.myCall || '我') : (State.settings.otherCall || '祂');

    if (s.text) inner += `<div class="space-text">${escapeHTML(s.text)}</div>`;
    if (s.imgs && s.imgs.length) inner += `<div class="space-imgs">` + s.imgs.map(src => `<img src="${src}">`).join('') + `</div>`;
    inner += `<div class="space-time">${relTime(s.ts)}</div>`;

    card.onclick = () => openSpaceMenu(s);
    list.appendChild(card);
  });

let _spTempImgs = [];
function openSpaceWrite(editItem) {
  ensureSpaceQuota();
  const q = State.spaceQuota;
  const used = (q.me || 0);
  const freeLeft = Math.max(0, SPACE_QUOTA_FREE - used);
  const needPay = !editItem && used >= SPACE_QUOTA_FREE;
  if (needPay && State.love < SPACE_QUOTA_COST) {
    openModal({ title: '', bodyHTML: `免费额度用完了，发动态需要 ${SPACE_QUOTA_COST} 爱意值，当前爱意不足。`, actions: [] });
    setTimeout(closeModal, 2000); return;
  }
  _spTempImgs = editItem ? (editItem.imgs || []).slice() : [];
  const tip = needPay ? `本次将消耗 ${SPACE_QUOTA_COST} 爱意值` : `今日免费额度剩余 ${freeLeft} 条`;
  const previewHTML = _spTempImgs.map((src, i) => `<img class="sp-thumb" data-spimg="${i}" src="${src}">`).join('');
  openModal({
    title: editItem ? '编辑动态' : '发动态',
    wide: true,
    bodyHTML: `

      <div style="font-size:12.5px;color:var(--text-soft);margin-top:8px;text-align:center" id="sp-tip">${tip}</div>
    `,
    actions: [{ label: '发布', green: true, keepOpen: true, onClick: () => doPostSpace(editItem) }]
  });
  const refreshPreview = () => {
    const box = $('#sp-img-preview');
    if (!box) return;
    box.innerHTML = _spTempImgs.map((src, i) => `<img class="sp-thumb" data-spimg="${i}" src="${src}">`).join('');
    bindThumbDel();
  };
  const bindThumbDel = () => {
    $$('#sp-img-preview [data-spimg]').forEach(el => {
      el.onclick = () => { const i = +el.dataset.spimg; _spTempImgs.splice(i, 1); refreshPreview(); };
    });
  };
  $('#sp-pick-img').onclick = () => pickImage((dataUrl) => { _spTempImgs.push(dataUrl); refreshPreview(); }, true);
  bindThumbDel();
  if (editItem) { const t = $('#sp-tip'); if (t) t.style.display = 'none'; }
  setTimeout(() => { const el = $('#space-input'); if (el) el.focus(); }, 100);
}
function doPostSpace(editItem) {
  const ta = $('#space-input');
  const text = ta ? ta.value.trim() : '';
  const imgs = _spTempImgs.slice();
  if (!text && !imgs.length) { toast('写点什么吧'); return; }
  if (editItem) {
    editItem.text = text;
    editItem.imgs = imgs;
    save.spaces();
    closeModal(); renderSpaceList(); toast('已更新');
    return;
  }
  ensureSpaceQuota();
  const q = State.spaceQuota;
  const used = (q.me || 0);
  const needPay = used >= SPACE_QUOTA_FREE;
  if (needPay) {
    if (State.love < SPACE_QUOTA_COST) { toast('爱意值不够'); return; }
    State.love -= SPACE_QUOTA_COST; save.love();
    const el = $('#hdr-love'); if (el) el.textContent = State.love;
  }
  q.me = used + 1; save.spaceQuota();
  State.spaces.push({ id: uid(), who: 'me', text, imgs, read: true, ts: Date.now() });
  save.spaces();
  addLove(2);
  closeModal(); renderSpaceList();
  const list = $('#space-list'); if (list) list.scrollTop = 0;
  toast(needPay ? '已发布（-' + SPACE_QUOTA_COST + '爱意）' : '已发布');
}
function pushOtherSpace() {
  ensureSpaceQuota();
  const q = State.spaceQuota;
  const used = (q.other || 0);
  const needPay = used >= SPACE_QUOTA_FREE;
  if (needPay) {
    if (State.love < SPACE_QUOTA_COST) return;
    State.love -= SPACE_QUOTA_COST; save.love();
    const el = $('#hdr-love'); if (el) el.textContent = State.love;
  }

  }
  q.other = used + 1; save.spaceQuota();

/* ==================== openSub ==================== */
function setSubAction(iconHTML, onClick) {
  const el = $('#sub-action');
  if (!el) return;
  if (!iconHTML) { el.style.display = 'none'; el.innerHTML = ''; el.onclick = null; el.classList.remove('show'); return; }
  el.style.display = '';
  el.classList.add('show');
  el.innerHTML = iconHTML;
  el.onclick = onClick || null;
}
function openSub(title, bodyHTML, afterRender) {
  const subPage = $('#page-sub');
  if (subPage.classList.contains('active')) {
    subStack.push({
      title: $('#sub-title').textContent,
      html: $('#sub-body').innerHTML,
      after: subPage._afterRender || null,
      padOff: $('#sub-body').classList.contains('pad-off'),
      actionHTML: $('#sub-action') ? $('#sub-action').innerHTML : '',
      actionShow: $('#sub-action') ? $('#sub-action').classList.contains('show') : false,
      actionClick: $('#sub-action') ? $('#sub-action').onclick : null
    });
  } else {
    subStack = [];
  }
  setSubAction('');
  $('#sub-title').textContent = title;
  const sb = $('#sub-body');
  sb.classList.remove('pad-off');
  sb.innerHTML = bodyHTML;
  sb.style.padding = '';
  showPage('page-sub');
  subPage._afterRender = afterRender || null;
  if (afterRender) afterRender();
}

function openDayEditor(d) {
  const editing = d ? { ...d } : { id: uid(), name: '', date: '', repeat: 'none' };
  const repeatLabel = { none: '不重复', weekly: '每周', monthly: '每月', yearly: '每年' };
  openModal({
    title: d ? '编辑重要日' : '添加重要日',
    bodyHTML: `
      <input class="field" id="day-name" placeholder="名称" value="${escapeHTML(editing.name)}" style="margin-bottom:10px">
      <input class="field" id="day-date" type="date" value="${editing.date}" style="margin-bottom:10px">
      <div class="set-row" id="day-repeat-row" style="cursor:pointer"><span class="label">重复</span><span class="value" id="day-repeat-val">${repeatLabel[editing.repeat]}</span></div>
    `,
    actions: [{ label: '保存', keepOpen: true, onClick: () => {
      const name = $('#day-name').value.trim();
      const date = $('#day-date').value;
      if (!name || !date) { openModal({ title:'', bodyHTML:'名称和日期都要填', actions: [] }); setTimeout(closeModal, 1500); return; }
      editing.name = name; editing.date = date;
      if (d) { const i = State.days.findIndex(x => x.id === d.id); State.days[i] = editing; }
      else State.days.push(editing);
      save.days(); closeModal(); renderDays();
    }}]
  });
  setTimeout(() => {
    $('#day-repeat-row').onclick = () => {
      openDropdown($('#day-repeat-row'),
        Object.keys(repeatLabel).map(k => ({ value: k, label: repeatLabel[k] })),
        (v) => { editing.repeat = v; $('#day-repeat-val').textContent = repeatLabel[v]; },
        editing.repeat);
    };
  }, 50);
}
function renderDays() {
  const list = $('#day-list'); if (!list) return;
  if (!State.days.length) { list.innerHTML = `<div class="empty-tip">还没有重要日。</div>`; return; }
  const sorted = [...State.days].sort((a, b) => nextDate(a).getTime() - nextDate(b).getTime());
  list.innerHTML = '';
  sorted.forEach(d => {
    const nd = nextDate(d);
    const days = Math.round((nd - startOfDay(new Date())) / 86400000);
    let countText;
    if (days === 0) countText = '就是今天';
    else if (days > 0) countText = '还有 ' + days + ' 天';
    else countText = '已过 ' + (-days) + ' 天';
    const repeatLabel = { none: '', weekly: '每周', monthly: '每月', yearly: '每年' }[d.repeat];
    const el = document.createElement('div');
    el.className = 'day-item';
    el.innerHTML = `
      <div class="day-info">
        <div class="day-name">${escapeHTML(d.name)}${repeatLabel ? `<span class="day-repeat">${repeatLabel}</span>` : ''}</div>
        <div class="day-sub">${d.date}</div>
      </div>
      <div class="day-count">${countText}</div>
    `;
    el.onclick = () => openDayEditorMenu(d);
    list.appendChild(el);
  });
}
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function nextDate(d) {
  const base = new Date(d.date + 'T00:00:00');
  const today = startOfDay(new Date());
  if (d.repeat === 'none') return base;
  let next = new Date(base);
  if (d.repeat === 'weekly') { while (next < today) next.setDate(next.getDate() + 7); }
  else if (d.repeat === 'monthly') { while (next < today) next.setMonth(next.getMonth() + 1); }
  else if (d.repeat === 'yearly') { while (next < today) next.setFullYear(next.getFullYear() + 1); }
  return next;
}
function openDayEditorMenu(d) {
  openModal({ title: escapeHTML(d.name), bodyHTML: '', actions: [
    { label: '删除', danger: true, onClick: () => { State.days = State.days.filter(x => x.id !== d.id); save.days(); renderDays(); } }
  ]});
}

function runMoodHis() {
  const now = new Date();
  const s = State.settings;
  const targetH = s.moodHour ?? 20, targetM = s.moodMinute ?? 0;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const todayK = todayKey();
  const allKeys = Object.keys(State.moods).sort();
  let startDate;
  if (allKeys.length) {
    const earliest = allKeys[0];
    startDate = new Date(earliest + 'T00:00:00');
  } else {
    startDate = new Date(now); startDate.setHours(0,0,0,0);
  }
  const today0 = new Date(now); today0.setHours(0,0,0,0);
  for (let d = new Date(startDate); d <= today0; d.setDate(d.getDate() + 1)) {
    const k = dayKey(d.getTime());
    const isToday = k === todayK;
    if (isToday) {
      let rec = State.moods[k];
      if (!rec) { State.moods[k] = {}; rec = State.moods[k]; }
      if (rec._targetMin == null) {
        const base = targetH * 60 + targetM;
        const maxMin = Math.min(base + 180, 23 * 60 + 59);
        rec._targetMin = base + Math.floor(Math.random() * Math.max(1, maxMin - base));
      }
      if (nowMin < rec._targetMin) continue;
    }
    if (State.moods[k] && State.moods[k].his) continue;
    if (!State.moods[k]) State.moods[k] = {};
    const moodIdx = Math.floor(Math.random() * MOODS.length);
    const moodT = MOODS[moodIdx].t;
    let line;
    const itfStat = State.itfStats[k];
    if (itfStat && itfStat.total >= 5 && Math.random() < 0.6) {
      const positive = ['开心','想你','兴奋'];
      const pickT = positive[Math.floor(Math.random() * positive.length)];
      const lines = HIS_LINES[pickT];
      line = lines[Math.floor(Math.random() * lines.length)];
    } else {
      const lines = HIS_LINES[moodT] || HIS_LINES['平淡'];
      line = lines[Math.floor(Math.random() * lines.length)];
    }
    const weather = HIS_WEATHER[Math.floor(Math.random() * HIS_WEATHER.length)];
    State.moods[k].his = { mood: moodIdx, weather, line };
    if (!State.moods[k].his._recorded) {
      State.moods[k].his._recorded = true;
      addLove(3);
    }
  }
  save.moods();
}

function importSongs() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const txt = await f.text();
    let data;
    try { data = JSON.parse(txt); } catch(e) { openModal({ title:'失败', bodyHTML:'文件格式不正确', actions: [] }); return; }
    if (!Array.isArray(data)) { openModal({ title:'失败', bodyHTML:'格式不对', actions: [] }); return; }
    for (const item of data) {
      if (!item.name) continue;
      const id = uid();
      if (item.data) {
        try { const blob = await (await fetch(item.data)).blob(); await CacheStore.put('song_' + id, blob); } catch (e) {}
      }
      State.songs.push({ id, name: item.name, artist: item.artist || '' });
    }
    await save.songs(); renderMusicList(); toast('已导入');
  };
  inp.click();
}
async function exportSongs() {
  const out = [];
  for (const s of State.songs) {
    const blob = await CacheStore.get('song_' + s.id);
    let data = '';
    if (blob) data = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    out.push({ name: s.name, artist: s.artist || '', data });
  }
  const blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `音乐_${dateStamp()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function doItfDedup() {
  const list = State.interactions[itfBoard] || [];
  const map = new Map();
  list.forEach(x => {
    const k = (x.content || '').trim();
    if (!k) return;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(x);
  });
  const groups = [...map.entries()].filter(([, arr]) => arr.length > 1);
  if (!groups.length) { openModal({ title:'去重', bodyHTML:'没有重复内容', actions: [] }); setTimeout(closeModal, 3000); return; }
  const dupIds = new Set();
  groups.forEach(([, arr]) => {
    arr.sort((a, b) => (a.t||0) - (b.t||0));
    arr.slice(1).forEach(x => dupIds.add(x.id));
  });
  State.interactions[itfBoard] = list.filter(x => !dupIds.has(x.id));
  save.interactions();
  const html = `<div class="dup-list">` + groups.map(([content, arr]) => {
    return `<div class="dup-item"><span style="flex:1">${escapeHTML(content)}</span><span class="dup-count">×${arr.length}</span></div>`;
  }).join('') + `</div>`;
  openModal({ title: '重复内容（已去重，不进回收站）', bodyHTML: html, actions: [] });
  renderItfZoneTabs(); renderItfBody();
}
function importInteractions() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.txt,.json,application/json,text/plain';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const text = await f.text();
    let incoming = [];
    if (f.name.toLowerCase().endsWith('.json')) {
      try {
        const data = JSON.parse(text);
        if (Array.isArray(data)) {
          incoming = data.map(d => {
            if (typeof d === 'string') return { content: d.trim() };
            return { content: (d.content || '').trim() };
          }).filter(x => x.content);
        }
      } catch(e) { openModal({ title:'导入失败', bodyHTML:'JSON 格式不正确', actions: [] }); return; }
    } else {
      incoming = text.split('\n').map(s => s.trim()).filter(Boolean).map(line => ({ content: line }));
    }
    if (!incoming.length) { openModal({ title:'导入失败', bodyHTML:'没有解析到内容', actions: [] }); return; }
    const list = State.interactions[itfBoard];
    const exist = new Set(list.map(x => (x.content||'').trim()));
    const dups = [];
    let added = 0;
    incoming.forEach(x => {
      if (exist.has(x.content)) { dups.push(x); }
      else { list.push({ id: uid(), content: x.content, locked: false, t: Date.now() }); exist.add(x.content); added++; }
    });
    save.interactions(); renderItfZoneTabs(); renderItfBody();
    if (dups.length) {
      const html = `<div class="dup-list">` + dups.map(d => `<div class="dup-item"><span style="flex:1">${escapeHTML(d.content)}</span></div>`).join('') + `</div><div style="font-size:12.5px;color:var(--text-soft);margin-top:8px;text-align:center">重复内容已忽略，不进回收站</div>`;
      openModal({ title: '导入完成（新增 ' + added + ' 条，重复 ' + dups.length + ' 条）', bodyHTML: html, actions: [] });
    } else {
      openModal({ title: '导入完成', bodyHTML: '新增 ' + added + ' 条，没有重复', actions: [] });
      setTimeout(closeModal, 2500);
    }
  };
  inp.click();
}
function exportInteractions() {
  const list = State.interactions[itfBoard] || [];
  if (!list.length) { openModal({ title:'', bodyHTML:'当前板块没有互动', actions: [] }); setTimeout(closeModal, 1500); return; }
  openModal({ title: '选择导出格式', bodyHTML: '', actions: [
    { label: 'TXT', onClick: () => exportItfFmt('txt') },
    { label: 'JSON', onClick: () => exportItfFmt('json') }
  ]});
}
function exportItfFmt(fmt) {
  const list = State.interactions[itfBoard] || [];
  let content, mime, ext;
  if (fmt === 'json') {
    content = JSON.stringify(list.map(x => ({ content: x.content })), null, 2);
    mime = 'application/json'; ext = 'json';
  } else {
    content = list.map(x => x.content).join('\n');
    mime = 'text/plain'; ext = 'txt';
  }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const boardName = (ITF_BOARDS.find(b => b.key === itfBoard) || {}).name || '';
  a.href = url; a.download = `互动_${boardName}_${dateStamp()}.${ext}`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openInteractionPicker() {
  const html = `<div class="board-tabs" id="itf-pick-tabs">` +

    $$('#itf-pick-tabs [data-board]').forEach(t => t.classList.toggle('active', t.dataset.board === cur && !t.classList.contains('disabled')));
  }
  function renderPickBody() {
    const body = $('#itf-pick-body');
    const list = State.interactions[cur] || [];
    const visible = list.filter(x => !x.locked);
    if (!visible.length) { body.innerHTML = `<div class="empty-tip" style="padding:24px 12px">这个板块还没有互动。</div>`; return; }
    body.innerHTML = `<div style="max-height:46vh;overflow-y:auto">` + visible.map((x, i) =>

    ).join('') + `</div>`;
    $$('#itf-pick-body [data-pick]').forEach(el => {
      el.onclick = () => {
        const item = visible[+el.dataset.pick];
        closeModal();
        sendMyInteraction(item.content, cur);
        recordItfStat(item.content);
        if (!multiSendMode) triggerReply();
      };
    });
  }
  $$('#itf-pick-tabs [data-board]').forEach(t => {
    if (t.classList.contains('disabled')) return;
    t.onclick = () => { cur = t.dataset.board; renderPickTabs(); renderPickBody(); };
  });
  renderPickTabs();
  renderPickBody();
}
function recordItfStat(content) {
  const k = todayKey();
  if (!State.itfStats[k]) State.itfStats[k] = { total: 0, byContent: {} };
  State.itfStats[k].total = (State.itfStats[k].total || 0) + 1;
  if (!State.itfStats[k].byContent) State.itfStats[k].byContent = {};
  State.itfStats[k].byContent[content] = (State.itfStats[k].byContent[content] || 0) + 1;
  let top = '', topN = 0;
  for (const c in State.itfStats[k].byContent) {
    if (State.itfStats[k].byContent[c] > topN) { topN = State.itfStats[k].byContent[c]; top = c; }
  }
  State.itfStats[k].top = top;
  save.itfStats();
}
